<figure class="fig">
<svg class="dia" viewBox="0 0 720 284" role="img" aria-label="Satellite heights on a logarithmic scale: Starlink about 480 km, OneWeb 1,200 km, GPS 20,200 km, geostationary 35,786 km, with minimum round trips of 6, 16, 270 and 477 ms">
<text x="20" y="24" class="xs b">height above the ground (a logarithmic scale: each step is ten times higher)</text><line x1="175.7" y1="36" x2="175.7" y2="214" class="grid"/><text x="175.702" y="230" class="mid xs muted">300 km</text><line x1="252.0" y1="36" x2="252.0" y2="214" class="grid"/><text x="252.021" y="230" class="mid xs muted">1,000 km</text><line x1="321.7" y1="36" x2="321.7" y2="214" class="grid"/><text x="321.661" y="230" class="mid xs muted">3,000 km</text><line x1="398.0" y1="36" x2="398.0" y2="214" class="grid"/><text x="397.979" y="230" class="mid xs muted">10,000 km</text><line x1="467.6" y1="36" x2="467.6" y2="214" class="grid"/><text x="467.619" y="230" class="mid xs muted">30,000 km</text><text x="600" y="46" class="end xs b">round trip,</text><text x="600" y="58" class="end xs b">at least</text><text x="690" y="46" class="end xs b">one orbit</text><text x="20" y="88" class="sm b">Starlink (most)</text><rect x="150" y="72" width="55.4951" height="22" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.2"/><text x="211.495" y="88" class="xs mono">480 km</text><text x="600" y="88" class="end xs mono b">6 ms</text><text x="690" y="88" class="end xs">94 min</text><text x="20" y="124" class="sm b">OneWeb</text><rect x="150" y="108" width="113.578" height="22" rx="4" class="t-teal" stroke="var(--teal)" stroke-width="1.2"/><text x="269.578" y="124" class="xs mono">1,200 km</text><text x="600" y="124" class="end xs mono b">16 ms</text><text x="690" y="124" class="end xs">109 min</text><text x="20" y="160" class="sm b">GPS</text><rect x="150" y="144" width="292.548" height="22" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.2"/><text x="448.548" y="160" class="xs mono">20,200 km</text><text x="600" y="160" class="end xs mono b">270 ms</text><text x="690" y="160" class="end xs">12 hours</text><text x="20" y="196" class="sm b">geostationary</text><rect x="150" y="180" width="328.799" height="22" rx="4" class="t-orange" stroke="var(--orange)" stroke-width="1.2"/><text x="484.799" y="196" class="xs mono">35,786 km</text><text x="600" y="196" class="end xs mono b">477 ms</text><text x="690" y="196" class="end xs">1 day</text><text x="20" y="256" class="xs">Round trip: up to the satellite and down to a ground station, then back the same way, at the speed of light, with the</text><text x="20" y="272" class="xs">satellite straight overhead. Real connections add processing, queues and the rest of the internet.</text>
</svg>
<figcaption>How high, and how long a round trip must take. A geostationary satellite goes round once a day, so it seems to hang still in the sky: one dish, pointed once, for ever. But it’s so far away that light alone costs half a second.</figcaption>
</figure>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 471.2" role="img" aria-label="A three-way handshake to start a connection and a goodbye in each direction to end it">
<use href="#alice-head" x="124" y="4" width="52" height="52"/><text x="150" y="74" class="mid slab b">Alice</text><line x1="150" y1="82" x2="150" y2="465.2" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="570" y="74" class="mid slab b">Otto</text><line x1="570" y1="82" x2="570" y2="465.2" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="461.2" class="xs muted">time ↓</text><g data-show="1"><line x1="150" y1="86" x2="570" y2="122" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="97" class="mid mono sm b halo">HELLO, I start at 1000</text><text x="360" y="120" class="mid xs muted halo">SYN</text></g><g data-show="2"><line x1="570" y1="132.8" x2="150" y2="168.8" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="143.8" class="mid mono sm b halo">HELLO, I start at 5000; next from you: 1001</text><text x="360" y="166.8" class="mid xs muted halo">SYN + ACK</text></g><g data-show="3"><line x1="150" y1="179.6" x2="570" y2="215.6" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="190.6" class="mid mono sm b halo">next from you: 5001</text><text x="360" y="213.6" class="mid xs muted halo">ACK</text></g><g data-show="3"><circle cx="150" cy="233.6" r="5" class="f-ink"/><text x="164" y="238.6" class="hand  halo" text-anchor="start">connected! data flows both ways…</text></g><g data-show="4"><line x1="150" y1="258.8" x2="570" y2="294.8" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="269.8" class="mid mono sm b halo">GOODBYE (I’m done sending)</text><text x="360" y="292.8" class="mid xs muted halo">FIN</text></g><g data-show="4"><line x1="570" y1="305.6" x2="150" y2="341.6" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="316.6" class="mid mono sm b halo">got it</text><text x="360" y="339.6" class="mid xs muted halo">ACK</text></g><g data-show="4"><line x1="570" y1="352.4" x2="150" y2="388.4" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="363.4" class="mid mono sm b halo">GOODBYE from me too</text><text x="360" y="386.4" class="mid xs muted halo">FIN</text></g><g data-show="4"><line x1="150" y1="399.2" x2="570" y2="435.2" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="410.2" class="mid mono sm b halo">got it</text><text x="360" y="433.2" class="mid xs muted halo">ACK</text></g><use href="#computer" x="546" y="10" width="48" height="44"/>
</svg>
<ol class="steps"><li>Alice says hello, and picks a starting number for her datagrams. A random one, as we’ll see.</li><li>Otto says hello back, picks his own starting number, and acknowledges Alice’s.</li><li>Alice acknowledges Otto’s. Three messages, and now both sides know that the other is there, and what numbers to expect.</li><li>Saying goodbye takes a message each way, because each side decides separately when it has finished sending.</li></ol>
<figcaption>Hello, hello, and goodbye.</figcaption>
</figure>

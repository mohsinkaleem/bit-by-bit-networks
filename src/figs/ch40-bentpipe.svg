<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 282" role="img" aria-label="A satellite dish talking to a satellite that relays to a ground gateway; then satellites passing traffic between themselves by laser; then the satellites moving and the dish switching">
<path d="M0,250 Q360,215 720,250 L720,280 L0,280 Z" class="f-teal2"/><use href="#house" x="36" y="186" width="56" height="60"/><text x="64" y="270" class="mid xs b">Uncle Ray’s farm</text><rect x="88" y="200" width="26" height="12" rx="3" class="f-card" stroke="var(--ink)" stroke-width="1.2"/><text x="101" y="196" class="mid xs">dish</text><rect x="161" y="64" width="18" height="12" rx="2" class="f-navy"/><rect x="140" y="66" width="18" height="8" class="f-blue"/><rect x="182" y="66" width="18" height="8" class="f-blue"/><rect x="321" y="44" width="18" height="12" rx="2" class="f-navy"/><rect x="300" y="46" width="18" height="8" class="f-blue"/><rect x="342" y="46" width="18" height="8" class="f-blue"/><rect x="481" y="44" width="18" height="12" rx="2" class="f-navy"/><rect x="460" y="46" width="18" height="8" class="f-blue"/><rect x="502" y="46" width="18" height="8" class="f-blue"/><rect x="611" y="64" width="18" height="12" rx="2" class="f-navy"/><rect x="590" y="66" width="18" height="8" class="f-blue"/><rect x="632" y="66" width="18" height="8" class="f-blue"/><g data-show="=1"><path d="M104,200 L168,80" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><path d="M172,80 L250,222" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><rect x="222" y="222" width="60" height="20" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="252" y="236" class="mid xs b">gateway</text><path d="M282,232 L330,232" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><text x="334" y="236" class="xs">fibre to a data centre, then the internet</text><text x="210" y="130" class="xs hand f-green">up</text></g><g data-show="=2"><path d="M104,200 L168,80" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><path d="M180,66 L318,52" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><path d="M342,50 L478,50" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><path d="M500,52 L608,66" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><path d="M622,80 L640,222" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><rect x="612" y="222" width="60" height="20" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="642" y="236" class="mid xs b">gateway</text><text x="400" y="38" class="mid xs b f-red">lasers, satellite to satellite</text><text x="360" y="170" class="mid xs">no gateway in sight (the sea, or the far north)?</text><text x="360" y="186" class="mid xs">pass it along in space, at the full speed of light</text></g><g data-show="=3"><path d="M104,200 L330,60" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><path d="M104,200 L168,80" class="line s-muted" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M150,70 l-40,-4" class="line s-orange" stroke-width="2" marker-end="url(#ah-orange)"/><path d="M312,50 l-40,-4" class="line s-orange" stroke-width="2" marker-end="url(#ah-orange)"/><text x="200" y="140" class="mid xs hand f-orange">7.6 km every second</text><text x="400" y="120" class="xs">the dish steers its beam</text><text x="400" y="136" class="xs">electronically to the next one</text></g>
</svg>
<ol class="steps"><li>The simplest design, a <em>bent pipe</em>: the dish talks to a satellite overhead, and the satellite repeats everything down to a ground station, a <strong>gateway</strong>, within a few hundred kilometres, which is wired to the internet.</li><li>Newer satellites have lasers to talk to each other. Over the ocean, or far from any gateway, packets hop from satellite to satellite until one is above a gateway. They’re routers, in orbit.</li><li>And everything moves. The satellite overhead will be gone in a few minutes, so every few seconds the dish is handed to another one, and the paths through space change with it. The dish has no motor: it’s a flat grid of hundreds of tiny antennas that aims its beam by timing them (a “phased array”).</li></ol>
<figcaption>How a low-orbit satellite internet carries a packet.</figcaption>
</figure>

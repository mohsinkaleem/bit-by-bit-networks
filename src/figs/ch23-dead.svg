"/><circle cx="622" cy="50" r="5" class="f-blue"/><line x1="280" y1="32" x2="280" y2="70" class="line s-orange" stroke-width="2" stroke-dasharray="4 3"/><text x="284" y="40" class="xs b f-orange">✂ pulled out</text><text x="676" y="46" class="xs b f-red">3 pings lost: 0.6 s</text><text x="676" y="60" class="xs f-blue">then ttl 63: one hop more</text><text x="14" y="112" class="sm b">2. The cable goes silent, but stays plugged in: nobody notices until the Hellos stop</text><line x1="40" y1="170" x2="670" y2="170" class="grid"/><line x1="40" y1="166" x2="40" y2="174" class="grid"/><text x="40" y="188" class="mid xs muted">0 s</text><line x1="145" y1="166" x2="145" y2="174" class="grid"/><text x="145" y="188" class="mid xs muted">10 s</text><line x1="250" y1="166" x2="250" y2="174" class="grid"/><text x="250" y="188" class="mid xs muted">20 s</text><line x1="355" y1="166" x2="355" y2="174" class="grid"/><text x="355" y="188" class="mid xs muted">30 s</text><line x1="460" y1="166" x2="460" y2="174" class="grid"/><text x="460" y="188" class="mid xs muted">40 s</text><line x1="565" y1="166" x2="565" y2="174" class="grid"/><text x="565" y="188" class="mid xs muted">50 s</text><line x1="670" y1="166" x2="670" y2="174" class="grid"/><text x="670" y="188" class="mid xs muted">60 s</text><circle cx="45" cy="158" r="4" class="f-green"/><circle cx="55.5" cy="158" r="4" class="f-green"/><circle cx="66" cy="158" r="4" class="f-green"/><path d="M73.5,155 l6,6 M79.5,155 l-6,6" class="line s-red" stroke-width="2"/><path d="M84,155 l6,6 M90,155 l-6,6" class="line s-red" stroke-width="2"/><path d="M94.5,155 l6,6 M100.5,155 l-6,6" class="line s-red" stroke-width="2"/><path d="M105,155 l6,6 M111,155 l-6,6" class="line s-red" stroke-width="2"/><path d="M115.5,155 l6,6 M121.5,155 l-6,6" class="line s-red" stroke-width="2"/><path d="M126,155 l6,6 M132,155 l-6,6" class="line s-red" stroke-width="2"/><path d="M136.5,155 l6,6 M142.5,155 l-6,6" class="line s-red" stroke-width="2"/><path d="M147
<figure class="fig">
<svg class="dia" viewBox="0 0 720 384" role="img" aria-label="Spanning tree: one link of the triangle is blocked so no loop remains">
<g transform="translate(0,34)"><line x1="360" y1="60" x2="170" y2="250" class="wire" stroke-width="5"/><line x1="170" y1="250" x2="550" y2="250" class="line s-red" stroke-width="4" stroke-dasharray="10 8"/><path d="M348.0,238.0 l24,24 M372.0,238.0 l-24,24" class="line s-red" stroke-width="5"/><text x="360" y="284" class="mid hand f-red">blocked</text><line x1="550" y1="250" x2="360" y2="60" class="wire" stroke-width="5"/><use href="#switch" x="300" y="42" width="120" height="37"/><text x="360" y="98" class="mid slab b halo">S1</text><use href="#switch" x="110" y="232" width="120" height="37"/><text x="170" y="288" class="mid slab b halo">S2</text><use href="#switch" x="490" y="232" width="120" height="37"/><text x="550" y="288" class="mid slab b halo">S3</text><line x1="360" y1="60" x2="360" y2="0" class="wire" stroke-width="3"/><use href="#alice-head" x="386" y="-2" width="40" height="40"/><text x="430" y="24" class="sm b">Alice</text><text x="360" y="330" class="mid sm">S1 has the lowest ID, so it’s the root. Every switch keeps its shortest path to S1, and the one link on neither path is switched off.</text><text x="300" y="58" class="end lg">👑</text></g>
</svg>
<figcaption>A spanning tree: every switch still reaches every other, but there’s exactly one path between any two.</figcaption>
</figure>

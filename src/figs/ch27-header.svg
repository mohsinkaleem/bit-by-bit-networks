<figure class="fig">
<svg class="dia" viewBox="0 0 720 312" role="img" aria-label="The TCP header, filled in with the values from the Pi&#x27;s real SYN segment">
<text x="60" y="16" class="xs muted">0</text><text x="360" y="16" class="mid xs muted">16</text><text x="660" y="16" class="end xs muted">31 bits</text><rect x="60" y="24" width="300" height="38" class="t-yellow" stroke="var(--yellow)" stroke-width="1.3"/><text x="210" y="39" class="mid xs b">source port</text><text x="210" y="55" class="mid xs mono">58798</text><rect x="360" y="24" width="300" height="38" class="t-yellow" stroke="var(--yellow)" stroke-width="1.3"/><text x="510" y="39" class="mid xs b">destination port</text><text x="510" y="55" class="mid xs mono">443 (HTTPS)</text><rect x="60" y="64" width="600" height="38" class="t-blue" stroke="var(--blue)" stroke-width="1.3"/><text x="360" y="79" class="mid xs b">sequence number</text><text x="360" y="95" class="mid xs mono">1912436191: where this segment’s bytes start</text><rect x="60" y="104" width="600" height="38" class="t-green" stroke="var(--green)" stroke-width="1.3"/><text x="360" y="119" class="mid xs b">acknowledgement number</text><text x="360" y="135" class="mid xs mono">0: “the next byte I expect from you” (none yet)</text><rect x="60" y="144" width="75" height="38" class="f-card" stroke="var(--line)" stroke-width="1.3"/><text x="97.5" y="159" class="mid xs b">offset</text><text x="97.5" y="175" class="mid xs mono">10</text><rect x="135" y="144" width="75" height="38" class="f-card" stroke="var(--line)" stroke-width="1.3"/><rect x="210" y="144" width="150" height="38" class="t-red" stroke="var(--red)" stroke-width="1.3"/><text x="285" y="159" class="mid xs b">flags</text><text x="285" y="175" class="mid xs mono">SYN</text><rect x="360" y="144" width="300" height="38" class="t-purple" stroke="var(--purple)" stroke-width="1.3"/><text x="510" y="159" class="mid xs b">window</text><text x="510" y="175" class="mid xs mono">64240 bytes</text><rect x="60" y="184" width="300" height="38" class="f-card" stroke="var(--line)" stroke-width="1.3"/><text x="210" y="199" class="mid xs b">checksum</text><text x="210" y="215" class="mid xs mono">0x9510</text><rect x="360" y="184" width="300" height="38" class="f-card" stroke="var(--line)" stroke-width="1.3"/><text x="510" y="199" class="mid xs b">urgent pointer</text><text x="510" y="215" class="mid xs mono">0 (never used)</text><rect x="60" y="224" width="600" height="38" class="t-orange" stroke="var(--orange)" stroke-width="1.3"/><text x="360" y="239" class="mid xs b">options</text><text x="360" y="255" class="mid xs mono">MSS 1460 · SACK permitted · timestamps · window scale 10</text><text x="52" y="248" class="end xs muted">20 more</text><text x="52" y="260" class="end xs muted">bytes</text><text x="360" y="286" class="mid xs">“offset 10” means the header is 10 × 4 = 40 bytes long: 20 fixed, and 20 bytes of options.</text><text x="360" y="302" class="mid xs">The flags are one bit each: SYN, ACK, FIN, RST, PSH, URG, and two for congestion (ECE, CWR, Chapter 28).</text>
</svg>
<figcaption>The TCP header, with the real SYN that opened Grandpa Otto’s connection to example.org. Compare UDP’s 8 bytes in Chapter 26.</figcaption>
</figure>

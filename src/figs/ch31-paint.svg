<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 268" role="img" aria-label="The paint-mixing picture of Diffie-Hellman: a public colour, two secret colours, two public mixes, and the same final mixture on both sides">
<rect x="240" y="8" width="240" height="250" rx="10" class="t-red" opacity="0.45"/><text x="360" y="28" class="mid xs b f-red">in public: Eve sees all of it</text><text x="110" y="28" class="mid sm b">Alice</text><text x="610" y="28" class="mid sm b">Bob</text><g data-show="1"><path d="M334,56 L386,56 L380,94 L340,94 Z" fill="#f2c94c" stroke="var(--ink)" stroke-width="1.5"/><text x="360" y="112" class="mid xs b">a common colour</text><text x="360" y="126" class="mid xs muted">agreed in public</text></g><g data-show="2"><path d="M84,56 L136,56 L130,94 L90,94 Z" fill="#d9534f" stroke="var(--ink)" stroke-width="1.5"/><text x="110" y="112" class="mid xs b">her secret colour</text><text x="110" y="126" class="mid xs muted">never shared</text></g><g data-show="2"><path d="M584,56 L636,56 L630,94 L590,94 Z" fill="#4a7fd6" stroke="var(--ink)" stroke-width="1.5"/><text x="610" y="112" class="mid xs b">his secret colour</text><text x="610" y="126" class="mid xs muted">never shared</text></g><g data-show="3"><path d="M274,154 L326,154 L320,192 L280,192 Z" fill="#e8894a" stroke="var(--ink)" stroke-width="1.5"/><text x="300" y="210" class="mid xs b">Alice’s mix</text><text x="300" y="224" class="mid xs muted">yellow + red</text></g><g data-show="3"><path d="M394,154 L446,154 L440,192 L400,192 Z" fill="#8fb56b" stroke="var(--ink)" stroke-width="1.5"/><text x="420" y="210" class="mid xs b">Bob’s mix</text><text x="420" y="224" class="mid xs muted">yellow + blue</text></g><g data-show="3"><path d="M140,90 C200,140 240,160 270,168" class="line s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/><path d="M580,90 C520,140 480,160 450,168" class="line s-muted" stroke-width="1.5" marker-end="url(#ah-muted)"/></g><g data-show="4"><path d="M84,184 L136,184 L130,222 L90,222 Z" fill="#8a6a3a" stroke="var(--ink)" stroke-width="1.5"/><text x="110" y="240" class="mid xs b">the shared secret</text><text x="110" y="254" class="mid xs muted">Bob’s mix + her red</text></g><g data-show="4"><path d="M584,184 L636,184 L630,222 L590,222 Z" fill="#8a6a3a" stroke="var(--ink)" stroke-width="1.5"/><text x="610" y="240" class="mid xs b">the shared secret</text><text x="610" y="254" class="mid xs muted">Alice’s mix + his blue</text></g><g data-show="4"><path d="M392,178 C300,230 200,220 140,206" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><path d="M328,178 C420,230 520,220 580,206" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g>
</svg>
<ol class="steps"><li>Alice and Bob agree, in public, on a common starting colour. Eve hears it.</li><li>Each secretly picks a colour of their own, and never tells anyone.</li><li>Each mixes their secret colour into the common one, and sends the mix across, in public. Eve sees both mixes, but unmixing paint is hopeless: she can’t get the secret colours back out.</li><li>Each adds their own secret colour to the <em>other’s</em> mix. Both end up with the same colour, common + red + blue, which never crossed the room. Eve has common + red, and common + blue, and no way to combine them into common + red + blue.</li></ol>
<figcaption>Diffie–Hellman key exchange, with paint instead of numbers.</figcaption>
</figure>

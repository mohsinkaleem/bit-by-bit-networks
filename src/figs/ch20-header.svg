<figure class="fig">
<svg class="dia" viewBox="0 0 720 320" role="img" aria-label="The IPv4 header drawn 32 bits wide, with the values from the Pi&#x27;s request to info.cern.ch">
<text x="40" y="22" class="mid xs muted">0</text><text x="200" y="22" class="mid xs muted">8</text><text x="360" y="22" class="mid xs muted">16</text><text x="520" y="22" class="mid xs muted">24</text><text x="680" y="22" class="mid xs muted">32</text><text x="360" y="10" class="mid xs muted">bits →</text><rect x="40.0" y="30" width="80.0" height="48" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="80" y="49" class="mid xs b">version</text><text x="80" y="66" class="mid mono xs">4</text><rect x="120.0" y="30" width="80.0" height="48" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="160" y="49" class="mid xs b">header length</text><text x="160" y="66" class="mid mono xs">5</text><rect x="200.0" y="30" width="120.0" height="48" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="260" y="49" class="mid xs b">DSCP</text><text x="260" y="66" class="mid mono xs">0</text><rect x="320.0" y="30" width="40.0" height="48" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="340" y="49" class="mid xs b">ECN</text><text x="340" y="66" class="mid mono xs">0</text><rect x="360.0" y="30" width="320.0" height="48" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="520" y="49" class="mid xs b">total length</text><text x="520" y="66" class="mid mono xs">128 bytes</text><text x="32" y="58" class="end xs muted">0</text><rect x="40.0" y="82" width="320.0" height="48" rx="4" class="t-orange" stroke="var(--line)" stroke-width="1.5"/><text x="200" y="101" class="mid xs b">identification</text><text x="200" y="118" class="mid mono xs">29127</text><rect x="360.0" y="82" width="60.0" height="48" rx="4" class="t-orange" stroke="var(--line)" stroke-width="1.5"/><text x="390" y="101" class="mid xs b">flags</text><text x="390" y="118" class="mid mono xs">DF</text><rect x="420.0" y="82" width="260.0" height="48" rx="4" class="t-orange" stroke="var(--line)" stroke-width="1.5"/><text x="550" y="101" class="mid xs b">fragment offset</text><text x="550" y="118" class="mid mono xs">0</text><text x="32" y="110" class="end xs muted">4</text><rect x="40.0" y="134" width="160.0" height="48" rx="4" class="t-red" stroke="var(--line)" stroke-width="1.5"/><text x="120" y="153" class="mid xs b">time to live</text><text x="120" y="170" class="mid mono xs">64</text><rect x="200.0" y="134" width="160.0" height="48" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="280" y="153" class="mid xs b">protocol</text><text x="280" y="170" class="mid mono xs">6 = TCP</text><rect x="360.0" y="134" width="320.0" height="48" rx="4" class="t-red" stroke="var(--line)" stroke-width="1.5"/><text x="520" y="153" class="mid xs b">header checksum</text><text x="520" y="170" class="mid mono xs">0x06cd</text><text x="32" y="162" class="end xs muted">8</text><rect x="40.0" y="186" width="640.0" height="48" rx="4" class="t-blue" stroke="var(--line)" stroke-width="1.5"/><text x="360" y="205" class="mid xs b">source address</text><text x="360" y="222" class="mid mono xs">192.168.1.4</text><text x="32" y="214" class="end xs muted">12</text><rect x="40.0" y="238" width="640.0" height="48" rx="4" class="t-blue" stroke="var(--line)" stroke-width="1.5"/><text x="360" y="257" class="mid xs b">destination address</text><text x="360" y="274" class="mid mono xs">188.184.67.127</text><text x="32" y="266" class="end xs muted">16</text><text x="32" y="22" class="end xs muted">byte</text><rect x="40" y="298" width="14" height="14" rx="3" style="fill:var(--orange);opacity:0.5"/><text x="60" y="309" class="xs">for chopping up and gluing back</text><rect x="260" y="298" width="14" height="14" rx="3" style="fill:var(--red);opacity:0.5"/><text x="280" y="309" class="xs">changed by every router</text><rect x="480" y="298" width="14" height="14" rx="3" style="fill:var(--blue);opacity:0.5"/><text x="500" y="309" class="xs">the same end to end (until Chapter 22)</text>
</svg>
<figcaption>The 20-byte IPv4 header, with the values from the Pi’s “GET /” in Chapter 16.</figcaption>
</figure>

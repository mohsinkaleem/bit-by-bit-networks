<figure class="fig">
<svg class="dia" viewBox="0 0 720 276" role="img" aria-label="A timeline of the contact plan: two-hour links between Earth and the orbiter each day, twelve-minute passes over the rover; the question waits 3 hours on the orbiter, and the answer waits 20 hours">
<text x="20" y="24" class="xs b">the contact plan (dtn.py): when each radio link is up</text><line x1="150.0" y1="40" x2="150.0" y2="236" class="grid"/><text x="150" y="252" class="mid xs muted">06:00</text><text x="150" y="266" class="mid xs b muted">day 1</text><line x1="216.0" y1="40" x2="216.0" y2="236" class="grid"/><text x="216" y="252" class="mid xs muted">09:00</text><line x1="282.0" y1="40" x2="282.0" y2="236" class="grid"/><text x="282" y="252" class="mid xs muted">12:00</text><line x1="348.0" y1="40" x2="348.0" y2="236" class="grid"/><text x="348" y="252" class="mid xs muted">15:00</text><line x1="414.0" y1="40" x2="414.0" y2="236" class="grid"/><text x="414" y="252" class="mid xs muted">18:00</text><line x1="480.0" y1="40" x2="480.0" y2="236" class="grid"/><text x="480" y="252" class="mid xs muted">21:00</text><line x1="546.0" y1="40" x2="546.0" y2="236" class="grid"/><text x="546" y="252" class="mid xs muted">00:00</text><text x="546" y="266" class="mid xs b muted">day 2</text><line x1="612.0" y1="40" x2="612.0" y2="236" class="grid"/><text x="612" y="252" class="mid xs muted">03:00</text><line x1="678.0" y1="40" x2="678.0" y2="236" class="grid"/><text x="678" y="252" class="mid xs muted">06:00</text><text x="20" y="76" class="xs b">Earth ⇄ orbiter</text><rect x="150" y="60" width="44" height="22" rx="3" class="t-green" stroke="var(--green)" stroke-width="1.2"/><rect x="678" y="60" width="22" height="22" rx="3" class="t-green" stroke="var(--green)" stroke-width="1.2"/><text x="20" y="126" class="xs b">orbiter ⇄ rover</text><rect x="223.333" y="110" width="4.4" height="22" rx="3" class="t-green" stroke="var(--green)" stroke-width="1.2"/><rect x="494.667" y="110" width="4.4" height="22" rx="3" class="t-green" stroke="var(--green)" stroke-width="1.2"/><rect x="151.8" y="150" width="5.1" height="14" rx="3" class="f-blue" opacity="0.75"/><text x="155.833" y="180" class="xs f-blue">question: 14 minutes in flight, then 3 hours stored on the orbiter</text><rect x="157.0" y="150" width="66.4" height="14" rx="3" class="f-blue" opacity="0.75"/><rect x="223.3" y="196" width="454.7" height="14" rx="3" class="f-purple" opacity="0.75"/><text x="227.333" y="226" class="xs f-purple">answer: stored on the orbiter, 20 hours, until Earth’s dish is back</text><rect x="678.0" y="196" width="5.1" height="14" rx="3" class="f-purple" opacity="0.75"/><text x="20" y="162" class="xs b f-blue">the question</text><text x="20" y="208" class="xs b f-purple">the answer</text>
</svg>
<figcaption>The run below, as a timeline. At no moment is there a path all the way from Earth to the rover, so every bundle spends most of its life in storage, waiting for the next link.</figcaption>
</figure>

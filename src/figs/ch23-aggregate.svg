<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 280" role="img" aria-label="Four neighbouring customer networks announced as one aggregate route, then one customer moving to another provider">
<g data-show="1"><rect x="14" y="26" width="150" height="44" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="89" y="45" class="mid xs b">a school</text><text x="89" y="61" class="mid mono xs">198.18.0.0/24</text></g><g data-show="1"><line x1="164" y1="48" x2="236" y2="130" class="line s-muted" stroke-width="1.5"/></g><g data-show="1"><rect x="14" y="82" width="150" height="44" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="89" y="101" class="mid xs b">a bakery</text><text x="89" y="117" class="mid mono xs">198.18.1.0/24</text></g><g data-show="1"><line x1="164" y1="104" x2="236" y2="130" class="line s-muted" stroke-width="1.5"/></g><g data-show="1-2"><rect x="14" y="138" width="150" height="44" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="89" y="157" class="mid xs b">a clinic</text><text x="89" y="173" class="mid mono xs">198.18.2.0/24</text></g><g data-show="1-2"><line x1="164" y1="160" x2="236" y2="130" class="line s-muted" stroke-width="1.5"/></g><g data-show="1"><rect x="14" y="194" width="150" height="44" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="89" y="213" class="mid xs b">a library</text><text x="89" y="229" class="mid mono xs">198.18.3.0/24</text></g><g data-show="1"><line x1="164" y1="216" x2="236" y2="130" class="line s-muted" stroke-width="1.5"/></g><g data-show="3"><rect x="14" y="138" width="150" height="44" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="89" y="157" class="mid xs b">the clinic (moved)</text><text x="89" y="173" class="mid mono xs">198.18.2.0/24</text><path d="M164,160 C220,200 250,236 300,236" class="line s-purple" stroke-width="2"/></g><use href="#router" x="236" y="104" width="76" height="50"/><text x="274" y="170" class="mid sm b">Northnet</text><text x="274" y="186" class="mid xs muted">(the old provider)</text><g data-show="3"><use href="#router" x="300" y="212" width="60" height="40"/><text x="330" y="266" class="mid xs b">Southnet</text><line x1="360" y1="232" x2="470" y2="170" class="line s-purple" stroke-width="2"/></g><line x1="312" y1="128" x2="470" y2="128" class="line s-muted" stroke-width="2"/><rect x="470" y="30" width="236" height="220" rx="10" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="588" y="52" class="mid xs b">a router elsewhere on</text><text x="588" y="66" class="mid xs b">the internet has to know:</text><g data-show="=1"><text x="486" y="96" class="mono xs">198.18.0.0/24 → Northnet</text><text x="486" y="118" class="mono xs">198.18.1.0/24 → Northnet</text><text x="486" y="140" class="mono xs">198.18.2.0/24 → Northnet</text><text x="486" y="162" class="mono xs">198.18.3.0/24 → Northnet</text><text x="588" y="196" class="mid sm b f-orange">4 routes</text></g><g data-show="=2"><text x="486" y="96" class="mono xs">198.18.0.0/22 → Northnet</text><text x="588" y="196" class="mid sm b f-green">1 route</text></g><g data-show="=3"><text x="486" y="96" class="mono xs">198.18.0.0/22 → Northnet</text><text x="486" y="118" class="mono xs b" style="fill:var(--purple)">198.18.2.0/24 → Southnet</text><text x="588" y="170" class="mid xs">198.18.2.9: both match;</text><text x="588" y="186" class="mid xs">the /24 is longer, so Southnet</text><text x="588" y="214" class="mid sm b f-orange">2 routes</text></g>
</svg>
<ol class="steps"><li>An internet provider gives four customers a /24 each. If it told the rest of the internet about each one separately, every router in the world would need four entries for them.</li><li>But the four networks sit side by side: together they’re exactly 198.18.0.0/22. So the provider announces just that one. This is <strong>aggregation</strong> (or “summarization”), and it’s the whole point of CIDR.</li><li>The clinic moves to a different provider, and takes its addresses with it. Southnet announces 198.18.2.0/24. Routers elsewhere keep Northnet’s /22 and add Southnet’s /24, and longest-prefix match sends the clinic’s traffic the right way. The exception works, but it costs everyone an extra entry.</li></ol>
<figcaption>Aggregation: announce one big route instead of many small ones. (198.18.0.0/15 is set aside for testing, so these addresses belong to nobody.)</figcaption>
</figure>

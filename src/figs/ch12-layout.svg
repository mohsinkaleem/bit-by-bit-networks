<figure class="fig">
<svg class="dia" viewBox="0 0 720 164" role="img" aria-label="Datagram header: destination port, source port, length and check, then the data">
<rect x="14" y="30" width="110" height="62" rx="6" class="t-green" stroke="var(--line)"/><text x="69" y="54" class="mid slab b">to port</text><text x="69" y="78" class="mid mono xs">64</text><text x="69" y="112" class="mid xs muted">2 bytes</text><rect x="126" y="30" width="110" height="62" rx="6" class="t-green" stroke="var(--line)"/><text x="181" y="54" class="mid slab b">from port</text><text x="181" y="78" class="mid mono xs">51234</text><text x="181" y="112" class="mid xs muted">2 bytes</text><rect x="238" y="30" width="110" height="62" rx="6" class="t-green" stroke="var(--line)"/><text x="293" y="54" class="mid slab b">length</text><text x="293" y="78" class="mid mono xs">10</text><text x="293" y="112" class="mid xs muted">2 bytes</text><rect x="350" y="30" width="110" height="62" rx="6" class="t-red" stroke="var(--line)"/><text x="405" y="54" class="mid slab b">check</text><text x="405" y="78" class="mid mono xs">a CRC-like sum</text><text x="405" y="112" class="mid xs muted">2 bytes</text><rect x="462" y="30" width="234" height="62" rx="6" class="t-yellow" stroke="var(--line)"/><text x="579" y="54" class="mid slab b">data</text><text x="579" y="78" class="mid mono xs">“e4”</text><text x="579" y="112" class="mid xs muted">any bytes</text><path d="M14,124 L14,132 L458,132 L458,124" class="line s-green" stroke-width="2"/><text x="236" y="152" class="mid hand f-green">the whole header: just 8 bytes</text>
</svg>
<figcaption>A datagram: four small numbers, then the message.</figcaption>
</figure>

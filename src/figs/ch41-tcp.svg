<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 358.933" role="img" aria-label="A sequence diagram: a TCP connection attempt from Earth gives up after 2 minutes 7 seconds, long before the first SYN reaches Mars 5 and a half minutes later">
<text x="250" y="28" class="mid slab b">Earth</text><line x1="250" y1="36" x2="250" y2="352.93333333333334" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="610" y="28" class="mid slab b">Mars</text><line x1="610" y1="36" x2="610" y2="352.93333333333334" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="348.93333333333334" class="xs muted">time ↓</text><g data-show="1"><line x1="250" y1="40" x2="610" y2="186.467" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="340" y="69.6167" class="mid mono sm b halo">SYN</text></g><g data-show="1"><line x1="250" y1="40.4" x2="610" y2="186.9" class="line s-blue" stroke-width="1" opacity="0.5"/></g><g data-show="1"><line x1="250" y1="41.3" x2="610" y2="187.8" class="line s-blue" stroke-width="1" opacity="0.5"/></g><g data-show="1"><line x1="250" y1="43.0" x2="610" y2="189.5" class="line s-blue" stroke-width="1" opacity="0.5"/></g><g data-show="1"><line x1="250" y1="46.5" x2="610" y2="193.0" class="line s-blue" stroke-width="1" opacity="0.5"/></g><g data-show="1"><line x1="250" y1="53.4" x2="610" y2="199.9" class="line s-blue" stroke-width="1" opacity="0.5"/></g><g data-show="1"><line x1="250" y1="67.3" x2="610" y2="213.8" class="line s-blue" stroke-width="1" opacity="0.5"/></g><g data-show="1"><path d="M241.2,40 L228,40 L228,98.0667 L241.2,98.0667" class="line s-orange" stroke-width="2.5"/><text x="219.2" y="74.0333" class="hand f-orange halo" text-anchor="end">gives up after 134 s</text></g><g data-show="1"><circle cx="250" cy="100.667" r="5" class="f-ink"/><text x="264" y="105.667" class="hand  halo" text-anchor="start">“Could not connect to server”</text></g><g data-show="2"><circle cx="610" cy="186.467" r="5" class="f-ink"/><text x="596" y="191.467" class="hand  halo" text-anchor="end">the first SYN arrives</text></g><g data-show="2"><line x1="610" y1="186.467" x2="250" y2="332.933" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="502" y="223.407" class="mid mono sm b halo">SYN-ACK</text></g><g data-show="2"><circle cx="250" cy="332.933" r="5" class="f-ink"/><text x="264" y="337.933" class="hand  halo" text-anchor="start">nobody is waiting for it any more</text></g><text x="710" y="16" class="end xs muted">Mars at its nearest: 5 min 38 s each way</text>
</svg>
<ol class="steps"><li>Earth’s computer sends a SYN, to open a TCP connection (Chapter 27). No answer after a second, so it sends another; then after 3 s, 7, 15, 31 and 63, each time waiting twice as long. After seven tries it gives up: on the Pi, 134 seconds after the start.</li><li>Five and a half minutes after the first SYN left, it reaches Mars, which answers politely. The SYN-ACK reaches Earth eleven minutes after the start, and is thrown away.</li></ol>
<figcaption>TCP’s timers were made for a planet. Even to Mars at its very nearest, the conversation can’t start.</figcaption>
</figure>

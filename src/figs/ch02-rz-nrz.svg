<figure class="fig">
<svg class="dia" viewBox="0 0 720 278" role="img" aria-label="The bits 11010 drawn two ways: as pulses with rests, and as held levels">
<line x1="110" y1="34" x2="110" y2="240" class="grid" stroke-dasharray="3 4"/><line x1="220" y1="34" x2="220" y2="240" class="grid" stroke-dasharray="3 4"/><line x1="330" y1="34" x2="330" y2="240" class="grid" stroke-dasharray="3 4"/><line x1="440" y1="34" x2="440" y2="240" class="grid" stroke-dasharray="3 4"/><line x1="550" y1="34" x2="550" y2="240" class="grid" stroke-dasharray="3 4"/><line x1="660" y1="34" x2="660" y2="240" class="grid" stroke-dasharray="3 4"/><text x="165" y="24" class="mid mono b f-green">1</text><text x="275" y="24" class="mid mono b f-green">1</text><text x="385" y="24" class="mid mono b f-red">0</text><text x="495" y="24" class="mid mono b f-green">1</text><text x="605" y="24" class="mid mono b f-red">0</text><text x="110" y="49" class="sm b">Flashlight style: pulse, then rest  (“return to zero”)</text><line x1="110" y1="65" x2="660" y2="65" class="grid" stroke-dasharray="4 4"/><text x="102" y="69" class="end xs muted">+5 V</text><line x1="110" y1="95" x2="660" y2="95" class="grid"/><text x="102" y="99" class="end xs muted">0 V</text><line x1="110" y1="125" x2="660" y2="125" class="grid" stroke-dasharray="4 4"/><text x="102" y="129" class="end xs muted">−5 V</text><path d="M110,65 L165,65 L165,95 L220,95 L220,65 L275,65 L275,95 L330,95 L330,125 L385,125 L385,95 L440,95 L440,65 L495,65 L495,95 L550,95 L550,125 L605,125 L605,95 L660,95" class="line thick s-navy"/><text x="110" y="159" class="sm b">Metronome style: hold the level for one whole tick  (“non-return to zero”)</text><line x1="110" y1="175" x2="660" y2="175" class="grid" stroke-dasharray="4 4"/><text x="102" y="179" class="end xs muted">+5 V</text><line x1="110" y1="205" x2="660" y2="205" class="grid"/><text x="102" y="209" class="end xs muted">0 V</text><line x1="110" y1="235" x2="660" y2="235" class="grid" stroke-dasharray="4 4"/><text x="102" y="239" class="end xs muted">−5 V</text><path d="M110,175 L165,175 L220,175 L275,175 L330,175 L330,235 L385,235 L440,235 L440,175 L495,175 L550,175 L550,235 L605,235 L660,235" class="line thick s-navy"/><text x="385" y="266" class="mid hand muted">the two 1s at the start blur together in the bottom row: timing has to tell them apart</text>
</svg>
<figcaption>Two ways to draw 1 1 0 1 0 on a wire.</figcaption>
</figure>

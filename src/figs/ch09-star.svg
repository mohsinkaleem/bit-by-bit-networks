<figure class="fig">
<svg class="dia" viewBox="0 0 720 332" role="img" aria-label="A hub repeats every frame to every port; a switch sends each frame only toward its destination">
<text x="180" y="24" class="mid slab b">A hub: repeat everything, everywhere</text><text x="180" y="318" class="mid hand">Alice → Bob reaches everyone (and collides)</text><line x1="60" y1="70" x2="180" y2="160" class="wire" stroke-width="4"/><line x1="300" y1="70" x2="180" y2="160" class="wire" stroke-width="4"/><line x1="60" y1="250" x2="180" y2="160" class="wire" stroke-width="4"/><line x1="300" y1="250" x2="180" y2="160" class="wire" stroke-width="4"/><line x1="60" y1="70" x2="180" y2="160" class="line s-orange" stroke-width="5" stroke-dasharray="8 6"/><path d="M180,160 L276,88" class="line s-orange" stroke-width="5" marker-end="url(#ah-orange)"/><path d="M180,160 L84,232" class="line s-orange" stroke-width="5" marker-end="url(#ah-orange)"/><path d="M180,160 L276,232" class="line s-orange" stroke-width="5" marker-end="url(#ah-orange)"/><use href="#hub" x="105" y="137" width="150" height="46"/><use href="#alice-head" x="34" y="40" width="52" height="52"/><text x="60" y="106" class="mid sm b halo">Alice</text><use href="#bob-head" x="274" y="40" width="52" height="52"/><text x="300" y="106" class="mid sm b halo">Bob</text><use href="#carol-head" x="34" y="220" width="52" height="52"/><text x="60" y="286" class="mid sm b halo">Carol</text><use href="#dave-head" x="274" y="220" width="52" height="52"/><text x="300" y="286" class="mid sm b halo">Dave</text><text x="540" y="24" class="mid slab b">A switch: only where it needs to go</text><text x="540" y="318" class="mid hand">Alice → Bob and Carol → Dave, both at once</text><line x1="420" y1="70" x2="540" y2="160" class="wire" stroke-width="4"/><line x1="660" y1="70" x2="540" y2="160" class="wire" stroke-width="4"/><line x1="420" y1="250" x2="540" y2="160" class="wire" stroke-width="4"/><line x1="660" y1="250" x2="540" y2="160" class="wire" stroke-width="4"/><line x1="420" y1="70" x2="540" y2="160" class="line s-green" stroke-width="5" stroke-dasharray="8 6"/><path d="M540,160 L636,88" class="line s-green" stroke-width="5" marker-end="url(#ah-green)"/><line x1="420" y1="250" x2="540" y2="160" class="line s-blue" stroke-width="5" stroke-dasharray="8 6"/><path d="M540,160 L636,232" class="line s-blue" stroke-width="5" marker-end="url(#ah-blue)"/><use href="#switch" x="465" y="137" width="150" height="46"/><use href="#alice-head" x="394" y="40" width="52" height="52"/><text x="420" y="106" class="mid sm b halo">Alice</text><use href="#bob-head" x="634" y="40" width="52" height="52"/><text x="660" y="106" class="mid sm b halo">Bob</text><use href="#carol-head" x="394" y="220" width="52" height="52"/><text x="420" y="286" class="mid sm b halo">Carol</text><use href="#dave-head" x="634" y="220" width="52" height="52"/><text x="660" y="286" class="mid sm b halo">Dave</text><line x1="360" y1="30" x2="360" y2="280" class="line s-line"/>
</svg>
<figcaption>Same star-shaped wiring, very different boxes in the middle.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 268" role="img" aria-label="A packet rides in the data part of a frame: piece number, total, length, then a slice of data">
<rect x="14" y="36" width="70" height="46" rx="6" class="t-blue" stroke="var(--line)"/><text x="49" y="64" class="mid slab b">to</text><rect x="86" y="36" width="70" height="46" rx="6" class="t-blue" stroke="var(--line)"/><text x="121" y="64" class="mid slab b">from</text><rect x="158" y="36" width="70" height="46" rx="6" class="t-green" stroke="var(--line)"/><text x="193" y="64" class="mid slab b">type</text><rect x="230" y="36" width="390" height="46" rx="6" class="t-yellow" stroke="var(--line)"/><text x="425" y="64" class="mid slab b">data</text><rect x="622" y="36" width="86" height="46" rx="6" class="t-red" stroke="var(--line)"/><text x="665" y="64" class="mid slab b">check</text><text x="665" y="28" class="mid mono xs b f-red">CRC-32</text><text x="14" y="22" class="sm muted">A frame (Chapter 8)</text><path d="M230,84 L14,140 M620,84 L706,140" class="line s-muted dash" stroke-width="1.5"/><rect x="14" y="142" width="110" height="58" rx="6" class="t-blue" stroke="var(--line)"/><text x="69" y="166" class="mid slab b">piece #</text><text x="69" y="188" class="mid xs">which piece</text><text x="69" y="218" class="mid xs muted">4 bytes</text><rect x="126" y="142" width="110" height="58" rx="6" class="t-blue" stroke="var(--line)"/><text x="181" y="166" class="mid slab b">of</text><text x="181" y="188" class="mid xs">how many</text><text x="181" y="218" class="mid xs muted">4 bytes</text><rect x="238" y="142" width="110" height="58" rx="6" class="t-blue" stroke="var(--line)"/><text x="293" y="166" class="mid slab b">length</text><text x="293" y="188" class="mid xs">data bytes</text><text x="293" y="218" class="mid xs muted">4 bytes</text><rect x="350" y="142" width="358" height="58" rx="6" class="t-yellow" stroke="var(--line)"/><text x="529" y="166" class="mid slab b">data</text><text x="529" y="188" class="mid xs">a slice of the video</text><text x="529" y="218" class="mid xs muted">up to 1,488 bytes</text><path d="M14,228 L14,236 L344,236 L344,228" class="line s-blue" stroke-width="2"/><text x="180" y="256" class="mid hand f-blue">the packet’s own little header</text>
</svg>
<figcaption>Each piece (from now on, a <strong>packet</strong>) rides inside an ordinary frame. The frame’s check at the very end covers every bit of it.</figcaption>
</figure>

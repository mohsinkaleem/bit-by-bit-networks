<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 330" role="img" aria-label="Alice broadcasts who has 1.254, the router replies with its card address">
<use href="#alice-head" x="84" y="4" width="52" height="52"/><text x="110" y="78" class="mid slab b">Alice (1.1)</text><line x1="110" y1="86" x2="110" y2="324.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><use href="#bob-head" x="324" y="4" width="52" height="52"/><text x="350" y="78" class="mid slab b">Bob (1.2)</text><line x1="350" y1="86" x2="350" y2="324.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="590" y="78" class="mid slab b">R1 (1.254)</text><line x1="590" y1="86" x2="590" y2="324.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="320.0" class="xs muted">time ↓</text><g data-show="1"><line x1="110" y1="90" x2="350" y2="124" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="230" y="100" class="mid mono sm b halo"></text></g><g data-show="1"><line x1="110" y1="90" x2="590" y2="141" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="474.8" y="121.76" class="mid mono sm b halo">who has 1.254?</text><text x="474.8" y="144.76" class="mid xs muted halo">to: everyone (broadcast)</text></g><g data-show="2"><circle cx="350" cy="154.6" r="5" class="f-ink"/><text x="364" y="159.6" class="hand  halo" text-anchor="start">not me: ignore it</text></g><g data-show="2"><line x1="590" y1="175" x2="110" y2="212.4" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="350" y="186.7" class="mid mono sm b halo">1.254 is card c1:01</text><text x="350" y="209.7" class="mid xs muted halo">to: Alice only</text></g><g data-show="3"><circle cx="110" cy="236.2" r="5" class="f-ink"/><text x="124" y="241.2" class="hand  halo" text-anchor="start">write it down: 1.254 → c1:01</text></g><g data-show="3"><line x1="110" y1="260" x2="590" y2="294" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="350" y="270" class="mid mono sm b halo">frame to c1:01</text></g><use href="#router" x="560" y="10" width="60" height="40"/>
</svg>
<ol class="steps"><li>Alice knows her gateway’s <em>network</em> address, 1.254, but a frame needs a <em>card</em> address. So she broadcasts a question to her whole network.</li><li>Everyone hears it. Only the computer that has 1.254 answers, and it replies to Alice directly.</li><li>Alice notes the answer in a small table, so she doesn’t have to ask again for a while, and sends her frame.</li></ol>
<figcaption>Turning a network address into a card address.</figcaption>
</figure>

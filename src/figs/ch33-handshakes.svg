<figure class="fig">
<svg class="dia" viewBox="0 0 720 222" role="img" aria-label="Round trips before the first byte of the response: three with TCP and TLS, two with QUIC, one with QUIC 0-RTT">
<text x="20" y="28" class="xs b">TCP + TLS 1.3 (HTTP/1.1, HTTP/2)</text><rect x="20" y="34" width="146" height="30" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="93" y="53" class="mid xs b">TCP</text><rect x="170" y="34" width="146" height="30" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="243" y="53" class="mid xs b">TLS</text><rect x="320" y="34" width="146" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="393" y="53" class="mid xs b">request → response</text><text x="480" y="54" class="sm b">first byte ≈ 455 ms</text><text x="20" y="86" class="xs b">QUIC (HTTP/3)</text><rect x="20" y="92" width="146" height="30" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="93" y="111" class="mid xs b">QUIC + TLS</text><rect x="170" y="92" width="146" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="243" y="111" class="mid xs b">request → response</text><text x="330" y="112" class="sm b">first byte ≈ 350 ms</text><text x="20" y="144" class="xs b">QUIC, returning, with 0-RTT</text><rect x="20" y="150" width="146" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="93" y="169" class="mid xs b">hello + request → response</text><text x="180" y="170" class="sm b">one round trip in all</text><line x1="20" y1="16" x2="20" y2="196" class="grid" stroke-dasharray="3 4"/><text x="20" y="210" class="mid xs muted">0 RTT</text><line x1="170" y1="16" x2="170" y2="196" class="grid" stroke-dasharray="3 4"/><text x="170" y="210" class="mid xs muted">1 RTT</text><line x1="320" y1="16" x2="320" y2="196" class="grid" stroke-dasharray="3 4"/><text x="320" y="210" class="mid xs muted">2 RTT</text><line x1="470" y1="16" x2="470" y2="196" class="grid" stroke-dasharray="3 4"/><text x="470" y="210" class="mid xs muted">3 RTT</text>
</svg>
<figcaption>Round trips before the answer starts. The timings are real: <code>curl</code> from Grandpa’s Pi to quic.nginx.org, 175 ms away, over HTTP/2 and HTTP/3.</figcaption>
</figure>

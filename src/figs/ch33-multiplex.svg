<figcaption>Three Wikipedia pages at once. With HTTP/1.1, each needs its own connection (and handshake). With HTTP/2, they share one: this is the real order of the DATA frames from <code>h2client.py en.wikipedia.org /wiki/HTTP/2 /wiki/HTTP/3 /wiki/QUIC</code>. The QUIC page was ready first; then the server let the three take turns.</figcaption>
</figure>

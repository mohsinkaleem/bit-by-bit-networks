<figure class="fig">
<svg class="dia" viewBox="0 0 720 116" role="img" aria-label="A body sent as chunks, each prefixed with its length, ending with a zero-length chunk">
<rect x="20" y="30" width="42" height="40" rx="6" class="t-blue" stroke="var(--line)"/><text x="41" y="56" class="mid mono b">51</text><rect x="66" y="30" width="207" height="40" rx="6" class="t-yellow" stroke="var(--line)"/><text x="169.5" y="56" class="mid mono b">81 bytes of page…</text><rect x="277" y="30" width="31" height="40" rx="6" class="t-blue" stroke="var(--line)"/><text x="292.5" y="56" class="mid mono b">b</text><rect x="312" y="30" width="119" height="40" rx="6" class="t-yellow" stroke="var(--line)"/><text x="371.5" y="56" class="mid mono b">&lt;p&gt;5…&lt;/p&gt;</text><rect x="435" y="30" width="31" height="40" rx="6" class="t-blue" stroke="var(--line)"/><text x="450.5" y="56" class="mid mono b">b</text><rect x="470" y="30" width="119" height="40" rx="6" class="t-yellow" stroke="var(--line)"/><text x="529.5" y="56" class="mid mono b">&lt;p&gt;4…&lt;/p&gt;</text><rect x="593" y="30" width="31" height="40" rx="6" class="f-none" stroke="var(--line)"/><text x="608.5" y="56" class="mid mono b">…</text><rect x="628" y="30" width="31" height="40" rx="6" class="t-red" stroke="var(--line)"/><text x="643.5" y="56" class="mid mono b">0</text><text x="40" y="100" class="hand f-blue">each chunk starts with its own length (in hex)…</text><text x="700" y="100" class="end hand f-red">…and a length of 0 means “that’s all”</text>
</svg>
<figcaption>Chunked sending: length-first framing, one piece at a time.</figcaption>
</figure>

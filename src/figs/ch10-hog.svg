<figure class="fig">
<svg class="dia" viewBox="0 0 720 280" role="img" aria-label="A single huge message hogs the link; chopped into packets, others&#x27; messages slip in between">
<text x="14" y="34" class="slab b">One giant message</text><rect x="150" y="46" width="556" height="34" rx="4" class="f-card" stroke="var(--line)"/><text x="140" y="68" class="end xs muted">link to Carol</text><rect x="152" y="48" width="512" height="30" rx="3" class="f-orange"/><text x="408" y="68" class="mid sm b" fill="#fff">Bob’s video, all two hours of it</text><rect x="666" y="48" width="36" height="30" rx="3" class="f-blue"/><text x="684" y="68" class="mid xs b" fill="#fff">HI</text><line x1="190" y1="12" x2="190" y2="42" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><text x="196" y="22" class="hand f-blue">Alice presses send</text><path d="M190,86 l0,8 L666,94 l0,-8" class="line s-red" stroke-width="2"/><text x="428" y="114" class="mid hand f-red">…and waits for the entire video</text><text x="14" y="184" class="slab b">In packets</text><rect x="150" y="196" width="556" height="34" rx="4" class="f-card" stroke="var(--line)"/><text x="140" y="218" class="end xs muted">link to Carol</text><rect x="152" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="178" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="204" y="198" width="22" height="30" rx="3" class="f-blue"/><text x="215" y="218" class="mid xs b" fill="#fff">HI</text><rect x="230" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="256" y="198" width="22" height="30" rx="3" class="f-green"/><rect x="282" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="308" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="334" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="360" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="386" y="198" width="22" height="30" rx="3" class="f-green"/><rect x="412" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="438" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="464" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="490" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="516" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="542" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="568" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="594" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="620" y="198" width="22" height="30" rx="3" class="f-orange"/><rect x="646" y="198" width="22" height="30" rx="3" class="f-orange"/><text x="676" y="218" class="sm b">…</text><line x1="190" y1="162" x2="190" y2="192" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><text x="196" y="172" class="hand f-blue">Alice presses send</text><path d="M190,236 l0,8 L230,244 l0,-8" class="line s-green" stroke-width="2"/><text x="190" y="264" class="hand f-green">…and waits a moment</text><text x="706" y="264" class="end xs muted">(green: Dave’s messages get a turn too)</text>
</svg>
<figcaption>Chopped into small pieces, one big message can share the link with everyone else’s.</figcaption>
</figure>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 292" role="img" aria-label="A home router rewriting the source address of an outgoing packet, recording it in its NAT table, translating the reply back, and dropping an unsolicited packet">
<rect x="8" y="8" width="250" height="216" rx="10" class="t-green" style="opacity:0.6"/><text x="20" y="28" class="xs b f-green">inside: private addresses</text><text x="706" y="28" class="end xs b" style="fill:var(--blue)">outside: the internet</text><use href="#computer" x="50" y="60" width="56" height="50"/><text x="78" y="124" class="mid xs b">Bob’s laptop</text><text x="78" y="138" class="mid mono xs">192.168.1.3</text><use href="#router" x="320" y="66" width="80" height="52"/><text x="360" y="136" class="mid xs b">home router</text><text x="360" y="150" class="mid mono xs">outside: 203.0.113.77</text><use href="#server" x="640" y="58" width="36" height="58"/><text x="658" y="130" class="mid xs b">info.cern.ch</text><text x="658" y="144" class="mid mono xs">188.184.67.127</text><line x1="110" y1="90" x2="318" y2="90" class="wire" stroke-width="3"/><line x1="402" y1="90" x2="636" y2="90" class="line s-muted dash" stroke-width="2"/><g data-show="=1"><rect x="20" y="166" width="200" height="40" rx="6" class="f-surface" stroke="var(--green)" stroke-width="1.5"/><text x="30" y="182" class="mono xs">from 192.168.1.3:52000</text><text x="30" y="198" class="mono xs">to 188.184.67.127:80</text></g><g data-show="=1"><path d="M222,186 L300,186" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/></g><g data-show="=2"><rect x="470" y="166" width="200" height="40" rx="6" class="f-surface" stroke="var(--blue)" stroke-width="1.5"/><text x="480" y="182" class="mono xs">from 203.0.113.77:52000</text><text x="480" y="198" class="mono xs">to 188.184.67.127:80</text></g><g data-show="=2"><path d="M420,186 L466,186" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="186" class="mid hand f-orange">rewrite the “from”</text></g><g data-show="2-4"><rect x="260" y="236" width="200" height="46" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="360" y="254" class="mid xs b">NAT table</text><text x="360" y="272" class="mid mono xs">:52000 ↔ 192.168.1.3:52000</text></g><g data-show="=3"><rect x="470" y="166" width="200" height="40" rx="6" class="f-surface" stroke="var(--blue)" stroke-width="1.5"/><text x="480" y="182" class="mono xs">from 188.184.67.127:80</text><text x="480" y="198" class="mono xs">to 203.0.113.77:52000</text></g><g data-show="=3"><path d="M466,186 L420,186" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="186" class="mid hand f-orange">look it up…</text></g><g data-show="=3"><rect x="20" y="166" width="200" height="40" rx="6" class="f-surface" stroke="var(--green)" stroke-width="1.5"/><text x="30" y="182" class="mono xs">from 188.184.67.127:80</text><text x="30" y="198" class="mono xs">to 192.168.1.3:52000</text></g><g data-show="=3"><path d="M300,186 L222,186" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/></g><g data-show="=4"><rect x="470" y="166" width="200" height="40" rx="6" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="480" y="182" class="mono xs">from 198.51.100.66:4444</text><text x="480" y="198" class="mono xs">to 203.0.113.77:22</text></g><g data-show="=4"><path d="M466,186 L420,186" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><text x="320" y="190" class="mid hand f-red">✗ no entry: dropped</text></g>
</svg>
<ol class="steps"><li>Bob’s laptop sends a packet to CERN, from its private address. That address means nothing on the internet: millions of homes use 192.168.1.3.</li><li>On the way out, the router swaps the private source for its own public address, and notes what it did in its table. (It also fixes the IP and TCP checksums, since the addresses are part of what they check.)</li><li>CERN’s answer comes back to the router’s public address. The router looks up port 52000 in its table, swaps the destination back to 192.168.1.3:52000, and sends it on. Neither the laptop nor CERN ever knows.</li><li>A packet that isn’t an answer to anything finds no entry in the table, and the router has no idea which device it might be for. It’s thrown away. That’s why NAT works as a basic firewall, and why you can’t easily run a server at home.</li></ol>
<figcaption>Network address translation: one public address shared by a whole house.</figcaption>
</figure>

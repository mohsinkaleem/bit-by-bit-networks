<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 380" role="img" aria-label="Sequence diagram: a server hands out a cookie and the browser returns it on later requests">
<use href="#alice-head" x="144" y="4" width="52" height="52"/><text x="170" y="74" class="mid slab b">Alice’s browser</text><line x1="170" y1="82" x2="170" y2="374.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><use href="#bob-head" x="444" y="4" width="52" height="52"/><text x="470" y="74" class="mid slab b">Bob’s server</text><line x1="470" y1="82" x2="470" y2="374.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="370.0" class="xs muted">time ↓</text><g data-show="1"><line x1="170" y1="86" x2="470" y2="116" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="320" y="94" class="mid mono sm b halo">GET /hello</text></g><g data-show="1"><circle cx="470" cy="122" r="5" class="f-ink"/><text x="484" y="127" class="hand  halo" text-anchor="start">never seen you: you’re #7</text></g><g data-show="1"><line x1="470" y1="134" x2="170" y2="164" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="320" y="142" class="mid mono sm b halo">200 OK  Set-Cookie: visitor=7</text></g><g data-show="2"><circle cx="170" cy="173" r="5" class="f-ink"/><text x="184" y="178" class="hand  halo" text-anchor="start">remembers visitor=7 for bob</text></g><g data-show="2"><line x1="170" y1="194" x2="470" y2="224" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="320" y="202" class="mid mono sm b halo">GET /hello  Cookie: visitor=7</text></g><g data-show="2"><circle cx="470" cy="230" r="5" class="f-ink"/><text x="484" y="235" class="hand  halo" text-anchor="start">#7! visit number 2</text></g><g data-show="2"><line x1="470" y1="242" x2="170" y2="272" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="320" y="250" class="mid mono sm b halo">200 OK “Welcome back!”</text></g><g data-show="3"><line x1="170" y1="302" x2="470" y2="332" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="320" y="310" class="mid mono sm b halo">GET /weather  Cookie: visitor=7</text></g><g data-show="3"><circle cx="170" cy="344" r="5" class="f-ink"/><text x="184" y="349" class="hand  halo" text-anchor="start">…the ticket goes along with every request to bob</text></g>
</svg>
<ol class="steps"><li>Alice’s first visit. The server has never seen her, so it picks a new number and sends it back in a <code>Set-Cookie</code> header.</li><li>Her browser stores the cookie and, from then on, sends it back in a <code>Cookie</code> header. Now the server can tell her apart from everyone else.</li><li>It goes along with <em>every</em> request to Bob’s server, not just to that page, until it expires.</li></ol>
<figcaption>A cookie is a ticket the server hands you, and you show it every time you come back.</figcaption>
</figure>

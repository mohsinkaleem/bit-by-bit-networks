<figure class="fig">
<svg class="dia" viewBox="0 0 720 206" role="img" aria-label="Comparison of visible header fields in a TCP segment carrying TLS and in a QUIC packet">
<text x="20" y="22" class="xs b">A TCP segment carrying TLS: what every router on the way can read (and change)</text><rect x="20" y="32" width="47" height="30" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="43.5" y="51" class="mid xs b">IP</text><rect x="70" y="32" width="57" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="98.5" y="51" class="mid xs b">ports</text><rect x="130" y="32" width="47" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="153.5" y="51" class="mid xs b">seq</text><rect x="180" y="32" width="47" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="203.5" y="51" class="mid xs b">ack</text><rect x="230" y="32" width="47" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="253.5" y="51" class="mid xs b">flags</text><rect x="280" y="32" width="57" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="308.5" y="51" class="mid xs b">window</text><rect x="340" y="32" width="77" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="378.5" y="51" class="mid xs b">TLS header</text><rect x="420" y="32" width="267" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="553.5" y="51" class="mid xs b">🔒 encrypted data</text><text x="20" y="90" class="xs b">A QUIC packet: almost everything is encrypted, even the packet number and the acknowledgements</text><rect x="20" y="100" width="47" height="30" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="43.5" y="119" class="mid xs b">IP</text><rect x="70" y="100" width="47" height="30" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="93.5" y="119" class="mid xs b">UDP</text><rect x="120" y="100" width="41" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="140.5" y="119" class="mid xs b">flags</text><rect x="164" y="100" width="107" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="217.5" y="119" class="mid xs b">connection ID</text><rect x="274" y="100" width="33" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="290.5" y="119" class="mid xs b">🔒 #</text><rect x="310" y="100" width="377" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="498.5" y="119" class="mid xs b">🔒 frames: STREAM, ACK, … (and the rest of the flags)</text><text x="20" y="160" class="xs">Readable parts are yellow. A middlebox can’t read a QUIC connection’s packet numbers or acknowledgements, so it can’t</text><text x="20" y="177" class="xs">meddle with them, or come to depend on them, and QUIC can keep changing without breaking. Only the connection ID</text><text x="20" y="194" class="xs">stays visible, so that load balancers (Chapter 34) can send each packet to the right server.</text>
</svg>
<figcaption>What the network sees.</figcaption>
</figure>

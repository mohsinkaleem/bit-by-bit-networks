<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 322" role="img" aria-label="A Kubernetes cluster with two nodes, pods with their own IP addresses, connections between nodes, and a Service with a virtual IP and DNS name">
<rect x="10" y="40" width="340" height="190" rx="12" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="24" y="60" class="xs b">node 1: a computer · pods get 10.244.1.0/24</text><rect x="30" y="150" width="300" height="30" rx="8" class="t-teal" stroke="var(--teal)" stroke-width="1.6"/><text x="180" y="170" class="mid xs">a bridge (or routes), set up by the CNI plugin</text><rect x="40" y="72" width="130" height="56" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="105" y="94" class="mid xs b">pod garden-7d9f</text><text x="105" y="114" class="mid xs mono">10.244.1.5</text><path d="M105,128 L105,150" class="line s-muted" stroke-width="2.5"/><rect x="190" y="72" width="130" height="56" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="255" y="94" class="mid xs b">pod weather-2c1a</text><text x="255" y="114" class="mid xs mono">10.244.1.6</text><path d="M255,128 L255,150" class="line s-muted" stroke-width="2.5"/><text x="180" y="212" class="mid xs muted">kube-proxy: Service addresses → pods</text><rect x="370" y="40" width="340" height="190" rx="12" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="384" y="60" class="xs b">node 2: a computer · pods get 10.244.2.0/24</text><rect x="390" y="150" width="300" height="30" rx="8" class="t-teal" stroke="var(--teal)" stroke-width="1.6"/><text x="540" y="170" class="mid xs">a bridge (or routes), set up by the CNI plugin</text><rect x="400" y="72" width="130" height="56" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="465" y="94" class="mid xs b">pod garden-4b8e</text><text x="465" y="114" class="mid xs mono">10.244.2.7</text><path d="M465,128 L465,150" class="line s-muted" stroke-width="2.5"/><rect x="550" y="72" width="130" height="56" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="615" y="94" class="mid xs b">pod db-0</text><text x="615" y="114" class="mid xs mono">10.244.2.8</text><path d="M615,128 L615,150" class="line s-muted" stroke-width="2.5"/><text x="540" y="212" class="mid xs muted">kube-proxy: Service addresses → pods</text><g data-show="2"><path d="M350,165 L370,165" class="line s-orange" stroke-width="3"/><text x="360" y="250" class="mid xs b f-orange">between nodes: an overlay (VXLAN, Chapter 35) or plain routes (often BGP, Chapter 24)</text></g><g data-show="3"><rect x="220" y="270" width="280" height="44" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="360" y="290" class="mid xs b">Service “garden”: 10.96.0.20:80</text><text x="360" y="306" class="mid xs mono">garden.default.svc.cluster.local</text></g><text x="360" y="24" class="mid sm b">a Kubernetes cluster</text>
</svg>
<ol class="steps"><li>Every <strong>pod</strong> (one or more containers that share a network namespace) gets its own IP address, from a range belonging to its node. On one node, pods are connected much like <code>box.sh</code>’s boxes.</li><li>Kubernetes’ one rule: every pod can reach every other pod’s address directly, with no NAT, whichever node it’s on. A <strong>CNI plugin</strong> makes that true, either by tunnelling between nodes (VXLAN), or by telling the network routes to each node’s pod range.</li><li>Pods come and go, and their addresses change, so clients use a <strong>Service</strong>: a stable virtual address, and a DNS name. No computer actually has 10.96.0.20: on every node, kube-proxy (or an eBPF program, Chapter 39) rewrites packets for it with DNAT to one of the garden pods, a load balancer (Chapter 34) built into every node.</li></ol>
<figcaption>How Kubernetes networking fits together.</figcaption>
</figure>

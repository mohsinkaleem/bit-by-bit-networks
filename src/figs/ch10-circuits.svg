<figure class="fig">
<svg class="dia" viewBox="0 0 720 296" role="img" aria-label="Circuit switching reserves a whole path per call; packet switching shares links between everyone&#x27;s packets">
<text x="175" y="22" class="mid slab b">Circuit switching (the phone network)</text><path d="M50,80 L136,80 L230,150 L300,150" class="wire" stroke-width="5" fill="none"/><path d="M136,80 L100,196 M230,150 L190,206" class="wire" stroke-width="3"/><path d="M50,80 L136,80 L230,150 L300,150" class="line s-purple" stroke-width="9" fill="none" opacity="0.45"/><rect x="110" y="64" width="52" height="32" rx="6" class="card"/><text x="136" y="56" class="mid xs muted halo">exchange</text><rect x="204" y="134" width="52" height="32" rx="6" class="card"/><text x="244" y="182" class="mid xs muted halo">exchange</text><use href="#alice-head" x="6" y="58" width="44" height="44"/><use href="#bob-head" x="300" y="128" width="44" height="44"/><use href="#carol-head" x="78" y="192" width="40" height="40"/><use href="#dave-head" x="174" y="202" width="40" height="40"/><rect x="73.0" y="73" width="10" height="14" rx="3" class="f-purple"/><text x="94" y="64" class="mid hand xs f-purple halo">“hello?”</text><text x="268" y="136" class="mid hand xs muted halo">(silence)</text><text x="70" y="216" class="end hand f-red b">busy!</text><text x="220" y="224" class="hand f-red b">busy!</text><text x="175" y="262" class="mid sm">The whole path is reserved for the call, even</text><text x="175" y="282" class="mid sm">during silences. Everyone else has to wait.</text><line x1="358" y1="30" x2="358" y2="286" class="line s-line"/><text x="541" y="22" class="mid slab b">Packet switching</text><path d="M416,80 L502,80 L596,150 L666,150" class="wire" stroke-width="5" fill="none"/><path d="M502,80 L466,196 M596,150 L556,206" class="wire" stroke-width="3"/><rect x="476" y="64" width="52" height="32" rx="6" class="card"/><text x="502" y="56" class="mid xs muted halo">switch</text><rect x="570" y="134" width="52" height="32" rx="6" class="card"/><text x="610" y="182" class="mid xs muted halo">switch</text><use href="#alice-head" x="372" y="58" width="44" height="44"/><use href="#bob-head" x="666" y="128" width="44" height="44"/><use href="#carol-head" x="444" y="192" width="40" height="40"/><use href="#dave-head" x="540" y="202" width="40" height="40"/><rect x="432.0" y="73" width="16" height="14" rx="3" class="f-purple"/><rect x="454.0" y="73" width="16" height="14" rx="3" class="f-purple"/><rect x="538.0" y="95" width="16" height="14" rx="3" class="f-purple"/><rect x="558.0" y="109" width="16" height="14" rx="3" class="f-orange"/><rect x="578.0" y="123" width="16" height="14" rx="3" class="f-green"/><rect x="618.0" y="143" width="16" height="14" rx="3" class="f-orange"/><rect x="638.0" y="143" width="16" height="14" rx="3" class="f-purple"/><rect x="475.0" y="151" width="16" height="14" rx="3" class="f-orange"/><rect x="570.0" y="177" width="16" height="14" rx="3" class="f-green"/><text x="541" y="262" class="mid sm">Everyone’s packets share every link,</text><text x="541" y="282" class="mid sm">and nobody reserves anything.</text>
</svg>
<figcaption>Two ways to share a network. Purple is Alice’s call (or packets); orange is Carol’s and green is Dave’s.</figcaption>
</figure>

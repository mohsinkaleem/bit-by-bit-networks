2" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="424" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="450" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="476" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="502" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="528" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="554" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="580" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="606" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><path d="M554,104 l0,6 l74,0 l0,-6" class="line s-purple" stroke-width="2"/><text x="591" y="124" class="mid xs b" style="fill:var(--purple)">window: 12 KB</text></g><g data-show="=3"><text x="470" y="62" class="mid xs b">full: the program still hasn’t read anything</text><rect x="320" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="346" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="372" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="398" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="424" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="450" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="476" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="502" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="528" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="554" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="580" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="606" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><path d="M632,104 l0,6 l-4,0 l0,-6" class="line s-purple" stroke-width="2"/><text x="630" y="124" class="mid xs b" style="fill:var(--purple)">window: 0!</text></g><g data-show="=4"><text x="470" y="62" class="mid xs b">the program reads 28 KB: room again</text><rect x="320" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="346" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="372" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="398" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="424" y="70" width="22" height="26" rx="3" class="t-green" stroke="var(--green)"/><rect x="450" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="476" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="502" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="528" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="554" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="580" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><rect x="606" y="70" width="22" height="26" rx="3" class="f-surface" stroke="var(--line)"/><path d="M450,104 l0,6 l178,0 l0,-6" class="line s-purple" stroke-width="2"/><text x="539" y="124" class="mid xs b" style="fill:var(--purple)">window: 28 KB</text></g><g data-show="=1"><path d="M110,90 L300,90" class="line s-blue" stroke-width="3" marker-end="url(#ah-blue)"/><text x="200" y="82" class="mid xs b halo">data</text></g><g data-show="=2"><path d="M300,110 L110,110" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="200" y="126" class="mid xs b halo" style="fill:var(--purple)">ACK, window 12 KB</text></g><g data-show="=3"><path d="M300,110 L110,110" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="200" y="126" class="mid xs b halo" style="fill:var(--purple)">ACK, window 0: stop!</text><text x="65" y="170" class="mid xs">…waits, and now and then</text><text x="65" y="184" class="mid xs">asks “room yet?”</text></g><g data-show="=4"><path d="M300,110 L110,110" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="200" y="126" class="mid xs b halo" style="fill:var(--purple)">window update: 28 KB</text></g>
</svg>
<ol class="steps"><li>TCP delivers data into a buffer in the receiver’s kernel, where it waits until the program reads it (like UDP’s, in Chapter 26). Every acknowledgement carries the <strong>window</strong>: how much free space is left.</li><li>If the program is slow to read, the buffer fills, and the window it advertises shrinks. The sender may never have more unacknowledged data out than the window allows.</li><li>When the buffer is full, the receiver advertises a <strong>zero window</strong>, and the sender stops. It sends a tiny probe now and then, in case the window update that reopens it gets lost.</li><li>When the program reads, space opens up, and the receiver sends a <strong>window update</strong>. Nothing is ever lost for lack of room: this is <strong>flow control</strong>, and it’s exactly what UDP’s flood in Chapter 26 didn’t have.</li></ol>
<figcaption>Flow control: the receiver says how much it can take.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 306" role="img" aria-label="The real certificate chain for example.org: the site&#x27;s certificate, two intermediates, and a root">
<rect x="150" y="14" width="420" height="56" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="162" y="34" class="sm b">example.org</text><text x="162" y="52" class="xs muted">public key: ECDSA P-256 · valid 26 Sep to 25 Dec 2026</text><text x="560" y="34" class="end xs b">the website</text><text x="140" y="46" class="end xs muted">#0</text><path d="M600,60 C650,74 650,86 600,100" class="line s-orange" stroke-width="2" marker-end="url(#ah-orange)"/><text x="650" y="84" class="xs b f-orange">signed by ↓</text><rect x="150" y="86" width="420" height="56" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="162" y="106" class="sm b">Cloudflare TLS Issuing ECC CA 3</text><text x="162" y="124" class="xs muted">public key: ECDSA P-256 · valid until 2035</text><text x="560" y="106" class="end xs b">an intermediate</text><text x="140" y="118" class="end xs muted">#1</text><path d="M600,132 C650,146 650,158 600,172" class="line s-orange" stroke-width="2" marker-end="url(#ah-orange)"/><text x="650" y="156" class="xs b f-orange">signed by ↓</text><rect x="150" y="158" width="420" height="56" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="162" y="178" class="sm b">SSL.com TLS Transit ECC CA R2</text><text x="162" y="196" class="xs muted">public key: ECDSA P-384 · valid until 2037</text><text x="560" y="178" class="end xs b">another intermediate</text><text x="140" y="190" class="end xs muted">#2</text><path d="M600,204 C650,218 650,230 600,244" class="line s-orange" stroke-width="2" marker-end="url(#ah-orange)"/><text x="650" y="228" class="xs b f-orange">signed by ↓</text><rect x="150" y="230" width="420" height="56" rx="8" class="t-green" stroke="var(--line)" stroke-width="1.6"/><text x="162" y="250" class="sm b">SSL.com TLS ECC Root CA 2022</text><text x="162" y="268" class="xs muted">public key: ECDSA P-384 · this copy cross-signed by an older root</text><text x="560" y="250" class="end xs b">a root: trusted in advance</text><text x="140" y="262" class="end xs muted">#3</text>
</svg>
<figcaption>The certificates example.org really sends, checked from the bottom up: each one is signed by the next, ending at a root the computer already trusts (from <code>openssl s_client -showcerts</code>). The root is sent as a copy signed by an even older root, so that devices too old to know the 2022 one still trust the chain (Chapter 32).</figcaption>
</figure>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 324" role="img" aria-label="A packet crossing two routers keeps its addresses while the frame around it changes at every hop">
<line x1="52" y1="58" x2="256" y2="58" class="wire" stroke-width="5"/><line x1="256" y1="58" x2="464" y2="58" class="wire" stroke-width="5"/><line x1="464" y1="58" x2="668" y2="58" class="wire" stroke-width="5"/><text x="154" y="88" class="mid xs muted">street (net 1)</text><text x="360" y="88" class="mid xs muted">the R1–R4 cable</text><text x="566" y="88" class="mid xs muted">Otto’s town (net 4)</text><use href="#alice-head" x="28" y="32" width="48" height="48"/><text x="52" y="26" class="mid slab b">Alice</text><use href="#router" x="223" y="36" width="66" height="44"/><text x="256" y="26" class="mid slab b">R1</text><use href="#router" x="431" y="36" width="66" height="44"/><text x="464" y="26" class="mid slab b">R4</text><use href="#computer" x="644" y="36" width="48" height="44"/><text x="668" y="26" class="mid slab b">Otto</text><g data-show="=1"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="1.2s" begin="indefinite" fill="freeze" path="M72,58 L226,58"/></circle></g><g data-show="=2"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="1.2s" begin="indefinite" fill="freeze" path="M276,58 L434,58"/></circle></g><g data-show="=3"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="1.2s" begin="indefinite" fill="freeze" path="M484,58 L638,58"/></circle></g><g data-show="1"><rect x="57.0" y="112" width="194" height="146" rx="10" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="67" y="132" class="xs b f-blue">frame</text><text x="67" y="152" class="mono xs b">to c1:01</text><text x="67" y="170" class="mono xs">from 0a:11</text><rect x="67.0" y="182" width="174" height="66" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="77" y="200" class="xs b">packet</text><text x="77" y="218" class="mono xs b">to 4.2 · from 1.1</text><text x="77" y="238" class="mono xs">hops left 64</text></g><g data-show="4"><rect x="64.0" y="179" width="180" height="72" rx="10" class="f-none" stroke="var(--green)" stroke-width="3.5"/></g><g data-show="2"><rect x="263.0" y="112" width="194" height="146" rx="10" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="273" y="132" class="xs b f-blue">frame</text><text x="273" y="152" class="mono xs b">to c4:01</text><text x="273" y="170" class="mono xs">from c1:01</text><rect x="273.0" y="182" width="174" height="66" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="283" y="200" class="xs b">packet</text><text x="283" y="218" class="mono xs b">to 4.2 · from 1.1</text><text x="283" y="238" class="mono xs b f-red">hops left 63</text></g><g data-show="4"><rect x="270.0" y="179" width="180" height="72" rx="10" class="f-none" stroke="var(--green)" stroke-width="3.5"/></g><g data-show="3"><rect x="469.0" y="112" width="194" height="146" rx="10" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="479" y="132" class="xs b f-blue">frame</text><text x="479" y="152" class="mono xs b">to 40:02</text><text x="479" y="170" class="mono xs">from c4:01</text><rect x="479.0" y="182" width="174" height="66" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="489" y="200" class="xs b">packet</text><text x="489" y="218" class="mono xs b">to 4.2 · from 1.1</text><text x="489" y="238" class="mono xs b f-red">hops left 62</text></g><g data-show="4"><rect x="476.0" y="179" width="180" height="72" rx="10" class="f-none" stroke="var(--green)" stroke-width="3.5"/></g><g data-show="4"><text x="360" y="290" class="mid hand f-green">The packet (green) makes the whole trip. Only its hop count changes.</text><text x="360" y="312" class="mid hand f-blue">The frame around it is thrown away and rebuilt at every router.</text></g>
</svg>
<ol class="steps"><li>Alice’s packet is for 4.2, which isn’t on her network. So she puts it in a frame addressed to her <strong>gateway</strong>, R1, using R1’s card address.</li><li>R1 opens the frame and looks at the packet’s destination: network 4. Its table says “via R4”. It takes one off the hop count, wraps the packet in a <em>new</em> frame addressed to R4’s card, and sends it down the cable.</li><li>R4 is plugged right into network 4. It asks “who has 4.2?”, learns Otto’s card address, and wraps the packet in a new frame for him.</li><li>Three frames, one packet. Card addresses only ever get a frame across one network. Network addresses get the packet across the whole town.</li></ol>
<figcaption>New frame, same packet.</figcaption>
</figure>

</svg>
<ol class="steps"><li>An IPv4 address is 32 bits, written as four bytes in decimal. <code>192.168.1.3/24</code> means the first 24 bits name the network, and the last 8 name one computer on it.</li><li>The same split, written as a <strong>netmask</strong>: a 1 for every network bit, and a 0 for every host bit. 24 ones is <code>255.255.255.0</code>.</li><li>AND them together, bit by bit: a 1 only where both have a 1. The host bits all become 0, and what’s left is the network’s own address, <code>192.168.1.0</code>. Every computer does this before sending every packet.</li></ol>
<figcaption>Where the network part ends.</figcaption>
</figure>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 330" role="img" aria-label="One web request travelling from Alice&#x27;s laptop to a server and back, with the envelopes at each stage">
<line x1="60" y1="64" x2="250" y2="64" class="wire" stroke-width="5"/><line x1="250" y1="64" x2="450" y2="64" class="wire" stroke-width="5"/><line x1="450" y1="64" x2="650" y2="64" class="wire" stroke-width="5"/><use href="#alice-head" x="34" y="36" width="52" height="52"/><use href="#router" x="218" y="42" width="64" height="44"/><use href="#cloud" x="390" y="28" width="120" height="72"/><use href="#server" x="632" y="36" width="36" height="56"/><text x="60" y="108" class="mid xs b">Alice’s laptop</text><text x="250" y="108" class="mid xs b">home router</text><text x="450" y="108" class="mid xs b">~12 routers</text><text x="650" y="108" class="mid xs b">grandpa-otto.example</text><g data-show="=1"><rect x="140" y="116" width="440" height="68" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="150" y="134" class="xs b">frame</text><text x="230" y="134" class="mono xs"></text><rect x="154" y="142" width="412" height="37" rx="8" class="f-surface" stroke="var(--line)" stroke-width="2"/><text x="164" y="160" class="xs b">who has?</text><text x="244" y="160" class="mono xs">192.168.1.1? tell 192.168.1.3</text><text x="360" y="212" class="mid hand">ARP: “who has 192.168.1.1?” → “it’s card 14:c3:5e:40:0b:32”</text></g><g data-show="=1"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="1.4s" begin="indefinite" fill="freeze" path="M60,64 L250,64 L60,64"/></circle></g><g data-show="=2"><rect x="140" y="116" width="440" height="120" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="150" y="134" class="xs b">frame</text><text x="230" y="134" class="mono xs"></text><rect x="154" y="142" width="412" height="89" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="164" y="160" class="xs b">packet</text><text x="244" y="160" class="mono xs">to 192.168.1.1</text><rect x="168" y="168" width="384" height="58" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="178" y="186" class="xs b">datagram</text><text x="258" y="186" class="mono xs">to port 53</text><rect x="182" y="194" width="356" height="27" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="192" y="212" class="xs b">question</text><text x="272" y="212" class="mono xs">grandpa-otto.example?</text><text x="360" y="264" class="mid hand">DNS over UDP: “grandpa-otto.example is 203.0.113.42”</text></g><g data-show="=2"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="1.4s" begin="indefinite" fill="freeze" path="M60,64 L250,64 L60,64"/></circle></g><g data-show="=3"><rect x="140" y="116" width="440" height="94" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="150" y="134" class="xs b">frame</text><text x="230" y="134" class="mono xs"></text><rect x="154" y="142" width="412" height="63" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="164" y="160" class="xs b">packet</text><text x="244" y="160" class="mono xs">to 203.0.113.42</text><rect x="168" y="168" width="384" height="32" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="178" y="186" class="xs b">TCP</text><text x="258" y="186" class="mono xs">port 80, SYN, #1000</text><text x="360" y="238" class="mid hand">TCP handshake: SYN → SYN+ACK → ACK</text></g><g data-show="=3"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="4.2s" begin="indefinite" fill="freeze" path="M60,64 L250,64 L450,64 L650,64 L450,64 L250,64 L60,64"/></circle></g><g data-show="=4"><rect x="140" y="116" width="440" height="120" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="150" y="134" class="xs b">frame</text><text x="230" y="134" class="mono xs">to the router’s card</text><rect x="154" y="142" width="412" height="89" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="164" y="160" class="xs b">packet</text><text x="244" y="160" class="mono xs">to 203.0.113.42, hops 64</text><rect x="168" y="168" width="384" height="58" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="178" y="186" class="xs b">TCP</text><text x="258" y="186" class="mono xs">port 80, byte #1001</text><rect x="182" y="194" width="356" height="27" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="192" y="212" class="xs b">HTTP</text><text x="272" y="212" class="mono xs">GET / HTTP/1.1</text><text x="360" y="264" class="mid hand">the request, wrapped in four envelopes</text></g><g data-show="=4"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="0.7s" begin="indefinite" fill="freeze" path="M60,64 L250,64"/></circle></g><g data-show="=5"><rect x="140" y="116" width="440" height="120" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="150" y="134" class="xs b">frame</text><text x="230" y="134" class="mono xs">new at every hop</text><rect x="154" y="142" width="412" height="89" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="164" y="160" class="xs b">packet</text><text x="244" y="160" class="mono xs">hops 63, 62, … 52</text><rect x="168" y="168" width="384" height="58" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="178" y="186" class="xs b">TCP</text><text x="258" y="186" class="mono xs">untouched</text><rect x="182" y="194" width="356" height="27" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="192" y="212" class="xs b">HTTP</text><text x="272" y="212" class="mono xs">untouched</text><text x="360" y="264" class="mid hand">routers rewrap the frame and lower the hop count</text></g><g data-show="=5"><circle r="8" class="f-blue" stroke="var(--surface)" stroke-width="2"><animateMotion dur="1.4s" begin="indefinite" fill="freeze" path="M250,64 L450,64 L650,64"/></circle></g><g data-show="=6"><rect x="140" y="116" width="440" height="120" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="150" y="134" class="xs b">frame</text><text x="230" y="134" class="mono xs">my card ✓ check ✓</text><rect x="154" y="142" width="412" height="89" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="164" y="160" class="xs b">packet</text><text x="244" y="160" class="mono xs">to me ✓</text><rect x="168" y="168" width="384" height="58" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="178" y="186" class="xs b">TCP</text><text x="258" y="186" class="mono xs">port 80 → web server</text><rect x="182" y="194" width="356" height="27" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="192" y="212" class="xs b">HTTP</text><text x="272" y="212" class="mono xs">GET / → the home page</text><text x="360" y="264" class="mid hand">Otto’s server peels each layer off in turn</text></g><g data-show="=7"><rect x="140" y="116" width="440" height="120" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="150" y="134" class="xs b">frame</text><text x="230" y="134" class="mono xs"></text><rect x="154" y="142" width="412" height="89" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="164" y="160" class="xs b">packet</text><text x="244" y="160" class="mono xs">to 192.168.1.3</text><rect x="168" y="168" width="384" height="58" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="178" y="186" class="xs b">TCP</text><text x="258" y="186" class="mono xs">byte #5001</text><rect x="182" y="194" width="356" height="27" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="192" y="212" class="xs b">HTTP</text><text x="272" y="212" class="mono xs">200 OK, &lt;h1&gt;Hello…</text><text x="360" y="264" class="mid hand">the page comes back the same way, then goodbye (FIN)</text></g><g data-show="=7"><circle r="8" class="f-green" stroke="var(--surface)" stroke-width="2"><animateMotion dur="2.1s" begin="indefinite" fill="freeze" path="M650,64 L450,64 L250,64 L60,64"/></circle></g>
</svg>
<ol class="steps"><li>Alice types <code>http://grandpa-otto.example/</code>. Before her laptop can send anything off her network, it needs the router’s card address, so it asks “who has 192.168.1.1?” (Chapter 11).</li><li>Next, the name. Her laptop asks the resolver, which here is the home router, in a UDP datagram to port 53 (Chapters 12 and 14).</li><li>Now it knows where to go. It opens a TCP connection to port 80 at 203.0.113.42, with a three-way handshake (Chapter 13).</li><li>The browser writes its request into the connection: <code>GET / HTTP/1.1</code> (Chapter 6). TCP numbers the bytes, IP addresses the packet, and Ethernet puts it in a frame for the router, with a CRC on the end (Chapters 8–13).</li><li>About a dozen routers pass it along. Each one checks the frame, throws it away, lowers the hop count, and builds a new frame for the next link. The packet inside, and everything inside that, is never touched (Chapter 11).</li><li>At Otto’s server, each layer checks its own header and passes the rest up: the card, then IP, then TCP, which delivers the bytes to the web server program listening on port 80.</li><li>The server’s answer makes the same journey in reverse, the browser shows the page, and the two ends say goodbye. A whole book’s worth of inventions, in about 90 milliseconds.</li></ol>
<figcaption>One click, every layer.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 234" role="img" aria-label="IPsec ESP packet layouts: transport mode, tunnel mode, and tunnel mode inside UDP port 4500 for NAT traversal">
<text x="20" y="38" class="xs b">the original</text><rect x="170" y="20" width="60" height="28" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.3"/><text x="200" y="38" class="mid xs b">IP</text><rect x="230" y="20" width="60" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.3"/><text x="260" y="38" class="mid xs b">TCP</text><rect x="290" y="20" width="180" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.3"/><text x="380" y="38" class="mid xs b">data</text><text x="20" y="82" class="xs b">transport mode</text><rect x="170" y="64" width="60" height="28" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.3"/><text x="200" y="82" class="mid xs b">IP</text><rect x="230" y="64" width="60" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3"/><text x="260" y="82" class="mid xs b">ESP</text><rect x="290" y="64" width="60" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="320" y="82" class="mid xs b">🔒 TCP</text><rect x="350" y="64" width="180" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="440" y="82" class="mid xs b">🔒 data</text><rect x="530" y="64" width="70" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="565" y="82" class="mid xs b">🔒 trailer</text><rect x="600" y="64" width="50" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3"/><text x="625" y="82" class="mid xs b">ICV</text><text x="20" y="126" class="xs b">tunnel mode</text><rect x="170" y="108" width="60" height="28" rx="4" class="t-blue" stroke="var(--blue)" stroke-width="1.3"/><text x="200" y="126" class="mid xs b">new IP</text><rect x="230" y="108" width="50" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3"/><text x="255" y="126" class="mid xs b">ESP</text><rect x="280" y="108" width="50" height="28" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="305" y="126" class="mid xs b">🔒 IP</text><rect x="330" y="108" width="50" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="355" y="126" class="mid xs b">🔒 TCP</text><rect x="380" y="108" width="150" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="455" y="126" class="mid xs b">🔒 data</text><rect x="530" y="108" width="70" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="565" y="126" class="mid xs b">🔒 trailer</text><rect x="600" y="108" width="50" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3"/><text x="625" y="126" class="mid xs b">ICV</text><text x="20" y="170" class="xs b">…through a NAT</text><rect x="170" y="152" width="60" height="28" rx="4" class="t-blue" stroke="var(--blue)" stroke-width="1.3"/><text x="200" y="170" class="mid xs b">new IP</text><rect x="230" y="152" width="70" height="28" rx="4" class="t-orange" stroke="var(--orange)" stroke-width="1.3"/><text x="265" y="170" class="mid xs b">UDP 4500</text><rect x="300" y="152" width="50" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3"/><text x="325" y="170" class="mid xs b">ESP</text><rect x="350" y="152" width="50" height="28" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="375" y="170" class="mid xs b">🔒 IP</text><rect x="400" y="152" width="170" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="485" y="170" class="mid xs b">🔒 TCP + data</text><rect x="570" y="152" width="70" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3" stroke-dasharray="5 3"/><text x="605" y="170" class="mid xs b">🔒 trailer</text><rect x="640" y="152" width="40" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.3"/><text x="660" y="170" class="mid xs b">ICV</text><text x="20" y="206" class="xs">ESP = the SPI (which security agreement this is) and a sequence number. ICV = the integrity check value: the tag.</text><text x="20" y="222" class="xs">The keys come from a separate handshake protocol, IKE, on UDP port 500, which also checks certificates or passwords.</text>
</svg>
<figcaption>IPsec’s ESP, three ways. Transport mode protects a packet between two computers; tunnel mode wraps whole packets, for VPNs. ESP has no ports, so home routers’ NAT can’t handle it, and it’s usually wrapped in UDP as well.</figcaption>
</figure>

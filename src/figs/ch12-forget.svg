<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 365.2" role="img" aria-label="Datagrams can be lost, reordered or duplicated without either end being told">
<use href="#alice-head" x="124" y="4" width="52" height="52"/><text x="150" y="74" class="mid slab b">Alice</text><line x1="150" y1="82" x2="150" y2="359.2" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="570" y="74" class="mid slab b">Otto</text><line x1="570" y1="82" x2="570" y2="359.2" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="355.2" class="xs muted">time ↓</text><g data-show="1"><line x1="150" y1="86" x2="570" y2="118" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="95" class="mid mono sm b halo">#1</text></g><g data-show="1"><circle cx="570" cy="121.2" r="5" class="f-ink"/><text x="584" y="126.2" class="hand  halo" text-anchor="start">got #1</text></g><g data-show="2"><line x1="150" y1="124.4" x2="381" y2="142" class="line s-red dash" stroke-width="2.5"/><path d="M372,133 l18,18 M390,133 l-18,18" class="line s-red" stroke-width="3.5"/><text x="265.5" y="126.2" class="mid mono sm b halo">#2</text></g><g data-show="2"><circle cx="150" cy="156.4" r="5" class="f-ink"/><text x="164" y="161.4" class="hand muted halo" text-anchor="start">(she has no idea)</text></g><g data-show="3"><line x1="150" y1="169.2" x2="570" y2="246" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="297" y="189.08" class="mid mono sm b halo">#3</text><text x="297" y="212.08" class="mid xs muted halo">the long way round</text></g><g data-show="3"><line x1="150" y1="188.4" x2="570" y2="220.4" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="444" y="203.8" class="mid mono sm b halo">#4</text></g><g data-show="3"><circle cx="570" cy="223.6" r="5" class="f-ink"/><text x="584" y="228.6" class="hand  halo" text-anchor="start">got #4</text></g><g data-show="3"><circle cx="570" cy="249.2" r="5" class="f-ink"/><text x="584" y="254.2" class="hand  halo" text-anchor="start">got #3 (late!)</text></g><g data-show="4"><line x1="150" y1="265.2" x2="570" y2="297.2" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="274.2" class="mid mono sm b halo">#5</text></g><g data-show="4"><line x1="150" y1="265.2" x2="570" y2="326" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="452.4" y="301.976" class="mid mono sm b halo">#5 again</text></g><g data-show="4"><circle cx="570" cy="300.4" r="5" class="f-ink"/><text x="584" y="305.4" class="hand  halo" text-anchor="start">got #5</text></g><g data-show="4"><circle cx="570" cy="329.2" r="5" class="f-ink"/><text x="584" y="334.2" class="hand f-red halo" text-anchor="start">got #5 twice?!</text></g><use href="#computer" x="546" y="10" width="48" height="44"/>
</svg>
<ol class="steps"><li>Alice sends five datagrams to Otto. The first one arrives, as most do.</li><li>Number 2 is lost: noise, a full mailbox, a broken cable. Nobody tells Alice. Nobody tells Otto either: he doesn’t know it was ever sent.</li><li>Numbers 3 and 4 take different routes across town (Chapter 11), and 4 overtakes 3.</li><li>And very occasionally, a datagram arrives twice, perhaps because some piece of equipment sent it again. The network makes no promises at all.</li></ol>
<figcaption>Fire and forget: what the network is allowed to do to your datagrams.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 250" role="img" aria-label="One kernel holding three network namespaces, each with its own devices, addresses, routes and ports">
<rect x="10" y="10" width="700" height="230" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="24" y="32" class="sm b">one Linux kernel</text><text x="24" y="50" class="xs muted">(the Pi)</text><rect x="30" y="64" width="206" height="160" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="42" y="86" class="sm b">the host</text><text x="42" y="108" class="xs mono">▸ lo</text><text x="42" y="124" class="xs mono">▸ wlan0 192.168.1.4</text><text x="42" y="140" class="xs mono">▸ eth0 (no cable)</text><text x="42" y="170" class="xs">routes: default via 192.168.1.1</text><text x="42" y="188" class="xs">ports: 22 (ssh), …</text><text x="42" y="206" class="xs muted">its own firewall, ARP table…</text><rect x="256" y="64" width="206" height="160" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="268" y="86" class="sm b">“web”</text><text x="268" y="108" class="xs mono">▸ lo</text><text x="268" y="124" class="xs mono">▸ eth0 10.36.0.2</text><text x="268" y="170" class="xs">routes: default via 10.36.0.1</text><text x="268" y="188" class="xs">ports: 80</text><text x="268" y="206" class="xs muted">its own firewall, ARP table…</text><rect x="482" y="64" width="206" height="160" rx="8" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="494" y="86" class="sm b">“bot”</text><text x="494" y="108" class="xs mono">▸ lo</text><text x="494" y="124" class="xs mono">▸ eth0 10.36.0.4</text><text x="494" y="170" class="xs">routes: default via 10.36.0.1</text><text x="494" y="188" class="xs">ports: 80 (as well!)</text><text x="494" y="206" class="xs muted">its own firewall, ARP table…</text>
</svg>
<figcaption>Network <strong>namespaces</strong>: one kernel, several complete, separate network stacks. A process in “web” sees only web’s devices, routes, firewall and ports. Nothing is copied: the kernel just gives each group of processes a different view.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 380" role="img" aria-label="The TLS 1.3 key schedule: early, handshake and master secrets, and the handshake and application traffic secrets derived from them">
<rect x="55" y="16" width="190" height="40" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="150" y="33" class="mid xs b">zero</text><text x="150" y="48" class="mid xs muted">(no pre-shared key)</text><path d="M150,56 L150,80" class="line s-muted" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="55" y="82" width="190" height="40" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="150" y="99" class="mid xs b">early secret</text><text x="150" y="114" class="mid xs muted">HKDF-Extract</text><path d="M150,122 L150,156" class="line s-muted" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="310" y="96" width="200" height="40" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="410" y="113" class="mid xs b">X25519 shared secret</text><text x="410" y="128" class="mid xs muted">from the two key shares</text><path d="M330,136 L248,164" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/><rect x="55" y="158" width="190" height="40" rx="8" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="150" y="175" class="mid xs b">handshake secret</text><text x="150" y="190" class="mid xs muted">HKDF-Extract</text><path d="M150,198 L150,250" class="line s-muted" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="55" y="252" width="190" height="40" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="150" y="269" class="mid xs b">master secret</text><text x="150" y="284" class="mid xs muted">HKDF-Extract</text><path d="M246,172 L452,172" class="line s-orange" stroke-width="1.8" marker-end="url(#ah-orange)"/><path d="M246,186 L452,212" class="line s-orange" stroke-width="1.8" marker-end="url(#ah-orange)"/><rect x="455" y="152" width="210" height="40" rx="8" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="560" y="169" class="mid xs b">client handshake secret</text><text x="560" y="184" class="mid xs muted">“c hs traffic” + transcript</text><rect x="455" y="196" width="210" height="40" rx="8" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="560" y="213" class="mid xs b">server handshake secret</text><text x="560" y="228" class="mid xs muted">“s hs traffic” + transcript</text><path d="M246,266 L452,266" class="line s-purple" stroke-width="1.8" marker-end="url(#ah-purple)"/><path d="M246,280 L452,306" class="line s-purple" stroke-width="1.8" marker-end="url(#ah-purple)"/><rect x="455" y="246" width="210" height="40" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="560" y="263" class="mid xs b">client application secret</text><text x="560" y="278" class="mid xs muted">“c ap traffic” + transcript</text><rect x="455" y="290" width="210" height="40" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="560" y="307" class="mid xs b">server application secret</text><text x="560" y="322" class="mid xs muted">“s ap traffic” + transcript</text><text x="560" y="352" class="mid xs b">each secret → a 32-byte key (“key”) and a 12-byte IV (“iv”),</text><text x="560" y="368" class="mid xs">and a Finished key (“finished”) for the MACs</text><text x="150" y="318" class="mid xs muted">“transcript” = SHA-256 of every</text><text x="150" y="332" class="mid xs muted">handshake message so far</text>
</svg>
<figcaption>TLS 1.3’s key schedule. Every arrow is HKDF, a way of stretching and mixing secrets with HMAC (Chapter 31). Each key is labelled with what it’s for, and tied to the conversation so far, so a key for one job is useless for any other. In the lab, it’s twenty lines.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 386" role="img" aria-label="Three ways of marking where a message ends">
<text x="20" y="30" class="sm b">1. Using the word OVER to end a message</text><rect x="40" y="44" width="65" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="72.5" y="64" class="mid mono sm b">START</text><rect x="108" y="44" width="54" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="135" y="64" class="mid mono sm b">GAME</text><rect x="165" y="44" width="54" height="30" rx="4" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="192" y="64" class="mid mono sm b">OVER</text><rect x="222" y="44" width="43" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="243.5" y="64" class="mid mono sm b">LOL</text><rect x="268" y="44" width="54" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="295" y="64" class="mid mono sm b">OVER</text><path d="M108,84 L108,90 L219,90 L219,84" class="line s-red"/><text x="163.5" y="110" class="mid hand f-red">Bob: “the message is GAME”</text><text x="282" y="110" class="hand f-red">…then “LOL” is gibberish</text><text x="20" y="156" class="sm b">2. Using control codes that can’t appear in the text</text><rect x="40" y="170" width="32" height="30" rx="4" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="56" y="190" class="mid mono sm b">~S</text><rect x="75" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="86" y="190" class="mid mono sm b">G</text><rect x="100" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="111" y="190" class="mid mono sm b">A</text><rect x="125" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="136" y="190" class="mid mono sm b">M</text><rect x="150" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="161" y="190" class="mid mono sm b">E</text><rect x="175" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="186" y="190" class="mid mono sm b">␣</text><rect x="200" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="211" y="190" class="mid mono sm b">O</text><rect x="225" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="236" y="190" class="mid mono sm b">V</text><rect x="250" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="261" y="190" class="mid mono sm b">E</text><rect x="275" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="286" y="190" class="mid mono sm b">R</text><rect x="300" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="311" y="190" class="mid mono sm b">␣</text><rect x="325" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="336" y="190" class="mid mono sm b">L</text><rect x="350" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="361" y="190" class="mid mono sm b">O</text><rect x="375" y="170" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="386" y="190" class="mid mono sm b">L</text><rect x="400" y="170" width="32" height="30" rx="4" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="416" y="190" class="mid mono sm b">~E</text><path d="M75,210 L75,216 L397,216 L397,210" class="line s-green"/><text x="236" y="236" class="mid hand f-green">one complete message</text><text x="20" y="282" class="sm b">3. And when the text itself contains a ~, it’s escaped as ~~</text><rect x="40" y="296" width="32" height="30" rx="4" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="56" y="316" class="mid mono sm b">~S</text><rect x="75" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="86" y="316" class="mid mono sm b">S</text><rect x="100" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="111" y="316" class="mid mono sm b">E</text><rect x="125" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="136" y="316" class="mid mono sm b">E</text><rect x="150" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="161" y="316" class="mid mono sm b">␣</text><rect x="175" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="186" y="316" class="mid mono sm b">Y</text><rect x="200" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="211" y="316" class="mid mono sm b">O</text><rect x="225" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="236" y="316" class="mid mono sm b">U</text><rect x="250" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="261" y="316" class="mid mono sm b">␣</text><rect x="275" y="296" width="32" height="30" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="291" y="316" class="mid mono sm b">~~</text><rect x="310" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="321" y="316" class="mid mono sm b">␣</text><rect x="335" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="346" y="316" class="mid mono sm b">S</text><rect x="360" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="371" y="316" class="mid mono sm b">O</text><rect x="385" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="396" y="316" class="mid mono sm b">O</text><rect x="410" y="296" width="22" height="30" rx="4" class="t-yellow" stroke="var(--line)" stroke-width="1.5"/><text x="421" y="316" class="mid mono sm b">N</text><rect x="435" y="296" width="32" height="30" rx="4" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="451" y="316" class="mid mono sm b">~E</text><path d="M291.0,338 l0,14" class="line s-purple" marker-start="url(#ah-purple)"/><text x="291" y="372" class="mid hand f-purple">means one real “~”</text>
</svg>
<figcaption>Words can appear inside messages. Control codes can’t, as long as we escape them.</figcaption>
</figure>

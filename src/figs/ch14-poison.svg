<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 369.2" role="img" aria-label="Eve floods a resolver with forged answers and one matches the question number">
<text x="110" y="80" class="mid slab b">resolver</text><line x1="110" y1="88" x2="110" y2="363.20000000000005" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><use href="#eve-head" x="354" y="4" width="52" height="52"/><text x="380" y="80" class="mid slab b">Eve</text><line x1="380" y1="88" x2="380" y2="363.20000000000005" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="630" y="80" class="mid slab b">seaside</text><line x1="630" y1="88" x2="630" y2="363.20000000000005" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="359.20000000000005" class="xs muted">time ↓</text><g data-show="1"><line x1="110" y1="92" x2="630" y2="142.4" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="255.6" y="99.112" class="mid mono sm b halo">question #7: harbor.seaside?</text></g><g data-show="2"><circle cx="380" cy="158.6" r="5" class="f-ink"/><text x="394" y="163.6" class="hand f-red halo" text-anchor="start">fake answers #1… #6, #7, #8… #50</text></g><g data-show="2"><line x1="380" y1="171.2" x2="110" y2="196.4" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><text x="245" y="176.8" class="mid mono sm b halo"></text></g><g data-show="2"><line x1="380" y1="185.6" x2="110" y2="210.8" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><text x="245" y="191.2" class="mid mono sm b halo"></text></g><g data-show="2"><line x1="380" y1="200" x2="110" y2="225.2" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><text x="245" y="205.6" class="mid mono sm b halo">#7: harbor is 6.66</text></g><g data-show="2"><line x1="380" y1="214.4" x2="110" y2="239.6" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><text x="245" y="220" class="mid mono sm b halo"></text></g><g data-show="3"><circle cx="110" cy="261.2" r="5" class="f-ink"/><text x="124" y="266.2" class="hand f-red halo" text-anchor="start">#7 matches! Believe it, and remember it for an hour</text></g><g data-show="4"><line x1="630" y1="282.8" x2="110" y2="333.2" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="370" y="301" class="mid mono sm b halo">#7: harbor is 4.8</text><text x="370" y="324" class="mid xs muted halo">too late: already answered</text></g><use href="#server" x="92" y="8" width="36" height="46"/><use href="#server" x="612" y="8" width="36" height="46"/>
</svg>
<ol class="steps"><li>The resolver asks seaside’s server about harbor.seaside, with question number 7.</li><li>Eve can’t see the question, but she can guess. She floods the resolver with fake answers, each with a different number.</li><li>One of them has the right number, and it arrives first. The resolver believes it.</li><li>The real answer arrives a moment later, and it’s ignored. For the next hour, everyone on the street who asks for harbor.seaside is sent to Eve.</li></ol>
<figcaption>Poisoning a resolver’s memory.</figcaption>
</figure>

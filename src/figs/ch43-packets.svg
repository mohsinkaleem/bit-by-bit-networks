<figure class="fig">
<svg class="dia" viewBox="0 0 720 274" role="img" aria-label="The bytes of an NDN Interest: type 5, a name made of components, a nonce and a lifetime; and the fields of the Data packet that answers it">
<text x="20" y="22" class="xs b">an Interest, 43 bytes: every piece is Type, Length, Value</text><rect x="20" y="32" width="220" height="21" rx="4" class="t-green" stroke="none" stroke-width="0"/><text x="30" y="47" class="xs mono b">05 29</text><text x="250" y="47" class="xs">Interest, 41 bytes follow</text><rect x="20" y="58" width="220" height="21" rx="4" class="t-blue" stroke="none" stroke-width="0"/><text x="30" y="73" class="xs mono b">07 1d</text><text x="250" y="73" class="xs">Name, 29 bytes:</text><rect x="20" y="84" width="220" height="21" rx="4" class="t-blue" stroke="none" stroke-width="0"/><text x="30" y="99" class="xs mono b">08 03 6e 64 6e</text><text x="250" y="99" class="xs">   component “ndn”</text><rect x="20" y="110" width="220" height="21" rx="4" class="t-blue" stroke="none" stroke-width="0"/><text x="30" y="125" class="xs mono b">08 03 65 64 75</text><text x="250" y="125" class="xs">   component “edu”</text><rect x="20" y="136" width="220" height="21" rx="4" class="t-blue" stroke="none" stroke-width="0"/><text x="30" y="151" class="xs mono b">08 04 75 63 6c 61</text><text x="250" y="151" class="xs">   component “ucla”</text><rect x="20" y="162" width="220" height="21" rx="4" class="t-blue" stroke="none" stroke-width="0"/><text x="30" y="177" class="xs mono b">08 04 70 69 6e 67</text><text x="250" y="177" class="xs">   component “ping”</text><rect x="20" y="188" width="220" height="21" rx="4" class="t-blue" stroke="none" stroke-width="0"/><text x="30" y="203" class="xs mono b">08 05 33 31 34 31 35</text><text x="250" y="203" class="xs">   component “31415”</text><rect x="20" y="214" width="220" height="21" rx="4" class="t-orange" stroke="none" stroke-width="0"/><text x="30" y="229" class="xs mono b">0a 04 5a 1c 9e 02</text><text x="250" y="229" class="xs">Nonce: 4 random bytes, to catch loops</text><rect x="20" y="240" width="220" height="21" rx="4" class="t-orange" stroke="none" stroke-width="0"/><text x="30" y="255" class="xs mono b">0c 02 0f a0</text><text x="250" y="255" class="xs">InterestLifetime: 4,000 ms</text><text x="420" y="22" class="xs b">the Data that answers it</text><rect x="420" y="32" width="36" height="24" rx="4" class="t-green" stroke="none" stroke-width="0"/><text x="438" y="48" class="mid xs mono b">06</text><text x="466" y="48" class="xs">Data</text><rect x="420" y="62" width="36" height="24" rx="4" class="t-blue" stroke="none" stroke-width="0"/><text x="438" y="78" class="mid xs mono b">07</text><text x="466" y="78" class="xs">Name: the same /ndn/edu/ucla/ping/31415</text><rect x="420" y="92" width="36" height="24" rx="4" class="t-orange" stroke="none" stroke-width="0"/><text x="438" y="108" class="mid xs mono b">14</text><text x="466" y="108" class="xs">MetaInfo: fresh for 1,000 ms</text><rect x="420" y="122" width="36" height="24" rx="4" class="t-yellow" stroke="none" stroke-width="0"/><text x="438" y="138" class="mid xs mono b">15</text><text x="466" y="138" class="xs">Content (a real one would hold the thing)</text><rect x="420" y="152" width="36" height="24" rx="4" class="t-purple" stroke="none" stroke-width="0"/><text x="438" y="168" class="mid xs mono b">16</text><text x="466" y="168" class="xs">SignatureInfo: type 0, a SHA-256 digest</text><rect x="420" y="182" width="36" height="24" rx="4" class="t-purple" stroke="none" stroke-width="0"/><text x="438" y="198" class="mid xs mono b">17</text><text x="466" y="198" class="xs">SignatureValue: 32 bytes</text><path d="M412,62 L406,62 L406,176 L412,176" class="line s-purple" stroke-width="1.6" fill="none"/><text x="420" y="228" class="xs">The signature covers the name and the content</text><text x="420" y="244" class="xs">together: a name can’t be moved to other data.</text>
</svg>
<figcaption>NDN’s two packet types. There are no addresses anywhere: routers forward on the name, and the Data’s signature is what makes it trustworthy, wherever it came from.</figcaption>
</figure>

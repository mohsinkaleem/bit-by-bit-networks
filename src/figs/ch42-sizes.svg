<figure class="fig">
<svg class="dia" viewBox="0 0 720 318" role="img" aria-label="Bar chart of public key and signature sizes: Ed25519 32 and 64 bytes, ECDSA 65 and 71, RSA 270 and 256, ML-DSA-65 1,952 and 3,309, SLH-DSA-128f 32 and 17,088">
<text x="20" y="22" class="xs b">bytes, as OpenSSL 3.6 makes them</text><rect x="440" y="12" width="12" height="12" class="t-orange"/><text x="458" y="22" class="xs">public key</text><rect x="540" y="12" width="12" height="12" class="t-purple"/><text x="558" y="22" class="xs">one signature</text><text x="20" y="54" class="xs b">Ed25519</text><rect x="170" y="40" width="2.0" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="52" width="2.0" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="180" y="56" class="xs mono">32 + 64</text><text x="20" y="86" class="xs b">ECDSA P-256</text><rect x="170" y="72" width="2.0" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="84" width="2.0" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="180" y="88" class="xs mono">65 + 71</text><text x="20" y="118" class="xs b">RSA-2048</text><rect x="170" y="104" width="6.8" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="116" width="6.4" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="184.794" y="120" class="xs mono">270 + 256</text><text x="20" y="150" class="xs b">ML-DSA-44</text><rect x="170" y="136" width="33.0" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="148" width="60.9" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="238.897" y="152" class="xs mono">1,312 + 2,420</text><text x="20" y="182" class="xs b">ML-DSA-65</text><rect x="170" y="168" width="49.1" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="180" width="83.3" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="261.267" y="184" class="xs mono">1,952 + 3,309</text><text x="20" y="214" class="xs b">ML-DSA-87</text><rect x="170" y="200" width="65.2" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="212" width="116.4" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="294.433" y="216" class="xs mono">2,592 + 4,627</text><text x="20" y="246" class="xs b">SLH-DSA-SHA2-128s</text><rect x="170" y="232" width="2.0" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="244" width="197.7" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="375.687" y="248" class="xs mono">32 + 7,856</text><text x="20" y="278" class="xs b">SLH-DSA-SHA2-128f</text><rect x="170" y="264" width="2.0" height="10" class="t-orange" stroke="var(--orange)" stroke-width="0.8"/><rect x="170" y="276" width="430.0" height="10" class="t-purple" stroke="var(--purple)" stroke-width="0.8"/><text x="608" y="280" class="xs mono">32 + 17,088</text><text x="20" y="306" class="xs">A TLS handshake carries two or three certificates, each with a public key and a signature, plus one more signature (Chapter 32).</text>
</svg>
<figcaption>Post-quantum signatures are big. The first three rows are today’s; the rest are NIST’s new standards.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 300" role="img" aria-label="The parts of a URL: scheme, host and path">
<text x="20" y="36" class="sm b">One of our addresses:</text><rect x="90" y="48" width="53.2" height="36" rx="6" class="t-purple" stroke="var(--line)"/><text x="116.6" y="72" class="mid mono lg b">ttp</text><path d="M116.6,86 L116.6,100" class="line thin s-muted"/><text x="116.6" y="116" class="mid hand">how to talk (scheme)</text><rect x="145.2" y="48" width="53.2" height="36" rx="6" class="f-none" stroke="var(--line)"/><text x="171.8" y="72" class="mid mono lg b">://</text><rect x="200.39999999999998" y="48" width="78.0" height="36" rx="6" class="t-blue" stroke="var(--line)"/><text x="239.4" y="72" class="mid mono lg b">carol</text><path d="M239.39999999999998,86 L239.39999999999998,124" class="line thin s-muted"/><text x="239.4" y="140" class="mid hand">which computer (host)</text><rect x="280.4" y="48" width="239.20000000000002" height="36" rx="6" class="t-yellow" stroke="var(--line)"/><text x="400" y="72" class="mid mono lg b">/recipes/snacks.mu</text><path d="M400.0,86 L400.0,100" class="line thin s-muted"/><text x="400" y="116" class="mid hand">which document (path)</text><text x="20" y="180" class="sm b">A real one, same parts:</text><rect x="90" y="192" width="78.0" height="36" rx="6" class="t-purple" stroke="var(--line)"/><text x="129" y="216" class="mid mono lg b">https</text><path d="M129.0,230 L129.0,244" class="line thin s-muted"/><text x="129" y="260" class="mid hand">scheme</text><rect x="170.0" y="192" width="53.2" height="36" rx="6" class="f-none" stroke="var(--line)"/><text x="196.6" y="216" class="mid mono lg b">://</text><rect x="225.2" y="192" width="202.0" height="36" rx="6" class="t-blue" stroke="var(--line)"/><text x="326.2" y="216" class="mid mono lg b">www.example.com</text><path d="M326.2,230 L326.2,268" class="line thin s-muted"/><text x="326.2" y="284" class="mid hand">host</text><rect x="429.2" y="192" width="214.4" height="36" rx="6" class="t-yellow" stroke="var(--line)"/><text x="536.4" y="216" class="mid mono lg b">/docs/intro.html</text><path d="M536.4,230 L536.4,244" class="line thin s-muted"/><text x="536.4" y="260" class="mid hand">path</text>
</svg>
<figcaption>Every link says three things: which protocol to speak, which computer to ask, and what to ask it for.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 240" role="img" aria-label="Two ways to find the end of a message: an end marker, or a length up front">
<text x="20" y="30" class="sm b">Marker style (Chapter 3): look at every byte for the end marker, escape any ~ inside</text><rect x="40" y="44" width="34" height="34" rx="5" class="t-red" stroke="var(--line)"/><text x="57" y="66" class="mid mono sm b">~S</text><rect x="77" y="44" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="94" y="66" class="mid mono sm b">89</text><rect x="114" y="44" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="131" y="66" class="mid mono sm b">50</text><rect x="151" y="44" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="168" y="66" class="mid mono sm b">4E</text><rect x="188" y="44" width="34" height="34" rx="5" class="t-purple" stroke="var(--line)"/><text x="205" y="66" class="mid mono sm b">~~</text><rect x="225" y="44" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="242" y="66" class="mid mono sm b">47</text><rect x="262" y="44" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="279" y="66" class="mid mono sm b">0D</text><rect x="299" y="44" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="316" y="66" class="mid mono sm b">…</text><rect x="336" y="44" width="34" height="34" rx="5" class="t-red" stroke="var(--line)"/><text x="353" y="66" class="mid mono sm b">~E</text><text x="381" y="66" class="hand muted">“~” is 7E, so any 7E byte in the picture has to be doubled</text><text x="20" y="130" class="sm b">Length style: say how many bytes are coming, then simply count them</text><rect x="40" y="144" width="118.5" height="34" rx="5" class="t-blue" stroke="var(--line)"/><text x="99.25" y="166" class="mid mono sm b">Length: 944</text><rect x="161.5" y="144" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="178.5" y="166" class="mid mono sm b">89</text><rect x="198.5" y="144" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="215.5" y="166" class="mid mono sm b">50</text><rect x="235.5" y="144" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="252.5" y="166" class="mid mono sm b">4E</text><rect x="272.5" y="144" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="289.5" y="166" class="mid mono sm b">7E</text><rect x="309.5" y="144" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="326.5" y="166" class="mid mono sm b">47</text><rect x="346.5" y="144" width="34" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="363.5" y="166" class="mid mono sm b">0D</text><rect x="383.5" y="144" width="204.0" height="34" rx="5" class="t-yellow" stroke="var(--line)"/><text x="485.5" y="166" class="mid mono sm b">… 944 bytes in all …</text><path d="M160,190 C300,214 500,214 584.5,190" class="line s-green" marker-end="url(#ah-green)"/><text x="400" y="226" class="mid hand f-green">no escaping, no scanning: after 944 bytes, the message is over</text>
</svg>
<figcaption>An end marker means inspecting every byte. A length up front means you can just count.</figcaption>
</figure>

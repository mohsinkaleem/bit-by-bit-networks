<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 310" role="img" aria-label="A two-dimensional lattice of points with a short basis and a long skewed basis, and a target point to be matched to its nearest lattice point">
<clipPath id="lat42"><rect x="10" y="10" width="380" height="290" rx="8"/></clipPath><rect x="10" y="10" width="380" height="290" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><g clip-path="url(#lat42)"><circle cx="34.0" cy="62.0" r="3" class="f-ink"/><circle cx="34.0" cy="192.0" r="3" class="f-ink"/><circle cx="60.0" cy="140.0" r="3" class="f-ink"/><circle cx="86.0" cy="88.0" r="3" class="f-ink"/><circle cx="112.0" cy="36.0" r="3" class="f-ink"/><circle cx="60.0" cy="270.0" r="3" class="f-ink"/><circle cx="86.0" cy="218.0" r="3" class="f-ink"/><circle cx="112.0" cy="166.0" r="3" class="f-ink"/><circle cx="138.0" cy="114.0" r="3" class="f-ink"/><circle cx="164.0" cy="62.0" r="3" class="f-ink"/><circle cx="112.0" cy="296.0" r="3" class="f-ink"/><circle cx="138.0" cy="244.0" r="3" class="f-ink"/><circle cx="164.0" cy="192.0" r="3" class="f-ink"/><circle cx="190.0" cy="140.0" r="3" class="f-ink"/><circle cx="216.0" cy="88.0" r="3" class="f-ink"/><circle cx="242.0" cy="36.0" r="3" class="f-ink"/><circle cx="190.0" cy="270.0" r="3" class="f-ink"/><circle cx="216.0" cy="218.0" r="3" class="f-ink"/><circle cx="242.0" cy="166.0" r="3" class="f-ink"/><circle cx="268.0" cy="114.0" r="3" class="f-ink"/><circle cx="294.0" cy="62.0" r="3" class="f-ink"/><circle cx="242.0" cy="296.0" r="3" class="f-ink"/><circle cx="268.0" cy="244.0" r="3" class="f-ink"/><circle cx="294.0" cy="192.0" r="3" class="f-ink"/><circle cx="320.0" cy="140.0" r="3" class="f-ink"/><circle cx="346.0" cy="88.0" r="3" class="f-ink"/><circle cx="372.0" cy="36.0" r="3" class="f-ink"/><circle cx="320.0" cy="270.0" r="3" class="f-ink"/><circle cx="346.0" cy="218.0" r="3" class="f-ink"/><circle cx="372.0" cy="166.0" r="3" class="f-ink"/><circle cx="372.0" cy="296.0" r="3" class="f-ink"/><circle cx="174.4" cy="158.2" r="6" class="f-red"/><text x="164.4" y="180.2" class="end xs b f-red">a point with noise added</text><g data-show="1"><path d="M60,270 L138,244" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><path d="M60,270 L86,218" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><circle cx="190.0" cy="140.0" r="9" fill="none" class="line s-green" stroke-width="2.5"/></g><g data-show="2"><path d="M60,270 L242,166" class="line s-orange" stroke-width="3" marker-end="url(#ah-orange)"/><path d="M60,270 L346,88" class="line s-orange" stroke-width="3" marker-end="url(#ah-orange)"/></g></g><text x="420" y="40" class="xs">A lattice: a grid of points, made by adding</text><text x="420" y="56" class="xs">whole multiples of two arrows (a basis).</text><g data-show="1"><text x="420" y="92" class="xs b f-green">With short, nearly square arrows (green),</text><text x="420" y="108" class="xs">finding the lattice point nearest to the red</text><text x="420" y="124" class="xs">one is easy: round to the nearest corner.</text></g><g data-show="2"><text x="420" y="160" class="xs b f-orange">The orange arrows make exactly the same</text><text x="420" y="176" class="xs">grid. But from them, rounding points you</text><text x="420" y="192" class="xs">to the wrong place, far away.</text><text x="420" y="226" class="xs b">Now imagine 768 dimensions instead of 2.</text><text x="420" y="242" class="xs">The public key is like the orange arrows;</text><text x="420" y="258" class="xs">the private key, the green ones. Nobody</text><text x="420" y="274" class="xs">knows a fast way, even with a quantum</text><text x="420" y="290" class="xs">computer, to get from one to the other.</text></g>
</svg>
<ol class="steps"><li>The same grid of points can be made from different pairs of arrows. With a good pair, it’s easy to find the grid point closest to any spot.</li><li>With a bad pair, it’s very hard. Lattice cryptography gives everyone the bad arrows, and keeps the good ones secret.</li></ol>
<figcaption>The hard problem underneath ML-KEM and ML-DSA, in two dimensions instead of hundreds.</figcaption>
</figure>

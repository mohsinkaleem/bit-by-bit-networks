<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 539" role="img" aria-label="Stop-and-wait with sequence numbers, surviving a lost datagram and a lost acknowledgment">
<use href="#alice-head" x="144" y="4" width="52" height="52"/><text x="170" y="74" class="mid slab b">Alice</text><line x1="170" y1="82" x2="170" y2="533.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="550" y="74" class="mid slab b">Otto</text><line x1="550" y1="82" x2="550" y2="533.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="529.0" class="xs muted">time ↓</text><g data-show="1"><line x1="170" y1="86" x2="550" y2="116" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="94" class="mid mono sm b halo">#0</text></g><g data-show="1"><line x1="550" y1="122" x2="170" y2="152" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="130" class="mid mono sm b halo">ACK 1</text><text x="360" y="153" class="mid xs muted halo">“I have everything before #1”</text></g><g data-show="2"><line x1="170" y1="164" x2="379" y2="180.5" class="line s-red dash" stroke-width="2.5"/><path d="M370,171.5 l18,18 M388,171.5 l-18,18" class="line s-red" stroke-width="3.5"/><text x="274.5" y="165.25" class="mid mono sm b halo">#1</text></g><g data-show="2"><path d="M161.2,164 L148,164 L148,236 L161.2,236" class="line s-orange" stroke-width="2.5"/><text x="139.2" y="205" class="hand f-orange halo" text-anchor="end">no ACK… time’s up</text></g><g data-show="2"><line x1="170" y1="242" x2="550" y2="272" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="250" class="mid mono sm b halo">#1 again</text></g><g data-show="2"><line x1="550" y1="278" x2="170" y2="308" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="286" class="mid mono sm b halo">ACK 2</text></g><g data-show="3"><line x1="170" y1="320" x2="550" y2="350" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="328" class="mid mono sm b halo">#2</text></g><g data-show="3"><line x1="550" y1="356" x2="360" y2="371" class="line s-red dash" stroke-width="2.5"/><path d="M351,362 l18,18 M369,362 l-18,18" class="line s-red" stroke-width="3.5"/><text x="455" y="356.5" class="mid mono sm b halo">ACK 3</text></g><g data-show="3"><path d="M161.2,320 L148,320 L148,404 L161.2,404" class="line s-orange" stroke-width="2.5"/><text x="139.2" y="367" class="hand f-orange halo" text-anchor="end">time’s up</text></g><g data-show="4"><line x1="170" y1="410" x2="550" y2="440" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="418" class="mid mono sm b halo">#2 again</text></g><g data-show="4"><circle cx="550" cy="446" r="5" class="f-ink"/><text x="536" y="451" class="hand  halo" text-anchor="end">I already have #2! Keep one copy…</text></g><g data-show="4"><line x1="550" y1="473" x2="170" y2="503" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="481" class="mid mono sm b halo">ACK 3</text><text x="360" y="504" class="mid xs muted halo">…but acknowledge it again</text></g><use href="#computer" x="526" y="10" width="48" height="44"/>
</svg>
<ol class="steps"><li>Every datagram carries a number, and every acknowledgment says which number Otto wants next.</li><li>Datagram #1 is lost. Alice waits for its ACK, gives up, and sends it again. Exactly the plan from Chapter 3.</li><li>This time the <em>acknowledgment</em> is lost. Alice can’t tell the difference, so she resends #2.</li><li>In Chapter 3, this is where Bob printed a message twice. Now the number gives it away: Otto already has #2, so he throws the copy away and just repeats his ACK.</li></ol>
<figcaption>Numbers turn “did you get that?” into something that always works.</figcaption>
</figure>

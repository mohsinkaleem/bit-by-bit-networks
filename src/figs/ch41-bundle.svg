<figure class="fig">
<svg class="dia" viewBox="0 0 720 346" role="img" aria-label="The bytes of one bundle, block by block: primary block with version, flags, CRC type, destination, source, report-to, creation time, lifetime and CRC; a hop count block; a payload block">
<rect x="10" y="12" width="290" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="20" y="28" class="xs mono b">9f</text><text x="312" y="28" class="xs">start of the bundle: an array of blocks, length unknown</text><rect x="10" y="42" width="290" height="24" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="20" y="58" class="xs mono b">89 07 00 01</text><text x="312" y="58" class="xs">primary block: 9 items. Version 7, flags 0, CRC type 1 (CRC-16)</text><rect x="10" y="72" width="290" height="24" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="20" y="88" class="xs mono b">82 01 6e “//rover/camera”</text><text x="312" y="88" class="xs">destination: [1 = the dtn scheme, the name]</text><rect x="10" y="102" width="290" height="24" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="20" y="118" class="xs mono b">82 01 68 “//earth/”</text><text x="312" y="118" class="xs">source node</text><rect x="10" y="132" width="290" height="24" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="20" y="148" class="xs mono b">82 01 00</text><text x="312" y="148" class="xs">report to: dtn:none (nobody)</text><rect x="10" y="162" width="290" height="24" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="20" y="178" class="xs mono b">82 1b 00 00 00 c4 7b ce 2e e0 01</text><text x="312" y="178" class="xs">created: 843,890,700,000 ms after 1 January 2000, bundle number 1</text><rect x="10" y="192" width="290" height="24" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="20" y="208" class="xs mono b">1a 24 0c 84 00</text><text x="312" y="208" class="xs">lifetime: 604,800,000 ms, a week</text><rect x="10" y="222" width="290" height="24" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="20" y="238" class="xs mono b">42 86 5c</text><text x="312" y="238" class="xs">CRC-16 of this block, so damage can be spotted</text><rect x="10" y="252" width="290" height="24" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.2"/><text x="20" y="268" class="xs mono b">85 0a 02 00 00 43 82 10 00</text><text x="312" y="268" class="xs">hop count block: type 10, number 2, data [16, 0]: at most 16 hops, none yet</text><rect x="10" y="282" width="290" height="24" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.2"/><text x="20" y="298" class="xs mono b">85 01 01 00 00 58 21 “Please…”</text><text x="312" y="298" class="xs">payload block: type 1, number 1, 33 bytes of data</text><rect x="10" y="312" width="290" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="20" y="328" class="xs mono b">ff</text><text x="312" y="328" class="xs">end of the bundle</text>
</svg>
<figcaption>One bundle, all 105 bytes, as <code>dtn.py --bundle</code> builds it. The primary block never changes on the way; the other blocks can.</figcaption>
</figure>

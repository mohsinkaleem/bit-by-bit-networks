<figure class="fig">
<svg class="dia" viewBox="0 0 720 344" role="img" aria-label="A scale of Wi-Fi signal strengths from -20 to -100 dBm, marking the Pi at -38, a laptop at -58 and the noise floor at -95">
<text x="20" y="24" class="sm b">Wi-Fi signal strength, in dBm (every 10 dBm down is 10 times weaker)</text><rect x="224" y="50" width="24" height="280" rx="12" class="t-green"/><line x1="218" y1="330.0" x2="224" y2="330.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="334" class="end xs muted">-100</text><line x1="218" y1="295.0" x2="224" y2="295.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="299" class="end xs muted">-90</text><line x1="218" y1="260.0" x2="224" y2="260.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="264" class="end xs muted">-80</text><line x1="218" y1="225.0" x2="224" y2="225.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="229" class="end xs muted">-70</text><line x1="218" y1="190.0" x2="224" y2="190.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="194" class="end xs muted">-60</text><line x1="218" y1="155.0" x2="224" y2="155.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="159" class="end xs muted">-50</text><line x1="218" y1="120.0" x2="224" y2="120.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="124" class="end xs muted">-40</text><line x1="218" y1="85.0" x2="224" y2="85.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="89" class="end xs muted">-30</text><line x1="218" y1="50.0" x2="224" y2="50.0" class="line s-muted" stroke-width="1.5"/><text x="212" y="54" class="end xs muted">-20</text><rect x="224" y="50.0" width="24" height="105.0" style="fill:var(--green);opacity:0.55"/><text x="178" y="106.5" class="end xs b" style="fill:var(--green)">excellent</text><rect x="224" y="155.0" width="24" height="59.5" style="fill:var(--teal);opacity:0.55"/><text x="178" y="188.75" class="end xs b" style="fill:var(--teal)">good: video calls work</text><rect x="224" y="214.5" width="24" height="45.5" style="fill:var(--yellow);opacity:0.55"/><text x="178" y="241.25" class="end xs b" style="fill:var(--yellow)">patchy</text><rect x="224" y="260.0" width="24" height="70.0" style="fill:var(--red);opacity:0.55"/><text x="178" y="299" class="end xs b" style="fill:var(--red)">unusable</text><line x1="250" y1="120.0" x2="296" y2="120.0" class="line" stroke-width="2"/><circle cx="236" cy="120.0" r="6" class="f-ink"/><text x="304" y="125" class="sm">-40 dBm: Grandpa Otto’s Pi, next to the router</text><line x1="250" y1="183.0" x2="296" y2="183.0" class="line" stroke-width="2"/><circle cx="236" cy="183.0" r="6" class="f-ink"/><text x="304" y="188" class="sm">-58 dBm: Bob’s laptop, two rooms away</text><line x1="250" y1="312.5" x2="296" y2="312.5" class="line" stroke-width="2"/><circle cx="236" cy="312.5" r="6" class="f-ink"/><text x="304" y="317.5" class="sm">-95 dBm: the noise: background radio hiss</text><path d="M640,191.0 L640,304.5" class="line s-purple" stroke-width="3" marker-start="url(#ah-purple)" marker-end="url(#ah-purple)"/><text x="628" y="232" class="end sm b" style="fill:var(--purple)">37 dB apart:</text><text x="628" y="249" class="end xs">the signal is 5,000×</text><text x="628" y="263" class="end xs">stronger than the noise</text>
</svg>
<figcaption>−58 dBm is about 0.0000016 milliwatts: the laptop’s receiver is listening to a billionth of a watt.</figcaption>
</figure>

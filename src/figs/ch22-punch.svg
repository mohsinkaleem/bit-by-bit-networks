<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 272" role="img" aria-label="Two computers behind two NATs learn their outside addresses from a STUN server and punch holes by sending to each other">
<use href="#computer" x="45.0" y="17.5" width="50" height="45"/><text x="70" y="80" class="mid xs b">Bob</text><text x="70" y="94" class="mid mono xs">192.168.1.3</text><line x1="70" y1="102" x2="70" y2="262" class="line s-muted" stroke-width="1.5" stroke-dasharray="2 5"/><use href="#router" x="190.0" y="20.0" width="60" height="40"/><text x="220" y="80" class="mid xs b">Bob’s router</text><text x="220" y="94" class="mid mono xs">203.0.113.77</text><line x1="220" y1="102" x2="220" y2="262" class="line s-muted" stroke-width="1.5" stroke-dasharray="2 5"/><use href="#server" x="345.0" y="16.0" width="30" height="48"/><text x="360" y="80" class="mid xs b">STUN server</text><text x="360" y="94" class="mid mono xs">192.0.2.1</text><line x1="360" y1="102" x2="360" y2="262" class="line s-muted" stroke-width="1.5" stroke-dasharray="2 5"/><use href="#router" x="470.0" y="20.0" width="60" height="40"/><text x="500" y="80" class="mid xs b">university NAT</text><text x="500" y="94" class="mid mono xs">198.51.100.9</text><line x1="500" y1="102" x2="500" y2="262" class="line s-muted" stroke-width="1.5" stroke-dasharray="2 5"/><use href="#computer" x="625.0" y="17.5" width="50" height="45"/><text x="650" y="80" class="mid xs b">Alice</text><text x="650" y="94" class="mid mono xs">10.23.147.8</text><line x1="650" y1="102" x2="650" y2="262" class="line s-muted" stroke-width="1.5" stroke-dasharray="2 5"/><g data-show="1"><line x1="70" y1="122" x2="352" y2="122" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="215" y="115" class="mid xs b halo">what do I look like?</text></g><g data-show="1"><line x1="650" y1="142" x2="368" y2="142" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="505" y="135" class="mid xs b halo">what do I look like?</text></g><g data-show="2"><line x1="360" y1="172" x2="78" y2="172" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="215" y="165" class="mid xs b halo">Alice is 198.51.100.9:41000</text></g><g data-show="2"><line x1="360" y1="192" x2="642" y2="192" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="505" y="185" class="mid xs b halo">Bob is 203.0.113.77:50000</text></g><g data-show="3"><line x1="650" y1="222" x2="228" y2="222" class="line s-purple" stroke-width="2.5"/><path d="M221,215 l14,14 M235,215 l-14,14" class="line s-red" stroke-width="3"/><text x="435" y="215" class="mid xs b halo">hello Bob</text></g><g data-show="4"><line x1="70" y1="248" x2="642" y2="248" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="241" class="mid xs b halo">hello Alice: gets through!</text></g>
</svg>
<ol class="steps"><li>Alice, at university, and Bob, at home, want to play a game directly, with no server in the middle. Both are behind NATs. First, each asks a STUN server what its address and port look like from outside.</li><li>The game’s server passes each one’s outside address to the other.</li><li>Alice sends a packet to Bob’s outside address. Bob’s router has no entry for her, so it drops it. But her own NAT now has an entry saying “Alice is talking to 203.0.113.77:50000”.</li><li>Bob sends to Alice’s outside address. It passes his router (creating an entry for her), and arrives at her NAT, which sees an answer to her packet, and lets it in. Both holes are open. This is <strong>hole punching</strong>, and it’s how most video calls connect.</li></ol>
<figcaption>Getting through two NATs at once.</figcaption>
</figure>

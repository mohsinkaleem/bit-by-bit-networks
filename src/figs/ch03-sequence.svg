<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 635" role="img" aria-label="Sequence diagram: a message, a lost message with a timeout and retry, and a lost acknowledgement causing a duplicate">
<use href="#alice-head" x="204" y="4" width="52" height="52"/><text x="230" y="74" class="mid slab b">Alice</text><line x1="230" y1="82" x2="230" y2="629.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><use href="#bob-head" x="464" y="4" width="52" height="52"/><text x="490" y="74" class="mid slab b">Bob</text><line x1="490" y1="82" x2="490" y2="629.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="625.0" class="xs muted">time ↓</text><g data-show="1"><line x1="230" y1="86" x2="490" y2="116" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="94" class="mid mono sm b halo">~S HI BOB ~E</text></g><g data-show="1"><circle cx="490" cy="119" r="5" class="f-ink"/><text x="504" y="124" class="hand  halo" text-anchor="start">prints “HI BOB”</text></g><g data-show="1"><line x1="490" y1="131" x2="230" y2="161" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="139" class="mid mono sm b halo">~A</text></g><g data-show="1"><circle cx="230" cy="164" r="5" class="f-ink"/><text x="216" y="169" class="hand f-green halo" text-anchor="end">delivered ✓</text></g><g data-show="2"><line x1="230" y1="191" x2="373" y2="207.5" class="line s-red dash" stroke-width="2.5"/><path d="M364,198.5 l18,18 M382,198.5 l-18,18" class="line s-red" stroke-width="3.5"/><text x="301.5" y="192.25" class="mid mono sm b halo">~S WANT TO PLAY? ~E</text></g><g data-show="2"><path d="M221.2,191 L208,191 L208,275 L221.2,275" class="line s-orange" stroke-width="2.5"/><text x="199.2" y="238" class="hand f-orange halo" text-anchor="end">waiting for ~A…</text></g><g data-show="3"><circle cx="230" cy="290" r="5" class="f-ink"/><text x="216" y="295" class="hand f-orange halo" text-anchor="end">time’s up! send it again</text></g><g data-show="3"><line x1="230" y1="290" x2="490" y2="320" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="298" class="mid mono sm b halo">~S WANT TO PLAY? ~E</text></g><g data-show="3"><circle cx="490" cy="323" r="5" class="f-ink"/><text x="504" y="328" class="hand  halo" text-anchor="start">prints “WANT TO PLAY?”</text></g><g data-show="3"><line x1="490" y1="335" x2="230" y2="365" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="343" class="mid mono sm b halo">~A</text></g><g data-show="4"><line x1="230" y1="395" x2="490" y2="425" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="403" class="mid mono sm b halo">~S MEET AT NOON ~E</text></g><g data-show="4"><circle cx="490" cy="428" r="5" class="f-ink"/><text x="504" y="433" class="hand  halo" text-anchor="start">prints “MEET AT NOON”</text></g><g data-show="4"><line x1="490" y1="440" x2="360" y2="455" class="line s-red dash" stroke-width="2.5"/><path d="M351,446 l18,18 M369,446 l-18,18" class="line s-red" stroke-width="3.5"/><text x="425" y="440.5" class="mid mono sm b halo">~A</text></g><g data-show="4"><path d="M221.2,425 L208,425 L208,509 L221.2,509" class="line s-orange" stroke-width="2.5"/><text x="199.2" y="472" class="hand f-orange halo" text-anchor="end">waiting for ~A…</text></g><g data-show="5"><circle cx="230" cy="524" r="5" class="f-ink"/><text x="216" y="529" class="hand f-orange halo" text-anchor="end">time’s up! send it again</text></g><g data-show="5"><line x1="230" y1="524" x2="490" y2="554" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="532" class="mid mono sm b halo">~S MEET AT NOON ~E</text></g><g data-show="5"><circle cx="490" cy="557" r="5" class="f-ink"/><text x="504" y="562" class="hand f-red halo" text-anchor="start">prints it AGAIN?!</text></g><g data-show="5"><line x1="490" y1="569" x2="230" y2="599" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="577" class="mid mono sm b halo">~A</text></g>
</svg>
<ol class="steps"><li>The normal case. Alice sends a message, Bob prints it and replies <code>~A</code> (“got it”), and Alice knows it arrived.</li><li>This time a burst of noise wrecks the message on its way. Bob never sees a complete message, so he never replies. Alice starts a timer.</li><li>The timer runs out with no <code>~A</code>, so Alice assumes the message was lost and sends it again. This time it gets through.</li><li>Now the <em>message</em> arrives fine, and Bob prints it, but his <code>~A</code> is the one that gets lost.</li><li>Alice can’t tell the difference between a lost message and a lost <code>~A</code>, so she does the only thing she can: sends it again. And Bob, who has no way of knowing he’s seen it before, prints it twice.</li></ol>
<figcaption>Time runs down the page. Each arrow is one message crossing the wire.</figcaption>
</figure>

="3" class="t-green"/><text x="335" y="104" class="mid mono sm b">J</text><rect x="345" y="86" width="16" height="26" rx="3" class="f-yellow"/><text x="353" y="104" class="mid mono sm b">K</text><rect x="363" y="86" width="16" height="26" rx="3" class="t-green"/><text x="371" y="104" class="mid mono sm b">L</text><rect x="381" y="86" width="16" height="26" rx="3" class="t-green"/><text x="389" y="104" class="mid mono sm b">M</text><rect x="399" y="86" width="16" height="26" rx="3" class="t-green"/><text x="407" y="104" class="mid mono sm b">N</text><rect x="417" y="86" width="16" height="26" rx="3" class="t-green"/><text x="425" y="104" class="mid mono sm b">O</text><rect x="435" y="86" width="16" height="26" rx="3" class="t-green"/><text x="443" y="104" class="mid mono sm b">P</text><line x1="308" y1="81" x2="308" y2="117" class="line thick s-navy"/><text x="624" y="104" class="hand lg">Q2: right → <tspan class="f-green b">1</tspan></text><path d="M380,115 L308,133" class="line thin s-muted" marker-end="url(#ah-muted)"/></g><g data-show="3"><rect x="237" y="138" width="16" height="26" rx="3" class="t-red"/><text x="245" y="156" class="mid mono sm b">I</text><rect x="255" y="138" width="16" height="26" rx="3" class="t-red"/><text x="263" y="156" class="mid mono sm b">J</text><rect x="273" y="138" width="16" height="26" rx="3" class="f-yellow"/><text x="281" y="156" class="mid mono sm b">K</text><rect x="291" y="138" width="16" height="26" rx="3" class="t-red"/><text x="299" y="156" class="mid mono sm b">L</text><rect x="309" y="138" width="16" height="26" rx="3" class="t-green" opacity="0.35"/><text x="317" y="156" class="mid mono sm b" opacity="0.35">M</text><rect x="327" y="138" width="16" height="26" rx="3" class="t-green" opacity="0.35"/><text x="335" y="156" class="mid mono sm b" opacity="0.35">N</text><rect x="345" y="138" width="16" height="26" rx="3" class="t-green" opacity="0.35"/><text x="353" y="156" class="mid mono sm b" opacity="0.35">O</text><rect x="363" y="138" width="16" height="26" rx="3" class="t-green" opacity="0.35"/><text x="371" y="156" class="mid mono sm b" opacity="0.35">P</text><line x1="308" y1="133" x2="308" y2="169" class="line thick s-navy"/><text x="624" y="156" class="hand lg">Q3: left → <tspan class="f-red b">0</tspan></text><path d="M272,167 L308,185" class="line thin s-muted" marker-end="url(#ah-muted)"/></g><g data-show="4"><rect x="273" y="190" width="16" height="26" rx="3" class="t-red" opacity="0.35"/><text x="281" y="208" class="mid mono sm b" opacity="0.35">I</text><rect x="291" y="190" width="16" height="26" rx="3" class="t-red" opacity="0.35"/><text x="299" y="208" class="mid mono sm b" opacity="0.35">J</text><rect x="309" y="190" width="16" height="26" rx="3" class="f-yellow"/><text x="317" y="208" class="mid mono sm b">K</text><rect x="327" y="190" width="16" height="26" rx="3" class="t-green"/><text x="335" y="208" class="mid mono sm b">L</text><line x1="308" y1="185" x2="308" y2="221" class="line thick s-navy"/><text x="624" y="208" class="hand lg">Q4: right → <tspan class="f-green b">1</tspan></text><path d="M326,219 L308,237" class="line thin s-muted" marker-end="url(#ah-muted)"/></g><g data-show="5"><rect x="291" y="242" width="16" height="26" rx="3" class="f-yellow"/><text x="299" y="260" class="mid mono sm b">K</text><rect x="309" y="242" width="16" height="26" rx="3" class="t-green" opacity="0.35"/><text x="317" y="260" class="mid mono sm b" opacity="0.35">L</text><line x1="308" y1="237" x2="308" y2="273" class="line thick s-navy"/><text x="624" y="260" class="hand lg">Q5: left → <tspan class="f-red b">0</tspan></text></g><g data-show="6"><rect x="158" y="294" width="300" height="46" rx="10" class="f-navy"/><text x="308" y="324" class="mid slab xl b on-night">K  =  01010</text></g></svg>
<ol class="steps"><li><b>Question 1.</b> 32 symbols left. Cut them in half: A–P on the left, Q–~ on the right. K is on the <b>left</b>, so the answer is <b>0</b>.</li><li><b>Question 2.</b> 16 symbols left. Cut them in half: A–H on the left, I–P on the right. K is on the <b>right</b>, so the answer is <b>1</b>.</li><li><b>Question 3.</b> 8 symbols left. Cut them in half: I–L on the left, M–P on the right. K is on the <b>left</b>, so the answer is <b>0</b>.</li><li><b>Question 4.</b> 4 symbols left. Cut them in half: I–J on the left, K–L on the right. K is on the <b>right</b>, so the answer is <b>1</b>.</li><li><b>Question 5.</b> 2 symbols left. Cut them in half: K on the left, L on the right. K is on the <b>left</b>, so the answer is <b>0</b>.</li><li>Only one symbol is left: <b>K</b>. Write the five answers down in order and you get <b>01010</b>. Those five bits are all Bob needs to know Alice meant K.</li></ol>
<figcaption>Five yes/no answers are enough to pick one symbol out of 32.</figcaption>
</figure>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 306" role="img" aria-label="An announcement for 10.1.0.0/16 spreading between five autonomous systems, the AS path growing at each step, and a loop being rejected">
<line x1="90" y1="240" x2="300" y2="240" class="line s-line" stroke-width="4"/><line x1="300" y1="240" x2="300" y2="70" class="line s-line" stroke-width="4"/><line x1="300" y1="70" x2="590" y2="70" class="line s-line" stroke-width="4"/><line x1="300" y1="240" x2="590" y2="70" class="line s-line" stroke-width="4"/><line x1="590" y1="70" x2="590" y2="240" class="line s-line" stroke-width="4"/><rect x="32" y="220" width="116" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="90" y="238" class="mid xs b">University</text><text x="90" y="253" class="mid mono xs muted">AS65001</text><rect x="242" y="220" width="116" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="300" y="238" class="mid xs b">Northnet</text><text x="300" y="253" class="mid mono xs muted">AS64510</text><rect x="242" y="50" width="116" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="300" y="68" class="mid xs b">Tier 1 West</text><text x="300" y="83" class="mid mono xs muted">AS64500</text><rect x="532" y="50" width="116" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="590" y="68" class="mid xs b">Tier 1 East</text><text x="590" y="83" class="mid mono xs muted">AS64501</text><rect x="532" y="220" width="116" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="590" y="238" class="mid xs b">Southnet</text><text x="590" y="253" class="mid mono xs muted">AS64530</text><g data-show="1"><line x1="152" y1="226" x2="236" y2="226" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/></g><g data-show="1"><rect x="119.4" y="194" width="149.2" height="22" rx="5" class="t-green" stroke="var(--green)"/><text x="194" y="209" class="mid mono xs b">10.1.0.0/16: 65001</text></g><g data-show="2"><line x1="286" y1="216" x2="286" y2="96" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/></g><g data-show="2"><rect x="173.3" y="138" width="97.4" height="22" rx="5" class="t-green" stroke="var(--green)"/><text x="222" y="153" class="mid mono xs b">64510 65001</text></g><g data-show="2"><line x1="356" y1="222" x2="526" y2="110" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/></g><g data-show="2"><rect x="346.3" y="138" width="97.4" height="22" rx="5" class="t-green" stroke="var(--green)"/><text x="395" y="153" class="mid mono xs b">64510 65001</text></g><g data-show="3"><line x1="604" y1="94" x2="604" y2="216" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/></g><g data-show="3"><rect x="519.1" y="274" width="141.8" height="22" rx="5" class="t-green" stroke="var(--green)"/><text x="590" y="289" class="mid mono xs b">64501 64510 65001</text></g><g data-show="3"><line x1="360" y1="56" x2="528" y2="56" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/></g><g data-show="3"><rect x="373.1" y="24" width="141.8" height="22" rx="5" class="t-green" stroke="var(--green)"/><text x="444" y="39" class="mid mono xs b">64500 64510 65001</text></g><text x="444" y="84" class="mid xs muted" data-show="3">(Tier 1 East already has a shorter one)</text><g data-show="4"><line x1="552" y1="102" x2="380" y2="216" class="line s-red" stroke-width="3" marker-end="url(#ah-red)"/></g><g data-show="4"><rect x="454.1" y="174" width="141.8" height="22" rx="5" class="t-red" stroke="var(--red)"/><text x="525" y="189" class="mid mono xs b">64501 64510 65001</text></g><g data-show="4"><text x="260" y="294" class="mid hand f-red">“64510? That’s me. It’s a loop: ignore it.”</text></g>
</svg>
<ol class="steps"><li>The university announces its addresses to Northnet. The announcement carries an <strong>AS path</strong>, which starts with just the university’s own number.</li><li>Northnet adds its own number to the front, and passes the route on to its two providers. Anyone who hears it now knows the whole list of networks it would pass through.</li><li>Each network adds its number and passes it on. Southnet’s route to the university goes through three networks. Unlike Chapter 11’s routers, which only knew a distance, every network can see the whole path…</li><li>…so loops are easy to spot. When Tier 1 East offers the route back to Northnet, Northnet finds its own number already in the path, and ignores it. No counting to infinity. BGP is called a <strong>path vector</strong> protocol for this reason.</li></ol>
<figcaption>The AS path grows by one number at every network.</figcaption>
</figure>

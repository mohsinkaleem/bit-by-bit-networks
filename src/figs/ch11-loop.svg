<figure class="fig">
<svg class="dia" viewBox="0 0 720 270" role="img" aria-label="A packet bounces between two routers with bad tables until its hop count reaches zero">
<use href="#router" x="178" y="112" width="84" height="56"/><text x="220" y="190" class="mid slab b">R1</text><use href="#router" x="458" y="112" width="84" height="56"/><text x="500" y="190" class="mid slab b">R2</text><path d="M250,110 Q360,30 470,110" class="line s-muted" stroke-width="2.5" marker-end="url(#ah-muted)"/><path d="M470,170 Q360,250 250,170" class="line s-muted" stroke-width="2.5" marker-end="url(#ah-muted)"/><text x="360" y="42" class="mid hand">“network 4? that’s via R2”</text><text x="360" y="250" class="mid hand">“network 4? that’s via R1”</text><rect x="260" y="59" width="30" height="22" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="275" y="75" class="mid mono xs b">8</text><rect x="345" y="61" width="30" height="22" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="360" y="77" class="mid mono xs b">7</text><rect x="430" y="59" width="30" height="22" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="445" y="75" class="mid mono xs b">6</text><rect x="430" y="199" width="30" height="22" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="445" y="215" class="mid mono xs b">5</text><rect x="345" y="197" width="30" height="22" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="360" y="213" class="mid mono xs b">4</text><rect x="260" y="199" width="30" height="22" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="275" y="215" class="mid mono xs b">3</text><text x="80" y="110" class="mid hand lg f-red">…2, 1, 0!</text><text x="80" y="136" class="mid hand f-red">dropped ✗</text><text x="80" y="160" class="mid xs muted">and Alice gets</text><text x="80" y="176" class="mid xs muted">a note saying so</text><text x="640" y="110" class="mid xs muted">Without a hop</text><text x="640" y="126" class="mid xs muted">limit, it would</text><text x="640" y="142" class="mid xs muted">circle forever.</text>
</svg>
<figcaption>Two routers that each think the other knows the way. The hop count guarantees the packet can’t circle forever.</figcaption>
</figure>

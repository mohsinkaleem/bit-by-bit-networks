<figure class="fig">
<svg class="dia" viewBox="0 0 720 176" role="img" aria-label="An HTTP/2 frame header: 3-byte length, 1-byte type, 1-byte flags, 4-byte stream number, then the payload">
<rect x="20" y="36" width="132" height="40" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="86" y="60" class="mid mono sm b">00 00 1f</text><text x="86" y="28" class="mid xs b">length</text><text x="86" y="94" class="mid xs">31 bytes of payload</text><rect x="158" y="36" width="44" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="180" y="60" class="mid mono sm b">01</text><text x="180" y="28" class="mid xs b">type</text><text x="180" y="94" class="mid xs">1 = HEADERS</text><rect x="208" y="36" width="44" height="40" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="230" y="60" class="mid mono sm b">05</text><text x="230" y="28" class="mid xs b">flags</text><text x="230" y="94" class="mid xs">END_STREAM + END_HEADERS</text><rect x="258" y="36" width="176" height="40" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="346" y="60" class="mid mono sm b">00 00 00 01</text><text x="346" y="28" class="mid xs b">stream</text><text x="346" y="94" class="mid xs">stream 1</text><rect x="440" y="36" width="264" height="40" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="572" y="60" class="mid mono sm b">82 87 41 88 2f 91 d3 …</text><text x="572" y="28" class="mid xs b">payload</text><text x="572" y="94" class="mid xs">the headers, compressed (HPACK)</text><text x="20" y="130" class="xs">Every HTTP/2 frame starts with these 9 bytes. The ten types include DATA (0) and HEADERS (1) for requests and</text><text x="20" y="147" class="xs">responses, and SETTINGS, WINDOW_UPDATE, PING, RST_STREAM and GOAWAY for managing the connection. This is the</text><text x="20" y="164" class="xs">request our lab sent to example.org: a whole GET, headers and all, in 40 bytes.</text>
</svg>
<figcaption>An HTTP/2 frame, from <code>h2client.py example.org</code>.</figcaption>
</figure>

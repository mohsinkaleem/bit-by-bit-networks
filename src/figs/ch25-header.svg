<figure class="fig">
<svg class="dia" viewBox="0 0 720 262" role="img" aria-label="The IPv4 header beside the IPv6 header, showing which fields were removed, renamed, or added">
<text x="170" y="20" class="mid sm b">IPv4: 20 bytes, or more</text><rect x="20" y="30" width="37.5" height="22" class="f-card" stroke="var(--line)"/><text x="38.75" y="45" class="mid xs">ver</text><rect x="57.5" y="30" width="37.5" height="22" class="t-red" stroke="var(--red)"/><text x="76.25" y="45" class="mid xs">hlen</text><line x1="60.5" y1="41" x2="92" y2="41" class="line s-red" stroke-width="1.5"/><rect x="95" y="30" width="75" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="132.5" y="45" class="mid xs">type of service</text><rect x="170" y="30" width="150" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="245" y="45" class="mid xs">total length</text><rect x="20" y="52" width="150" height="22" class="t-red" stroke="var(--red)"/><text x="95" y="67" class="mid xs">identification</text><line x1="23" y1="63" x2="167" y2="63" class="line s-red" stroke-width="1.5"/><rect x="170" y="52" width="28.125" height="22" class="t-red" stroke="var(--red)"/><text x="184.062" y="67" class="mid xs">flags</text><line x1="173" y1="63" x2="195.125" y2="63" class="line s-red" stroke-width="1.5"/><rect x="198.125" y="52" width="121.875" height="22" class="t-red" stroke="var(--red)"/><text x="259.062" y="67" class="mid xs">fragment offset</text><line x1="201.125" y1="63" x2="317" y2="63" class="line s-red" stroke-width="1.5"/><rect x="20" y="74" width="75" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="57.5" y="89" class="mid xs">TTL</text><rect x="95" y="74" width="75" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="132.5" y="89" class="mid xs">protocol</text><rect x="170" y="74" width="150" height="22" class="t-red" stroke="var(--red)"/><text x="245" y="89" class="mid xs">header checksum</text><line x1="173" y1="85" x2="317" y2="85" class="line s-red" stroke-width="1.5"/><rect x="20" y="96" width="300" height="22" class="f-card" stroke="var(--line)"/><text x="170" y="111" class="mid xs">source address (32 bits)</text><rect x="20" y="118" width="300" height="22" class="f-card" stroke="var(--line)"/><text x="170" y="133" class="mid xs">destination address (32 bits)</text><rect x="20" y="140" width="300" height="22" class="t-red" stroke="var(--red)"/><text x="170" y="155" class="mid xs">options (maybe)</text><line x1="23" y1="151" x2="317" y2="151" class="line s-red" stroke-width="1.5"/><text x="550" y="20" class="mid sm b">IPv6: always exactly 40 bytes</text><rect x="400" y="30" width="37.5" height="22" class="f-card" stroke="var(--line)"/><text x="418.75" y="45" class="mid xs">ver</text><rect x="437.5" y="30" width="75" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="475" y="45" class="mid xs">traffic class</text><rect x="512.5" y="30" width="187.5" height="22" class="t-green" stroke="var(--green)"/><text x="606.25" y="45" class="mid xs">flow label</text><rect x="400" y="52" width="150" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="475" y="67" class="mid xs">payload length</text><rect x="550" y="52" width="75" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="587.5" y="67" class="mid xs">next header</text><rect x="625" y="52" width="75" height="22" class="t-yellow" stroke="var(--yellow)"/><text x="662.5" y="67" class="mid xs">hop limit</text><rect x="400" y="74" width="300" height="22" class="f-card" stroke="var(--line)"/><text x="550" y="89" class="mid xs">source address</text><rect x="400" y="96" width="300" height="22" class="f-card" stroke="var(--line)"/><text x="550" y="111" class="mid xs muted">(128 bits)</text><rect x="400" y="118" width="300" height="22" class="f-card" stroke="var(--line)"/><rect x="400" y="140" width="300" height="22" class="f-card" stroke="var(--line)"/><rect x="400" y="162" width="300" height="22" class="f-card" stroke="var(--line)"/><text x="550" y="177" class="mid xs">destination address</text><rect x="400" y="184" width="300" height="22" class="f-card" stroke="var(--line)"/><text x="550" y="199" class="mid xs muted">(128 bits)</text><rect x="400" y="206" width="300" height="22" class="f-card" stroke="var(--line)"/><rect x="400" y="228" width="300" height="22" class="f-card" stroke="var(--line)"/><rect x="20" y="200" width="16" height="14" class="t-red" stroke="var(--red)"/><text x="42" y="211" class="xs">gone in IPv6</text><rect x="140" y="200" width="16" height="14" class="t-yellow" stroke="var(--yellow)"/><text x="162" y="211" class="xs">kept (most renamed)</text><rect x="260" y="200" width="16" height="14" class="t-green" stroke="var(--green)"/><text x="282" y="211" class="xs">new</text>
</svg>
<figcaption>IPv6 threw out everything routers had to work at. No checksum to recompute at every hop, no fragments to cut, no options to parse, and a fixed size.</figcaption>
</figure>

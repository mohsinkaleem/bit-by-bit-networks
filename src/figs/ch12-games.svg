="7" height="7" class="f-ink" opacity="0.7"/><rect x="659" y="166" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="666" y="159" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="666" y="173" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="673" y="152" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="673" y="166" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="652" y="152" width="28" height="28" class="f-none" stroke="var(--ink)" stroke-width="1"/><use href="#bob-head" x="14" y="216" width="48" height="48"/><text x="72" y="236" class="sm b">Bob</text><text x="72" y="256" class="mono xs">1.2 port 50999</text><line x1="240" y1="240" x2="486" y2="232" class="line" style="stroke:var(--green)" stroke-width="3"/><rect x="486" y="210" width="204" height="48" rx="8" class="f-surface" stroke="var(--green)" stroke-width="2.5"/><text x="498" y="230" class="sm b">game #3</text><text x="498" y="248" class="mono xs">with 1.2:50999</text><rect x="652" y="227" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="652" y="241" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="659" y="220" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="659" y="234" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="666" y="227" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="666" y="241" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="673" y="220" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="673" y="234" width="7" height="7" class="f-ink" opacity="0.7"/><rect x="652" y="220" width="28" height="28" class="f-none" stroke="var(--ink)" stroke-width="1"/><text x="360" y="306" class="mid sm">Otto’s address and port are the same for all three. The other end’s address and port tell the games apart.</text>

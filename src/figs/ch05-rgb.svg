<figure class="fig">
<svg class="dia" viewBox="0 0 720 136" role="img" aria-label="Six colours and the three bytes that describe each">
<rect x="20" y="16" width="104" height="64" rx="8" fill="#ff0000" stroke="var(--line)"/><text x="72" y="102" class="mid mono b">FF 00 00</text><text x="72" y="122" class="mid hand">red</text><rect x="136" y="16" width="104" height="64" rx="8" fill="#00c800" stroke="var(--line)"/><text x="188" y="102" class="mid mono b">00 C8 00</text><text x="188" y="122" class="mid hand">green</text><rect x="252" y="16" width="104" height="64" rx="8" fill="#0000ff" stroke="var(--line)"/><text x="304" y="102" class="mid mono b">00 00 FF</text><text x="304" y="122" class="mid hand">blue</text><rect x="368" y="16" width="104" height="64" rx="8" fill="#ffd966" stroke="var(--line)"/><text x="420" y="102" class="mid mono b">FF D9 66</text><text x="420" y="122" class="mid hand">volcano sky</text><rect x="484" y="16" width="104" height="64" rx="8" fill="#202020" stroke="var(--line)"/><text x="536" y="102" class="mid mono b">20 20 20</text><text x="536" y="122" class="mid hand">volcano</text><rect x="600" y="16" width="104" height="64" rx="8" fill="#003554" stroke="var(--line)"/><text x="652" y="102" class="mid mono b">00 35 54</text><text x="652" y="122" class="mid hand">this book’s header</text>
</svg>
<figcaption>Every colour is three bytes: how much red, how much green, how much blue (00 = none, FF = all).</figcaption>
</figure>

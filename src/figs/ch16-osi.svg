<figure class="fig">
<svg class="dia" viewBox="0 0 720 312" role="img" aria-label="The seven OSI layers next to the five internet layers, with tshark&#x27;s names for each, and common jargon">
<text x="90" y="30" class="mid slab b">OSI model</text><text x="255" y="30" class="mid slab b">Internet model</text><text x="440" y="30" class="mid slab b">tshark -V prints</text><text x="632" y="30" class="mid slab b">People say…</text><rect x="10" y="44" width="160" height="30" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="22" y="64" class="sm b">7 Application</text><rect x="10" y="78" width="160" height="30" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="22" y="98" class="sm b">6 Presentation</text><rect x="10" y="112" width="160" height="30" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="22" y="132" class="sm b">5 Session</text><rect x="10" y="146" width="160" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="22" y="166" class="sm b">4 Transport</text><rect x="10" y="180" width="160" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="22" y="200" class="sm b">3 Network</text><rect x="10" y="214" width="160" height="30" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="22" y="234" class="sm b">2 Data link</text><rect x="10" y="248" width="160" height="30" rx="6" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="22" y="268" class="sm b">1 Physical</text><rect x="190" y="44" width="130" height="98" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="255" y="98" class="mid sm b">Application</text><rect x="336" y="44" width="208" height="98" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="346" y="98" class="mono xs">Hypertext Transfer Protocol</text><text x="560" y="91" class="xs">“a layer 7 firewall”</text><text x="560" y="105" class="xs muted">(it reads the HTTP)</text><rect x="190" y="146" width="130" height="30" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="255" y="166" class="mid sm b">Transport</text><rect x="336" y="146" width="208" height="30" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="346" y="166" class="mono xs">Transmission Control Protocol</text><text x="560" y="166" class="xs">“a layer 4 load balancer”</text><rect x="190" y="180" width="130" height="30" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="255" y="200" class="mid sm b">Internet</text><rect x="336" y="180" width="208" height="30" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="346" y="200" class="mono xs">Internet Protocol Version 4</text><text x="560" y="193" class="xs">“a layer 3 switch”</text><text x="560" y="207" class="xs muted">(a router, really)</text><rect x="190" y="214" width="130" height="30" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="255" y="234" class="mid sm b">Link</text><rect x="336" y="214" width="208" height="30" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="346" y="234" class="mono xs">Ethernet II</text><text x="560" y="234" class="xs">“a layer 2 switch”</text><rect x="190" y="248" width="130" height="30" rx="6" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="255" y="268" class="mid sm b">Physical</text><rect x="336" y="248" width="208" height="30" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="346" y="268" class="mono xs">Frame 8: 142 bytes on wire</text><text x="560" y="261" class="xs">“layer 1 problem”</text><text x="560" y="275" class="xs muted">(a bad cable)</text><text x="360" y="300" class="mid xs muted">Layers 5 and 6 never really caught on as separate things. The numbers for 1 to 4, and 7, are used every day.</text>
</svg>
<figcaption>The same stack, counted two ways. Engineers use the internet’s layers, with OSI’s numbers.</figcaption>
</figure>

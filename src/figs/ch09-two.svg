<figure class="fig">
<svg class="dia" viewBox="0 0 720 300" role="img" aria-label="Two switches joined together; each learns that several addresses live behind the connecting port">
<use href="#switch" x="125" y="107" width="150" height="46"/><text x="200" y="98" class="mid slab b">S1</text><use href="#switch" x="445" y="107" width="150" height="46"/><text x="520" y="98" class="mid slab b">S2</text><line x1="275" y1="130" x2="445" y2="130" class="wire" stroke-width="5"/><text x="360" y="120" class="mid xs muted">port 9 ↔ port 9</text><line x1="80" y1="222" x2="164.0" y2="152" class="wire" stroke-width="3.5"/><use href="#alice-head" x="56" y="220" width="48" height="48"/><text x="80" y="282" class="mid xs b">Alice 0a:11</text><text x="80" y="212" class="mid xs muted halo">port 1</text><line x1="280" y1="222" x2="224.0" y2="152" class="wire" stroke-width="3.5"/><use href="#bob-head" x="256" y="220" width="48" height="48"/><text x="280" y="282" class="mid xs b">Bob 0b:22</text><text x="280" y="212" class="mid xs muted halo">port 2</text><line x1="440" y1="222" x2="496.0" y2="152" class="wire" stroke-width="3.5"/><use href="#carol-head" x="416" y="220" width="48" height="48"/><text x="440" y="282" class="mid xs b">Carol 0c:33</text><text x="440" y="212" class="mid xs muted halo">port 1</text><line x1="640" y1="222" x2="556.0" y2="152" class="wire" stroke-width="3.5"/><use href="#dave-head" x="616" y="220" width="48" height="48"/><text x="640" y="282" class="mid xs b">Dave 0d:44</text><text x="640" y="212" class="mid xs muted halo">port 2</text><rect x="30" y="16" width="130" height="92" rx="8" class="card"/><text x="40" y="36" class="mono xs">0a:11 → port 1</text><text x="40" y="56" class="mono xs">0b:22 → port 2</text><text x="40" y="76" class="mono xs b f-teal">0c:33 → port 9</text><text x="40" y="96" class="mono xs b f-teal">0d:44 → port 9</text><rect x="570" y="16" width="130" height="92" rx="8" class="card"/><text x="580" y="36" class="mono xs b f-teal">0a:11 → port 9</text><text x="580" y="56" class="mono xs b f-teal">0b:22 → port 9</text><text x="580" y="76" class="mono xs">0c:33 → port 1</text><text x="580" y="96" class="mono xs">0d:44 → port 2</text>
</svg>
<figcaption>To S1, Carol and Dave both simply live “out of port 9”. It doesn’t need to know any more than that.</figcaption>
</figure>

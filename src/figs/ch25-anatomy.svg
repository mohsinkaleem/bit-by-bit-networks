<figure class="fig">
<svg class="dia" viewBox="0 0 720 190" role="img" aria-label="An IPv6 address split into a 48-bit global routing prefix, a 16-bit subnet ID and a 64-bit interface ID">
<text x="360" y="22" class="mid sm b">One computer’s address at the university (in the range set aside for examples)</text><rect x="40" y="40" width="234" height="36" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.8"/><text x="77" y="64" class="mid mono b">2001</text><text x="117" y="64" class="mid mono b muted">:</text><text x="157" y="64" class="mid mono b">0db8</text><text x="197" y="64" class="mid mono b muted">:</text><text x="237" y="64" class="mid mono b">04c1</text><text x="277" y="64" class="mid mono b muted">:</text><path d="M40,86 L40,92 L274,92 L274,86" class="line" stroke="var(--blue)" stroke-width="2"/><text x="157" y="110" class="mid xs b">global routing prefix: 48 bits</text><text x="157" y="125" class="mid xs muted">who: the university’s block, from its provider</text><rect x="280" y="40" width="74" height="36" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.8"/><text x="317" y="64" class="mid mono b">0012</text><text x="357" y="64" class="mid mono b muted">:</text><path d="M280,86 L280,92 L354,92 L354,86" class="line" stroke="var(--yellow)" stroke-width="2"/><text x="317" y="110" class="mid xs b">subnet: 16 bits</text><text x="317" y="125" class="mid xs muted">which network inside it</text><rect x="360" y="40" width="314" height="36" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.8"/><text x="397" y="64" class="mid mono b">3b57</text><text x="437" y="64" class="mid mono b muted">:</text><text x="477" y="64" class="mid mono b">d9be</text><text x="517" y="64" class="mid mono b muted">:</text><text x="557" y="64" class="mid mono b">3b78</text><text x="597" y="64" class="mid mono b muted">:</text><text x="637" y="64" class="mid mono b">a7e8</text><path d="M360,86 L360,92 L674,92 L674,86" class="line" stroke="var(--green)" stroke-width="2"/><text x="517" y="110" class="mid xs b">interface ID: 64 bits</text><text x="517" y="125" class="mid xs muted">which computer on that network</text><text x="360" y="158" class="mid xs">The first 64 bits say which network (routers only look at these); the last 64 say which computer.</text><text x="360" y="176" class="mid xs">A home usually gets a /56 from its provider: 256 networks of 18,446,744,073,709,551,616 addresses each.</text>
</svg>
<figcaption>The three parts of a typical IPv6 address.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 330" role="img" aria-label="Real Wi-Fi networks heard by the Pi on 2.4 GHz channels 1, 3, 6, 9 and 11, with overlapping ones marked, and 5 GHz blocks of 80 MHz channels">
<text x="14" y="22" class="sm b">2.4 GHz: what Grandpa Otto’s Pi could hear, one evening</text><line x1="60" y1="170" x2="700" y2="170" class="line" stroke-width="1.5"/><line x1="151.4" y1="170" x2="151.4" y2="175" class="line" stroke-width="1"/><text x="151.429" y="188" class="mid xs b">1</text><line x1="189.5" y1="170" x2="189.5" y2="175" class="line" stroke-width="1"/><text x="189.524" y="188" class="mid xs muted">2</text><line x1="227.6" y1="170" x2="227.6" y2="175" class="line" stroke-width="1"/><text x="227.619" y="188" class="mid xs muted">3</text><line x1="265.7" y1="170" x2="265.7" y2="175" class="line" stroke-width="1"/><text x="265.714" y="188" class="mid xs muted">4</text><line x1="303.8" y1="170" x2="303.8" y2="175" class="line" stroke-width="1"/><text x="303.81" y="188" class="mid xs muted">5</text><line x1="341.9" y1="170" x2="341.9" y2="175" class="line" stroke-width="1"/><text x="341.905" y="188" class="mid xs b">6</text><line x1="380.0" y1="170" x2="380.0" y2="175" class="line" stroke-width="1"/><text x="380" y="188" class="mid xs muted">7</text><line x1="418.1" y1="170" x2="418.1" y2="175" class="line" stroke-width="1"/><text x="418.095" y="188" class="mid xs muted">8</text><line x1="456.2" y1="170" x2="456.2" y2="175" class="line" stroke-width="1"/><text x="456.19" y="188" class="mid xs muted">9</text><line x1="494.3" y1="170" x2="494.3" y2="175" class="line" stroke-width="1"/><text x="494.286" y="188" class="mid xs muted">10</text><line x1="532.4" y1="170" x2="532.4" y2="175" class="line" stroke-width="1"/><text x="532.381" y="188" class="mid xs b">11</text><line x1="570.5" y1="170" x2="570.5" y2="175" class="line" stroke-width="1"/><text x="570.476" y="188" class="mid xs muted">12</text><line x1="608.6" y1="170" x2="608.6" y2="175" class="line" stroke-width="1"/><text x="608.571" y="188" class="mid xs muted">13</text><text x="52" y="188" class="end xs muted">channel</text><path d="M67.6,170 C90.5,142.8 212.4,142.8 235.2,170" style="fill:var(--blue);fill-opacity:0.18;stroke:var(--blue)" stroke-width="1.8"/><path d="M67.6,170 C90.5,90.1 212.4,90.1 235.2,170" style="fill:var(--blue);fill-opacity:0.18;stroke:var(--blue)" stroke-width="1.8"/><path d="M143.8,170 C166.7,130.9 288.6,130.9 311.4,170" style="fill:var(--red);fill-opacity:0.18;stroke:var(--red)" stroke-width="1.8"/><path d="M258.1,170 C281.0,120.7 402.9,120.7 425.7,170" style="fill:var(--blue);fill-opacity:0.18;stroke:var(--blue)" stroke-width="1.8"/><path d="M258.1,170 C281.0,113.9 402.9,113.9 425.7,170" style="fill:var(--blue);fill-opacity:0.18;stroke:var(--blue)" stroke-width="1.8"/><path d="M258.1,170 C281.0,64.6 402.9,64.6 425.7,170" style="fill:var(--blue);fill-opacity:0.18;stroke:var(--blue)" stroke-width="1.8"/><path d="M372.4,170 C395.2,137.7 517.1,137.7 540.0,170" style="fill:var(--red);fill-opacity:0.18;stroke:var(--red)" stroke-width="1.8"/><path d="M448.6,170 C471.4,112.2 593.3,112.2 616.2,170" style="fill:var(--blue);fill-opacity:0.18;stroke:var(--blue)" stroke-width="1.8"/><path d="M448.6,170 C471.4,57.8 593.3,57.8 616.2,170" style="fill:var(--blue);fill-opacity:0.18;stroke:var(--blue)" stroke-width="1.8"/><text x="227.619" y="106.9" class="mid xs b f-red">channel 3 overlaps</text><text x="227.619" y="119.9" class="mid xs b f-red">both 1 and 6</text><text x="456.19" y="126.7" class="mid xs b f-red">9 hits 6 and 11</text><text x="700" y="44" class="end xs muted">each hump: one network, as tall as it is loud</text><text x="14" y="240" class="sm b">5 GHz: much more room, in wider blocks</text><rect x="60.0" y="254" width="74.0" height="40" rx="4" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="98.4962" y="272" class="mid xs b">36–48</text><text x="98.4962" y="287" class="mid xs">5 networks</text><rect x="137.0" y="254" width="74.0" height="40" rx="4" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="175.489" y="272" class="mid xs b">52–64</text><text x="175.489" y="287" class="mid xs">2 networks</text><rect x="368.0" y="254" width="74.0" height="40" rx="4" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="406.466" y="272" class="mid xs b">100–112</text><text x="406.466" y="287" class="mid xs muted">empty</text><rect x="445.0" y="254" width="74.0" height="40" rx="4" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="483.459" y="272" class="mid xs b">116–128</text><text x="483.459" y="287" class="mid xs muted">empty</text><rect x="522.0" y="254" width="74.0" height="40" rx="4" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="560.451" y="272" class="mid xs b">132–144</text><text x="560.451" y="287" class="mid xs muted">empty</text><rect x="603.8" y="254" width="74.0" height="40" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="642.256" y="272" class="mid xs b">149–161</text><text x="642.256" y="287" class="mid xs">ours + 1 more</text><text x="60" y="312" class="xs muted">Each block is four 20 MHz channels joined into one 80 MHz channel. Blocks 52–144 must also share with weather radar.</text>
</svg>
<figcaption>Only channels 1, 6 and 11 don’t overlap on 2.4 GHz. Networks on 3 or 9 get interference from both sides, and cause it too.</figcaption>
</figure>

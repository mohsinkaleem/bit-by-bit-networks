<figure class="fig">
<svg class="dia" viewBox="0 0 720 314" role="img" aria-label="Tracing a route by sending packets with hop limits of 1, 2 and 3">
<text x="70" y="24" class="mid slab b">Alice</text><line x1="70" y1="34" x2="70" y2="276" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="260" y="24" class="mid slab b">R1</text><line x1="260" y1="34" x2="260" y2="276" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="460" y="24" class="mid slab b">R4</text><line x1="460" y1="34" x2="460" y2="276" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="650" y="24" class="mid slab b">Otto</text><line x1="650" y1="34" x2="650" y2="276" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><line x1="70" y1="64" x2="252" y2="64" class="line s-blue" stroke-width="3" marker-end="url(#ah-blue)"/><text x="120" y="56" class="mono xs b f-blue halo">hops left 1</text><path d="M252,56 l16,16 M268,56 l-16,16" class="line s-red" stroke-width="3.5"/><line x1="256" y1="86" x2="78" y2="86" class="line s-red dash" stroke-width="2" marker-end="url(#ah-red)"/><text x="165" y="104" class="mid hand f-red halo">R1: “died here”</text><line x1="70" y1="144" x2="452" y2="144" class="line s-blue" stroke-width="3" marker-end="url(#ah-blue)"/><text x="120" y="136" class="mono xs b f-blue halo">hops left 2</text><path d="M452,136 l16,16 M468,136 l-16,16" class="line s-red" stroke-width="3.5"/><line x1="456" y1="166" x2="78" y2="166" class="line s-red dash" stroke-width="2" marker-end="url(#ah-red)"/><text x="265" y="184" class="mid hand f-red halo">R4: “died here”</text><line x1="70" y1="224" x2="642" y2="224" class="line s-blue" stroke-width="3" marker-end="url(#ah-blue)"/><text x="120" y="216" class="mono xs b f-blue halo">hops left 3</text><line x1="646" y1="246" x2="78" y2="246" class="line s-green dash" stroke-width="2" marker-end="url(#ah-green)"/><text x="360" y="264" class="mid hand f-green halo">Otto: “hello!”</text><text x="360" y="300" class="mid hand">Each reply names one more router on the way. That’s the whole trick.</text>
</svg>
<figcaption>Send a packet allowed 1 hop, then 2, then 3, and see who complains.</figcaption>
</figure>

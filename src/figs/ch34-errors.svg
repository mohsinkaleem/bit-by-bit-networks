<figure class="fig">
<svg class="dia" viewBox="0 0 720 232" role="img" aria-label="Where 502, 503 and 504 errors come from: a CDN or load balancer reporting a problem with the server behind it">
<rect x="20" y="30" width="140" height="44" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="90" y="56" class="mid sm b">browser</text><rect x="170" y="30" width="140" height="44" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="240" y="56" class="mid sm b">CDN edge</text><rect x="340" y="30" width="140" height="44" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="410" y="56" class="mid sm b">load balancer</text><rect x="520" y="30" width="180" height="44" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="610" y="56" class="mid sm b">web servers</text><path d="M162,52 L186,52" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><path d="M312,52 L336,52" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><path d="M482,52 L506,52" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="20" y="96" width="210" height="30" rx="6" class="t-red" stroke="var(--red)" stroke-width="1.4"/><text x="32" y="116" class="sm b">502 Bad Gateway</text><text x="244" y="116" class="xs">the CDN or balancer says: “the server behind me refused, or sent back nonsense”</text><rect x="20" y="134" width="210" height="30" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.4"/><text x="32" y="154" class="sm b">503 Service Unavailable</text><text x="244" y="154" class="xs">the CDN or balancer says: “I have no healthy servers (or I'm overloaded): try later”</text><rect x="20" y="172" width="210" height="30" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.4"/><text x="32" y="192" class="sm b">504 Gateway Timeout</text><text x="244" y="192" class="xs">the CDN or balancer says: “the server behind me didn't answer in time”</text><text x="20" y="222" class="xs">These errors are written by a middleman, about the server behind it, which may never have seen the request at all.</text>
</svg>
<figcaption>Error pages from the middle. The lab’s load balancer produces all three.</figcaption>
</figure>

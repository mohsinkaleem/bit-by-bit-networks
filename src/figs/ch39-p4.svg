<figure class="fig">
<svg class="dia" viewBox="0 0 720 256" role="img" aria-label="The P4 pipeline: parser, ingress match-action tables, queues, egress tables, deparser">
<rect x="20" y="40" width="116" height="64" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="78" y="62" class="mid sm b">parser</text><text x="78" y="128" class="mid xs">a state machine:</text><text x="78" y="142" class="mid xs">read Ethernet, then</text><text x="78" y="156" class="mid xs">IPv4 or IPv6, then</text><path d="M138,72 L154,72" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="156" y="40" width="136" height="64" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="224" y="62" class="mid sm b">ingress</text><text x="224" y="128" class="mid xs">match-action tables:</text><text x="224" y="142" class="mid xs">look up fields, run</text><text x="224" y="156" class="mid xs">actions</text><path d="M294,72 L310,72" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="312" y="40" width="96" height="64" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="360" y="62" class="mid sm b">queues</text><text x="360" y="128" class="mid xs">buffers, and</text><text x="360" y="142" class="mid xs">scheduling</text><path d="M410,72 L426,72" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="428" y="40" width="118" height="64" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="487" y="62" class="mid sm b">egress</text><text x="487" y="128" class="mid xs">more tables:</text><text x="487" y="142" class="mid xs">rewrite on the way</text><text x="487" y="156" class="mid xs">out</text><path d="M548,72 L564,72" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="566" y="40" width="104" height="64" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="618" y="62" class="mid sm b">deparser</text><text x="618" y="128" class="mid xs">put the headers</text><text x="618" y="142" class="mid xs">back together</text><text x="20" y="24" class="xs b muted">packet in</text><text x="700" y="24" class="end xs b muted">packet out</text><rect x="160" y="186" width="400" height="60" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="360" y="206" class="mid xs b">You write all five parts, in P4. The switch chip knows no protocols</text><text x="360" y="222" class="mid xs">until you teach it: not even Ethernet. Tables are filled in at run time,</text><text x="360" y="238" class="mid xs">by a controller, just like OpenFlow’s.</text>
</svg>
<figcaption>A P4 program describes a switch’s whole pipeline. OpenFlow lets you fill in tables whose shape was decided by the switch’s makers; P4 lets you decide the shape too.</figcaption>
</figure>

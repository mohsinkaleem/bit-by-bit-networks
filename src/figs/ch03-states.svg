<figure class="fig">
<svg class="dia" viewBox="0 0 720 344" role="img" aria-label="State machine for the Chatterbox Protocol">
<rect x="20" y="150" width="150" height="54" rx="27" class="t-teal" stroke="var(--ink)" stroke-width="2"/><text x="95" y="174" class="mid slab b">IDLE</text><text x="95" y="192" class="mid xs muted">nothing to send</text><rect x="285" y="40" width="150" height="54" rx="27" class="t-yellow" stroke="var(--ink)" stroke-width="2"/><text x="360" y="64" class="mid slab b">SENDING</text><text x="360" y="82" class="mid xs muted">~S … ~E</text><rect x="545" y="150" width="160" height="54" rx="27" class="t-blue" stroke="var(--ink)" stroke-width="2"/><text x="625" y="174" class="mid slab b">WAITING</text><text x="625" y="192" class="mid xs muted">for ~A, timer on</text><rect x="285" y="262" width="150" height="54" rx="27" class="t-red" stroke="var(--ink)" stroke-width="2"/><text x="360" y="286" class="mid slab b">BACKOFF</text><text x="360" y="304" class="mid xs muted">wait a random time</text><path d="M110,148 C130,90 200,70 280,68" class="line s-ink" marker-end="url(#ah-ink)"/><text x="150" y="88" class="mid hand halo">have a message</text><path d="M438,68 C520,70 590,90 612,146" class="line s-ink" marker-end="url(#ah-ink)"/><text x="562" y="88" class="mid hand halo">sent ~E</text><path d="M543,184 L174,184" class="line s-green" marker-end="url(#ah-green)"/><text x="462" y="176" class="mid hand halo">got ~A: success!</text><path d="M350,98 L350,258" class="line s-red" marker-end="url(#ah-red)"/><text x="342" y="140" class="end hand halo">collision!</text><path d="M630,206 C610,270 520,296 440,292" class="line s-orange" marker-end="url(#ah-orange)"/><text x="590" y="280" class="mid hand halo">timer ran out</text><path d="M372,258 L372,100" class="line s-ink" marker-end="url(#ah-ink)"/><text x="380" y="236" class="start hand halo">line quiet again</text><path d="M282,300 C180,300 110,260 96,208" class="line s-muted" marker-end="url(#ah-muted)"/><text x="150" y="330" class="mid hand halo">too many tries: give up</text><rect x="20" y="20" width="220" height="92" rx="10" class="card"/><text x="32" y="44" class="sm b">In every state:</text><text x="32" y="66" class="sm">if a message arrives,</text><text x="32" y="86" class="sm">print it and send ~A</text><text x="32" y="104" class="xs muted">(as soon as the line is quiet)</text>
</svg>
<figcaption>The whole protocol as a state machine: every Chatterbox is always in exactly one of these four states.</figcaption>
</figure>

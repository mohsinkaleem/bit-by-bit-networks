<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 318" role="img" aria-label="A program&#x27;s socket calls, the kernel&#x27;s socket table, and a receive buffer filling with datagrams">
<rect x="10" y="10" width="700" height="90" rx="10" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="24" y="30" class="sm b" style="fill:var(--blue)">your program</text><rect x="10" y="118" width="700" height="190" rx="10" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="24" y="138" class="sm b muted">the operating system’s kernel</text><line x1="10" y1="109" x2="710" y2="109" class="line s-muted dash" stroke-width="1.5"/><text x="706" y="106" class="end xs muted">system calls cross here</text><g data-show="1"><text x="30" y="52" class="mono sm b">s = socket(AF_INET, SOCK_DGRAM)</text></g><g data-show="2"><text x="370" y="52" class="mono sm b">s.bind(("0.0.0.0", 7123))</text></g><g data-show="4"><text x="30" y="78" class="mono sm b">data, who = s.recvfrom(512)</text></g><g data-show="4"><text x="370" y="78" class="mono sm b">s.sendto(reply, who)</text></g><g data-show="1"><rect x="30" y="152" width="300" height="140" rx="8" class="f-surface" stroke="var(--line)"/><text x="180" y="172" class="mid xs b">the socket table</text><text x="44" y="196" class="mono xs">UDP  *:5353       (mDNS, Chapter 22)</text><text x="44" y="216" class="mono xs">UDP  127.0.0.1:53 (a name server)</text></g><g data-show="2"><rect x="38" y="228" width="284" height="22" rx="4" class="t-yellow" stroke="var(--yellow)"/><text x="44" y="243" class="mono xs b">UDP  *:7123       ← our socket</text></g><g data-show="=1"><text x="44" y="243" class="mono xs muted">UDP  *:7123 ?     not yet: no port</text></g><g data-show="2"><text x="380" y="172" class="xs b">our socket’s receive buffer</text><rect x="380" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/><rect x="418" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/><rect x="456" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/><rect x="494" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/><rect x="532" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/><rect x="570" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/><rect x="608" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/><rect x="646" y="182" width="32" height="30" rx="4" class="f-surface" stroke="var(--line)"/></g><g data-show="3"><rect x="380" y="182" width="32" height="30" rx="4" class="t-green" stroke="var(--green)"/><rect x="418" y="182" width="32" height="30" rx="4" class="t-green" stroke="var(--green)"/></g><g data-show="3-4"><path d="M680,280 C640,250 520,240 440,216" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="600" y="296" class="mid xs b f-green">a datagram for port 7123 arrives</text></g><g data-show="=4"><path d="M396,180 C396,150 380,120 300,70" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="460" y="150" class="xs b" style="fill:var(--blue)">recvfrom() takes the oldest one</text></g><g data-show="5"><path d="M690,250 C660,245 640,245 620,250" class="line s-red" stroke-width="2.5"/><text x="700" y="240" class="end xs b f-red">one for port 7777: no such socket</text><text x="700" y="262" class="end xs b f-red">→ drop it, send back ICMP “port unreachable”</text></g>
</svg>
<ol class="steps"><li><code>socket()</code> asks the kernel for a new socket: an entry in its table, and a number (a “file descriptor”) the program uses to refer to it. It has no port yet.</li><li><code>bind()</code> claims a port. From now on, the kernel will deliver datagrams for UDP port 7123 to this socket, and it gets a <strong>receive buffer</strong> to keep them in until the program asks. (A program that just calls <code>sendto()</code> without binding gets a random port, as Chapter 12’s clients did.)</li><li>Datagrams arrive whenever they like, whether the program is ready or not. The kernel looks up the destination port in its table, finds our socket, and puts the datagram at the end of its buffer.</li><li><code>recvfrom()</code> takes the oldest datagram out of the buffer, with the address and port it came from, so the program knows where to send the reply. If the buffer is empty, it waits.</li><li>A datagram for a port with no socket has nowhere to go. The kernel throws it away, and sends back an ICMP “port unreachable” (Chapter 21), which is what Chapter 12’s “nobody home” was.</li></ol>
<figcaption>What a UDP socket really is: an entry in the kernel’s table, and a queue.</figcaption>
</figure>

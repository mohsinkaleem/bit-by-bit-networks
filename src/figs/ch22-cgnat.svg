<figure class="fig">
<svg class="dia" viewBox="0 0 720 170" role="img" aria-label="Double NAT: a home router&#x27;s NAT behind an internet provider&#x27;s carrier-grade NAT">
<rect x="14" y="40" width="150" height="70" rx="10" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="89" y="70" class="mid sm b">Bob’s house</text><text x="89" y="90" class="mid mono xs">192.168.1.0/24</text><rect x="200" y="40" width="160" height="70" rx="10" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="280" y="70" class="mid sm b">home router</text><text x="280" y="90" class="mid mono xs">outside: 100.72.14.9</text><rect x="396" y="40" width="150" height="70" rx="10" class="t-orange" stroke="var(--orange)" stroke-width="2"/><text x="471" y="70" class="mid sm b">provider’s big NAT</text><text x="471" y="90" class="mid mono xs">outside: 203.0.113.77</text><rect x="582" y="40" width="124" height="70" rx="10" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="644" y="70" class="mid sm b">the internet</text><path d="M166,75 L196,75" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><path d="M362,75 L392,75" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><path d="M548,75 L578,75" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="140" class="mid xs">With carrier-grade NAT, the home router’s “outside” address is private too (100.64.0.0/10),</text><text x="360" y="156" class="mid xs">and hundreds of homes share each of the provider’s public addresses.</text>
</svg>
<figcaption>NAT inside NAT. Many mobile networks, and some home internet providers, work like this.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 464" role="img" aria-label="The TCP state machine: opening states on both sides, ESTABLISHED, and the closing states including TIME_WAIT">
<line x1="100" y1="58" x2="100" y2="100" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="110" y="83" class="xs halo" text-anchor="start">connect(): send SYN</text><line x1="560" y1="58" x2="560" y2="100" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="550" y="83" class="xs halo" text-anchor="end">SYN in: send SYN,ACK</text><line x1="120.779" y1="125.913" x2="305.443" y2="193.43" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="213.111" y="163.671" class="xs halo" text-anchor="middle">SYN,ACK in: send ACK</text><line x1="539.221" y1="125.913" x2="354.557" y2="193.43" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="446.889" y="163.671" class="xs halo" text-anchor="middle">ACK in</text><line x1="309.221" y1="205.913" x2="124.557" y2="273.43" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="216.889" y="243.671" class="xs halo" text-anchor="middle">close(): send FIN</text><line x1="350.779" y1="205.913" x2="535.443" y2="273.43" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="443.111" y="243.671" class="xs halo" text-anchor="middle">FIN in: send ACK</text><line x1="100" y1="298" x2="100" y2="330" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="110" y="318" class="xs halo" text-anchor="start">ACK in</text><line x1="560" y1="298" x2="560" y2="330" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="550" y="318" class="xs halo" text-anchor="end">close(): send FIN</text><line x1="100" y1="368" x2="100" y2="400" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="110" y="388" class="xs halo" text-anchor="start">FIN in: send ACK</text><line x1="560" y1="368" x2="560" y2="400" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="550" y="388" class="xs halo" text-anchor="end">ACK in</text><rect x="68.8" y="26" width="62.4" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="100" y="45" class="mid mono xs b">CLOSED</text><rect x="528.8" y="26" width="62.4" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="560" y="45" class="mid mono xs b">LISTEN</text><rect x="60.4" y="106" width="79.2" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="100" y="125" class="mid mono xs b">SYN_SENT</text><rect x="520.4" y="106" width="79.2" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="560" y="125" class="mid mono xs b">SYN_RCVD</text><rect x="277.8" y="186" width="104.4" height="28" rx="14" class="t-green" stroke="var(--line)" stroke-width="1.5"/><text x="330" y="205" class="mid mono xs b">ESTABLISHED</text><rect x="52" y="266" width="96" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="100" y="285" class="mid mono xs b">FIN_WAIT_1</text><rect x="512" y="266" width="96" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="560" y="285" class="mid mono xs b">CLOSE_WAIT</text><rect x="52" y="336" width="96" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="100" y="355" class="mid mono xs b">FIN_WAIT_2</text><rect x="520.4" y="336" width="79.2" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="560" y="355" class="mid mono xs b">LAST_ACK</text><rect x="56.2" y="406" width="87.6" height="28" rx="14" class="t-orange" stroke="var(--line)" stroke-width="1.5"/><text x="100" y="425" class="mid mono xs b">TIME_WAIT</text><rect x="528.8" y="406" width="62.4" height="28" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.5"/><text x="560" y="425" class="mid mono xs b">CLOSED</text><text x="100" y="452" class="mid xs muted">…waits 2 × the maximum segment lifetime (60 s on Linux), then CLOSED</text><text x="330" y="20" class="end xs b" style="fill:var(--blue)">the client (it connects, and here it closes first)</text><text x="420" y="20" class="xs b" style="fill:var(--purple)">the server</text>
</svg>
<figcaption>The states a TCP connection goes through, and what moves it from one to the next. <code>netstat</code> and <code>ss</code> show these names.</figcaption>
</figure>

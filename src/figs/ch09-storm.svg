<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 384" role="img" aria-label="A broadcast circling a loop of three switches forever, multiplying as it goes">
<g transform="translate(0,34)"><line x1="360" y1="60" x2="170" y2="250" class="wire" stroke-width="5"/><line x1="170" y1="250" x2="550" y2="250" class="wire" stroke-width="5"/><line x1="550" y1="250" x2="360" y2="60" class="wire" stroke-width="5"/><use href="#switch" x="300" y="42" width="120" height="37"/><text x="360" y="98" class="mid slab b halo">S1</text><use href="#switch" x="110" y="232" width="120" height="37"/><text x="170" y="288" class="mid slab b halo">S2</text><use href="#switch" x="490" y="232" width="120" height="37"/><text x="550" y="288" class="mid slab b halo">S3</text><line x1="360" y1="60" x2="360" y2="0" class="wire" stroke-width="3"/><use href="#alice-head" x="386" y="-2" width="40" height="40"/><text x="430" y="24" class="sm b">Alice</text><g data-show="=1"><circle cx="268" cy="150" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="268" y="155" class="mid xs b" fill="#fff">1</text></g><g data-show="=1"><circle cx="452" cy="150" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="452" y="155" class="mid xs b" fill="#fff">1</text></g><g data-show="=2"><circle cx="360" cy="262" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="360" y="267" class="mid xs b" fill="#fff">2</text></g><g data-show="=2"><circle cx="300" cy="262" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="300" y="267" class="mid xs b" fill="#fff">2</text></g><g data-show="=2"><circle cx="420" cy="262" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="420" y="267" class="mid xs b" fill="#fff">2</text></g><g data-show="=3"><circle cx="250" cy="140" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="250" y="145" class="mid xs b" fill="#fff">3</text></g><g data-show="=3"><circle cx="290" cy="170" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="290" y="175" class="mid xs b" fill="#fff">3</text></g><g data-show="=3"><circle cx="470" cy="140" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="470" y="145" class="mid xs b" fill="#fff">3</text></g><g data-show="=3"><circle cx="430" cy="170" r="15" class="f-orange" stroke="var(--surface)" stroke-width="2"/><text x="430" y="175" class="mid xs b" fill="#fff">3</text></g><g data-show="4"><text x="360" y="330" class="mid hand lg f-red">…and around, and around, and around</text></g><g data-show="=4"><circle cx="360" cy="180" r="44" class="f-red" opacity="0.2"/><text x="360" y="186" class="mid xl b f-red">∞</text></g></g>
</svg>
<ol class="steps"><li>Alice sends one broadcast. S1 floods it out of both of its other ports, so one copy heads to S2 and one to S3.</li><li>S2 floods its copy to S3, and S3 floods its copy to S2. Now two copies are crossing on the bottom link.</li><li>Each of those gets flooded onward around the triangle, back to S1, which floods them yet again. None of them will ever stop, because a switch has no way to tell it’s seen a frame before. (In a network with more loops, every lap even <em>multiplies</em> the copies.)</li><li>Within seconds the links are 100% full of copies of one broadcast, and every new broadcast adds more. Meanwhile the switches keep seeing Alice’s address arrive on different ports, and their tables thrash. The network is down. This is a <strong>broadcast storm</strong>.</li></ol>
<figcaption>Three switches in a loop, and one innocent broadcast.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 356" role="img" aria-label="Inside a laptop: packets pass the tap between the driver and IP; a filter picks which copies go up to tcpdump">
<rect x="170" y="14" width="420" height="332" rx="16" class="f-surface" stroke="var(--ink)" stroke-width="2"/><text x="380" y="36" class="mid slab b">Bob’s laptop</text><rect x="188" y="50" width="96" height="44" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="236" y="77" class="mid sm b">game</text><rect x="296" y="50" width="96" height="44" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="344" y="77" class="mid sm b">browser</text><rect x="446" y="50" width="126" height="44" rx="8" class="t-teal" stroke="var(--teal-ink)" stroke-width="2"/><text x="509" y="77" class="mid mono sm b">tcpdump</text><line x1="180" y1="110" x2="580" y2="110" class="line s-muted dash" stroke-width="1.5"/><text x="600" y="104" class="xs muted">programs</text><text x="600" y="124" class="xs muted">the kernel</text><rect x="188" y="126" width="204" height="34" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="290" y="148" class="mid sm b">TCP, UDP</text><rect x="188" y="172" width="204" height="34" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="290" y="194" class="mid sm b">IP</text><rect x="188" y="262" width="384" height="30" rx="8" class="f-card" stroke="var(--muted)" stroke-width="2"/><text x="380" y="282" class="mid sm b">driver</text><rect x="188" y="302" width="384" height="30" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="380" y="322" class="mid sm b">Wi-Fi card</text><rect x="420" y="118" width="152" height="118" rx="10" class="t-orange" stroke="var(--orange)" stroke-width="2"/><text x="432" y="134" class="xs b">the tap (BPF)</text><rect x="434" y="142" width="124" height="28" rx="8" class="f-surface" stroke="var(--orange)" stroke-width="2"/><text x="496" y="161" class="mid xs b">buffer</text><rect x="434" y="192" width="124" height="32" rx="8" class="f-surface" stroke="var(--orange)" stroke-width="2"/><text x="496" y="213" class="mid xs b">filter program</text><line x1="240" y1="302" x2="240" y2="294" class="line s-ink" stroke-width="2.5" marker-end="url(#ah-ink)"/><line x1="240" y1="262" x2="240" y2="208" class="line s-ink" stroke-width="2.5" marker-end="url(#ah-ink)"/><line x1="240" y1="172" x2="240" y2="162" class="line s-ink" stroke-width="2.5" marker-end="url(#ah-ink)"/><line x1="236" y1="126" x2="236" y2="96" class="line s-ink" stroke-width="2.5" marker-end="url(#ah-ink)"/><line x1="340" y1="96" x2="340" y2="126" class="line s-muted" stroke-width="2.5" marker-end="url(#ah-muted)"/><line x1="340" y1="162" x2="340" y2="172" class="line s-muted" stroke-width="2.5" marker-end="url(#ah-muted)"/><line x1="340" y1="206" x2="340" y2="260" class="line s-muted" stroke-width="2.5" marker-end="url(#ah-muted)"/><text x="350" y="238" class="xs muted">going out</text><text x="250" y="238" class="xs">coming in</text><line x1="496" y1="262" x2="496" y2="228" class="line s-orange" stroke-width="3" marker-end="url(#ah-orange)"/><text x="504" y="248" class="xs f-orange b">a copy of</text><text x="504" y="259" class="xs f-orange b">every one</text><line x1="496" y1="192" x2="496" y2="174" class="line s-orange" stroke-width="3" marker-end="url(#ah-orange)"/><text x="504" y="187" class="xs f-orange b">match?</text><line x1="536" y1="142" x2="536" y2="98" class="line s-teal" stroke-width="3" marker-end="url(#ah-teal)"/><path d="M558,208 L604,208" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><text x="610" y="205" class="xs muted">no match:</text><text x="610" y="219" class="xs muted">skip it</text><use href="#router" x="40" y="280" width="84" height="56"/><text x="82" y="272" class="mid xs b">home router</text><path d="M124,317 L186,317" class="line s-muted dash" stroke-width="2.5"/><text x="154" y="308" class="mid xs muted">radio</text>
</svg>
<figcaption>The tap sits just above the card’s driver. Every packet in or out passes it, and a small filter program decides which copies go up to <code>tcpdump</code>.</figcaption>
</figure>

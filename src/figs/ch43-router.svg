<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 232" role="img" aria-label="An NDN router with a content store, pending interest table and forwarding table, handling Interests from two devices and Data from the testbed">
<rect x="14" y="42" width="130" height="36" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="79" y="65" class="mid xs b">Bob’s MacBook</text><rect x="14" y="132" width="130" height="36" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="79" y="155" class="mid xs b">Alice’s phone</text><rect x="240" y="20" width="240" height="200" rx="12" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="360" y="40" class="mid xs b">Grandpa’s Pi: an NDN router</text><rect x="256" y="56" width="208" height="44" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.6"/><text x="360" y="74" class="mid xs b">Content Store</text><text x="360" y="90" class="mid xs">copies of Data it has passed on</text><rect x="256" y="110" width="208" height="44" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="360" y="128" class="mid xs b">Pending Interest Table</text><text x="360" y="144" class="mid xs">who is waiting for what</text><rect x="256" y="164" width="208" height="44" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="360" y="182" class="mid xs b">Forwarding table (FIB)</text><text x="360" y="198" class="mid xs">/ndn → the testbed · /grandpa → here</text><rect x="580" y="90" width="124" height="50" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="642" y="110" class="mid xs b">the testbed</text><text x="642" y="126" class="mid xs muted">(UCLA)</text><g data-show="=1"><path d="M146,60 L250,70" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="190" y="52" class="mid xs b f-green">Interest</text><text x="470" y="74" class="xs f-red">✗ not in the store</text><text x="470" y="128" class="xs b f-orange">+ Bob is waiting</text><text x="470" y="184" class="xs">longest match: /ndn</text><path d="M466,196 L578,124" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/></g><g data-show="=2"><path d="M146,150 L250,132" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="196" y="160" class="mid xs b f-green">same Interest</text><text x="470" y="128" class="xs b f-orange">+ Alice too: 2 waiting</text><text x="470" y="144" class="xs">nothing more sent upstream</text></g><g data-show="=3"><path d="M578,116 L470,132" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="528" y="108" class="mid xs b f-purple">Data</text><path d="M250,126 L148,64" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><path d="M250,136 L148,150" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="470" y="74" class="xs b f-green">✓ keep a copy</text><text x="470" y="144" class="xs">entry used up</text></g><g data-show="=4"><path d="M146,60 L250,70" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><path d="M250,76 L148,66" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="470" y="74" class="xs b f-green">✓ in the store: answered here</text><text x="470" y="184" class="xs">the testbed never hears of it</text></g>
</svg>
<ol class="steps"><li>An Interest arrives. Is a copy already in the <strong>content store</strong>? No. So the router writes down, in the <strong>pending interest table</strong>, who asked, and looks up the name in its <strong>forwarding table</strong> by longest prefix match (Chapter 23), and sends the Interest on.</li><li>Before an answer comes back, someone else asks for exactly the same name. The router doesn’t send a second Interest: it just adds them to the waiting list. That’s free multicast.</li><li>The Data comes back. It has no destination address, so how does it find its way? By the breadcrumbs: every router on the way remembered who asked. The Data goes to everyone waiting, the entry is crossed off, and a copy is kept.</li><li>Later, anyone else who asks gets the copy straight from the store. The more popular something is, the closer to people its copies end up.</li></ol>
<figcaption>What this chapter’s <code>ndn.py router</code> does with every packet, and exactly what it did on Grandpa’s Pi.</figcaption>
</figure>

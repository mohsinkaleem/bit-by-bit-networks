<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 496.1" role="img" aria-label="Joining a Wi-Fi network: beacon, probe, authentication, association, the four-way key handshake, then DHCP">
<text x="150" y="28" class="mid slab b">laptop</text><line x1="150" y1="36" x2="150" y2="490.1000000000001" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="570" y="28" class="mid slab b">access point</text><line x1="570" y1="36" x2="570" y2="490.1000000000001" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="486.1000000000001" class="xs muted">time ↓</text><g data-show="1"><line x1="570" y1="50.2" x2="150" y2="63.8" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="50" class="mid mono sm b halo">beacon: “HomeWiFi is here, WPA2”</text><text x="360" y="73" class="mid xs muted halo">ten times a second, to everyone</text></g><g data-show="2"><line x1="150" y1="94.4" x2="570" y2="108" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="94.2" class="mid mono sm b halo">probe request: “anyone here?”</text></g><g data-show="2"><line x1="570" y1="125" x2="150" y2="138.6" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="124.8" class="mid mono sm b halo">probe response</text></g><g data-show="3"><line x1="150" y1="165.8" x2="570" y2="179.4" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="165.6" class="mid mono sm b halo">authentication (open)</text></g><g data-show="3"><line x1="570" y1="196.4" x2="150" y2="210" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="196.2" class="mid mono sm b halo">authentication: OK</text></g><g data-show="4"><line x1="150" y1="237.2" x2="570" y2="250.8" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="237" class="mid mono sm b halo">association request</text></g><g data-show="4"><line x1="570" y1="267.8" x2="150" y2="281.4" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="267.6" class="mid mono sm b halo">association response: “you’re number 3”</text></g><g data-show="5"><line x1="570" y1="308.6" x2="150" y2="322.2" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="308.4" class="mid mono sm b halo">key message 1: a random number</text></g><g data-show="5"><line x1="150" y1="344.3" x2="570" y2="357.9" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="344.1" class="mid mono sm b halo">key message 2: my random number, and a proof</text></g><g data-show="5"><line x1="570" y1="380" x2="150" y2="393.6" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="379.8" class="mid mono sm b halo">key message 3: my proof, and the group key</text></g><g data-show="5"><line x1="150" y1="415.7" x2="570" y2="429.3" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="415.5" class="mid mono sm b halo">key message 4: done</text></g><g data-show="6"><line x1="150" y1="456.5" x2="570" y2="470.1" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="456.3" class="mid mono sm b halo">DHCP: “can I have an IP address?”</text><text x="360" y="479.3" class="mid xs muted halo">Chapter 22</text></g>
</svg>
<ol class="steps"><li>The access point sends a <strong>beacon</strong> about ten times a second, announcing its network’s name, its channel, and what it supports. A laptop can find networks just by listening.</li><li>Or it can shout: a <strong>probe request</strong> asks “is anyone here?” (or “is HomeWiFi here?”), and access points answer. This is how your phone finds networks faster than beacons alone would let it.</li><li>“Authentication”, but not really: it’s a leftover from the original 1997 standard, and for a home network it always says yes.</li><li><strong>Association</strong>: the laptop asks to join, and the access point gives it a number. From now on, the access point will pass its frames on.</li><li>The <strong>four-way handshake</strong>. The password is never sent. Instead, both sides mix it with two random numbers to make a fresh key for this laptop alone, and each proves it got the same answer. The frames are EAPOL, EtherType 0x888E, from Chapter 18’s table.</li><li>Now the laptop’s frames are encrypted, and it can ask for an address (Chapter 22). All of this takes a few tens of milliseconds.</li></ol>
<figcaption>Joining a Wi-Fi network, frame by frame.</figcaption>
</figure>

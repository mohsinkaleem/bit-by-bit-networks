<figure class="fig">
<svg class="dia" viewBox="0 0 720 264" role="img" aria-label="A table: key exchange and signature algorithms like X25519, RSA and ECDSA are broken by a quantum computer; AES-128 is weakened; AES-256, ChaCha20 and SHA-256 stay safe; the new ML-KEM, ML-DSA and SLH-DSA are designed to stay safe">
<text x="20" y="22" class="xs b"></text><text x="250" y="22" class="xs b">used for</text><text x="450" y="22" class="mid xs b">against today’s computers</text><text x="620" y="22" class="mid xs b">against a quantum computer</text><rect x="14" y="34" width="692" height="26" rx="4" class="f-card" stroke="var(--line)" stroke-width="0.8"/><text x="24" y="51" class="xs b">X25519, ECDH</text><text x="250" y="51" class="xs">agreeing on keys (Ch. 31, 32)</text><text x="450" y="51" class="mid xs">safe</text><rect x="540" y="37" width="160" height="20" rx="4" class="t-red" stroke="none" stroke-width="0"/><text x="620" y="51" class="mid xs b">broken (Shor)</text><rect x="14" y="66" width="692" height="26" rx="4" class="f-surface" stroke="var(--line)" stroke-width="0.8"/><text x="24" y="83" class="xs b">RSA</text><text x="250" y="83" class="xs">keys and signatures</text><text x="450" y="83" class="mid xs">safe</text><rect x="540" y="69" width="160" height="20" rx="4" class="t-red" stroke="none" stroke-width="0"/><text x="620" y="83" class="mid xs b">broken (Shor)</text><rect x="14" y="98" width="692" height="26" rx="4" class="f-card" stroke="var(--line)" stroke-width="0.8"/><text x="24" y="115" class="xs b">ECDSA, Ed25519</text><text x="250" y="115" class="xs">signatures, certificates</text><text x="450" y="115" class="mid xs">safe</text><rect x="540" y="101" width="160" height="20" rx="4" class="t-red" stroke="none" stroke-width="0"/><text x="620" y="115" class="mid xs b">broken (Shor)</text><rect x="14" y="130" width="692" height="26" rx="4" class="f-surface" stroke="var(--line)" stroke-width="0.8"/><text x="24" y="147" class="xs b">AES-128</text><text x="250" y="147" class="xs">encrypting the data</text><text x="450" y="147" class="mid xs">safe</text><rect x="540" y="133" width="160" height="20" rx="4" class="t-yellow" stroke="none" stroke-width="0"/><text x="620" y="147" class="mid xs b">weaker (Grover)</text><rect x="14" y="162" width="692" height="26" rx="4" class="f-card" stroke="var(--line)" stroke-width="0.8"/><text x="24" y="179" class="xs b">AES-256, ChaCha20</text><text x="250" y="179" class="xs">encrypting the data</text><text x="450" y="179" class="mid xs">safe</text><rect x="540" y="165" width="160" height="20" rx="4" class="t-green" stroke="none" stroke-width="0"/><text x="620" y="179" class="mid xs b">safe</text><rect x="14" y="194" width="692" height="26" rx="4" class="f-surface" stroke="var(--line)" stroke-width="0.8"/><text x="24" y="211" class="xs b">SHA-256</text><text x="250" y="211" class="xs">hashes, key schedules</text><text x="450" y="211" class="mid xs">safe</text><rect x="540" y="197" width="160" height="20" rx="4" class="t-green" stroke="none" stroke-width="0"/><text x="620" y="211" class="mid xs b">safe</text><rect x="14" y="226" width="692" height="26" rx="4" class="f-card" stroke="var(--line)" stroke-width="0.8"/><text x="24" y="243" class="xs b">ML-KEM, ML-DSA, SLH-DSA</text><text x="250" y="243" class="xs">the new standards</text><text x="450" y="243" class="mid xs">safe</text><rect x="540" y="229" width="160" height="20" rx="4" class="t-green" stroke="none" stroke-width="0"/><text x="620" y="243" class="mid xs b">safe, as far as anyone knows</text>
</svg>
<figcaption>What a large quantum computer would break. Shor’s algorithm destroys the maths behind almost every public-key method in use; Grover’s only speeds up guessing, which bigger keys fix.</figcaption>
</figure>

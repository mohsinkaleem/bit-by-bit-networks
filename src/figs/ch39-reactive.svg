<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 408.8" role="img" aria-label="A sequence diagram: the first packet goes to the controller, which installs a rule; later packets are forwarded by the switch alone">
<text x="90" y="28" class="mid slab b">h1</text><line x1="90" y1="36" x2="90" y2="402.79999999999995" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="300" y="28" class="mid slab b">switch s1</text><line x1="300" y1="36" x2="300" y2="402.79999999999995" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="520" y="28" class="mid slab b">controller</text><line x1="520" y1="36" x2="520" y2="402.79999999999995" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="660" y="28" class="mid slab b">h2</text><line x1="660" y1="36" x2="660" y2="402.79999999999995" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="398.79999999999995" class="xs muted">time ↓</text><g data-show="1"><line x1="90" y1="50.2" x2="300" y2="70.6" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="195" y="53.4" class="mid mono sm b halo">ping to h2</text></g><g data-show="1"><circle cx="300" cy="87.6" r="5" class="f-ink"/><text x="286" y="92.6" class="hand  halo" text-anchor="end">no rule matches…</text></g><g data-show="2"><line x1="300" y1="101.2" x2="520" y2="128.4" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="410" y="107.8" class="mid mono sm b halo">PACKET_IN</text><text x="410" y="130.8" class="mid xs muted halo">port 1: 0a…01 → 0a…02</text></g><g data-show="3"><circle cx="520" cy="159" r="5" class="f-ink"/><text x="506" y="164" class="hand  halo" text-anchor="end">h1: port 1, h2: port 2</text></g><g data-show="3"><line x1="520" y1="179.4" x2="300" y2="206.6" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="410" y="186" class="mid mono sm b halo">FLOW_MOD</text><text x="410" y="209" class="mid xs muted halo">port 1, to 0a…02: output 2</text></g><g data-show="3"><line x1="520" y1="227" x2="300" y2="250.8" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="410" y="231.9" class="mid mono sm b halo">PACKET_OUT</text></g><g data-show="3"><line x1="300" y1="257.6" x2="660" y2="278" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="480" y="260.8" class="mid mono sm b halo">the first ping</text></g><g data-show="4"><line x1="90" y1="301.8" x2="300" y2="315.4" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="195" y="301.6" class="mid mono sm b halo">ping 2</text></g><g data-show="4"><line x1="300" y1="315.4" x2="660" y2="329" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="480" y="315.2" class="mid mono sm b halo"></text></g><g data-show="4"><line x1="90" y1="339.2" x2="300" y2="352.8" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="195" y="339" class="mid mono sm b halo">ping 3</text></g><g data-show="4"><line x1="300" y1="352.8" x2="660" y2="366.4" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="480" y="352.6" class="mid mono sm b halo"></text></g><g data-show="4"><circle cx="300" cy="386.8" r="5" class="f-ink"/><text x="314" y="391.8" class="hand  halo" text-anchor="start">a rule matches: no need to ask</text></g>
</svg>
<ol class="steps"><li>A ping from h1 arrives at the switch. Its flow table has only one row, the lowest-priority rule that matches anything: “send it to the controller”.</li><li>So the switch wraps the packet in an OpenFlow <code>PACKET_IN</code> message and sends it to the controller, over an ordinary TCP connection.</li><li>The controller learns where h1 is, looks up where h2 is, and answers twice: a <code>FLOW_MOD</code> adds a row to the table for next time, and a <code>PACKET_OUT</code> sends this packet on its way.</li><li>Every later packet matches the new row, and the switch forwards it by itself, at full speed. The controller is only asked about the first packet of each conversation.</li></ol>
<figcaption>Reactive flow set-up: the controller is the switch’s memory and judgement, consulted once per conversation. (It could also install rules in advance, before any packet arrives: that’s <em>proactive</em>.)</figcaption>
</figure>

" y2="55.0" class="line s-orange" stroke-width="2"/><line x1="640" y1="55.0" x2="440" y2="62" class="line s-orange" stroke-width="2"/><text x="648" y="59" class="xs">TCP handshake</text><line x1="440" y1="65" x2="640" y2="76.0" class="line s-purple" stroke-width="2"/><line x1="640" y1="76.0" x2="440" y2="87" class="line s-purple" stroke-width="2"/><text x="648" y="80" class="xs">TLS handshake</text><line x1="440" y1="90" x2="640" y2="97.0" class="line s-green" stroke-width="2"/><line x1="640" y1="97.0" x2="440" y2="104" class="line s-green" stroke-width="2"/><text x="648" y="101" class="xs">request 1</text><line x1="440" y1="107" x2="640" y2="114.0" class="line s-green" stroke-width="2"/><line x1="640" y1="114.0" x2="440" y2="121" class="line s-green" stroke-width="2"/><text x="648" y="118" class="xs">request 2</text><line x1="440" y1="124" x2="640" y2="131.0" class="line s-green" stroke-width="2"/><line x1="640" y1="131.0" x2="440" y2="138" class="line s-green" stroke-width="2"/><text x="648" y="135" class="xs">request 3</text><line x1="440" y1="141" x2="640" y2="148.0" class="line s-green" stroke-width="2"/><line x1="640" y1="148.0" x2="440" y2="155" class="line s-green" stroke-width="2"/><text x="648" y="152" class="xs">request 4</text><line x1="440" y1="158" x2="640" y2="165.0" class="line s-green" stroke-width="2"/><line x1="640" y1="165.0" x2="440" y2="172" class="line s-green" stroke-width="2"/><text x="648" y="169" class="xs">request 5</text><text x="180" y="312" class="mid lg b f-red">858 ms</text><text x="540" y="312" class="mid lg b f-green">262 ms</text><text x="360" y="334" class="mid xs muted">Real timings: five requests for https://example.org/ from Bob’s MacBook (labs/ch30/httpclient.py keepalive)</text>
</svg>
<figcaption>Every new HTTPS connection costs round trips before the first byte of the request: one for TCP (Chapter 27), and one or more for TLS (Chapter 32). Keeping it open saves them for every request after the first.</figcaption>
</figure>

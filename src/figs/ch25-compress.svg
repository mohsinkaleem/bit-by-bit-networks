<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 112" role="img" aria-label="Compressing an IPv6 address: removing leading zeros, then replacing a run of zero groups with a double colon">
<g data-show="=1"><rect x="40" y="30" width="62" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="71" y="50" class="mid mono b">2001</text><text x="108" y="50" class="mid mono b muted">:</text><rect x="114" y="30" width="62" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="145" y="50" class="mid mono b">0db8</text><text x="182" y="50" class="mid mono b muted">:</text><rect x="188" y="30" width="62" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="219" y="50" class="mid mono b">0000</text><text x="256" y="50" class="mid mono b muted">:</text><rect x="262" y="30" width="62" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="293" y="50" class="mid mono b">0000</text><text x="330" y="50" class="mid mono b muted">:</text><rect x="336" y="30" width="62" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="367" y="50" class="mid mono b">0000</text><text x="404" y="50" class="mid mono b muted">:</text><rect x="410" y="30" width="62" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="441" y="50" class="mid mono b">ff00</text><text x="478" y="50" class="mid mono b muted">:</text><rect x="484" y="30" width="62" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="515" y="50" class="mid mono b">0042</text><text x="552" y="50" class="mid mono b muted">:</text><rect x="558" y="30" width="62" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="589" y="50" class="mid mono b">8329</text></g><g data-show="=2"><rect x="40" y="30" width="62" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="71" y="50" class="mid mono b">2001</text><text x="108" y="50" class="mid mono b muted">:</text><rect x="114" y="30" width="51" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="139.5" y="50" class="mid mono b">db8</text><text x="171" y="50" class="mid mono b muted">:</text><rect x="177" y="30" width="29" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="191.5" y="50" class="mid mono b">0</text><text x="212" y="50" class="mid mono b muted">:</text><rect x="218" y="30" width="29" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="232.5" y="50" class="mid mono b">0</text><text x="253" y="50" class="mid mono b muted">:</text><rect x="259" y="30" width="29" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="273.5" y="50" class="mid mono b">0</text><text x="294" y="50" class="mid mono b muted">:</text><rect x="300" y="30" width="62" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="331" y="50" class="mid mono b">ff00</text><text x="368" y="50" class="mid mono b muted">:</text><rect x="374" y="30" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="394" y="50" class="mid mono b">42</text><text x="420" y="50" class="mid mono b muted">:</text><rect x="426" y="30" width="62" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="457" y="50" class="mid mono b">8329</text></g><g data-show="=3"><text x="40" y="52" class="mono xl b">2001:db8::ff00:42:8329</text></g><g data-show="=1"><text x="40" y="96" class="sm">8 groups of 4 hex digits: 32 digits, 128 bits. Long.</text></g><g data-show="=2"><text x="40" y="96" class="sm">Rule 1: leave out the zeros at the start of each group. A group of 0000 becomes 0.</text></g><g data-show="=3"><text x="40" y="96" class="sm">Rule 2: replace one run of all-zero groups with ::. The reader can work out how many are missing.</text></g>
</svg>
<ol class="steps"><li>An IPv6 address written out in full: eight groups of 16 bits, each written as four hex digits, separated by colons.</li><li>Leading zeros in a group can go, just as you’d write 7 rather than 0007.</li><li>And one run of zero groups can become <code>::</code>. Only one, though: in <code>2001::1::5</code> there’d be no way to tell how many zeros each <code>::</code> stood for. <code>::1</code> is the loopback address (Chapter 20’s 127.0.0.1), and <code>::</code> alone is all zeros.</li></ol>
<figcaption>Two rules make IPv6 addresses shorter to write.</figcaption>
</figure>

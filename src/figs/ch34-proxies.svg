<figure class="fig">
<svg class="dia" viewBox="0 0 720 244" role="img" aria-label="A forward proxy sits in front of users and fetches sites for them; a reverse proxy sits in front of servers and answers for them">
<text x="180" y="22" class="mid sm b">a forward proxy works for the users</text><text x="540" y="22" class="mid sm b">a reverse proxy works for the website</text><line x1="360" y1="10" x2="360" y2="236" class="grid" stroke-dasharray="4 4"/><use href="#alice-head" x="20" y="44" width="44" height="44"/><path d="M68,66 L132,126" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><use href="#bob-head" x="20" y="104" width="44" height="44"/><path d="M68,126 L132,126" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><use href="#carol-head" x="20" y="164" width="44" height="44"/><path d="M68,186 L132,126" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><rect x="136" y="96" width="90" height="60" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="181" y="122" class="mid sm b">proxy</text><text x="181" y="138" class="mid xs muted">the school’s</text><rect x="262" y="52" width="88" height="34" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="306" y="73" class="mid sm b">example.org</text><path d="M228,126 L258,69" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><rect x="262" y="104" width="88" height="34" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="306" y="125" class="mid sm b">bbc.co.uk</text><path d="M228,126 L258,121" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><rect x="262" y="156" width="88" height="34" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="306" y="177" class="mid sm b">wikipedia</text><path d="M228,126 L258,173" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><text x="180" y="214" class="mid xs">It can log, filter and cache for everyone behind it.</text><text x="180" y="230" class="mid xs">The sites see the proxy’s address, not the users’.</text><use href="#cloud" x="376" y="80" width="100" height="60"/><text x="426" y="116" class="mid xs b">everyone</text><path d="M478,112 L526,122" class="line s-muted" stroke-width="1.8" marker-end="url(#ah-muted)"/><rect x="530" y="96" width="90" height="60" rx="8" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="575" y="115" class="mid sm b">reverse</text><text x="575" y="131" class="mid xs muted">proxy</text><text x="575" y="145" class="mid xs muted">(a load balancer)</text><use href="#server" x="660" y="44" width="30" height="48"/><path d="M622,126 L656,68" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><use href="#server" x="660" y="100" width="30" height="48"/><path d="M622,126 L656,124" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><use href="#server" x="660" y="156" width="30" height="48"/><path d="M622,126 L656,180" class="line s-muted" stroke-width="1.6" marker-end="url(#ah-muted)"/><text x="540" y="214" class="mid xs">It can spread the load, end TLS, cache, and hide</text><text x="540" y="230" class="mid xs">the servers. Visitors only ever see the proxy.</text>
</svg>
<figcaption>Two kinds of middleman. They’re the same program in different places: a proxy takes a request, and makes it again, somewhere else.</figcaption>
</figure>

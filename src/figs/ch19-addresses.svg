<figure class="fig">
<svg class="dia" viewBox="0 0 720 282" role="img" aria-label="A Wi-Fi frame from the laptop has three addresses: the access point receiving it, the laptop sending it, and the router it&#x27;s really for. The access point turns it into an Ethernet frame with two.">
<use href="#computer" x="36" y="40" width="68" height="60"/><text x="70" y="118" class="mid sm b">Bob’s laptop</text><text x="70" y="134" class="mid mono xs">e2:5f:b1:3c:77:0a</text><use href="#router" x="322" y="48" width="76" height="50"/><text x="360" y="118" class="mid sm b">access point</text><text x="360" y="134" class="mid mono xs">14:c3:5e:40:0b:38</text><use href="#router" x="612" y="48" width="76" height="50"/><text x="650" y="118" class="mid sm b">router</text><text x="650" y="134" class="mid mono xs">14:c3:5e:40:0b:32</text><path d="M114,58.8 q8.4,11.200000000000001 0,22.400000000000002" class="line s-purple" stroke-width="2" style="opacity:0.6"/><path d="M114,49.2 q15.6,20.8 0,41.6" class="line s-purple" stroke-width="2" style="opacity:0.6"/><path d="M114,39.599999999999994 q22.8,30.400000000000002 0,60.800000000000004" class="line s-purple" stroke-width="2" style="opacity:0.6"/><line x1="400" y1="73" x2="610" y2="73" class="wire" stroke-width="4"/><text x="20" y="170" class="sm b f-purple">In the air: a Wi-Fi frame, “to the network” bit set</text><rect x="20" y="180" width="100" height="46" rx="5" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="70" y="198" class="mid xs b">receiver</text><text x="70" y="216" class="mid mono xs">14:c3:…:0b:38</text><text x="70" y="242" class="mid xs muted">the access point</text><rect x="124" y="180" width="100" height="46" rx="5" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="174" y="198" class="mid xs b">transmitter</text><text x="174" y="216" class="mid mono xs">e2:5f:…:77:0a</text><text x="174" y="242" class="mid xs muted">the laptop</text><rect x="228" y="180" width="100" height="46" rx="5" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="278" y="198" class="mid xs b">destination</text><text x="278" y="216" class="mid mono xs">14:c3:…:0b:32</text><text x="278" y="242" class="mid xs muted">the router</text><rect x="332" y="180" width="60" height="46" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="362" y="208" class="mid xs b">data 🔒</text><text x="430" y="170" class="sm b f-blue">On the cable: an Ethernet frame</text><rect x="430" y="180" width="100" height="46" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="480" y="198" class="mid xs b">to</text><text x="480" y="216" class="mid mono xs">14:c3:…:0b:32</text><text x="480" y="242" class="mid xs muted">the router</text><rect x="534" y="180" width="100" height="46" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="584" y="198" class="mid xs b">from</text><text x="584" y="216" class="mid mono xs">e2:5f:…:77:0a</text><text x="584" y="242" class="mid xs muted">the laptop</text><rect x="638" y="180" width="60" height="46" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="668" y="208" class="mid xs b">data</text><path d="M398,203 L424,203" class="line s-ink" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="376" y="268" class="mid hand">the access point decrypts it, and rewrites the envelope</text>
</svg>
<figcaption>In the air, a frame needs three addresses: the next hop, the sender, and where it’s really going.</figcaption>
</figure>

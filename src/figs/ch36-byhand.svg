<figcaption>Chapter 36’s <code>box.sh</code>: three “containers” plugged into a software switch, with the host as their router and NAT. Docker’s default network is the same picture, with the bridge called <code>docker0</code> and addresses from 172.17.0.0/16.</figcaption>

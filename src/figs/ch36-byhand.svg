<rect x="10" y="10" width="700" height="300" rx="14" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="24" y="30" class="sm b">Grandpa’s Pi: the host</text><rect x="520" y="40" width="170" height="50" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="605" y="60" class="mid sm b">wlan0</text><text x="605" y="78" class="mid xs mono">192.168.1.4</text><path d="M690,65 L712,65" class="line s-blue" stroke-width="3"/><rect x="300" y="40" width="190" height="50" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="395" y="60" class="mid xs b">routing + NAT (nftables)</text><text x="395" y="78" class="mid xs mono">masquerade · 8036 → web:80</text><path d="M490,65 L520,65" class="line s-ink" stroke-width="2"/><rect x="40" y="110" width="640" height="40" rx="8" class="t-teal" stroke="var(--teal)" stroke-width="1.6"/><text x="360" y="134" class="mid sm b">br36: a software switch · the host is 10.36.0.1 on it</text><path d="M395,90 L395,110" class="line s-ink" stroke-width="2"/><path d="M140,150 L140,212" class="line s-muted" stroke-width="3"/><text x="148" y="186" class="xs mono muted">veth-web</text><rect x="70" y="212" width="150" height="84" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="145" y="234" class="mid xs b">namespace “web”</text><text x="145" y="256" class="mid xs mono">eth0 10.36.0.2</text><text x="145" y="274" class="mid xs mono muted">default via 10.36.0.1</text><path d="M350,150 L350,212" class="line s-muted" stroke-width="3"/><text x="358" y="186" class="xs mono muted">veth-db</text><rect x="280" y="212" width="150" height="84" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="1.6"/><text x="355" y="234" class="mid xs b">namespace “db”</text><text x="355" y="256" class="mid xs mono">eth0 10.36.0.3</text><text x="355" y="274" class="mid xs mono muted">default via 10.36.0.1</text><path d="M560,150 L560,212" class="line s-muted" stroke-width="3"/><text x="568" y=
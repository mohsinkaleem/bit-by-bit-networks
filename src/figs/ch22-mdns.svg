<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 234" role="img" aria-label="A laptop multicasting a question for raspberrypi.local to every device on the network, and the Pi answering">
<rect x="140" y="30" width="440" height="190" rx="14" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="360" y="50" class="mid sm b">Bob’s home network</text><use href="#computer" x="196" y="78" width="48" height="43"/><text x="220" y="134" class="mid xs b">Bob’s laptop</text><use href="#computer" x="476" y="78" width="48" height="43"/><text x="500" y="134" class="mid xs b">Grandpa’s Pi</text><use href="#computer" x="196" y="158" width="48" height="43"/><text x="220" y="214" class="mid xs b">the printer</text><use href="#computer" x="476" y="158" width="48" height="43"/><text x="500" y="214" class="mid xs b">the TV</text><g data-show="1"><circle cx="220" cy="100" r="60" class="f-none s-orange" stroke-width="2" stroke-dasharray="5 4"/><circle cx="220" cy="100" r="110" class="f-none s-orange" stroke-width="1.5" stroke-dasharray="5 4" style="opacity:0.6"/><text x="40" y="96" class="xs b f-orange">to 224.0.0.251:</text><text x="40" y="110" class="xs b f-orange">“who is</text><text x="40" y="124" class="xs b f-orange">raspberrypi.local?”</text></g><g data-show="2"><path d="M470,108 C400,140 300,140 250,110" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><text x="600" y="96" class="xs b f-green">“that’s me:</text><text x="600" y="110" class="xs b f-green">192.168.1.4”</text></g>
</svg>
<ol class="steps"><li>Bob types <code>ssh raspberrypi.local</code>. Names ending in <code>.local</code> aren’t looked up in DNS: his laptop sends the question to the multicast address 224.0.0.251, UDP port 5353, which every device on the network listens to.</li><li>The Pi recognizes its own name and answers. No name server was involved, and nobody had to configure anything.</li></ol>
<figcaption>Multicast DNS: ask everyone, and let the right one answer.</figcaption>
</figure>

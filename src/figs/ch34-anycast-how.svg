<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 300" role="img" aria-label="Anycast: three sites announce the same address block; people reach the nearest one; when one fails, its people move to another">
<use href="#server" x="106" y="128" width="28" height="44"/><text x="120" y="188" class="mid xs b">site A</text><text x="120" y="202" class="mid xs mono muted">announces 1.1.1.0/24</text><use href="#server" x="346" y="38" width="28" height="44"/><text x="360" y="98" class="mid xs b">site B</text><text x="360" y="112" class="mid xs mono muted">announces 1.1.1.0/24</text><use href="#server" x="586" y="128" width="28" height="44"/><text x="600" y="188" class="mid xs b">site C</text><text x="600" y="202" class="mid xs mono muted">announces 1.1.1.0/24</text><circle cx="60" cy="250" r="7" class="f-ink"/><g data-show="=2"><path d="M60,242 L120,208" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><g data-show="=3"><path d="M60,242 L120,208" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><circle cx="330" cy="250" r="7" class="f-ink"/><g data-show="=2"><path d="M330,242 L360,118" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><g data-show="=3"><path d="M330,242 L120,208" class="line s-orange" stroke-width="1.8" marker-end="url(#ah-orange)"/></g><circle cx="660" cy="250" r="7" class="f-ink"/><g data-show="=2"><path d="M660,242 L600,208" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><g data-show="=3"><path d="M660,242 L600,208" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><circle cx="240" cy="250" r="7" class="f-ink"/><g data-show="=2"><path d="M240,242 L120,208" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><g data-show="=3"><path d="M240,242 L120,208" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><circle cx="470" cy="250" r="7" class="f-ink"/><g data-show="=2"><path d="M470,242 L360,118" class="line s-green" stroke-width="1.8" marker-end="url(#ah-green)"/></g><g data-show="=3"><path d="M470,242 L120,208" class="line s-orange" stroke-width="1.8" marker-end="url(#ah-orange)"/></g><g data-show="3"><path d="M340,40 l40,40 M380,40 l-40,40" class="line s-red" stroke-width="4"/></g><text x="360" y="290" class="mid xs muted">people (and their resolvers) in different places</text>
</svg>
<ol class="steps"><li>Three sites, far apart, all announce the same block of addresses with BGP (Chapter 24). To the internet’s routers, they look like three routes to the same place.</li><li>Each network picks its best route, usually the shortest AS path, so each person reaches the site nearest to them, in network terms. Nobody’s computer does anything special: the address is the same everywhere.</li><li>If a site fails, it stops announcing, and within seconds BGP sends its people to the next best site. The same trick spreads out attacks: a flood aimed at the address lands on hundreds of sites at once.</li></ol>
<figcaption><strong>Anycast</strong>: one address, many places.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 218" role="img" aria-label="The four fields of a UDP header: source port, destination port, length and checksum, followed by the data">
<rect x="40" y="20" width="310" height="44" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="52" y="38" class="xs b">source port</text><text x="52" y="55" class="xs muted">which socket it came from</text><text x="338" y="48" class="end mono sm b">50123</text><rect x="360" y="20" width="310" height="44" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="372" y="38" class="xs b">destination port</text><text x="372" y="55" class="xs muted">which socket it’s for</text><text x="658" y="48" class="end mono sm b">123</text><rect x="40" y="80" width="310" height="44" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="52" y="98" class="xs b">length</text><text x="52" y="115" class="xs muted">header + data, in bytes</text><text x="338" y="108" class="end mono sm b">56</text><rect x="360" y="80" width="310" height="44" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="372" y="98" class="xs b">checksum</text><text x="372" y="115" class="xs muted">covers the header, data and addresses</text><text x="658" y="108" class="end mono sm b">0x0862</text><rect x="40" y="140" width="630" height="44" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="355" y="167" class="mid xs b">the data: 48 bytes of NTP request</text><text x="355" y="206" class="mid sm">That’s all of it: 8 bytes. Everything else is up to the program.</text>
</svg>
<figcaption>A simple NTP request from Bob’s MacBook (192.168.1.3) to time.apple.com, with its real checksum. Compare TCP’s header in Chapter 27.</figcaption>
</figure>

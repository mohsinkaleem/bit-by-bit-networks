<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 330" role="img" aria-label="Autonomous systems connected as customers, providers and peers, with the rules for which routes each one passes on">
<line x1="200" y1="70" x2="200" y2="140" class="line s-muted" stroke-width="2.5"/><line x1="520" y1="70" x2="520" y2="140" class="line s-muted" stroke-width="2.5"/><line x1="200" y1="70" x2="520" y2="140" class="line s-muted" stroke-width="2.5"/><line x1="200" y1="180" x2="110" y2="250" class="line s-muted" stroke-width="2.5"/><line x1="200" y1="180" x2="360" y2="250" class="line s-muted" stroke-width="2.5"/><line x1="520" y1="180" x2="360" y2="250" class="line s-muted" stroke-width="2.5"/><line x1="520" y1="180" x2="610" y2="250" class="line s-muted" stroke-width="2.5"/><line x1="255" y1="50" x2="465" y2="50" class="line s-muted dash" stroke-width="2.5"/><line x1="255" y1="160" x2="465" y2="160" class="line s-muted dash" stroke-width="2.5"/><rect x="145" y="30" width="110" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="200" y="48" class="mid xs b">Tier 1 West</text><text x="200" y="63" class="mid mono xs muted">AS64500</text><rect x="465" y="30" width="110" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="520" y="48" class="mid xs b">Tier 1 East</text><text x="520" y="63" class="mid mono xs muted">AS64501</text><rect x="145" y="140" width="110" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="200" y="158" class="mid xs b">Northnet</text><text x="200" y="173" class="mid mono xs muted">AS64510</text><rect x="465" y="140" width="110" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="520" y="158" class="mid xs b">Southnet</text><text x="520" y="173" class="mid mono xs muted">AS64530</text><rect x="55" y="250" width="110" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="110" y="268" class="mid xs b">University</text><text x="110" y="283" class="mid mono xs muted">AS65001</text><rect x="305" y="250" width="110" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="360" y="268" class="mid xs b">Bob’s ISP</text><text x="360" y="283" class="mid mono xs muted">AS65002</text><rect x="555" y="250" width="110" height="40" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.8"/><text x="610" y="268" class="mid xs b">a shop</text><text x="610" y="283" class="mid mono xs muted">AS65088</text><g data-show="=1"><text x="208" y="109" class="xs b f-orange halo">£ ↑</text><text x="528" y="109" class="xs b f-orange halo">£ ↑</text><text x="368" y="109" class="xs b f-orange halo">£ ↑</text><text x="163" y="219" class="xs b f-orange halo">£ ↑</text><text x="288" y="219" class="xs b f-orange halo">£ ↑</text><text x="448" y="219" class="xs b f-orange halo">£ ↑</text><text x="573" y="219" class="xs b f-orange halo">£ ↑</text><text x="360" y="44" class="mid xs b f-green halo">peers: nobody pays</text><text x="360" y="154" class="mid xs b f-green halo">peers</text></g><g data-show="=2"><line x1="180" y1="140" x2="180" y2="80" class="line s-green" stroke-width="3.5" marker-end="url(#ah-green)"/><text x="18" y="108" class="xs b halo" style="fill:var(--green)">the university’s route: to everyone</text><line x1="262" y1="168" x2="450" y2="168" class="line s-green" stroke-width="3.5" marker-end="url(#ah-green)"/><line x1="170" y1="182" x2="118" y2="244" class="line s-blue" stroke-width="3.5" marker-end="url(#ah-blue)"/><line x1="214" y1="182" x2="330" y2="250" class="line s-blue" stroke-width="3.5" marker-end="url(#ah-blue)"/><text x="238" y="222" class="xs b halo" style="fill:var(--blue)">everything, to customers</text></g><g data-show="=3"><line x1="250" y1="150" x2="450" y2="150" class="line s-red" stroke-width="3.5" marker-end="url(#ah-red)"/><text x="356" y="140" class="mid xs b f-red halo">✗ Southnet’s routes to Southnet? no</text><line x1="200" y1="138" x2="200" y2="76" class="line s-red" stroke-width="3.5" marker-end="url(#ah-red)"/><text x="210" y="108" class="xs b f-red halo">✗ peers’ and providers’ routes go up? no</text></g><g data-show="=4"><path d="M520,180 C520,230 420,262 404,262" class="line s-orange" stroke-width="3.5" marker-end="url(#ah-orange)"/><path d="M318,262 C260,250 220,220 214,186" class="line s-orange" stroke-width="3.5" marker-end="url(#ah-orange)"/><text x="360" y="318" class="mid xs b f-orange">If Bob’s ISP passed Southnet’s routes to Northnet, it would carry their traffic, and pay both of them to do it.</text></g>
</svg>
<ol class="steps"><li>The internet is about 88,000 networks, each run by one organization and called an <strong>autonomous system</strong> (AS), with a number. Most of them buy their connection to the rest of the internet from bigger ones: the customer pays the provider, for “transit”, and the money flows upward. At the top are a dozen or so <strong>tier 1</strong> networks, who pay nobody.</li><li>Northnet tells <em>everyone</em> about its own customers’ addresses: its providers, its peers and its other customers. That’s what its customers pay it for: to be reachable. And it tells its customers about everything it knows, because they pay for that too.</li><li>But it doesn’t tell its providers or its peers about routes it learned from <em>other</em> providers or peers. If it told Southnet “you can reach Tier 1 West through me”, it would end up carrying traffic between two networks that pay it nothing.</li><li>A customer with two providers mustn’t pass routes from one to the other, either. That’s a <strong>route leak</strong>, and it’s one of the most common ways the internet breaks. These two rules, choose customers first and don’t carry traffic for free, are what keep BGP stable, and nobody wrote them into the protocol: they’re just money.</li></ol>
<figcaption>Customers, providers and peers: who pays, and who hears what.</figcaption>
</figure>

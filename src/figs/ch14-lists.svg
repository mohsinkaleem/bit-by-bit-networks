x="392" y="148" class="mono xs">newsletter</text><text x="512" y="148" class="end mono xs b">2.7</text><text x="392" y="172" class="mono xs">bob</text><text x="512" y="172" class="end mono xs b">1.2</text><use href="#dave-head" x="610" y="8" width="44" height="44"/><text x="632" y="66" class="mid sm b">Dave’s list</text><rect x="560" y="76" width="144" height="116" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="572" y="100" class="mono xs f-red">otto</text><text x="692" y="100" class="end mono xs b f-red">4.2</text><line x1="568" y1="96" x2="696" y2="96" class="line s-red" stroke-width="2"/><text x="572" y="124" class="mono xs">library</text><text x="692" y="124" class="end mono xs b">3.1</text><text x="572" y="148" class="mono xs">newsletter</text><text x="692" y="148" class="end mono xs b">2.7</text><text x="572" y="172" class="mono xs">bob</text><text x="692" y="172" class="end mono xs b">1.2</text><text x="360" y="226" class="mid hand f-red">Otto’s town renumbers him to 4.9, and every list in town is wrong at once.</text>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 240" role="img" aria-label="Explicit congestion notification: a router marks a packet instead of dropping it, the receiver echoes the mark, and the sender slows down">
<use href="#computer" x="50" y="40" width="60" height="54"/><text x="80" y="110" class="mid xs b">sender</text><use href="#router" x="320" y="48" width="80" height="50"/><text x="360" y="110" class="mid xs b">a busy router</text><use href="#computer" x="610" y="40" width="60" height="54"/><text x="640" y="110" class="mid xs b">receiver</text><rect x="316" y="120" width="10" height="16" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="330" y="120" width="10" height="16" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="344" y="120" width="10" height="16" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="358" y="120" width="10" height="16" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="372" y="120" width="10" height="16" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="386" y="120" width="10" height="16" rx="2" class="t-blue" stroke="var(--blue)"/><text x="360" y="152" class="mid xs muted">queue getting long</text><g data-show="=1"><rect x="164" y="170" width="112" height="24" rx="5" class="t-green" stroke="var(--line)"/><text x="220" y="186" class="mid mono xs b">IP: ECT (“I can do ECN”)</text></g><g data-show="=2"><rect x="444" y="170" width="112" height="24" rx="5" class="t-orange" stroke="var(--line)"/><text x="500" y="186" class="mid mono xs b">IP: CE (“congestion!”)</text></g><g data-show="=3"><rect x="304" y="206" width="112" height="24" rx="5" class="t-orange" stroke="var(--line)"/><text x="360" y="222" class="mid mono xs b">TCP ACK: ECE (“echo: congestion”)</text></g><g data-show="=4"><rect x="164" y="206" width="112" height="24" rx="5" class="t-green" stroke="var(--line)"/><text x="220" y="222" class="mid mono xs b">TCP: CWR (“I’ve slowed down”)</text></g><g data-show="=1"><path d="M110,60 L318,60" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/></g><g data-show="=2"><path d="M402,60 L608,60" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/></g><g data-show="=3"><path d="M608,86 L112,86" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/></g><g data-show="=4"><path d="M110,60 L318,60" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/></g>
</svg>
<ol class="steps"><li>Both ends agreed, in the handshake, to use <strong>explicit congestion notification</strong>. The sender marks its packets “ECN-capable” with two spare bits in the IP header.</li><li>A router whose queue is getting long doesn’t drop the packet. It changes the mark to “congestion experienced”, and forwards it.</li><li>The receiver tells the sender, by setting the ECE flag in its acknowledgements.</li><li>The sender slows down exactly as if a packet had been lost, and sets CWR to say so. The difference: nothing was lost, nothing had to be sent again, and nobody waited for a timeout.</li></ol>
<figcaption>ECN: congestion signalled with a mark instead of a loss.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 284" role="img" aria-label="An 802.1Q VLAN tag of four bytes inserted between the source address and the type field, and its bit fields">
<text x="14" y="24" class="sm b">An ordinary frame, and the same frame with an 802.1Q tag</text><rect x="14.0" y="40" width="90.0" height="44" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="59" y="60" class="mid sm b">to</text><text x="59" y="76" class="mid xs muted">6</text><rect x="108.0" y="40" width="90.0" height="44" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="153" y="60" class="mid sm b">from</text><text x="153" y="76" class="mid xs muted">6</text><rect x="202.0" y="40" width="70.0" height="44" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="237" y="60" class="mid sm b">type</text><text x="237" y="76" class="mid xs muted">0800</text><rect x="276.0" y="40" width="300.0" height="44" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="426" y="60" class="mid sm b">data</text><text x="426" y="76" class="mid xs muted"></text><rect x="580.0" y="40" width="60.0" height="44" rx="5" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="610" y="60" class="mid sm b">check</text><text x="610" y="76" class="mid xs muted"></text><rect x="14.0" y="116" width="90.0" height="44" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="59" y="136" class="mid sm b">to</text><text x="59" y="152" class="mid xs muted">6</text><rect x="108.0" y="116" width="90.0" height="44" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="153" y="136" class="mid sm b">from</text><text x="153" y="152" class="mid xs muted">6</text><rect x="202.0" y="116" width="120.0" height="44" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="262" y="136" class="mid sm b">tag</text><text x="262" y="152" class="mid xs muted">8100 · VLAN 20</text><rect x="326.0" y="116" width="70.0" height="44" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="361" y="136" class="mid sm b">type</text><text x="361" y="152" class="mid xs muted">0800</text><rect x="400.0" y="116" width="230.0" height="44" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="515" y="136" class="mid sm b">data</text><text x="515" y="152" class="mid xs muted"></text><rect x="634.0" y="116" width="60.0" height="44" rx="5" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="664" y="136" class="mid sm b">check</text><text x="664" y="152" class="mid xs muted">new!</text><path d="M202,160 L30,206 M322,160 L698,206" class="line s-orange" stroke-width="1.2" style="opacity:0.7"/><rect x="30.0" y="206" width="256.0" height="44" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="158" y="226" class="mid sm b">TPID: 0x8100</text><text x="158" y="242" class="mid xs muted">16 bits</text><text x="158" y="268" class="mid xs">“a tag follows”</text><rect x="290.0" y="206" width="60.0" height="44" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="320" y="226" class="mid sm b">PCP</text><text x="320" y="242" class="mid xs muted">3</text><text x="320" y="268" class="mid xs">priority 0–7</text><rect x="354.0" y="206" width="40.0" height="44" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="374" y="226" class="mid sm b">DEI</text><text x="374" y="242" class="mid xs muted">1</text><rect x="398.0" y="206" width="300.0" height="44" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="548" y="226" class="mid sm b">VID: 000000010100</text><text x="548" y="242" class="mid xs muted">12 bits = 20</text><text x="548" y="268" class="mid xs">the VLAN number: 1 to 4094</text>
</svg>
<figcaption>A VLAN tag: four bytes squeezed in after the addresses. Old equipment sees type 8100, doesn’t understand it, and leaves the frame alone.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 200" role="img" aria-label="A VXLAN packet from the lab capture: outer Ethernet, IP and UDP to port 4789, an 8-byte VXLAN header with VNI 42, then an inner Ethernet frame">
<rect x="20" y="34" width="64.4" height="46" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.4"/><text x="52.2" y="55" class="mid xs b">Ethernet</text><text x="52.2" y="69" class="mid xs muted">outer</text><text x="52.2" y="96" class="mid xs muted">14</text><rect x="84.4" y="34" width="92" height="46" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.4"/><text x="130.4" y="55" class="mid xs b">IP</text><text x="130.4" y="69" class="mid xs muted">192.0.2.1 → .2</text><text x="130.4" y="96" class="mid xs muted">20</text><rect x="176.4" y="34" width="36.8" height="46" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.4"/><text x="194.8" y="55" class="mid xs b">UDP</text><text x="194.8" y="69" class="mid xs muted">→ 4789</text><text x="194.8" y="96" class="mid xs muted">8</text><rect x="213.2" y="34" width="36.8" height="46" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.4"/><text x="231.6" y="55" class="mid xs b">VXLAN</text><text x="231.6" y="69" class="mid xs muted">VNI 42</text><text x="231.6" y="96" class="mid xs muted">8</text><rect x="250" y="34" width="64.4" height="46" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="282.2" y="55" class="mid xs b">Ethernet</text><text x="282.2" y="69" class="mid xs muted">inner MACs</text><text x="282.2" y="96" class="mid xs muted">14</text><rect x="314.4" y="34" width="92" height="46" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="360.4" y="55" class="mid xs b">IP</text><text x="360.4" y="69" class="mid xs muted">10.99.0.1 → .2</text><text x="360.4" y="96" class="mid xs muted">20</text><rect x="406.4" y="34" width="294.4" height="46" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="553.6" y="61" class="mid xs b">ICMP echo request</text><text x="553.6" y="96" class="mid xs muted">64</text><text x="20" y="22" class="xs b">One ping through Chapter 35’s VXLAN tunnel, as tshark decoded it on the “internet” between the two namespaces: 148 bytes</text><path d="M20,110 L250,110" class="line s-blue" stroke-width="2"/><text x="135" y="126" class="mid xs b f-blue">the 50 bytes VXLAN adds</text><path d="M250,110 L700.8,110" class="line s-green" stroke-width="2"/><text x="475.4" y="126" class="mid xs b f-green">a complete Ethernet frame: the network the machines think they’re on</text><text x="20" y="156" class="xs">A VXLAN tunnel acts like a switch port: it learns which MAC addresses live at which far end (bridge fdb), and floods</text><text x="20" y="172" class="xs">the rest, ARP included. The 24-bit network identifier allows 16 million separate networks over the same wires,</text><text x="20" y="188" class="xs">where VLAN tags (Chapter 18) allowed 4,094: enough for a data centre where every customer gets their own.</text>
</svg>
<figcaption>VXLAN: a whole Ethernet frame, inside UDP. Kubernetes networks and cloud providers’ virtual networks are often built this way (Chapter 36).</figcaption>
</figure>

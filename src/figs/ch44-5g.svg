<figure class="fig">
<svg class="dia" viewBox="0 0 720 306" role="img" aria-label="5G: a phone talks to a base station that aims radio beams, which connects to a core network made of software functions, and on to the internet; slices share it all">
<rect x="14" y="110" width="70" height="40" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="49" y="135" class="mid xs b">phone</text><path d="M180,70 L180,180" class="line s-ink" stroke-width="4"/><rect x="166" y="60" width="28" height="36" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><path d="M166,78 Q126.0,93.5 86,133 Q126.0,113.5 166,82 Z" class="t-blue" opacity="0.35"/><path d="M166,78 Q121.0,111.0 76,168 Q121.0,131.0 166,82 Z" class="t-blue" opacity="0.9"/><path d="M166,78 Q131.0,128.5 96,203 Q131.0,148.5 166,82 Z" class="t-blue" opacity="0.35"/><text x="180" y="200" class="mid xs b">base station</text><text x="180" y="214" class="mid xs">(gNB): beams aimed</text><text x="180" y="228" class="mid xs">at each phone</text><path d="M196,80 L262,80" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="266" y="30" width="250" height="170" rx="12" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="391" y="50" class="mid xs b">the core: software, on ordinary servers</text><rect x="282" y="64" width="218" height="34" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="294" y="85" class="xs b">AMF</text><text x="334" y="85" class="xs">who you are, where you are</text><rect x="282" y="106" width="218" height="34" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="294" y="127" class="xs b">SMF</text><text x="334" y="127" class="xs">sets up your data sessions</text><rect x="282" y="148" width="218" height="34" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="294" y="169" class="xs b">UPF</text><text x="334" y="169" class="xs">the packets themselves: a router</text><path d="M516,162 L580,162" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><rect x="584" y="138" width="124" height="48" rx="8" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="646" y="158" class="mid xs b">the internet,</text><text x="646" y="174" class="mid xs">or a server nearby</text><text x="14" y="262" class="xs b">network slices: one set of antennas and servers, run as separate networks with different promises</text><rect x="14" y="272" width="222" height="26" rx="6" class="t-blue" stroke="none" stroke-width="0"/><text x="125" y="289" class="mid xs">phones and video: fast</text><rect x="248" y="272" width="222" height="26" rx="6" class="t-orange" stroke="none" stroke-width="0"/><text x="359" y="289" class="mid xs">a factory’s robots: quick and certain</text><rect x="482" y="272" width="222" height="26" rx="6" class="t-green" stroke="none" stroke-width="0"/><text x="593" y="289" class="mid xs">thousands of meters: cheap</text>
</svg>
<figcaption>5G, from the network’s point of view. The radio got cleverer; the big change is behind it, where the specialised boxes of older mobile networks became programs, run the way a cloud runs anything else (Chapter 39).</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 322" role="img" aria-label="Packets arriving at Otto&#x27;s computer are sorted into numbered ports, one per program">
<rect x="300" y="26" width="406" height="262" rx="16" class="f-card" stroke="var(--ink)" stroke-width="2"/><text x="503" y="50" class="mid slab b">Otto’s computer, 4.2</text><rect x="318" y="66" width="104" height="206" rx="10" class="t-teal" stroke="var(--teal)" stroke-width="2"/><text x="370" y="162" class="mid sm b">operating</text><text x="370" y="180" class="mid sm b">system</text><text x="370" y="202" class="mid xs muted">(the mailroom)</text><rect x="530" y="88" width="160" height="46" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="610" y="117" class="mid slab b">chat</text><rect x="470" y="95" width="50" height="32" rx="6" class="f-surface" stroke="var(--ink)" stroke-width="2"/><text x="495" y="117" class="mid mono b">7</text><line x1="422" y1="111" x2="466" y2="111" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><rect x="530" y="152" width="160" height="46" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="610" y="181" class="mid slab b">chess</text><rect x="470" y="159" width="50" height="32" rx="6" class="f-surface" stroke="var(--ink)" stroke-width="2"/><text x="495" y="181" class="mid mono b">64</text><line x1="422" y1="175" x2="466" y2="175" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><rect x="530" y="216" width="160" height="46" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="610" y="245" class="mid slab b">clock</text><rect x="470" y="223" width="50" height="32" rx="6" class="f-surface" stroke="var(--ink)" stroke-width="2"/><text x="495" y="245" class="mid mono b">123</text><line x1="422" y1="239" x2="466" y2="239" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="495" y="276" class="mid hand">ports</text><rect x="40" y="70" width="150" height="40" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><path d="M40,70 L115.0,90 L190,70" class="line" style="stroke:var(--yellow)" stroke-width="1.5"/><text x="115" y="104" class="mid mono xs b">to port 64</text><line x1="196" y1="90" x2="312" y2="100" class="line" style="stroke:var(--green)" stroke-width="2.5" marker-end="url(#ah-muted)"/><rect x="40" y="130" width="150" height="40" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><path d="M40,130 L115.0,150 L190,130" class="line" style="stroke:var(--yellow)" stroke-width="1.5"/><text x="115" y="164" class="mid mono xs b">to port 7</text><line x1="196" y1="150" x2="312" y2="160" class="line" style="stroke:var(--blue)" stroke-width="2.5" marker-end="url(#ah-muted)"/><rect x="40" y="190" width="150" height="40" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><path d="M40,190 L115.0,210 L190,190" class="line" style="stroke:var(--yellow)" stroke-width="1.5"/><text x="115" y="224" class="mid mono xs b">to port 123</text><line x1="196" y1="210" x2="312" y2="220" class="line" style="stroke:var(--purple)" stroke-width="2.5" marker-end="url(#ah-muted)"/><rect x="40" y="250" width="150" height="40" rx="5" class="t-red" stroke="var(--red)" stroke-width="2"/><path d="M40,250 L115.0,270 L190,250" class="line" style="stroke:var(--red)" stroke-width="1.5"/><text x="115" y="284" class="mid mono xs b">to port 99</text><line x1="196" y1="266" x2="312" y2="256" class="line s-red" stroke-width="2.5" marker-end="url(#ah-red)"/><path d="M318,250 C260,300 210,300 196,284" class="line s-red dash" stroke-width="2" marker-end="url(#ah-red)"/><text x="250" y="312" class="mid hand f-red">“nobody home at port 99”</text><text x="118" y="52" class="mid sm muted">Arriving packets</text>
</svg>
<figcaption>Every program gets a numbered mailbox. The operating system reads the number and delivers to the right one.</figcaption>
</figure>

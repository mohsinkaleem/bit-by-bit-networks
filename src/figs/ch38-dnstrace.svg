<figure class="fig">
<svg class="dia" viewBox="0 0 720 296" role="img" aria-label="A traceroute of DNS questions: for example.org the question reaches Google&#x27;s server; for example.com it vanishes after the first hop">
<text x="20" y="22" class="xs b">A DNS question, sent with a time-to-live of 1, 2, 3…, from Grandpa’s Pi to 8.8.8.8</text><text x="185" y="44" class="mid xs b">hop 1</text><text x="185" y="58" class="mid xs mono">192.168.1.1</text><text x="255" y="44" class="mid xs b">hop 2</text><text x="255" y="72" class="mid xs mono muted">(silent)</text><text x="325" y="44" class="mid xs b">hop 3</text><text x="325" y="58" class="mid xs mono">203.0.113.9</text><text x="395" y="44" class="mid xs b">hop 4</text><text x="395" y="72" class="mid xs mono muted">(silent)</text><text x="465" y="44" class="mid xs b">hop 5</text><text x="465" y="58" class="mid xs mono">142.250.172.12</text><text x="535" y="44" class="mid xs b">hop 6</text><text x="535" y="72" class="mid xs mono">192.178.121.31</text><text x="605" y="44" class="mid xs b">hop 7</text><text x="605" y="58" class="mid xs mono">142.251.55.41</text><text x="675" y="44" class="mid xs b">hop 8</text><text x="675" y="72" class="mid xs mono">8.8.8.8</text><text x="20" y="114" class="sm b">example.org</text><rect x="158" y="90" width="54" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="185" y="115" class="mid xs b">expired</text><rect x="228" y="90" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="255" y="115" class="mid xs b">…</text><rect x="298" y="90" width="54" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="325" y="115" class="mid xs b">expired</text><rect x="368" y="90" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="395" y="115" class="mid xs b">…</text><rect x="438" y="90" width="54" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="465" y="115" class="mid xs b">expired</text><rect x="508" y="90" width="54" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="535" y="115" class="mid xs b">expired</text><rect x="578" y="90" width="54" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="605" y="115" class="mid xs b">expired</text><rect x="648" y="90" width="54" height="40" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.4"/><text x="675" y="115" class="mid xs b">ANSWER</text><text x="20" y="170" class="sm b">example.com</text><rect x="158" y="146" width="54" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.4"/><text x="185" y="171" class="mid xs b">expired</text><rect x="228" y="146" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="255" y="171" class="mid xs b">…</text><rect x="298" y="146" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="325" y="171" class="mid xs b">…</text><rect x="368" y="146" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="395" y="171" class="mid xs b">…</text><rect x="438" y="146" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="465" y="171" class="mid xs b">…</text><rect x="508" y="146" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="535" y="171" class="mid xs b">…</text><rect x="578" y="146" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="605" y="171" class="mid xs b">…</text><rect x="648" y="146" width="54" height="40" rx="6" class="f-surface" stroke="var(--line)" stroke-width="1.4"/><text x="675" y="171" class="mid xs b">…</text><path d="M158,206 L158,212 L290,212 L290,206" class="line s-red" stroke-width="2"/><text x="224" y="228" class="mid xs b f-red">it dies somewhere in here</text><text x="20" y="252" class="xs">Hop 2 never answers anyone (plenty of routers don’t), but hop 3 does, for example.org. For example.com, nothing ever</text><text x="20" y="268" class="xs">comes back from hop 3 or beyond: the question never gets there. So it’s dropped by the home router, or by the internet</text><text x="20" y="284" class="xs">provider’s first box: that’s where to look next.</text>
</svg>
<figcaption>A real mystery from Bob’s home network, narrowed down with <code>dnstrace.py</code>. (The provider’s router address is replaced with a documentation address.)</figcaption>
</figure>

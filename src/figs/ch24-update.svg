<figure class="fig">
<svg class="dia" viewBox="0 0 720 232" role="img" aria-label="The 46 bytes of a real BGP UPDATE announcing 10.1.0.0/16 with AS path 65001, field by field">
<rect x="14" y="40" width="117" height="30" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="72.5" y="60" class="mid mono xs b">ff ff … ff</text><text x="72.5" y="32" class="mid xs b">marker</text><text x="72.5" y="88" class="mid xs muted">16 bytes of ff</text><rect x="140" y="40" width="75" height="30" rx="5" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="167" y="60" class="mid mono xs b">00</text><text x="188" y="60" class="mid mono xs b">2e</text><text x="177.5" y="32" class="mid xs b">length</text><text x="177.5" y="88" class="mid xs muted">46 bytes</text><rect x="224" y="40" width="75" height="30" rx="5" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="261.5" y="60" class="mid mono xs b">02</text><text x="261.5" y="32" class="mid xs b">type</text><text x="261.5" y="88" class="mid xs muted">2 = UPDATE</text><rect x="308" y="40" width="75" height="30" rx="5" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="335" y="60" class="mid mono xs b">00</text><text x="356" y="60" class="mid mono xs b">00</text><text x="345.5" y="32" class="mid xs b">withdrawn</text><text x="345.5" y="88" class="mid xs muted">none</text><rect x="392" y="40" width="75" height="30" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="419" y="60" class="mid mono xs b">00</text><text x="440" y="60" class="mid mono xs b">14</text><text x="429.5" y="32" class="mid xs b">attributes</text><text x="429.5" y="88" class="mid xs muted">20 bytes</text><rect x="476" y="40" width="81" height="30" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="485" y="60" class="mid mono xs b">40</text><text x="506" y="60" class="mid mono xs b">01</text><text x="527" y="60" class="mid mono xs b">01</text><text x="548" y="60" class="mid mono xs b">00</text><text x="516.5" y="32" class="mid xs b">ORIGIN</text><text x="516.5" y="88" class="mid xs muted">IGP</text><rect x="14" y="138" width="186" height="30" rx="5" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="23" y="158" class="mid mono xs b">40</text><text x="44" y="158" class="mid mono xs b">02</text><text x="65" y="158" class="mid mono xs b">06</text><text x="86" y="158" class="mid mono xs b">02</text><text x="107" y="158" class="mid mono xs b">01</text><text x="128" y="158" class="mid mono xs b">00</text><text x="149" y="158" class="mid mono xs b">00</text><text x="170" y="158" class="mid mono xs b">fd</text><text x="191" y="158" class="mid mono xs b">e9</text><text x="107" y="130" class="mid xs b">AS_PATH</text><text x="107" y="186" class="mid xs muted">a sequence of 1: 65001</text><rect x="209" y="138" width="144" height="30" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="218" y="158" class="mid mono xs b">40</text><text x="239" y="158" class="mid mono xs b">03</text><text x="260" y="158" class="mid mono xs b">04</text><text x="281" y="158" class="mid mono xs b">0a</text><text x="302" y="158" class="mid mono xs b">00</text><text x="323" y="158" class="mid mono xs b">01</text><text x="344" y="158" class="mid mono xs b">01</text><text x="281" y="130" class="mid xs b">NEXT_HOP</text><text x="281" y="186" class="mid xs muted">10.0.1.1</text><rect x="362" y="138" width="75" height="30" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="378.5" y="158" class="mid mono xs b">10</text><text x="399.5" y="158" class="mid mono xs b">0a</text><text x="420.5" y="158" class="mid mono xs b">01</text><text x="399.5" y="130" class="mid xs b">routes (NLRI)</text><text x="399.5" y="186" class="mid xs muted">/16: 10.1</text><text x="14" y="218" class="xs">Each attribute is: flags (40 = “every router must understand this, and pass it on”), a type number, a length, then the value.</text>
</svg>
<figcaption>The university’s announcement, from <code>bgp_speaker.py --hex</code>: a whole route in 46 bytes.</figcaption>

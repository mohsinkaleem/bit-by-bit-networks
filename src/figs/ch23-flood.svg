ss="mid xs b halo">lab</text><use href="#router" x="552" y="52" width="56" height="36"/><text x="580" y="104" class="mid xs b halo">dorms</text><use href="#router" x="552" y="212" width="56" height="36"/><text x="580" y="264" class="mid xs b halo">sports</text><g data-show="1-4"><rect x="250" y="4" width="200" height="40" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="350" y="20" class="mid mono xs b">library, #1: main 10,</text><text x="350" y="36" class="mid mono xs b">lab 10, dorms 10</text></g><g data-show="1"><circle cx="420" cy="52" r="9" class="f-orange"/><text x="420" y="56" class="mid xs b" style="fill:#fff">✓</text></g><g data-show="=2"><line x1="358.561" y1="100.267" x2="273.561" y2="140.267" class="line s-orange" stroke-width="3.5" marker-end="url(#ah-orange)"/></g><g data-show="2"><circle cx="250" cy="132" r="9" class="f-orange"/><text x="250" y="136" class="mid xs b" style="fill:#fff">✓</text></g><g data-show="=2"><line x1="404" y1="105.2" x2="404" y2="185.2" class="line s-orange" stroke-width="3.5" marker-end="url(#ah-orange)"/></g><g data-show="2"><circle cx="420" cy="212" r="9" class="f-orange"/><text x="420" y="216" class="mid xs b" style="fill:#fff">✓</text></g><g data-show="=2"><line x1="431.8" y1="56" x2="526.8" y2="56" class="line s-orange" stroke-width="3.5" marker-end="url(#ah-orange)"/></g><g data-show="2"><circle cx="610" cy="52" r="9" class="f-orange"/><text x="610" y="56" class="mid xs b" style="fill:#fff">✓</text></g><g data-show="=3"><line x1="187" y1="164" x2="112" y2="164" class="line s-orange" stroke-width="3.5" marker-end="url(#ah-orange)"/></g><g data-show="=3"><line x1="431.8" y1="216" x2="526.8" y2="216" class="line s-orange" stroke-width="3.5" marker-end="url(#ah-orange)"/></g><g data-show="=3"><line x1="263.361" y1="154.933" x2="331.361" y2="186.933" class="line s-muted" stroke-width="3.5" marker-end="url(#ah-muted)"/><path d="M324.361,179.933 l14,14 M338.361,179.933 l-14,14" class="line s-red" stroke-width="3"/></g><g data-show="=3"><line x1="346.639" y1="225.067" x2="278.639" y2="193.067" class="line s-muted" stroke-width="3.5" marker-end="url(#ah-muted)"/><path d="M271.639,186.067 l14,14 M285.639,186.067 l-14,14" class="line s-red" stroke-width="3"/></g><g data-show="=3"><line x1="594" y1="105.2" x2="594" y2="185.2" class="line s-muted" stroke-width="3.5" marker-end="url(#ah-muted)"/><path d="M587,178.2 l14,14 M601,178.2 l-14,14" class="line s-red" stroke-width="3"/></g><g data-show="3"><circle cx="100" cy="132" r="9" class="f-orange"/><text x="100" y="136" class="mid xs b" style="fill:#fff">✓</text></g><g data-show="3"><circle cx="610" cy="212" r="9" class="f-orange"/><text x="610" y="216" class="mid xs b" style="fill:#fff">✓</text></g><g data-show="=4"><line x1="566" y1="194.8" x2="566" y2="114.8" class="line s-muted" stroke-width="3.5" marker-end="url(#ah-muted)"/><path d="M559,107.8 l14,14 M573,107.8 l-14,14" class="line s-red" stroke-width="3"/></g><g data-show="5"><rect x="88" y="120" width="26" height="22" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><path d="M92,136 l6,-8 l6,5 l6,-7" class="line s-blue" stroke-width="1.5"/><rect x="238" y="120" width="26" height="22" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><path d="M242,136 l6,-8 l6,5 l6,-7" class="line s-blue" stroke-width="1.5"/><rect x="408" y="40" width="26" height="22" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><path d="M412,56 l6,-8 l6,5 l6,-7" class="line s-blue" stroke-width="1.5"/><rect x="408" y="200" width="26" height="22" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><path d="M412,216 l6,-8 l6,5 l6,-7" class="line s-blue" stroke-width="1.5"/><rect x="598" y="40" width="26" height="22" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><path d="M602,56 l6,-8 l6,5 l6,-7" class="line s-blue" stroke-width="1.5"/><rect x="598" y="200" width="26" height="22" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><path d="M602,216 l6,-8 l6,5 l6,-7" class="line s-blue" stroke-width="1.5"/></g>
</svg>
<ol class="steps"><li>The library’s router writes a <strong>link-state advertisement</strong>: who it is, its cables, what each one costs, and a sequence number. It’s news about the library router, and nothing else.</li><li>It sends the advertisement to every neighbour. Each one keeps a copy in its <strong>link-state database</strong>.</li><li>Each neighbour passes it on to all of <em>its</em> neighbours, except the one it came from. Main and the lab send it to each other, but both already have it (the same sequence number), so they drop the copy. Sports hears it from the lab first, so the copy from the dorms is dropped too.</li><li>Sports passes it on to the dorms, which already has it. Nobody has anything new to pass on, so the flood stops by itself: every router got the advertisement exactly once, in 3 rounds.</li><li>Every router does the same with its own advertisement. Now all six have the same database: a complete map of the campus, with every cable and every cost. Each one works out its own shortest paths from it.</li></ol>
<figcaption>Flooding: pass new news to everyone else, and ignore old news.</figcaption>
</figure>

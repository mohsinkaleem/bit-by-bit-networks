</svg>
<ol class="steps"><li>Bob has one enormous message: the video of the school play.</li><li>He chops it into pieces, and gives each one a little label: its number, and how many pieces there are in all. Each piece also gets its own check at the end (red). They set off down the wire, and noise hits piece 4.</li><li>Carol checks each piece as it arrives. The good ones go on her shelf in their numbered slots, no matter what order they arrived in. Piece 4 fails its check, so she throws it away.</li><li>She asks Bob for just the missing piece. He sends piece 4 again, and the video is complete. One damaged bit cost one small piece, not the whole two hours.</li></ol>
<figcaption>Chopping, checking, and filing by number.</figcaption>
</figure>

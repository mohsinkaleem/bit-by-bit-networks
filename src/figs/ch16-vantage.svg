<figure class="fig">
<svg class="dia" viewBox="0 0 720 316" role="img" aria-label="What a sniffer on Bob&#x27;s laptop can see: everything on a hub, only its own traffic and broadcasts on a switch, and encrypted frames on Wi-Fi">
<rect x="8" y="8" width="224" height="300" rx="12" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="120" y="32" class="mid slab b">On a hub</text><use href="#hub" x="70" y="138" width="100" height="31"/><line x1="120" y1="102" x2="120" y2="138" class="wire" stroke-width="3"/><line x1="54" y1="214" x2="90" y2="169" class="wire" stroke-width="3"/><line x1="186" y1="214" x2="150" y2="169" class="wire" stroke-width="3"/><use href="#computer" x="96" y="56" width="48" height="43"/><text x="154" y="76" class="xs b">Bob</text><text x="154" y="90" class="xs muted">(sniffing)</text><circle cx="142" cy="60" r="8" class="f-surface" stroke="var(--red)" stroke-width="3"/><line x1="147" y1="66" x2="154" y2="73" class="line s-red" stroke-width="3.5"/><use href="#computer" x="30" y="214" width="48" height="43"/><text x="54" y="272" class="mid xs b">Alice</text><use href="#computer" x="162" y="214" width="48" height="43"/><text x="186" y="272" class="mid xs b">Carol</text><path d="M58,202 L84,176" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><path d="M156,176 L182,202" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><path d="M134,134 L134,106" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><text x="120" y="286" class="mid xs b">Bob sees everything,</text><text x="120" y="300" class="mid xs">including Alice → Carol</text><rect x="248" y="8" width="224" height="300" rx="12" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="360" y="32" class="mid slab b">On a switch</text><use href="#switch" x="310" y="138" width="100" height="31"/><line x1="360" y1="102" x2="360" y2="138" class="wire" stroke-width="3"/><line x1="294" y1="214" x2="330" y2="169" class="wire" stroke-width="3"/><line x1="426" y1="214" x2="390" y2="169" class="wire" stroke-width="3"/><use href="#computer" x="336" y="56" width="48" height="43"/><text x="394" y="76" class="xs b">Bob</text><text x="394" y="90" class="xs muted">(sniffing)</text><circle cx="382" cy="60" r="8" class="f-surface" stroke="var(--red)" stroke-width="3"/><line x1="387" y1="66" x2="394" y2="73" class="line s-red" stroke-width="3.5"/><use href="#computer" x="270" y="214" width="48" height="43"/><text x="294" y="272" class="mid xs b">Alice</text><use href="#computer" x="402" y="214" width="48" height="43"/><text x="426" y="272" class="mid xs b">Carol</text><path d="M298,202 L324,176" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><path d="M396,176 L422,202" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><path d="M374,134 L374,106" class="line s-orange dash" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="382" y="126" class="xs f-orange b">“who has?”</text><text x="360" y="286" class="mid xs b">Bob sees only his own</text><text x="360" y="300" class="mid xs">packets, and broadcasts</text><rect x="488" y="8" width="224" height="300" rx="12" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="600" y="32" class="mid slab b">On Wi-Fi</text><use href="#router" x="566" y="130" width="68" height="46"/><line x1="600" y1="153" x2="600" y2="102" class="line s-muted dot-line" stroke-width="2"/><line x1="600" y1="153" x2="544" y2="212" class="line s-muted dot-line" stroke-width="2"/><line x1="600" y1="153" x2="656" y2="212" class="line s-muted dot-line" stroke-width="2"/><use href="#computer" x="576" y="56" width="48" height="43"/><text x="634" y="76" class="xs b">Bob</text><text x="634" y="90" class="xs muted">(sniffing)</text><circle cx="622" cy="60" r="8" class="f-surface" stroke="var(--red)" stroke-width="3"/><line x1="627" y1="66" x2="634" y2="73" class="line s-red" stroke-width="3.5"/><use href="#computer" x="510" y="214" width="48" height="43"/><text x="534" y="272" class="mid xs b">Alice</text><use href="#computer" x="642" y="214" width="48" height="43"/><text x="666" y="272" class="mid xs b">Carol</text><path d="M538,202 L564,176" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><path d="M636,176 L662,202" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><path d="M614,126 L614,106" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><g transform="translate(534.0,175)"><rect x="0" y="6" width="14" height="11" rx="2" class="f-orange"/><path d="M3,6 v-3 a4,4 0 0 1 8,0 v3" class="line s-orange" stroke-width="2"/></g><g transform="translate(652.0,175)"><rect x="0" y="6" width="14" height="11" rx="2" class="f-orange"/><path d="M3,6 v-3 a4,4 0 0 1 8,0 v3" class="line s-orange" stroke-width="2"/></g><g transform="translate(623,109)"><rect x="0" y="6" width="14" height="11" rx="2" class="f-orange"/><path d="M3,6 v-3 a4,4 0 0 1 8,0 v3" class="line s-orange" stroke-width="2"/></g><text x="600" y="286" class="mid xs b">Bob’s card hears it all,</text><text x="600" y="300" class="mid xs">but each laptop has its own lock</text>
</svg>
<figcaption>Where you sit decides what you can see.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 214" role="img" aria-label="Bar chart of real ping times while idle, downloading and uploading: medians of 10, 27 and 11 ms, worst cases of 14, 74 and 97 ms">
<text x="14" y="22" class="sm b">Pings from Bob’s MacBook to 1.1.1.1, every 100 ms (labs/ch28/bloat.py)</text><text x="140" y="61" class="end xs b">idle</text><rect x="150" y="44" width="74.36" height="24" rx="3" class="t-red" stroke="var(--red)"/><rect x="150" y="44" width="53.56" height="24" rx="3" class="t-blue" stroke="var(--blue)"/><text x="230.36" y="60" class="xs b" style="fill:var(--blue)">median 10.3 ms</text><text x="230.36" y="60" class="xs b f-red"></text><text x="140" y="105" class="end xs b">downloading</text><rect x="150" y="88" width="382.2" height="24" rx="3" class="t-red" stroke="var(--red)"/><rect x="150" y="88" width="139.88" height="24" rx="3" class="t-blue" stroke="var(--blue)"/><text x="293.88" y="104" class="xs b" style="fill:var(--blue)">median 26.9 ms</text><text x="538.2" y="104" class="xs b f-red">worst 73.5 ms</text><text x="140" y="149" class="end xs b">uploading</text><rect x="150" y="132" width="501.8" height="24" rx="3" class="t-red" stroke="var(--red)"/><rect x="150" y="132" width="56.16" height="24" rx="3" class="t-blue" stroke="var(--blue)"/><text x="210.16" y="148" class="xs b" style="fill:var(--blue)">median 10.8 ms</text><text x="657.8" y="148" class="xs b f-red">worst 96.5 ms</text><text x="150" y="186" class="xs">The download ran at 116 Mbit/s, the upload at 130. Busy, the queue in front of the slowest link</text><text x="150" y="202" class="xs">fills up, and every other packet, like a game’s, waits behind it.</text>
</svg>
<figcaption>Bufferbloat on Bob’s network, measured. Blue: the typical ping. Red: the worst one.</figcaption>

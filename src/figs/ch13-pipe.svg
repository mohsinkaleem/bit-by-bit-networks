<figure class="fig">
<svg class="dia" viewBox="0 0 720 268" role="img" aria-label="Stop-and-wait leaves the path mostly empty; a window keeps it full of datagrams">
<text x="14" y="40" class="slab b">Stop-and-wait: one at a time</text><use href="#alice-head" x="10" y="48" width="44" height="44"/><use href="#computer" x="668" y="50" width="44" height="40"/><rect x="66" y="44" width="592" height="52" rx="26" class="f-card" stroke="var(--line)" stroke-width="2"/><line x1="86" y1="70" x2="638" y2="70" class="line s-line dash" stroke-width="1.5"/><rect x="237" y="48" width="26" height="18" rx="3" class="f-blue"/><path d="M263,57 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><text x="360" y="120" class="mid hand">Nearly empty. At 40 ms a round trip, that’s 25 datagrams a second, however fast the wire.</text><text x="14" y="170" class="slab b">A window of 8: keep the pipe full</text><use href="#alice-head" x="10" y="178" width="44" height="44"/><use href="#computer" x="668" y="180" width="44" height="40"/><rect x="66" y="174" width="592" height="52" rx="26" class="f-card" stroke="var(--line)" stroke-width="2"/><line x1="86" y1="200" x2="638" y2="200" class="line s-line dash" stroke-width="1.5"/><rect x="137" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M163,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="197" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M223,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="257" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M283,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="317" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M343,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="377" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M403,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="437" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M463,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="497" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M523,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><rect x="557" y="178" width="26" height="18" rx="3" class="f-blue"/><path d="M583,187 l8,0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/><circle cx="180" cy="213" r="7" class="f-green"/><path d="M172,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><circle cx="240" cy="213" r="7" class="f-green"/><path d="M232,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><circle cx="300" cy="213" r="7" class="f-green"/><path d="M292,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><circle cx="360" cy="213" r="7" class="f-green"/><path d="M352,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><circle cx="420" cy="213" r="7" class="f-green"/><path d="M412,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><circle cx="480" cy="213" r="7" class="f-green"/><path d="M472,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><circle cx="540" cy="213" r="7" class="f-green"/><path d="M532,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><circle cx="600" cy="213" r="7" class="f-green"/><path d="M592,213 l-8,0" class="line s-green" stroke-width="2" marker-end="url(#ah-green)"/><text x="360" y="250" class="mid hand">8 datagrams on their way, acknowledgments streaming back: 8 times as much gets through.</text>
</svg>
<figcaption>A network path is a pipe. Stop-and-wait uses a tiny part of it.</figcaption>
</figure>

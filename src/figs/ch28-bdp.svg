oke="var(--blue)"/><rect x="398" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="413.2" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="428.4" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="443.6" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="458.8" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="474" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="489.2" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="504.4" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="519.6" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="534.8" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="550" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="565.2" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="580.4" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="595.6" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="610.8" y="64" width="11" height="14" rx="2" class="t-blue" stroke="var(--blue)"/><rect x="626" y="62" width="11" height="18" rx="2" class="t-blue" stroke="var(--blue)"/><path d="M640,96 C600,120 140,120 90,98" class="line s-green dash" stroke-width="2" marker-end="url(#ah-green)"/><text x="364" y="132" class="mid xs f-green b">…and the acknowledgements take the same time to come back</text><text x="364" y="40" class="mid sm b">Bob’s upload: 135 Mbit/s × 12 ms round trip = 202,500 bytes in flight: about 146 full segments</text><text x="40" y="160" class="xs b">link</text><text x="300" y="160" class="xs b">speed</text><text x="420" y="160" class="xs b">round trip</text><text x="560" y="160" class="xs b">bytes in flight to fill it</text><text x="40" y="180" class="xs">a home Wi-Fi link</text><text x="300" y="180" class="mono xs">300 Mbit/s</text><text x="420" y="180" class="mono xs">5 ms</text><text x="560" y="180" class="mono xs b">188 KB</text><text x="40" y="198" class="xs">Bob’s upload to Cloudflare</text><text x="300" y="198" class="mono xs">135 Mbit/s</text><text x="420" y="198" class="mono xs">12 ms</text><text x="560" y="198" class="mono xs b">203 KB</text><text x="40" y="216" class="xs">London to New York</text><text x="300" y="216" class="mono xs">1 Gbit/s</text><text x="420" y="216" class="mono xs">70 ms</text><text x="560" y="216" class="mono xs b">8.8 MB</text><text x="40" y="234" class="xs">a data centre link</text><text x="300" y="234" class="mono xs">100 Gbit/s</text><text x="420" y="234" class="mono xs">0.1 ms</text><text x="560" y="234" class="mono xs b">1.3 MB</text>
</svg>
<figcaption>The <strong>bandwidth-delay product</strong>: how much data has to be on its way at once to keep a path busy. TCP’s window must be at least this big.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 372" role="img" aria-label="Inside a home router: a router, a four-port switch and a Wi-Fi access point, bridged together into one network">
<rect x="200" y="30" width="330" height="250" rx="16" class="f-card" stroke="var(--ink)" stroke-width="2"/><text x="365" y="52" class="mid slab b">the “router” on the shelf</text><rect x="222" y="66" width="130" height="60" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="287" y="92" class="mid sm b">router</text><text x="287" y="108" class="mid xs muted">(Chapters 20–22)</text><rect x="222" y="160" width="130" height="100" rx="8" class="t-teal" stroke="var(--teal-ink)" stroke-width="2"/><text x="287" y="186" class="mid sm b">4-port switch</text><rect x="234" y="206" width="22" height="16" rx="2" class="f-surface" stroke="var(--ink)" stroke-width="1.5"/><rect x="262" y="206" width="22" height="16" rx="2" class="f-surface" stroke="var(--ink)" stroke-width="1.5"/><rect x="290" y="206" width="22" height="16" rx="2" class="f-surface" stroke="var(--ink)" stroke-width="1.5"/><rect x="318" y="206" width="22" height="16" rx="2" class="f-surface" stroke="var(--ink)" stroke-width="1.5"/><text x="287" y="244" class="mid xs muted">(this chapter)</text><rect x="386" y="160" width="130" height="100" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="451" y="186" class="mid sm b">Wi-Fi access</text><text x="451" y="202" class="mid sm b">point</text><text x="451" y="244" class="mid xs muted">(Chapter 19)</text><line x1="287" y1="126" x2="287" y2="160" class="line" stroke-width="3"/><line x1="352" y1="210" x2="386" y2="210" class="line" stroke-width="3"/><text x="369" y="202" class="mid xs muted">bridge</text><rect x="386" y="70" width="130" height="52" rx="8" class="f-surface" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="451" y="92" class="mid xs">also: DHCP, NAT,</text><text x="451" y="107" class="mid xs">a firewall (Ch. 22)</text><line x1="222" y1="96" x2="120" y2="96" class="wire" stroke-width="4"/><use href="#cloud" x="10" y="56" width="120" height="72"/><text x="70" y="142" class="mid xs b">the internet</text><text x="166" y="88" class="mid xs muted">fiber / DSL</text><path d="M245,222 L245,300" class="wire" stroke-width="3"/><path d="M301,222 L301,300" class="wire" stroke-width="3"/><use href="#computer" x="200" y="296" width="60" height="54"/><text x="230" y="362" class="mid xs b">Bob’s gaming PC</text><use href="#computer" x="272" y="296" width="60" height="54"/><text x="302" y="362" class="mid xs b">the TV</text><use href="#computer" x="612" y="84" width="56" height="50"/><text x="640" y="148" class="mid xs b">Bob’s laptop</text><path d="M520,210 Q560,160.0 608,110" class="line s-purple dot-line" stroke-width="2.5"/><use href="#computer" x="612" y="174" width="56" height="50"/><text x="640" y="238" class="mid xs b">Grandpa’s Pi</text><path d="M520,210 Q560,205.0 608,200" class="line s-purple dot-line" stroke-width="2.5"/><use href="#computer" x="612" y="264" width="56" height="50"/><text x="640" y="328" class="mid xs b">the doorbell</text><path d="M520,210 Q560,250.0 608,290" class="line s-purple dot-line" stroke-width="2.5"/>
</svg>
<figcaption>One box, three jobs. Everything plugged into the switch or joined to the Wi-Fi is on the same Ethernet network.</figcaption>
</figure>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 272" role="img" aria-label="Two Wi-Fi stations waiting for a busy channel, counting down random backoff slots; one sends and is acknowledged, then the other">
<text x="108" y="75" class="end sm b">Bob’s laptop</text><line x1="120" y1="70" x2="706" y2="70" class="grid"/><text x="108" y="145" class="end sm b">Mum’s phone</text><line x1="120" y1="140" x2="706" y2="140" class="grid"/><text x="108" y="215" class="end sm b">the router</text><line x1="120" y1="210" x2="706" y2="210" class="grid"/><g data-show="1"><rect x="120" y="46" width="100.0" height="186" rx="4" class="f-line" style="opacity:0.6"/><text x="170" y="34" class="mid xs b muted">someone else</text><text x="170" y="144" class="mid sm b muted">busy</text></g><g data-show="2"><rect x="220.0" y="56" width="42.5" height="28" rx="4" class="f-none" stroke="var(--muted)" stroke-width="1.5"/><text x="241.25" y="75" class="mid xs b">wait</text></g><g data-show="2"><rect x="220.0" y="126" width="42.5" height="28" rx="4" class="f-none" stroke="var(--muted)" stroke-width="1.5"/><text x="241.25" y="145" class="mid xs b">wait</text></g><g data-show="2"><rect x="262.5" y="61" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="267.125" y="74" class="mid xs b">3</text><rect x="273.8" y="61" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="278.375" y="74" class="mid xs b">2</text><rect x="285.0" y="61" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="289.625" y="74" class="mid xs b">1</text></g><g data-show="2"><rect x="262.5" y="131" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="267.125" y="144" class="mid xs b">5</text><rect x="273.8" y="131" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="278.375" y="144" class="mid xs b">4</text><rect x="285.0" y="131" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="289.625" y="144" class="mid xs b">3</text></g><g data-show="=2"><text x="307.5" y="108" class="hand">each picks a random number, and counts down while it’s quiet</text></g><g data-show="3"><rect x="296.2" y="56" width="125.0" height="28" rx="4" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="358.75" y="75" class="mid xs b">DATA</text></g><g data-show="3-4"><text x="275" y="170" class="hand f-orange">the phone hears the laptop, and freezes at 2</text></g><g data-show="4"><rect x="441.2" y="196" width="55.0" height="28" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="468.75" y="215" class="mid xs b">ACK</text></g><g data-show="4"><text x="441.25" y="250" class="mid xs muted">16 µs after the data</text></g><g data-show="5"><rect x="496.2" y="126" width="42.5" height="28" rx="4" class="f-none" stroke="var(--muted)" stroke-width="1.5"/><text x="517.5" y="145" class="mid xs b">wait</text></g><g data-show="5"><rect x="538.8" y="131" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="543.375" y="144" class="mid xs b">2</text><rect x="550.0" y="131" width="9.2" height="18" rx="2" class="t-yellow" stroke="var(--yellow)"/><text x="554.625" y="144" class="mid xs b">1</text></g><g data-show="5"><rect x="561.2" y="126" width="125.0" height="28" rx="4" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="623.75" y="145" class="mid xs b">DATA</text></g><g data-show="5"><text x="623.75" y="108" class="mid hand f-purple">then its turn comes</text></g><text x="706" y="262" class="end xs muted">time →</text>
</svg>
<ol class="steps"><li>Someone else is using the channel. Bob’s laptop and his mum’s phone both have a frame to send, so they listen, and wait.</li><li>The channel goes quiet. Each waits a moment longer, then picks a random number of 9-microsecond slots: 3 for the laptop, 5 for the phone. They count down, one slot at a time, while the channel stays quiet.</li><li>The laptop reaches zero first and sends. The phone hears it, and freezes its count at 2 instead of starting again.</li><li>Radio can’t tell a sender whether its frame collided, so the receiver has to say so: the router sends back an ACK, just 16 microseconds after the frame ends. No ACK means “try again”.</li><li>The channel is quiet again. The phone waits, carries on counting from 2, and sends. If two stations had reached zero together, neither would get an ACK, and both would pick a new number from a range twice as big.</li></ol>
<figcaption>Collision avoidance: wait, count down, talk, and wait for the ACK.</figcaption>
</figure>

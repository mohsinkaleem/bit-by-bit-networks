<figure class="fig">
<svg class="dia" viewBox="0 0 720 346" role="img" aria-label="The layers built in this book, from signals at the bottom to running the network at the top, with the chapters for each">
<rect x="80" y="14" width="560" height="38" rx="7" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="94" y="31" class="xs b">running the network</text><text x="94" y="45" class="xs">middleboxes, tunnels, containers, programmable networks, troubleshooting</text><text x="626" y="38" class="end xs muted">ch. 34–36, 38, 39</text><rect x="70" y="58" width="580" height="38" rx="7" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="84" y="75" class="xs b">keeping secrets</text><text x="84" y="89" class="xs">cryptography, TLS, post-quantum locks</text><text x="636" y="82" class="end xs muted">ch. 31, 32, 42</text><rect x="60" y="102" width="600" height="38" rx="7" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="74" y="119" class="xs b">names and applications</text><text x="74" y="133" class="xs">names, the web, DNS, HTTP, a page load from end to end</text><text x="646" y="126" class="end xs muted">ch. 6, 7, 14, 29, 30, 37</text><rect x="50" y="146" width="620" height="38" rx="7" class="t-teal" stroke="var(--teal)" stroke-width="1.5"/><text x="64" y="163" class="xs b">between programs</text><text x="64" y="177" class="xs">ports, retries, TCP, UDP, QUIC, bundles for Mars</text><text x="656" y="170" class="end xs muted">ch. 12, 13, 26–28, 33, 41</text><rect x="40" y="190" width="640" height="38" rx="7" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="54" y="207" class="xs b">between networks</text><text x="54" y="221" class="xs">routers, IP, routing, BGP, IPv6, named data</text><text x="666" y="214" class="end xs muted">ch. 11, 20–25, 43</text><rect x="30" y="234" width="660" height="38" rx="7" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="44" y="251" class="xs b">on one link</text><text x="44" y="265" class="xs">frames, addresses, switches, Ethernet, Wi-Fi, meshes</text><text x="676" y="258" class="end xs muted">ch. 5, 8–10, 18, 19, 44</text><rect x="20" y="278" width="680" height="38" rx="7" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="34" y="295" class="xs b">signals</text><text x="34" y="309" class="xs">a flashlight, wires, glass, radio, satellites</text><text x="686" y="302" class="end xs muted">ch. 1–3, 17, 40</text><text x="360" y="336" class="mid sm hand">…and the lamp still says HI.</text>

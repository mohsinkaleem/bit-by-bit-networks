<figure class="fig">
<svg class="dia" viewBox="0 0 720 170" role="img" aria-label="One eBPF instruction, eight bytes: opcode 55, registers 00, offset 0c 00, immediate 00 08 00 00">
<text x="360" y="22" class="mid sm b mono">jne r0, 0x0800, +12  =  if r0 isn’t 0x0800, skip the next 12 instructions</text><rect x="60" y="40" width="71" height="40" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="95.5" y="66" class="mid sm b mono">55</text><text x="95.5" y="100" class="mid xs b">opcode</text><text x="95.5" y="116" class="mid xs">jump if not equal,</text><text x="95.5" y="130" class="mid xs">to a number</text><rect x="135" y="40" width="71" height="40" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="170.5" y="66" class="mid sm b mono">00</text><text x="170.5" y="100" class="mid xs b">registers</text><text x="170.5" y="116" class="mid xs">dst = r0,</text><text x="170.5" y="130" class="mid xs">src = unused</text><rect x="210" y="40" width="146" height="40" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="283" y="66" class="mid sm b mono">0c 00</text><text x="283" y="100" class="mid xs b">offset</text><text x="283" y="116" class="mid xs">skip 12</text><text x="283" y="130" class="mid xs">instructions</text><rect x="360" y="40" width="296" height="40" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="508" y="66" class="mid sm b mono">00 08 00 00</text><text x="508" y="100" class="mid xs b">number</text><text x="508" y="116" class="mid xs">0x0800:</text><text x="508" y="130" class="mid xs">IPv4</text><text x="360" y="158" class="mid xs muted">Eight bytes, little-endian. Compare Chapter 16’s classic BPF: the same idea, with more registers and more room.</text>
</svg>
<figcaption>The third instruction of this chapter’s counting program, as the kernel receives it.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 264" role="img" aria-label="An ARP request and its reply, field by field, from the Pi&#x27;s real capture">
<text x="14" y="30" class="sm b">“Who has 192.168.1.1? Tell 192.168.1.4.”</text><text x="706" y="30" class="end xs muted">broadcast, to ff:ff:ff:ff:ff:ff</text><rect x="14" y="40" width="51" height="44" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="39.5" y="56" class="mid xs b">hardware</text><text x="39.5" y="74" class="mid mono xs">0001</text><rect x="68" y="40" width="55" height="44" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="95.5" y="56" class="mid xs b">protocol</text><text x="95.5" y="74" class="mid mono xs">0800</text><rect x="126" y="40" width="47" height="44" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="149.5" y="56" class="mid xs b">sizes</text><text x="149.5" y="74" class="mid mono xs">0604</text><rect x="176" y="40" width="73" height="44" rx="5" class="t-purple" stroke="var(--orange)" stroke-width="2"/><text x="212.5" y="56" class="mid xs b">operation</text><text x="212.5" y="74" class="mid mono xs">1: ask</text><rect x="252" y="40" width="123" height="44" rx="5" class="t-blue" stroke="var(--line)" stroke-width="1.2"/><text x="313.5" y="56" class="mid xs b">sender MAC</text><text x="313.5" y="74" class="mid mono xs">2c:cf:67:5e:10:c2</text><rect x="378" y="40" width="91" height="44" rx="5" class="t-yellow" stroke="var(--line)" stroke-width="1.2"/><text x="423.5" y="56" class="mid xs b">sender IP</text><text x="423.5" y="74" class="mid mono xs">192.168.1.4</text><rect x="472" y="40" width="123" height="44" rx="5" class="t-blue" stroke="var(--orange)" stroke-width="2"/><text x="533.5" y="56" class="mid xs b">target MAC</text><text x="533.5" y="74" class="mid mono xs">00:00:00:00:00:00</text><rect x="598" y="40" width="91" height="44" rx="5" class="t-yellow" stroke="var(--line)" stroke-width="1.2"/><text x="643.5" y="56" class="mid xs b">target IP</text><text x="643.5" y="74" class="mid mono xs">192.168.1.1</text><text x="14" y="150" class="sm b">“192.168.1.1 is at 14:c3:5e:40:0b:32.”</text><text x="706" y="150" class="end xs muted">straight back to the Pi</text><rect x="14" y="160" width="51" height="44" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="39.5" y="176" class="mid xs b">hardware</text><text x="39.5" y="194" class="mid mono xs">0001</text><rect x="68" y="160" width="55" height="44" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="95.5" y="176" class="mid xs b">protocol</text><text x="95.5" y="194" class="mid mono xs">0800</text><rect x="126" y="160" width="47" height="44" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.2"/><text x="149.5" y="176" class="mid xs b">sizes</text><text x="149.5" y="194" class="mid mono xs">0604</text><rect x="176" y="160" width="73" height="44" rx="5" class="t-purple" stroke="var(--orange)" stroke-width="2"/><text x="212.5" y="176" class="mid xs b">operation</text><text x="212.5" y="194" class="mid mono xs">2: answer</text><rect x="252" y="160" width="123" height="44" rx="5" class="t-blue" stroke="var(--line)" stroke-width="1.2"/><text x="313.5" y="176" class="mid xs b">sender MAC</text><text x="313.5" y="194" class="mid mono xs">14:c3:5e:40:0b:32</text><rect x="378" y="160" width="91" height="44" rx="5" class="t-yellow" stroke="var(--line)" stroke-width="1.2"/><text x="423.5" y="176" class="mid xs b">sender IP</text><text x="423.5" y="194" class="mid mono xs">192.168.1.1</text><rect x="472" y="160" width="123" height="44" rx="5" class="t-blue" stroke="var(--line)" stroke-width="1.2"/><text x="533.5" y="176" class="mid xs b">target MAC</text><text x="533.5" y="194" class="mid mono xs">2c:cf:67:5e:10:c2</text><rect x="598" y="160" width="91" height="44" rx="5" class="t-yellow" stroke="var(--line)" stroke-width="1.2"/><text x="643.5" y="176" class="mid xs b">target IP</text><text x="643.5" y="194" class="mid mono xs">192.168.1.4</text><text x="535" y="102" class="mid xs f-orange b">all zeros: “that’s what I’m asking!”</text>
</svg>
<figcaption>A real “who has?” and its answer: 28 bytes each, inside an Ethernet frame of type 0806.</figcaption>
</figure>

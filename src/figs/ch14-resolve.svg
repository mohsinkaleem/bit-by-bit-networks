<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 523.5" role="img" aria-label="A resolver asks the root, then seaside&#x27;s name server, then remembers the answer">
<use href="#alice-head" x="44" y="4" width="52" height="52"/><text x="70" y="80" class="mid slab b">Alice</text><line x1="70" y1="88" x2="70" y2="517.5" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="260" y="80" class="mid slab b">resolver</text><line x1="260" y1="88" x2="260" y2="517.5" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="460" y="80" class="mid slab b">root</text><line x1="460" y1="88" x2="460" y2="517.5" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="650" y="80" class="mid slab b">seaside</text><line x1="650" y1="88" x2="650" y2="517.5" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="513.5" class="xs muted">time ↓</text><g data-show="1"><line x1="70" y1="92" x2="260" y2="127" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="165" y="102.5" class="mid mono sm b halo">otto.seaside?</text></g><g data-show="2"><line x1="260" y1="137.5" x2="460" y2="172.5" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="148" class="mid mono sm b halo">otto.seaside?</text></g><g data-show="2"><line x1="460" y1="183" x2="260" y2="218" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="360" y="193.5" class="mid mono sm b halo">ask seaside’s server</text><text x="360" y="216.5" class="mid xs muted halo">(and remember that for 2 days)</text></g><g data-show="3"><line x1="260" y1="232" x2="650" y2="267" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="396.5" y="237.25" class="mid mono sm b halo">otto.seaside?</text></g><g data-show="3"><line x1="650" y1="277.5" x2="260" y2="312.5" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="513.5" y="282.75" class="mid mono sm b halo">4.2</text><text x="513.5" y="305.75" class="mid xs muted halo">good for 1 hour</text></g><g data-show="4"><line x1="260" y1="326.5" x2="70" y2="361.5" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="165" y="337" class="mid mono sm b halo">4.2</text></g><g data-show="4"><circle cx="260" cy="382.5" r="5" class="f-ink"/><text x="274" y="387.5" class="hand  halo" text-anchor="start">remember: otto.seaside = 4.2</text></g><g data-show="5"><line x1="70" y1="407" x2="260" y2="442" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="165" y="417.5" class="mid mono sm b halo">otto.seaside?</text><text x="165" y="440.5" class="mid xs muted halo">(Bob, ten minutes later)</text></g><g data-show="5"><line x1="260" y1="452.5" x2="70" y2="487.5" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="165" y="463" class="mid mono sm b halo">4.2</text><text x="165" y="486" class="mid xs muted halo">straight from memory</text></g><use href="#server" x="242" y="8" width="36" height="46"/><use href="#server" x="442" y="8" width="36" height="46"/><use href="#server" x="632" y="8" width="36" height="46"/>
</svg>
<ol class="steps"><li>Alice’s computer doesn’t go looking itself. It asks the <strong>resolver</strong> on her street, a name server that does the asking for everyone.</li><li>The resolver starts at the top. The root doesn’t know Otto, but it knows who runs “seaside”, and says so.</li><li>The resolver asks seaside’s server, which does know, and says how long the answer is good for.</li><li>The resolver passes the answer on, and remembers it.</li><li>The next time anyone on the street asks, within the hour, the resolver answers straight away. The root and seaside don’t hear about it at all.</li></ol>
<figcaption>Asking around, and remembering.</figcaption>
</figure>

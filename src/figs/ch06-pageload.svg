<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 470" role="img" aria-label="Sequence diagram of a browser fetching a page, then its image, then following a redirect">
<use href="#alice-head" x="164" y="4" width="52" height="52"/><text x="190" y="74" class="mid slab b">Alice’s browser</text><line x1="190" y1="82" x2="190" y2="464.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><use href="#bob-head" x="504" y="4" width="52" height="52"/><text x="530" y="74" class="mid slab b">Bob’s server</text><line x1="530" y1="82" x2="530" y2="464.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="460.0" class="xs muted">time ↓</text><g data-show="1"><line x1="190" y1="86" x2="530" y2="116" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="94" class="mid mono sm b halo">GET /index.mu</text></g><g data-show="1"><line x1="530" y1="125" x2="190" y2="155" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="133" class="mid mono sm b halo">200 OK (text/markup)</text></g><g data-show="2"><circle cx="190" cy="164" r="5" class="f-ink"/><text x="204" y="169" class="hand  halo" text-anchor="start">shows the page… and spots &lt;image src="/volcano.png"&gt;</text></g><g data-show="2"><line x1="190" y1="185" x2="530" y2="215" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="193" class="mid mono sm b halo">GET /volcano.png</text></g><g data-show="2"><line x1="530" y1="224" x2="190" y2="254" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="232" class="mid mono sm b halo">200 OK (image/png, 944 bytes)</text></g><g data-show="3"><circle cx="190" cy="266" r="5" class="f-ink"/><text x="204" y="271" class="hand  halo" text-anchor="start">Alice clicks “homework notes”</text></g><g data-show="3"><line x1="190" y1="284" x2="530" y2="314" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="292" class="mid mono sm b halo">GET /homework.mu</text></g><g data-show="3"><line x1="530" y1="323" x2="190" y2="353" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="360" y="331" class="mid mono sm b halo">301 Moved → /school/homework.mu</text></g><g data-show="4"><line x1="190" y1="365" x2="530" y2="395" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="373" class="mid mono sm b halo">GET /school/homework.mu</text></g><g data-show="4"><line x1="530" y1="404" x2="190" y2="434" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="412" class="mid mono sm b halo">200 OK (text/markup)</text></g>
</svg>
<ol class="steps"><li>The browser asks for Bob’s index page, and gets back a markup document.</li><li>While drawing the page, it finds an image tag. The picture isn’t inside the page, so the browser makes a <em>second</em> request just for it. One page, two requests.</li><li>Alice clicks a link to the homework notes. Bob moved that file last week, so the server doesn’t send it. Instead it replies <code>301</code> with a <code>Location</code> header: “it lives over here now”.</li><li>Without bothering Alice, the browser asks again at the new location and gets the page. All Alice sees is the page appearing.</li></ol>
<figcaption>What really happens when you click around.</figcaption>
</figure>

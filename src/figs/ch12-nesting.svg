<figure class="fig">
<svg class="dia" viewBox="0 0 720 208" role="img" aria-label="Four nested envelopes: frame, packet, datagram, data, each read by a different part of the system">
<rect x="14" y="24" width="692" height="172" rx="10" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="26" y="45" class="sm b">frame</text><text x="110" y="45" class="mono xs">to c4:01 · from c1:01</text><text x="640" y="45" class="end hand xs muted">switches and cards read this</text><rect x="34" y="56" width="612" height="126" rx="10" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="46" y="77" class="sm b">packet</text><text x="130" y="77" class="mono xs">to 4.2 · from 1.1 · hops left 62</text><text x="634" y="77" class="end hand xs muted">routers read this</text><rect x="54" y="88" width="572" height="80" rx="10" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="66" y="109" class="sm b">datagram</text><text x="150" y="109" class="mono xs">to port 64 · from port 51234</text><text x="614" y="109" class="end hand xs muted">the operating system reads this</text><rect x="74" y="120" width="532" height="34" rx="10" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="86" y="141" class="sm b">data</text><text x="170" y="141" class="mono xs">e4</text><text x="594" y="141" class="end hand xs muted">the chess program reads this</text><rect x="650" y="30" width="50" height="160" rx="6" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="675" y="116" class="mid xs b" transform="rotate(-90 675 112)">check</text>
</svg>
<figcaption>Envelopes inside envelopes. Each layer only reads its own.</figcaption>
</figure>

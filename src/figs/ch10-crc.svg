<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 372" role="img" aria-label="Binary long division using XOR produces a 3-bit remainder, the CRC">
<text x="60" y="26" class="xs muted">message</text><text x="268" y="26" class="xs muted">+ 3 zeros</text><text x="73" y="56" class="mid mono b ">1</text><text x="99" y="56" class="mid mono b ">1</text><text x="125" y="56" class="mid mono b ">0</text><text x="151" y="56" class="mid mono b ">1</text><text x="177" y="56" class="mid mono b ">0</text><text x="203" y="56" class="mid mono b ">1</text><text x="229" y="56" class="mid mono b ">1</text><text x="255" y="56" class="mid mono b ">0</text><text x="281" y="56" class="mid mono b ">0</text><text x="307" y="56" class="mid mono b ">0</text><text x="333" y="56" class="mid mono b ">0</text><g data-show="2"><text x="73" y="77" class="mid mono b f-orange">1</text><text x="99" y="77" class="mid mono b f-orange">0</text><text x="125" y="77" class="mid mono b f-orange">1</text><text x="151" y="77" class="mid mono b f-orange">1</text></g><g data-show="2"><text x="48" y="77" class="end mono b f-orange">⊕</text><line x1="60" y1="83" x2="164" y2="83" class="line s-ink" stroke-width="1.5"/></g><g data-show="2"><text x="73" y="98" class="mid mono b f-muted">0</text><text x="99" y="98" class="mid mono b ">1</text><text x="125" y="98" class="mid mono b ">1</text><text x="151" y="98" class="mid mono b ">0</text><text x="177" y="98" class="mid mono b ">0</text><text x="203" y="98" class="mid mono b ">1</text><text x="229" y="98" class="mid mono b ">1</text><text x="255" y="98" class="mid mono b ">0</text><text x="281" y="98" class="mid mono b ">0</text><text x="307" y="98" class="mid mono b ">0</text><text x="333" y="98" class="mid mono b ">0</text></g><g data-show="3"><text x="99" y="119" class="mid mono b f-orange">1</text><text x="125" y="119" class="mid mono b f-orange">0</text><text x="151" y="119" class="mid mono b f-orange">1</text><text x="177" y="119" class="mid mono b f-orange">1</text></g><g data-show="3"><text x="48" y="119" class="end mono b f-orange">⊕</text><line x1="86" y1="125" x2="190" y2="125" class="line s-ink" stroke-width="1.5"/></g><g data-show="3"><text x="73" y="140" class="mid mono b f-muted">0</text><text x="99" y="140" class="mid mono b f-muted">0</text><text x="125" y="140" class="mid mono b ">1</text><text x="151" y="140" class="mid mono b ">1</text><text x="177" y="140" class="mid mono b ">1</text><text x="203" y="140" class="mid mono b ">1</text><text x="229" y="140" class="mid mono b ">1</text><text x="255" y="140" class="mid mono b ">0</text><text x="281" y="140" class="mid mono b ">0</text><text x="307" y="140" class="mid mono b ">0</text><text x="333" y="140" class="mid mono b ">0</text></g><g data-show="3"><text x="125" y="161" class="mid mono b f-orange">1</text><text x="151" y="161" class="mid mono b f-orange">0</text><text x="177" y="161" class="mid mono b f-orange">1</text><text x="203" y="161" class="mid mono b f-orange">1</text></g><g data-show="3"><text x="48" y="161" class="end mono b f-orange">⊕</text><line x1="112" y1="167" x2="216" y2="167" class="line s-ink" stroke-width="1.5"/></g><g data-show="3"><text x="73" y="182" class="mid mono b f-muted">0</text><text x="99" y="182" class="mid mono b f-muted">0</text><text x="125" y="182" class="mid mono b f-muted">0</text><text x="151" y="182" class="mid mono b ">1</text><text x="177" y="182" class="mid mono b ">0</text><text x="203" y="182" class="mid mono b ">0</text><text x="229" y="182" class="mid mono b ">1</text><text x="255" y="182" class="mid mono b ">0</text><text x="281" y="182" class="mid mono b ">0</text><text x="307" y="182" class="mid mono b ">0</text><text x="333" y="182" class="mid mono b ">0</text></g><g data-show="4"><text x="151" y="203" class="mid mono b f-orange">1</text><text x="177" y="203" class="mid mono b f-orange">0</text><text x="203" y="203" class="mid mono b f-orange">1</text><text x="229" y="203" class="mid mono b f-orange">1</text></g><g data-show="4"><text x="48" y="203" class="end mono b f-orange">⊕</text><line x1="138" y1="209" x2="242" y2="209" class="line s-ink" stroke-width="1.5"/></g><g data-show="4"><text x="73" y="224" class="mid mono b f-muted">0</text><text x="99" y="224" class="mid mono b f-muted">0</text><text x="125" y="224" class="mid mono b f-muted">0</text><text x="151" y="224" class="mid mono b f-muted">0</text><text x="177" y="224" class="mid mono b f-muted">0</text><text x="203" y="224" class="mid mono b ">1</text><text x="229" y="224" class="mid mono b ">0</text><text x="255" y="224" class="mid mono b ">0</text><text x="281" y="224" class="mid mono b ">0</text><text x="307" y="224" class="mid mono b ">0</text><text x="333" y="224" class="mid mono b ">0</text></g><g data-show="4"><text x="203" y="245" class="mid mono b f-orange">1</text><text x="229" y="245" class="mid mono b f-orange">0</text><text x="255" y="245" class="mid mono b f-orange">1</text><text x="281" y="245" class="mid mono b f-orange">1</text></g><g data-show="4"><text x="48" y="245" class="end mono b f-orange">⊕</text><line x1="190" y1="251" x2="294" y2="251" class="line s-ink" stroke-width="1.5"/></g><g data-show="4"><text x="73" y="266" class="mid mono b f-muted">0</text><text x="99" y="266" class="mid mono b f-muted">0</text><text x="125" y="266" class="mid mono b f-muted">0</text><text x="151" y="266" class="mid mono b f-muted">0</text><text x="177" y="266" class="mid mono b f-muted">0</text><text x="203" y="266" class="mid mono b f-muted">0</text><text x="229" y="266" class="mid mono b f-muted">0</text><text x="255" y="266" class="mid mono b ">1</text><text x="281" y="266" class="mid mono b ">1</text><text x="307" y="266" class="mid mono b ">0</text><text x="333" y="266" class="mid mono b ">0</text></g><g data-show="4"><text x="255" y="287" class="mid mono b f-orange">1</text><text x="281" y="287" class="mid mono b f-orange">0</text><text x="307" y="287" class="mid mono b f-orange">1</text><text x="333" y="287" class="mid mono b f-orange">1</text></g><g data-show="4"><text x="48" y="287" class="end mono b f-orange">⊕</text><line x1="242" y1="293" x2="346" y2="293" class="line s-ink" stroke-width="1.5"/></g><g data-show="4"><text x="73" y="308" class="mid mono b f-muted">0</text><text x="99" y="308" class="mid mono b f-muted">0</text><text x="125" y="308" class="mid mono b f-muted">0</text><text x="151" y="308" class="mid mono b f-muted">0</text><text x="177" y="308" class="mid mono b f-muted">0</text><text x="203" y="308" class="mid mono b f-muted">0</text><text x="229" y="308" class="mid mono b f-muted">0</text><text x="255" y="308" class="mid mono b f-muted">0</text><text x="281" y="308" class="mid mono b ">1</text><text x="307" y="308" class="mid mono b ">1</text><text x="333" y="308" class="mid mono b ">1</text></g><g data-show="5"><rect x="265" y="289" width="84" height="27" rx="6" class="f-none" stroke="var(--red)" stroke-width="3"/><text x="360" y="308" class="hand lg f-red">remainder = 111</text></g><g data-show="5"><text x="60" y="352" class="sm b">Send:</text><text x="110" y="352" class="mono b">11010110</text><text x="194" y="352" class="mono b f-red">111</text><text x="241.5" y="352" class="sm muted">(the message, then its 3-bit check)</text></g><g data-show="=2"><rect x="416" y="40" width="290" height="116" rx="10" class="card"/><text x="430" y="64" class="hand">Line the divisor up under</text><text x="430" y="88" class="hand">the first 1 and XOR:</text><text x="430" y="112" class="hand">1⊕1 = 0, 1⊕0 = 1, 0⊕0 = 0.</text><text x="430" y="136" class="hand">No carrying, no borrowing.</text></g><g data-show="=3"><rect x="416" y="40" width="290" height="116" rx="10" class="card"/><text x="430" y="64" class="hand">Skip ahead to the next 1</text><text x="430" y="88" class="hand">and do it again. The 1s at</text><text x="430" y="112" class="hand">the front always cancel out,</text><text x="430" y="136" class="hand">so the number keeps shrinking.</text></g><g data-show="=4"><rect x="416" y="40" width="290" height="68" rx="10" class="card"/><text x="430" y="64" class="hand">Keep going until the divisor</text><text x="430" y="88" class="hand">would hang off the end.</text></g><g data-show="=1"><rect x="416" y="40" width="290" height="108" rx="10" class="card"/><text x="430" y="64" class="hand">Message: 11010110</text><text x="430" y="88" class="hand">Agreed divisor: 1011</text><text x="430" y="112" class="hand">Tack on 3 zeros (one fewer</text><text x="430" y="132" class="hand">than the divisor’s length).</text></g>
</svg>
<ol class="steps"><li>Alice and Bob agree on a divisor in advance, here <code>1011</code>. Alice writes her message and adds three 0s to the end.</li><li>Long division, school style, except that “subtract” means XOR, bit by bit, with no borrowing. Put the divisor under the first 1.</li><li>Bring the divisor under the next leading 1, and XOR again. Whatever was in front has become zeros (greyed out).</li><li>Carry on until you run out of room.</li><li>What’s left over is the <strong>remainder</strong>, <code>111</code>. Alice sends it right after the message. Bob divides what he receives by the same divisor. If he doesn’t get the same remainder, something changed on the way.</li></ol>
<figcaption>A tiny CRC with a 4-bit divisor. CRC-32 is exactly the same process with a 33-bit divisor.</figcaption>
</figure>

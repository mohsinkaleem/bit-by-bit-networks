<figure class="fig">
<svg class="dia" viewBox="0 0 720 290" role="img" aria-label="An RJ45 connector with eight colour-coded pins in four twisted pairs, and which pairs each Ethernet speed uses">
<text x="170" y="24" class="mid sm b">An RJ45 plug, from the front (T568B)</text><rect x="34" y="36" width="272" height="150" rx="10" class="f-card" stroke="var(--ink)" stroke-width="2"/><rect x="120" y="186" width="100" height="20" rx="4" class="f-card" stroke="var(--ink)" stroke-width="2"/><rect x="54" y="54" width="22" height="92" rx="3" fill="var(--orange)" style="opacity:0.35"/><rect x="54" y="58" width="22" height="6" fill="var(--orange)"/><rect x="54" y="73" width="22" height="6" fill="var(--orange)"/><rect x="54" y="88" width="22" height="6" fill="var(--orange)"/><rect x="54" y="103" width="22" height="6" fill="var(--orange)"/><rect x="54" y="118" width="22" height="6" fill="var(--orange)"/><rect x="54" y="133" width="22" height="6" fill="var(--orange)"/><text x="65" y="164" class="mid mono sm b">1</text><rect x="84" y="54" width="22" height="92" rx="3" fill="var(--orange)" /><text x="95" y="164" class="mid mono sm b">2</text><rect x="114" y="54" width="22" height="92" rx="3" fill="var(--green)" style="opacity:0.35"/><rect x="114" y="58" width="22" height="6" fill="var(--green)"/><rect x="114" y="73" width="22" height="6" fill="var(--green)"/><rect x="114" y="88" width="22" height="6" fill="var(--green)"/><rect x="114" y="103" width="22" height="6" fill="var(--green)"/><rect x="114" y="118" width="22" height="6" fill="var(--green)"/><rect x="114" y="133" width="22" height="6" fill="var(--green)"/><text x="125" y="164" class="mid mono sm b">3</text><rect x="144" y="54" width="22" height="92" rx="3" fill="var(--blue)" /><text x="155" y="164" class="mid mono sm b">4</text><rect x="174" y="54" width="22" height="92" rx="3" fill="var(--blue)" style="opacity:0.35"/><rect x="174" y="58" width="22" height="6" fill="var(--blue)"/><rect x="174" y="73" width="22" height="6" fill="var(--blue)"/><rect x="174" y="88" width="22" height="6" fill="var(--blue)"/><rect x="174" y="103" width="22" height="6" fill="var(--blue)"/><rect x="174" y="118" width="22" height="6" fill="var(--blue)"/><rect x="174" y="133" width="22" height="6" fill="var(--blue)"/><text x="185" y="164" class="mid mono sm b">5</text><rect x="204" y="54" width="22" height="92" rx="3" fill="var(--green)" /><text x="215" y="164" class="mid mono sm b">6</text><rect x="234" y="54" width="22" height="92" rx="3" fill="var(--copper)" style="opacity:0.35"/><rect x="234" y="58" width="22" height="6" fill="var(--copper)"/><rect x="234" y="73" width="22" height="6" fill="var(--copper)"/><rect x="234" y="88" width="22" height="6" fill="var(--copper)"/><rect x="234" y="103" width="22" height="6" fill="var(--copper)"/><rect x="234" y="118" width="22" height="6" fill="var(--copper)"/><rect x="234" y="133" width="22" height="6" fill="var(--copper)"/><text x="245" y="164" class="mid mono sm b">7</text><rect x="264" y="54" width="22" height="92" rx="3" fill="var(--copper)" /><text x="275" y="164" class="mid mono sm b">8</text><path d="M65,216 L65,222 L95,222 L95,216" class="line" style="stroke:var(--orange)" stroke-width="2.5"/><text x="105" y="226" class="xs b" style="fill:var(--orange)">pair 2</text><path d="M125,232 L125,238 L215,238 L215,232" class="line" style="stroke:var(--green)" stroke-width="2.5"/><text x="225" y="242" class="xs b" style="fill:var(--green)">pair 3</text><path d="M155,248 L155,254 L185,254 L185,248" class="line" style="stroke:var(--blue)" stroke-width="2.5"/><text x="195" y="258" class="xs b" style="fill:var(--blue)">pair 1</text><path d="M245,264 L245,270 L275,270 L275,264" class="line" style="stroke:var(--copper)" stroke-width="2.5"/><text x="285" y="274" class="xs b" style="fill:var(--copper)">pair 4</text><text x="360" y="54" class="sm b">Which pairs carry what</text><rect x="360" y="78" width="340" height="40" rx="6" class="f-card" style="stroke:var(--orange)" stroke-width="2"/><text x="372" y="95" class="sm b">10 and 100 Mb/s</text><text x="372" y="111" class="xs">pairs 2 and 3 only: one pair each way</text><rect x="360" y="128" width="340" height="40" rx="6" class="f-card" style="stroke:var(--green)" stroke-width="2"/><text x="372" y="145" class="sm b">1 Gb/s</text><text x="372" y="161" class="xs">all four pairs, both directions at once</text><rect x="360" y="178" width="340" height="40" rx="6" class="f-card" style="stroke:var(--blue)" stroke-width="2"/><text x="372" y="195" class="sm b">10 Gb/s</text><text x="372" y="211" class="xs">all four pairs, both ways, 16 voltage levels</text><text x="360" y="252" class="xs muted">Each pair is twisted at a different rate, so that</text><text x="360" y="266" class="xs muted">the pairs don’t pick up each other’s signals.</text>
</svg>
<figcaption>Eight wires, four twisted pairs. Faster Ethernet uses more of them, in both directions at once.</figcaption>
</figure>

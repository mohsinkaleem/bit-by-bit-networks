<figure class="fig">
<svg class="dia" viewBox="0 0 720 305" role="img" aria-label="Post, then redirect, then get">
<use href="#alice-head" x="164" y="4" width="52" height="52"/><text x="190" y="74" class="mid slab b">Alice’s browser</text><line x1="190" y1="82" x2="190" y2="299.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><use href="#carol-head" x="504" y="4" width="52" height="52"/><text x="530" y="74" class="mid slab b">Carol’s guestbook</text><line x1="530" y1="82" x2="530" y2="299.0" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="295.0" class="xs muted">time ↓</text><line x1="190" y1="86" x2="530" y2="116" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="94" class="mid mono sm b halo">POST /guestbook</text><text x="360" y="117" class="mid xs muted halo">name=Alice&amp;message=Hi</text><circle cx="530" cy="123.5" r="5" class="f-ink"/><text x="544" y="128.5" class="hand  halo" text-anchor="start">adds the entry</text><line x1="530" y1="134" x2="190" y2="164" class="line s-orange" stroke-width="2.5" marker-end="url(#ah-orange)"/><text x="360" y="142" class="mid mono sm b halo">303 See Other → /guestbook</text><line x1="190" y1="182" x2="530" y2="212" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="190" class="mid mono sm b halo">GET /guestbook</text><line x1="530" y1="221" x2="190" y2="251" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="360" y="229" class="mid mono sm b halo">200 OK (the updated page)</text><circle cx="190" cy="269" r="5" class="f-ink"/><text x="204" y="274" class="hand f-green halo" text-anchor="start">if Alice reloads now, it re-sends the GET, not the POST</text>
</svg>
<figcaption>Post, redirect, get: reloading the page can’t sign the guestbook twice.</figcaption>
</figure>

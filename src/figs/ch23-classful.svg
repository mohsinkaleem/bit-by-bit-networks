<figure class="fig">
<svg class="dia" viewBox="0 0 720 288" role="img" aria-label="Class A, B and C addresses with fixed network sizes, compared with a CIDR /21">
<text x="14" y="22" class="sm b">1981 to 1993: the first bits of an address said where the network part ended</text><text x="14" y="56" class="sm b">Class A</text><rect x="150" y="40" width="130" height="24" rx="4" class="t-red" stroke="var(--red)" stroke-width="1.5"/><rect x="280" y="40" width="390" height="24" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="156" y="57" class="mono xs b">0…</text><text x="225" y="57" class="mid xs">network</text><text x="475" y="57" class="mid xs">computer</text><text x="150" y="80" class="xs muted">126 networks of 16,777,214 computers</text><text x="14" y="110" class="sm b">Class B</text><rect x="150" y="94" width="260" height="24" rx="4" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><rect x="410" y="94" width="260" height="24" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="156" y="111" class="mono xs b">10…</text><text x="290" y="111" class="mid xs">network</text><text x="540" y="111" class="mid xs">computer</text><text x="150" y="134" class="xs muted">16,384 networks of 65,534</text><text x="14" y="164" class="sm b">Class C</text><rect x="150" y="148" width="390" height="24" rx="4" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><rect x="540" y="148" width="130" height="24" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="156" y="165" class="mono xs b">110…</text><text x="355" y="165" class="mid xs">network</text><text x="605" y="165" class="mid xs">computer</text><text x="150" y="188" class="xs muted">2,097,152 networks of 254</text><line x1="14" y1="198" x2="706" y2="198" class="grid"/><text x="14" y="220" class="sm b">Since 1993 (CIDR): the slash says where it ends, and it can go anywhere</text><text x="14" y="252" class="sm b">/21</text><rect x="150" y="236" width="341.25" height="24" rx="4" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><rect x="491.25" y="236" width="178.75" height="24" rx="4" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="320.625" y="253" class="mid xs">network: 21 bits</text><text x="580.625" y="253" class="mid xs">11 bits</text><text x="150" y="276" class="xs muted">2,046 computers: just right for a company of 2,000, which used to need a whole class B (and waste 63,000 addresses)</text>
</svg>
<figcaption>Classes came in three sizes, and nothing in between. CIDR lets a network be any power-of-two size.</figcaption>
</figure>

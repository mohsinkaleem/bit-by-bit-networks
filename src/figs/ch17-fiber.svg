<figure class="fig">
<svg class="dia" viewBox="0 0 720 316" role="img" aria-label="Light travelling along an optical fibre by reflecting off the boundary between core and cladding, and cross-sections of multimode and single-mode fibre">
<text x="20" y="24" class="sm b">Light bounces along the core, trapped by the cladding around it</text><rect x="80" y="42" width="560" height="116" rx="58.0" class="t-teal" stroke="var(--teal)" stroke-width="2"/><rect x="80" y="60" width="560" height="80" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><path d="M84,100 L148,63 L212,137 L276,63 L340,137 L404,63 L468,137 L532,63 L596,137 L632,63" class="line s-red" stroke-width="3" marker-end="url(#ah-red)"/><rect x="20" y="82" width="56" height="36" rx="6" class="f-card" stroke="var(--ink)" stroke-width="2"/><text x="48" y="105" class="mid xs b">laser</text><rect x="644" y="82" width="62" height="36" rx="6" class="f-card" stroke="var(--ink)" stroke-width="2"/><text x="675" y="105" class="mid xs b">detector</text><rect x="150" y="170" width="16" height="12" rx="2" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="172" y="180" class="xs">core: the glass the light travels in</text><rect x="420" y="170" width="16" height="12" rx="2" class="t-teal" stroke="var(--teal)" stroke-width="1.5"/><text x="442" y="180" class="xs">cladding: different glass, which reflects it back</text><circle cx="130" cy="240" r="38" class="t-teal" stroke="var(--teal)" stroke-width="2"/><circle cx="130" cy="240" r="25" class="f-blue"/><text x="182" y="228" class="sm b">multimode</text><text x="182" y="244" class="xs">50 µm core, cheap:</text><text x="182" y="258" class="xs">a few hundred metres</text><circle cx="440" cy="240" r="38" class="t-teal" stroke="var(--teal)" stroke-width="2"/><circle cx="440" cy="240" r="5" class="f-blue"/><text x="492" y="228" class="sm b">single-mode</text><text x="492" y="244" class="xs">9 µm core, one clean path:</text><text x="492" y="258" class="xs">100 km and more</text><text x="360" y="304" class="mid xs muted">(A human hair is about 70 µm thick. The cladding of both is 125 µm across.)</text>
</svg>
<figcaption>Glass instead of copper: pulses of light, trapped inside a thread thinner than a hair.</figcaption>
</figure>

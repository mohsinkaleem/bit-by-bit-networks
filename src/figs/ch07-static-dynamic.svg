<figure class="fig">
<svg class="dia" viewBox="0 0 720 300" role="img" aria-label="A static page is read from disk; a dynamic page is produced by running a program">
<text x="20" y="36" class="slab b">A static page</text><rect x="20" y="50" width="150" height="70" rx="10" class="t-red" stroke="var(--line)"/><text x="95" y="80" class="mid b">request</text><text x="95" y="100" class="mid mono sm">GET /time</text><path d="M174,85 L236,85" class="line" marker-end="url(#ah-ink)"/><rect x="240" y="50" width="220" height="70" rx="10" class="t-teal" stroke="var(--line)"/><text x="350" y="80" class="mid b">server</text><text x="350" y="100" class="mid sm">read a file</text><use href="#disk" x="330" y="122" width="40" height="40"/><path d="M464,85 L526,85" class="line" marker-end="url(#ah-ink)"/><rect x="530" y="50" width="170" height="70" rx="10" class="t-yellow" stroke="var(--line)"/><text x="615" y="80" class="mid b">document</text><text x="615" y="100" class="mid hand">same answer every time</text><text x="20" y="176" class="slab b">A dynamic page</text><rect x="20" y="190" width="150" height="70" rx="10" class="t-red" stroke="var(--line)"/><text x="95" y="220" class="mid b">request</text><text x="95" y="240" class="mid mono sm">GET /time</text><path d="M174,225 L236,225" class="line" marker-end="url(#ah-ink)"/><rect x="240" y="190" width="220" height="70" rx="10" class="t-teal" stroke="var(--line)"/><text x="350" y="220" class="mid b">server</text><text x="350" y="240" class="mid sm">run a program</text><g transform="translate(330,264)"><rect width="40" height="34" rx="4" fill="#1d2b45"/><text x="20" y="22" class="mid mono xs" fill="#7dffa8">f(x)</text></g><path d="M464,225 L526,225" class="line" marker-end="url(#ah-ink)"/><rect x="530" y="190" width="170" height="70" rx="10" class="t-yellow" stroke="var(--line)"/><text x="615" y="220" class="mid b">document</text><text x="615" y="240" class="mid hand">a fresh answer every time</text>
</svg>
<figcaption>From the browser’s side the two look identical. Only the server knows the difference.</figcaption>
</figure>

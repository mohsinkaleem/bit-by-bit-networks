<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 310" role="img" aria-label="Five houses in a mesh: the path from house 1 to house 3 goes via house 2, and after house 2 fails, via the pub and house 4">
<path d="M140,70 L400,70" class="line s-muted" stroke-width="3"/><path d="M400,70 L400,200" class="line s-muted" stroke-width="3"/><path d="M400,200 L270,290" class="line s-muted" stroke-width="3"/><path d="M270,290 L110,230" class="line s-muted" stroke-width="3"/><path d="M110,230 L140,70" class="line s-muted" stroke-width="3"/><path d="M140,70 L400,200" class="line s-muted" stroke-width="2" stroke-dasharray="3 6"/><text x="250" y="150" class="mid xs muted">weak: 30% lost</text><g data-show="=1"><path d="M140,70 L400,70 L400,200" class="line s-green" stroke-width="6" fill="none" opacity="0.8"/></g><g data-show="=2"><path d="M140,70 L110,230 L270,290 L400,200" class="line s-green" stroke-width="6" fill="none" opacity="0.8"/><path d="M388,58 l24,24 M412,58 l-24,24" class="line s-red" stroke-width="4"/></g><circle cx="140" cy="70" r="24" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="140" y="75" class="mid xs b">house 1</text><circle cx="400" cy="70" r="24" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="400" y="75" class="mid xs b">house 2</text><circle cx="400" cy="200" r="24" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="400" y="205" class="mid xs b">house 3</text><circle cx="270" cy="290" r="24" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="270" y="295" class="mid xs b">house 4</text><circle cx="110" cy="230" r="24" class="t-yellow" stroke="var(--line)" stroke-width="1.6"/><text x="110" y="235" class="mid xs b">pub</text><path d="M86,238 L40,262" class="line s-orange" stroke-width="3"/><text x="38" y="280" class="xs b f-orange">5G: the way out</text><rect x="470" y="20" width="240" height="250" rx="10" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="484" y="42" class="xs b">house 1’s choices for house 3</text><g data-show="=1"><rect x="484" y="54" width="212" height="24" rx="5" class="t-green" stroke="var(--line)" stroke-width="1"/><text x="494" y="70" class="xs b">★ via house 2</text><text x="686" y="70" class="end xs mono b">220</text><rect x="484" y="84" width="212" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1"/><text x="494" y="100" class="xs">via house 5</text><text x="686" y="100" class="end xs mono">194</text><rect x="484" y="114" width="212" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1"/><text x="494" y="130" class="xs">direct (weak)</text><text x="686" y="130" class="end xs mono">145</text><text x="484" y="172" class="xs muted">quality out of 255, measured from</text><text x="484" y="188" class="xs muted">how many of each house’s hellos</text><text x="484" y="204" class="xs muted">get through, hop by hop</text><text x="484" y="236" class="xs b">two good hops beat one bad one</text></g><g data-show="=2"><rect x="484" y="54" width="212" height="24" rx="5" class="t-green" stroke="var(--line)" stroke-width="1"/><text x="494" y="70" class="xs b">★ via house 5</text><text x="686" y="70" class="end xs mono b">198</text><rect x="484" y="84" width="212" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1"/><text x="494" y="100" class="xs">direct (weak)</text><text x="686" y="100" class="end xs mono">(lower)</text><rect x="484" y="114" width="212" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1"/><text x="494" y="130" class="xs">via house 2</text><text x="686" y="130" class="end xs mono">gone</text><text x="484" y="172" class="xs muted">quality out of 255, measured from</text><text x="484" y="188" class="xs muted">how many of each house’s hellos</text><text x="484" y="204" class="xs muted">get through, hop by hop</text><text x="484" y="236" class="xs b">about 5 s of silence, then a new path</text></g>
</svg>
<ol class="steps"><li>Every second, each house broadcasts a small “hello, I’m here” message, and every house passes on the ones it hears. From how many arrive through each neighbour, house 1 rates every path to house 3. The direct link across the green loses too much; two clean hops through house 2 are better.</li><li>House 2’s radio breaks. Its hellos stop, and for about five seconds house 1’s pings go nowhere. Then the ratings catch up, and house 1 sends through the pub and house 4 instead: three hops, but three good ones.</li></ol>
<figcaption>This chapter’s lab, run on Grandpa’s Pi: the real ratings, from <code>batctl originators</code>.</figcaption>
</figure>

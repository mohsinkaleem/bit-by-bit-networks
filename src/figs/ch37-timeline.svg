<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 391.5" role="img" aria-label="The real sequence of packets when the Pi fetched example.org: ARP, DNS, TCP handshake, TLS handshake, HTTP/2 request and response, and closing, with times">
<text x="110" y="28" class="mid slab b">Grandpa’s Pi</text><line x1="110" y1="36" x2="110" y2="385.5" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="330" y="28" class="mid slab b">router</text><line x1="330" y1="36" x2="330" y2="385.5" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="610" y="28" class="mid slab b">example.org</text><line x1="610" y1="36" x2="610" y2="385.5" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="381.5" class="xs muted">time ↓</text><g data-show="1"><line x1="110" y1="44.2" x2="330" y2="58.9" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="220" y="44.55" class="mid mono sm b halo">ARP: who has 192.168.1.1?</text><text x="220" y="67.55" class="mid xs muted halo">0.0 ms</text></g><g data-show="1"><line x1="330" y1="65.2" x2="110" y2="79.9" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="220" y="65.55" class="mid mono sm b halo">ARP: it’s me</text><text x="220" y="88.55" class="mid xs muted halo">5.1 ms</text></g><g data-show="2"><line x1="110" y1="90.4" x2="330" y2="105.1" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="220" y="90.75" class="mid mono sm b halo">DNS: A? AAAA? example.org</text><text x="220" y="113.75" class="mid xs muted halo">5.1 ms</text></g><g data-show="2"><line x1="330" y1="113.5" x2="110" y2="128.2" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="220" y="113.85" class="mid mono sm b halo">DNS: 172.66.157.237 …</text><text x="220" y="136.85" class="mid xs muted halo">42.5 ms</text></g><g data-show="3"><line x1="110" y1="140.8" x2="610" y2="161.8" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="285" y="141.15" class="mid mono sm b halo">SYN</text><text x="285" y="164.15" class="mid xs muted halo">42.7 ms</text></g><g data-show="3"><line x1="610" y1="168.1" x2="110" y2="189.1" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="285" y="174.75" class="mid mono sm b halo">SYN, ACK</text><text x="285" y="197.75" class="mid xs muted halo">80.6 ms</text></g><g data-show="4"><line x1="110" y1="197.5" x2="610" y2="218.5" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="310" y="198.9" class="mid mono sm b halo">ACK + ClientHello (1,571 bytes)</text><text x="310" y="221.9" class="mid xs muted halo">80.6 – 83.1 ms</text></g><g data-show="4"><line x1="610" y1="226.9" x2="110" y2="247.9" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="335" y="231.45" class="mid mono sm b halo">ServerHello, 🔒 certificate, signature, Finished</text><text x="335" y="254.45" class="mid xs muted halo">124.9 – 127.9 ms</text></g><g data-show="5"><line x1="110" y1="256.3" x2="610" y2="277.3" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="310" y="257.7" class="mid mono sm b halo">🔒 Finished + 🔒 HTTP/2 GET /</text><text x="310" y="280.7" class="mid xs muted halo">131.4 – 131.9 ms</text></g><g data-show="5"><line x1="610" y1="285.7" x2="110" y2="306.7" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="335" y="290.25" class="mid mono sm b halo">🔒 HEADERS 200 OK, DATA 713 bytes</text><text x="335" y="313.25" class="mid xs muted halo">171.0 – 174.6 ms</text></g><g data-show="6"><line x1="110" y1="315.1" x2="610" y2="336.1" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="310" y="316.5" class="mid mono sm b halo">🔒 GOAWAY, close_notify, FIN</text><text x="310" y="339.5" class="mid xs muted halo">174.6 – 175.6 ms</text></g><g data-show="6"><line x1="610" y1="344.5" x2="110" y2="365.5" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="310" y="350.1" class="mid mono sm b halo">FIN, ACK</text><text x="310" y="373.1" class="mid xs muted halo">211.7 ms</text></g>
</svg>
<ol class="steps"><li>The Pi’s ARP cache was emptied first, so it has to ask for the router’s MAC address: 5 ms over Wi-Fi.</li><li>Two DNS questions at once, for an IPv4 and an IPv6 address. The router had to ask upstream: 37 ms. (The Pi has no global IPv6, Chapter 25, so it will use IPv4.)</li><li>The TCP handshake to the nearest Cloudflare site: 38 ms, one round trip.</li><li>curl’s ClientHello is 1,571 bytes, too big for one TCP segment, because it carries a post-quantum key share as well as an X25519 one (Chapter 42). The server answers with everything at once, the certificate chain encrypted.</li><li>One round trip after the ClientHello, the request goes out, in the same breath as the client’s Finished. Forty milliseconds later, the page comes back: 713 bytes, from the CDN’s cache.</li><li>curl only wanted one page, so it says goodbye three ways: an HTTP/2 GOAWAY, a TLS close_notify, and a TCP FIN. 175 ms from the first packet to the page.</li></ol>
<figcaption>Everything that happened when the Pi fetched <code>https://example.org/</code> with curl, from a real capture decrypted with its keys.</figcaption>
</figure>

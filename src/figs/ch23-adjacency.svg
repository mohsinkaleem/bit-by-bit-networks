<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 484.2" role="img" aria-label="The OSPF messages exchanged by two routers becoming neighbours, from a real capture: hellos, database descriptions, requests, updates and acknowledgements">
<text x="150" y="28" class="mid slab b">library (10.255.0.1)</text><line x1="150" y1="36" x2="150" y2="478.20000000000005" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="570" y="28" class="mid slab b">main (10.255.0.3)</text><line x1="570" y1="36" x2="570" y2="478.20000000000005" class="line s-muted" stroke-width="2" stroke-dasharray="2 5"/><text x="14" y="474.20000000000005" class="xs muted">time ↓</text><g data-show="1"><line x1="150" y1="50.2" x2="570" y2="67.2" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="51.7" class="mid mono sm b halo">Hello: “I can hear: nobody”</text><text x="360" y="74.7" class="mid xs muted halo">0.000 s, to 224.0.0.5</text></g><g data-show="1"><line x1="570" y1="87.6" x2="150" y2="104.6" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="89.1" class="mid mono sm b halo">Hello: “I can hear: nobody”</text><text x="360" y="112.1" class="mid xs muted halo">0.005 s</text></g><g data-show="2"><circle cx="150" cy="131.8" r="5" class="f-ink"/><text x="164" y="136.8" class="hand  halo" text-anchor="start">…10 seconds…</text></g><g data-show="2"><line x1="150" y1="155.6" x2="570" y2="172.6" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="157.1" class="mid mono sm b halo">Hello: “I can hear: 10.255.0.3”</text><text x="360" y="180.1" class="mid xs muted halo">10.001 s: both know the cable works both ways</text></g><g data-show="3"><line x1="570" y1="210" x2="150" y2="227" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="211.5" class="mid mono sm b halo">Database Description: “here’s what I know”</text><text x="360" y="234.5" class="mid xs muted halo">a list of advertisements: who, and which sequence number</text></g><g data-show="3"><line x1="150" y1="257.6" x2="570" y2="274.6" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="259.1" class="mid mono sm b halo">Database Description: “and here’s mine”</text></g><g data-show="4"><line x1="570" y1="305.2" x2="150" y2="322.2" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="306.7" class="mid mono sm b halo">LS Request: “send me yours, please”</text></g><g data-show="4"><line x1="150" y1="352.8" x2="570" y2="369.8" class="line s-navy" stroke-width="2.5" marker-end="url(#ah-ink)"/><text x="360" y="354.3" class="mid mono sm b halo">LS Update: the advertisements themselves</text><text x="360" y="377.3" class="mid xs muted halo">all in the same millisecond</text></g><g data-show="5"><line x1="570" y1="407.2" x2="150" y2="424.2" class="line s-purple" stroke-width="2.5" marker-end="url(#ah-purple)"/><text x="360" y="408.7" class="mid mono sm b halo">LS Acknowledge: “got them”</text><text x="360" y="431.7" class="mid xs muted halo">12.502 s</text></g><g data-show="5"><circle cx="150" cy="458.2" r="5" class="f-ink"/><text x="164" y="463.2" class="hand f-green halo" text-anchor="start">Full: same database on both sides</text></g>
</svg>
<ol class="steps"><li>Each router multicasts a Hello every 10 seconds on each cable, to 224.0.0.5 (“all OSPF routers”). It says who it is, how often it says hello, how long to wait before giving up on a neighbour, and which routers it can already hear. Neither can hear the other yet.</li><li>Ten seconds later, each Hello lists the other router. Now both know the cable works in both directions, and they’re neighbours (“2-Way”).</li><li>They compare notes. Each sends a short summary of the advertisements in its database, without the details.</li><li>Each asks for whatever the other has and it doesn’t (or has a newer copy of), and gets the full advertisements back.</li><li>Every advertisement received is acknowledged, or it would be sent again. When nothing is missing on either side, the neighbours are <strong>Full</strong>, and any change from now on is flooded to them straight away.</li></ol>
<figcaption>Two real routers becoming neighbours, from this chapter’s capture (<code>labs/ch23/ospf.pcap</code>).</figcaption>
</figure>

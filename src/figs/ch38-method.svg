<figure class="fig">
<svg class="dia" viewBox="0 0 720 324" role="img" aria-label="The troubleshooting ladder: from the link, through addresses, the router, the internet, names and ports, up to the application, with a tool for each">
<rect x="60" y="16" width="600" height="34" rx="7" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="74" y="38" class="sm b">the web page, or the app</text><text x="290" y="38" class="xs mono">curl -v https://example.org/ · openssl s_client</text><text x="650" y="38" class="end xs muted">ch. 30, 32, 33</text><text x="40" y="38" class="mid sm b muted">7</text><rect x="60" y="56" width="600" height="34" rx="7" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="74" y="78" class="sm b">the port</text><text x="290" y="78" class="xs mono">nc -vz example.org 443 · ss -tn</text><text x="650" y="78" class="end xs muted">ch. 26, 27</text><text x="40" y="78" class="mid sm b muted">6</text><rect x="60" y="96" width="600" height="34" rx="7" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="74" y="118" class="sm b">names</text><text x="290" y="118" class="xs mono">dig example.org · dig @1.1.1.1 · dig +tcp</text><text x="650" y="118" class="end xs muted">ch. 29</text><text x="40" y="118" class="mid sm b muted">5</text><rect x="60" y="136" width="600" height="34" rx="7" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="74" y="158" class="sm b">the internet, by address</text><text x="290" y="158" class="xs mono">ping 1.1.1.1 · traceroute · mtr · tracepath</text><text x="650" y="158" class="end xs muted">ch. 21, 23, 24</text><text x="40" y="158" class="mid sm b muted">4</text><rect x="60" y="176" width="600" height="34" rx="7" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="74" y="198" class="sm b">the router</text><text x="290" y="198" class="xs mono">ping 192.168.1.1 · arp -a / ip neigh</text><text x="650" y="198" class="end xs muted">ch. 21, 22</text><text x="40" y="198" class="mid sm b muted">3</text><rect x="60" y="216" width="600" height="34" rx="7" class="t-teal" stroke="var(--teal)" stroke-width="1.5"/><text x="74" y="238" class="sm b">an address, and a route</text><text x="290" y="238" class="xs mono">ifconfig / ip addr · route get / ip route</text><text x="650" y="238" class="end xs muted">ch. 20, 22</text><text x="40" y="238" class="mid sm b muted">2</text><rect x="60" y="256" width="600" height="34" rx="7" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="74" y="278" class="sm b">the link itself</text><text x="290" y="278" class="xs mono">is it connected? Wi-Fi signal · cable light</text><text x="650" y="278" class="end xs muted">ch. 17, 18, 19</text><text x="40" y="278" class="mid sm b muted">1</text><path d="M30,286 L30,26" class="line s-orange" stroke-width="3" marker-end="url(#ah-orange)"/><text x="360" y="312" class="mid xs b">Start at the bottom, and stop at the first thing that fails: everything above it will fail too.</text>
</svg>
<figcaption>The detective’s ladder. Each rung depends on the ones below it, so a failure low down makes everything above look broken too.</figcaption>
</figure>

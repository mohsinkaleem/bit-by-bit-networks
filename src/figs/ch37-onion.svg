<figure class="fig">
<svg class="dia" viewBox="0 0 720 318" role="img" aria-label="The nested layers of one real packet: Ethernet, IPv4, TCP, a TLS record, and inside it the encrypted HTTP/2 frames">
<text x="20" y="22" class="xs b">Frame 23 of the capture: curl’s HTTP/2 request, 189 bytes on the wire</text><rect x="20" y="34" width="680" height="256" rx="10" class="t-teal" stroke="var(--teal)" stroke-width="1.5"/><text x="32" y="54" class="xs b">Ethernet (Wi-Fi) header: 14 bytes</text><text x="688" y="54" class="end xs muted">ch. 19, 18</text><rect x="36" y="64" width="648" height="218" rx="10" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="48" y="84" class="xs b">IPv4 header: 20 bytes</text><text x="672" y="84" class="end xs muted">ch. 20</text><rect x="52" y="94" width="616" height="180" rx="10" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="64" y="114" class="xs b">TCP header: 32 bytes</text><text x="656" y="114" class="end xs muted">ch. 27</text><rect x="68" y="124" width="584" height="142" rx="10" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="80" y="144" class="xs b">TLS record header: 5 bytes</text><text x="640" y="144" class="end xs muted">ch. 32</text><rect x="84" y="160" width="552" height="90" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="6 3"/><text x="96" y="178" class="xs b">🔒 encrypted (101 bytes of HTTP/2, + 1 byte of real type):  ch. 33</text><rect x="100" y="186" width="100.8" height="36" rx="4" class="f-card" stroke="var(--line)"/><text x="150.4" y="201" class="mid xs b">HTTP/2 preface</text><text x="150.4" y="215" class="mid xs muted">24 bytes</text><rect x="204.8" y="186" width="113.4" height="36" rx="4" class="f-card" stroke="var(--line)"/><text x="261.5" y="201" class="mid xs b">SETTINGS</text><text x="261.5" y="215" class="mid xs muted">27 bytes</text><rect x="322.2" y="186" width="100" height="36" rx="4" class="f-card" stroke="var(--line)"/><text x="372.2" y="201" class="mid xs b">WINDOW_UPDATE</text><text x="372.2" y="215" class="mid xs muted">13 bytes</text><rect x="426.2" y="186" width="155.4" height="36" rx="4" class="f-card" stroke="var(--line)"/><text x="503.9" y="201" class="mid xs b">HEADERS</text><text x="503.9" y="215" class="mid xs muted">37 bytes</text><text x="100" y="240" class="xs muted">9 + 28: GET / and 5 more headers, 127 bytes as text, 28 compressed</text><rect x="585.6" y="186" width="40" height="36" rx="4" class="t-purple" stroke="var(--purple)"/><text x="605.6" y="201" class="mid xs b">tag</text><text x="605.6" y="215" class="mid xs muted">16</text><text x="360" y="308" class="mid xs">14 + 20 + 32 + 5 + 101 + 1 + 16 = 189. Everything outside the green box, a router can read.</text>
</svg>
<figcaption>One packet, every layer: the request itself, from the same capture.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 346" role="img" aria-label="Our inventions arranged as layers next to the internet&#x27;s layer names">
<text x="150" y="22" class="mid slab b">What we built</text><text x="441" y="22" class="mid slab b">What the internet calls it</text><text x="634" y="22" class="mid slab b">Who reads it</text><rect x="10" y="36" width="282" height="50" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="22" y="58" class="sm b">Programs talk: web pages, names</text><text x="22" y="76" class="xs muted">Ch. 4–7, 14</text><path d="M298,61 l26,0" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="334" y="36" width="214" height="50" rx="8" class="t-purple" stroke="var(--purple)" stroke-width="2"/><text x="346" y="58" class="sm b">Application layer</text><text x="346" y="76" class="xs">HTTP, DNS, email…</text><text x="634" y="66" class="mid xs">programs</text><rect x="10" y="94" width="282" height="50" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="22" y="116" class="sm b">Ports, datagrams, reliable connections</text><text x="22" y="134" class="xs muted">Ch. 12–13</text><path d="M298,119 l26,0" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="334" y="94" width="214" height="50" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="346" y="116" class="sm b">Transport layer</text><text x="346" y="134" class="xs">TCP, UDP</text><text x="634" y="124" class="mid xs">your operating system</text><rect x="10" y="152" width="282" height="50" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="22" y="174" class="sm b">Packets, network addresses, routers</text><text x="22" y="192" class="xs muted">Ch. 10–11</text><path d="M298,177 l26,0" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="334" y="152" width="214" height="50" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="346" y="174" class="sm b">Internet layer</text><text x="346" y="192" class="xs">IP (with ARP, ICMP)</text><text x="634" y="182" class="mid xs">routers</text><rect x="10" y="210" width="282" height="50" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="22" y="232" class="sm b">Frames, card addresses, switches, checks</text><text x="22" y="250" class="xs muted">Ch. 3, 8–10</text><path d="M298,235 l26,0" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="334" y="210" width="214" height="50" rx="8" class="t-blue" stroke="var(--blue)" stroke-width="2"/><text x="346" y="232" class="sm b">Link layer</text><text x="346" y="250" class="xs">Ethernet, Wi-Fi</text><text x="634" y="240" class="mid xs">switches, network cards</text><rect x="10" y="268" width="282" height="50" rx="8" class="t-red" stroke="var(--red)" stroke-width="2"/><text x="22" y="290" class="sm b">Bits on wires, light and radio</text><text x="22" y="308" class="xs muted">Ch. 1–2</text><path d="M298,293 l26,0" class="line s-muted" stroke-width="2" marker-end="url(#ah-muted)"/><rect x="334" y="268" width="214" height="50" rx="8" class="t-red" stroke="var(--red)" stroke-width="2"/><text x="346" y="290" class="sm b">Physical layer</text><text x="346" y="308" class="xs">copper, fiber, radio</text><text x="634" y="298" class="mid xs">cables, antennas</text><text x="360" y="334" class="mid hand">Each layer only reads its own header, and trusts the layer below to deliver.</text>
</svg>
<figcaption>The same stack, two sets of names.</figcaption>
</figure>

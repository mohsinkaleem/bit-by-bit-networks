<figure class="fig">
<svg class="dia" viewBox="0 0 720 234" role="img" aria-label="A real Set-Cookie header from google.com with each attribute explained">
<text x="14" y="22" class="mono sm b">Set-Cookie:</text><rect x="20" y="36" width="147.4" height="24" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="28" y="52" class="mono xs b">AEC=Aaa9EJpU_M6UK…</text><text x="260" y="52" class="xs">the name and value: a random identifier</text><line x1="171.4" y1="48" x2="252" y2="48" class="line s-line" stroke-width="1"/><rect x="20" y="68" width="191.2" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="28" y="84" class="mono xs b">expires=Sat, 27-Mar-2027</text><text x="260" y="84" class="xs">keep it for six months (or: Max-Age=seconds)</text><line x1="215.2" y1="80" x2="252" y2="80" class="line s-line" stroke-width="1"/><rect x="20" y="100" width="205.8" height="24" rx="5" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="28" y="116" class="mono xs b">path=/; domain=.google.com</text><text x="260" y="116" class="xs">send it back for every page on google.com and its subdomains</text><line x1="229.8" y1="112" x2="252" y2="112" class="line s-line" stroke-width="1"/><rect x="20" y="132" width="59.8" height="24" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="28" y="148" class="mono xs b">Secure</text><text x="260" y="148" class="xs">only ever send it over HTTPS</text><line x1="83.8" y1="144" x2="252" y2="144" class="line s-line" stroke-width="1"/><rect x="20" y="164" width="74.4" height="24" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="28" y="180" class="mono xs b">HttpOnly</text><text x="260" y="180" class="xs">the page’s JavaScript can’t read it, so a malicious script can’t steal it</text><line x1="98.4" y1="176" x2="252" y2="176" class="line s-line" stroke-width="1"/><rect x="20" y="196" width="103.6" height="24" rx="5" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="28" y="212" class="mono xs b">SameSite=lax</text><text x="260" y="212" class="xs">don’t send it when another site sends you here with a form, or loads it in a frame</text><line x1="127.6" y1="208" x2="252" y2="208" class="line s-line" stroke-width="1"/>
</svg>
<figcaption>One of the cookies <code>www.google.com</code> set on a first visit (its value shortened). The green attributes are all about security.</figcaption>
</figure>

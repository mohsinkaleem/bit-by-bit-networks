<figure class="fig">
<svg class="dia" viewBox="0 0 720 336" role="img" aria-label="Nested layers on a Mac: macOS, a Linux VM, Podman&#x27;s rootless network namespace, a bridge, and containers on veth cables">
<rect x="10" y="10" width="700" height="316" rx="14" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="24" y="32" class="sm b">Bob’s MacBook (macOS)</text><text x="24" y="50" class="xs">gvproxy listens on :8036, and passes connections into the VM</text><rect x="40" y="64" width="650" height="250" rx="12" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="54" y="86" class="xs b">a Linux virtual machine: enp0s1 192.168.127.2, gateway 192.168.127.1 (gvproxy again)</text><rect x="70" y="100" width="600" height="200" rx="12" class="t-purple" stroke="var(--purple)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="84" y="122" class="xs b">Podman’s rootless network namespace (pasta gives it a copy of enp0s1)</text><rect x="100" y="136" width="540" height="34" rx="8" class="t-teal" stroke="var(--teal)" stroke-width="1.6"/><text x="370" y="158" class="mid xs b">podman1: a bridge · 10.89.0.1 · aardvark-dns answers names here</text><path d="M190,170 L190,218" class="line s-muted" stroke-width="3"/><text x="198" y="198" class="xs mono muted">veth0</text><rect x="120" y="218" width="140" height="64" rx="8" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="190" y="242" class="mid xs b">container “web”</text><text x="190" y="262" class="mid xs mono">10.89.0.4</text><path d="M370,170 L370,218" class="line s-muted" stroke-width="3"/><text x="378" y="198" class="xs mono muted">veth1</text><rect x="300" y="218" width="140" height="64" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="1.6"/><text x="370" y="242" class="mid xs b">container “db”</text><text x="370" y="262" class="mid xs mono">10.89.0.5</text><path d="M550,170 L550,218" class="line s-muted" stroke-width="3"/><text x="558" y="198" class="xs mono muted">veth2</text><rect x="480" y="218" width="140" height="64" rx="8" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="550" y="242" class="mid xs b">container “pub”</text><text x="550" y="262" class="mid xs mono">port 80 ⇐ Mac’s 8036</text>
</svg>
<figcaption>The real layers behind <code>podman run</code> on Bob’s MacBook. Containers need a Linux kernel, so on a Mac they run inside a small Linux VM, and inside that, in namespaces, the same bridge-and-veth picture as the Pi.</figcaption>
</figure>

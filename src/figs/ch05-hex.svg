<figure class="fig">
<svg class="dia" viewBox="0 0 720 246" role="img" aria-label="A byte split into two 4-bit halves, each written as one hexadecimal digit">
<text x="40" y="34" class="hand lg">the letter</text><text x="40" y="78" class="slab b" style="font-size:48px">H</text><path d="M84,64 L128,64" class="line" marker-end="url(#ah-ink)"/><text x="106" y="54" class="mid mono sm muted">72</text><rect x="140" y="42" width="32" height="40" rx="5" class="t-red" stroke="var(--line)"/><text x="156" y="69" class="mid mono lg b">0</text><rect x="176" y="42" width="32" height="40" rx="5" class="t-green" stroke="var(--line)"/><text x="192" y="69" class="mid mono lg b">1</text><rect x="212" y="42" width="32" height="40" rx="5" class="t-red" stroke="var(--line)"/><text x="228" y="69" class="mid mono lg b">0</text><rect x="248" y="42" width="32" height="40" rx="5" class="t-red" stroke="var(--line)"/><text x="264" y="69" class="mid mono lg b">0</text><rect x="298" y="42" width="32" height="40" rx="5" class="t-green" stroke="var(--line)"/><text x="314" y="69" class="mid mono lg b">1</text><rect x="334" y="42" width="32" height="40" rx="5" class="t-red" stroke="var(--line)"/><text x="350" y="69" class="mid mono lg b">0</text><rect x="370" y="42" width="32" height="40" rx="5" class="t-red" stroke="var(--line)"/><text x="386" y="69" class="mid mono lg b">0</text><rect x="406" y="42" width="32" height="40" rx="5" class="t-red" stroke="var(--line)"/><text x="422" y="69" class="mid mono lg b">0</text><path d="M142,92 L142,100 L282,100 L282,92" class="line s-muted"/><path d="M300,92 L300,100 L440,100 L440,92" class="line s-muted"/><text x="212" y="130" class="mid mono b">0100 = 4</text><text x="370" y="130" class="mid mono b">1000 = 8</text><path d="M458,64 L500,64" class="line" marker-end="url(#ah-ink)"/><rect x="508" y="36" width="120" height="56" rx="10" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="568" y="74" class="mid mono xl b">0x48</text><text x="568" y="112" class="mid hand">“hex 48”</text><text x="40" y="170" class="sm b">The 16 hex digits, and the 4 bits each one stands for:</text><rect x="40" y="182" width="36" height="52" rx="5" class="card"/><text x="58" y="204" class="mid mono lg b">0</text><text x="58" y="224" class="mid mono xs muted">0000</text><rect x="80" y="182" width="36" height="52" rx="5" class="card"/><text x="98" y="204" class="mid mono lg b">1</text><text x="98" y="224" class="mid mono xs muted">0001</text><rect x="120" y="182" width="36" height="52" rx="5" class="card"/><text x="138" y="204" class="mid mono lg b">2</text><text x="138" y="224" class="mid mono xs muted">0010</text><rect x="160" y="182" width="36" height="52" rx="5" class="card"/><text x="178" y="204" class="mid mono lg b">3</text><text x="178" y="224" class="mid mono xs muted">0011</text><rect x="200" y="182" width="36" height="52" rx="5" class="card"/><text x="218" y="204" class="mid mono lg b">4</text><text x="218" y="224" class="mid mono xs muted">0100</text><rect x="240" y="182" width="36" height="52" rx="5" class="card"/><text x="258" y="204" class="mid mono lg b">5</text><text x="258" y="224" class="mid mono xs muted">0101</text><rect x="280" y="182" width="36" height="52" rx="5" class="card"/><text x="298" y="204" class="mid mono lg b">6</text><text x="298" y="224" class="mid mono xs muted">0110</text><rect x="320" y="182" width="36" height="52" rx="5" class="card"/><text x="338" y="204" class="mid mono lg b">7</text><text x="338" y="224" class="mid mono xs muted">0111</text><rect x="360" y="182" width="36" height="52" rx="5" class="card"/><text x="378" y="204" class="mid mono lg b">8</text><text x="378" y="224" class="mid mono xs muted">1000</text><rect x="400" y="182" width="36" height="52" rx="5" class="card"/><text x="418" y="204" class="mid mono lg b">9</text><text x="418" y="224" class="mid mono xs muted">1001</text><rect x="440" y="182" width="36" height="52" rx="5" class="card"/><text x="458" y="204" class="mid mono lg b">A</text><text x="458" y="224" class="mid mono xs muted">1010</text><rect x="480" y="182" width="36" height="52" rx="5" class="card"/><text x="498" y="204" class="mid mono lg b">B</text><text x="498" y="224" class="mid mono xs muted">1011</text><rect x="520" y="182" width="36" height="52" rx="5" class="card"/><text x="538" y="204" class="mid mono lg b">C</text><text x="538" y="224" class="mid mono xs muted">1100</text><rect x="560" y="182" width="36" height="52" rx="5" class="card"/><text x="578" y="204" class="mid mono lg b">D</text><text x="578" y="224" class="mid mono xs muted">1101</text><rect x="600" y="182" width="36" height="52" rx="5" class="card"/><text x="618" y="204" class="mid mono lg b">E</text><text x="618" y="224" class="mid mono xs muted">1110</text><rect x="640" y="182" width="36" height="52" rx="5" class="card"/><text x="658" y="204" class="mid mono lg b">F</text><text x="658" y="224" class="mid mono xs muted">1111</text>
</svg>
<figcaption>Split a byte in half and each half is one hex digit. Two hex digits = one byte, always.</figcaption>
</figure>

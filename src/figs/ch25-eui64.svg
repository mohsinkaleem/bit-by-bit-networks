<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 256" role="img" aria-label="Building an EUI-64 interface ID from the router&#x27;s MAC address 14:c3:5e:40:0b:32: insert ff:fe and flip the universal/local bit">
<text x="14" y="24" class="sm b">Bob’s router’s card address</text><g data-show="1"><rect x="40" y="36" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="60" y="56" class="mid mono b">14</text><rect x="86" y="36" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="106" y="56" class="mid mono b">c3</text><rect x="132" y="36" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="152" y="56" class="mid mono b">5e</text><rect x="178" y="36" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="198" y="56" class="mid mono b">40</text><rect x="224" y="36" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="244" y="56" class="mid mono b">0b</text><rect x="270" y="36" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="290" y="56" class="mid mono b">32</text></g><g data-show="2"><rect x="40" y="96" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="60" y="116" class="mid mono b">14</text><rect x="86" y="96" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="106" y="116" class="mid mono b">c3</text><rect x="132" y="96" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="152" y="116" class="mid mono b">5e</text><rect x="178" y="96" width="40" height="30" rx="5" class="t-yellow" stroke="var(--yellow)"/><text x="198" y="116" class="mid mono b">ff</text><rect x="224" y="96" width="40" height="30" rx="5" class="t-yellow" stroke="var(--yellow)"/><text x="244" y="116" class="mid mono b">fe</text><rect x="270" y="96" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="290" y="116" class="mid mono b">40</text><rect x="316" y="96" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="336" y="116" class="mid mono b">0b</text><rect x="362" y="96" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="382" y="116" class="mid mono b">32</text></g><g data-show="2"><text x="430" y="116" class="xs b f-orange">← split it in half, and put ff:fe in the middle</text></g><g data-show="3"><rect x="40" y="156" width="40" height="30" rx="5" class="t-red" stroke="var(--red)"/><text x="60" y="176" class="mid mono b">16</text><rect x="86" y="156" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="106" y="176" class="mid mono b">c3</text><rect x="132" y="156" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="152" y="176" class="mid mono b">5e</text><rect x="178" y="156" width="40" height="30" rx="5" class="t-yellow" stroke="var(--yellow)"/><text x="198" y="176" class="mid mono b">ff</text><rect x="224" y="156" width="40" height="30" rx="5" class="t-yellow" stroke="var(--yellow)"/><text x="244" y="176" class="mid mono b">fe</text><rect x="270" y="156" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="290" y="176" class="mid mono b">40</text><rect x="316" y="156" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="336" y="176" class="mid mono b">0b</text><rect x="362" y="156" width="40" height="30" rx="5" class="f-card" stroke="var(--line)"/><text x="382" y="176" class="mid mono b">32</text></g><g data-show="3"><text x="430" y="170" class="xs b f-red">← flip one bit: 14 = 0001 0100 becomes</text><text x="430" y="184" class="xs b f-red">16 = 0001 0110 (Chapter 18’s “chosen by software” bit)</text></g><g data-show="4"><text x="40" y="240" class="mono lg b">fe80::<tspan class="f-green">16c3:5eff:fe40:b32</tspan></text><text x="430" y="236" class="xs b f-green">← the router’s real link-local address</text></g>
</svg>
<ol class="steps"><li>An Ethernet or Wi-Fi card address is 48 bits (Chapter 18). But the interface part of an IPv6 address is 64.</li><li>The old recipe, called <strong>EUI-64</strong>, stretches it: cut it in half, and put the two bytes ff and fe in the middle.</li><li>Then flip the bit that says whether the address was chosen by software. (It’s flipped so that simple, hand-typed interface IDs like ::1 count as “chosen by software”.)</li><li>Stick fe80:: on the front, and that’s the link-local address Bob’s router really has. Look for ff:fe in the middle of an address: it usually means there’s a card address inside. This chapter’s lab finds them.</li></ol>
<figcaption>How a card address becomes the second half of an IPv6 address.</figcaption>
</figure>

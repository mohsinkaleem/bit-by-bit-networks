<figure class="fig">
<svg class="dia" viewBox="0 0 720 196" role="img" aria-label="A chain of two real redirects from http://bbc.co.uk/ to https://www.bbc.co.uk/">
<rect x="20" y="30" width="200" height="70" rx="10" class="t-orange" stroke="var(--orange)" stroke-width="1.8"/><text x="120" y="52" class="mid mono xs b">http://bbc.co.uk/</text><text x="120" y="72" class="mid xs b">301 Moved Permanently</text><text x="120" y="90" class="mid mono xs">Location: https://bbc.co.uk/</text><path d="M224,65 L256,65" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><rect x="260" y="30" width="200" height="70" rx="10" class="t-orange" stroke="var(--orange)" stroke-width="1.8"/><text x="360" y="52" class="mid mono xs b">https://bbc.co.uk/</text><text x="360" y="72" class="mid xs b">301 Moved Permanently</text><text x="360" y="90" class="mid mono xs">Location: https://www.bbc.co.uk/</text><path d="M464,65 L496,65" class="line" stroke-width="2.5" marker-end="url(#ah-ink)"/><rect x="500" y="30" width="200" height="70" rx="10" class="t-green" stroke="var(--green)" stroke-width="1.8"/><text x="600" y="52" class="mid mono xs b">https://www.bbc.co.uk/</text><text x="600" y="72" class="mid xs b">200 OK</text><text x="600" y="90" class="mid mono xs">the page</text><text x="20" y="130" class="xs">1. Plain http:// to https://, so everything after this is encrypted.</text><text x="20" y="148" class="xs">2. The bare name to the www one: the BBC’s website lives at a single name.</text><text x="20" y="166" class="xs">Both HTTPS answers also say Strict-Transport-Security: max-age=31536000; preload, which tells the browser:</text><text x="20" y="184" class="xs b">“for the next year, never even try http:// for this site”. Then step 1 never happens again.</text>
</svg>
<figcaption>A real chain of redirects, from <code>httpclient.py redirects http://bbc.co.uk/</code>.</figcaption>
</figure>

6" class="mono sm b">A = 0x4000</text><rect x="534" y="174" width="100" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="546" y="196" class="mono sm b">X = 0</text></g><g data-show="=7"><rect x="662.2" y="47" width="20.8" height="24" rx="4" class="f-none s-red" stroke-width="3"/><rect x="372" y="174" width="150" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="384" y="196" class="mono sm b">A = 0x4000</text><rect x="534" y="174" width="100" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="546" y="196" class="mono sm b">X = 20</text></g><g data-show="=8"><rect x="454.2" y="95" width="20.8" height="24" rx="4" class="f-none s-red" stroke-width="3"/><rect x="475.0" y="95" width="20.8" height="24" rx="4" class="f-none s-red" stroke-width="3"/><rect x="372" y="174" width="150" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="384" y="196" class="mono sm b">A = 80</text><rect x="534" y="174" width="100" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="546" y="196" class="mono sm b">X = 20</text></g><g data-show="=9"><rect x="372" y="174" width="150" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="384" y="196" class="mono sm b">A = 80</text><rect x="534" y="174" width="100" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="546" y="196" class="mono sm b">X = 20</text></g><g data-show="=10"><rect x="372" y="174" width="150" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="384" y="196" class="mono sm b">A = 80</text><rect x="534" y="174" width="100" height="34" rx="6" class="f-card" stroke="var(--ink)" stroke-width="1.5"/><text x="546" y="196" class="mono sm b">X = 20</text></g><text x="372" y="228" class="xs muted">the two registers, after this step</text>
</svg>
<ol class="steps"><li><code>ldh [12]</code>: load 2 bytes from offset 12 into register A. That’s the frame’s “what’s inside” field: 0x0800, an IPv4 packet.</li><li><code>jeq #0x800</code>: is A equal to 0x0800? Yes, so carry on to instruction 2. (If not, jump to 10, which throws the packet away.)</li><li><code>ldb [23]</code>: load 1 byte from offset 23: the IP header’s “what’s inside” field. It’s 6, meaning TCP.</li><li><code>jeq #0x6</code>: TCP? Yes. A name lookup (UDP, 17) would fail right here and jump to 10.</li><li><code>ldh [20]</code>: load the IP header’s flags and fragment position. 0x4000 is just the “don’t chop me up” flag.</li><li><code>jset #0x1fff</code>: are any of the fragment-position bits set? No: this is a whole packet (or its first piece), so the TCP header is really here (Chapter 20).</li><li><code>ldxb 4*([14]&amp;0xf)</code>: IP headers can vary in length, so find where TCP starts. Byte 14 is 0x45, and 4 × 5 = 20 goes into register X.</li><li><code>ldh [x + 16]</code>: load 2 bytes at 14 + 20 + 2 = offset 36: the TCP destination port. 0x0050 is 80.</li><li><code>jeq #0x50</code>: port 80? Yes!</li><li><code>ret #262144</code>: keep it. The number is how many bytes of it to copy up to <code>tcpdump</code>, and 262,144 means “all of it”. Nine small steps, a few nanoseconds.</li></ol>
<figcaption>The filter <code>ip and tcp dst port 80</code>, compiled by tcpdump, running on one real packet.</figcaption>
</figure>

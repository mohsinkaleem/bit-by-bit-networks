<figure class="fig">
<svg class="dia" viewBox="0 0 720 220" role="img" aria-label="The parts of an Ethernet frame on the wire: preamble, start byte, destination, source, type, data, check and gap">
<rect x="14.0" y="40" width="62.0" height="50" rx="5" class="f-card" stroke="var(--muted)" stroke-width="1.5"/><text x="45" y="63" class="mid sm b">preamble</text><text x="45" y="79" class="mid xs muted">7 bytes</text><text x="45" y="106" class="mid mono xs">1010…</text><rect x="80.0" y="40" width="40.0" height="50" rx="5" class="f-card" stroke="var(--muted)" stroke-width="1.5"/><text x="100" y="63" class="mid sm b">start</text><text x="100" y="79" class="mid xs muted">1</text><text x="100" y="106" class="mid mono xs">…1011</text><rect x="124.0" y="40" width="72.0" height="50" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="160" y="63" class="mid sm b">to</text><text x="160" y="79" class="mid xs muted">6</text><text x="160" y="106" class="mid mono xs">14:c3:5e…</text><rect x="200.0" y="40" width="72.0" height="50" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="236" y="63" class="mid sm b">from</text><text x="236" y="79" class="mid xs muted">6</text><text x="236" y="106" class="mid mono xs">2c:cf:67…</text><rect x="276.0" y="40" width="50.0" height="50" rx="5" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="301" y="63" class="mid sm b">type</text><text x="301" y="79" class="mid xs muted">2</text><text x="301" y="106" class="mid mono xs">0800</text><rect x="330.0" y="40" width="250.0" height="50" rx="5" class="t-yellow" stroke="var(--yellow)" stroke-width="1.5"/><text x="455" y="63" class="mid sm b">data</text><text x="455" y="79" class="mid xs muted">46 to 1,500 bytes</text><text x="455" y="106" class="mid mono xs">an IP packet</text><rect x="584.0" y="40" width="50.0" height="50" rx="5" class="t-red" stroke="var(--red)" stroke-width="1.5"/><text x="609" y="63" class="mid sm b">check</text><text x="609" y="79" class="mid xs muted">4</text><text x="609" y="106" class="mid mono xs">CRC-32</text><rect x="638.0" y="40" width="44.0" height="50" rx="5" class="f-none" stroke="var(--muted)" stroke-width="1.5"/><text x="660" y="63" class="mid sm b">gap</text><text x="660" y="79" class="mid xs muted">12</text><text x="660" y="106" class="mid mono xs">silence</text><path d="M124,120 L124,128 L634,128 L634,120" class="line s-ink" stroke-width="2"/><text x="379" y="144" class="mid xs b">the frame: 64 to 1,518 bytes. The check covers all of it.</text><path d="M124,160 L124,168 L580,168 L580,160" class="line s-teal" stroke-width="2"/><text x="352" y="184" class="mid xs b f-teal">what tcpdump shows you</text><path d="M14,120 L14,128 L120,128 L120,120" class="line s-muted" stroke-width="2"/><text x="67" y="144" class="mid xs muted">clock sync</text><text x="14" y="26" class="sm b">One Ethernet frame on the cable, in the order it’s sent</text><text x="360" y="206" class="mid hand">The card adds the preamble, the check and the gap, and strips them off again on arrival.</text>
</svg>
<figcaption>A real Ethernet frame. Chapter 3 invented start markers, Chapter 8 the addresses and Chapter 10 the check: it’s all here.</figcaption>
</figure>

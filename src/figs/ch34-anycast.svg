<figure class="fig">
<svg class="dia" viewBox="0 0 720 306" role="img" aria-label="Bar chart of round-trip times to the twelve answering DNS root servers from the Pi, from 3 ms to 155 ms, with the city of the instance that answered">
<text x="20" y="20" class="xs b">The same 13 addresses, asked from Grandpa’s Pi: which copy answered, and how long the round trip took</text><text x="20" y="46" class="xs mono">e.root-servers.net</text><rect x="150" y="34" width="7.5" height="14" rx="3" fill="var(--green)" fill-opacity="0.75"/><text x="163.54" y="45" class="xs">2.9 ms  XXX</text><text x="20" y="65" class="xs mono">d.root-servers.net</text><rect x="150" y="53" width="9.1" height="14" rx="3" fill="var(--green)" fill-opacity="0.75"/><text x="165.1" y="64" class="xs">3.5 ms  (its name doesn’t say)</text><text x="20" y="84" class="xs mono">j.root-servers.net</text><rect x="150" y="72" width="47.1" height="14" rx="3" fill="var(--green)" fill-opacity="0.75"/><text x="203.06" y="83" class="xs">18.1 ms  (its name doesn’t say)</text><text x="20" y="103" class="xs mono">k.root-servers.net</text><rect x="150" y="91" width="55.1" height="14" rx="3" fill="var(--green)" fill-opacity="0.75"/><text x="211.12" y="102" class="xs">21.2 ms  XXX</text><text x="20" y="122" class="xs mono">m.root-servers.net</text><rect x="150" y="110" width="104.5" height="14" rx="3" fill="var(--orange)" fill-opacity="0.75"/><text x="260.52" y="121" class="xs">40.2 ms  XXX</text><text x="20" y="141" class="xs mono">i.root-servers.net</text><rect x="150" y="129" width="104.8" height="14" rx="3" fill="var(--orange)" fill-opacity="0.75"/><text x="260.78" y="140" class="xs">40.3 ms  XXX</text><text x="20" y="160" class="xs mono">b.root-servers.net</text><rect x="150" y="148" width="111.5" height="14" rx="3" fill="var(--orange)" fill-opacity="0.75"/><text x="267.54" y="159" class="xs">42.9 ms  Singapore</text><text x="20" y="179" class="xs mono">l.root-servers.net</text><rect x="150" y="167" width="153.4" height="14" rx="3" fill="var(--orange)" fill-opacity="0.75"/><text x="309.4" y="178" class="xs">59 ms  XXX</text><text x="20" y="198" class="xs mono">g.root-servers.net</text><rect x="150" y="186" width="314.9" height="14" rx="3" fill="var(--red)" fill-opacity="0.75"/><text x="470.86" y="197" class="xs">121.1 ms  (its name doesn’t say)</text><text x="20" y="217" class="xs mono">a.root-servers.net</text><rect x="150" y="205" width="330.2" height="14" rx="3" fill="var(--red)" fill-opacity="0.75"/><text x="486.2" y="216" class="xs">127 ms  Tokyo</text><text x="20" y="236" class="xs mono">h.root-servers.net</text><rect x="150" y="224" width="382.5" height="14" rx="3" fill="var(--red)" fill-opacity="0.75"/><text x="538.46" y="235" class="xs">147.1 ms  London</text><text x="20" y="255" class="xs mono">c.root-servers.net</text><rect x="150" y="243" width="402.0" height="14" rx="3" fill="var(--red)" fill-opacity="0.75"/><text x="557.96" y="254" class="xs">154.6 ms  Paris</text><text x="20" y="280" class="xs">Every root server letter is really hundreds of machines around the world, all using the same address. The</text><text x="20" y="296" class="xs">one you reach is the one your network’s routes lead to: usually, but not always, the nearest. (f-root didn’t answer.)</text>
</svg>
<figcaption>Anycast, measured with <code>anycast.py</code>. The name each server gives (like <code>nnn1-jptyo-2</code> for a-root) says where it is. Nearby cities are blanked out as XXX.</figcaption>
</figure>

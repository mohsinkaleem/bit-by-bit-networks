16" class="xs b f-purple">OpenFlow:</text><text x="622" y="131" class="xs hand f-purple">“here are your rules”</text><text x="550" y="272" class="mid xs">the switches only match and forward</text>
</svg>
<figcaption>Every router has a <strong>control plane</strong>, the part that decides where things should go (Chapter 23’s maps, Chapter 24’s treaties), and a <strong>data plane</strong>, the part that actually moves packets. Software-defined networking takes the brains out of the boxes and puts them together, in one program.</figcaption>
</figure>

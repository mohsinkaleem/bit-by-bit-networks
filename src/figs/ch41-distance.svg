<figcaption>Earth to Mars, over the next two years, as this chapter’s <code>mars.py</code> calculates it. Earth goes round the Sun about twice for every once of Mars, so every 26 months or so it overtakes it (nearest), and in between they’re on opposite sides of the Sun.</figcaption>

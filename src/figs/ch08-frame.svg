<figure class="fig">
<svg class="dia" viewBox="0 0 720 176" role="img" aria-label="Layout of a frame: preamble, start marker, destination, source, type, data, check">
<rect x="14" y="36" width="86" height="62" rx="6" class="t-purple" stroke="var(--line)"/><text x="57" y="60" class="mid slab b">preamble</text><text x="57" y="82" class="mid mono xs">10101010…</text><text x="57" y="118" class="mid xs muted">7 bytes</text><rect x="102" y="36" width="76" height="62" rx="6" class="t-purple" stroke="var(--line)"/><text x="140" y="60" class="mid slab b">start</text><text x="140" y="82" class="mid mono xs">10101011</text><text x="140" y="118" class="mid xs muted">1 bytes</text><rect x="180" y="36" width="84" height="62" rx="6" class="t-blue" stroke="var(--line)"/><text x="222" y="60" class="mid slab b">to</text><text x="222" y="82" class="mid mono xs">0b:22:…</text><text x="222" y="118" class="mid xs muted">6 bytes</text><rect x="266" y="36" width="84" height="62" rx="6" class="t-blue" stroke="var(--line)"/><text x="308" y="60" class="mid slab b">from</text><text x="308" y="82" class="mid mono xs">0a:11:…</text><text x="308" y="118" class="mid xs muted">6 bytes</text><rect x="352" y="36" width="96" height="62" rx="6" class="t-green" stroke="var(--line)"/><text x="400" y="60" class="mid slab b">type</text><text x="400" y="82" class="mid mono xs">what’s inside</text><text x="400" y="118" class="mid xs muted">2 bytes</text><rect x="450" y="36" width="170" height="62" rx="6" class="t-yellow" stroke="var(--line)"/><text x="535" y="60" class="mid slab b">data</text><text x="535" y="82" class="mid mono xs">the message itself</text><text x="535" y="118" class="mid xs muted">46–1500 bytes</text><rect x="622" y="36" width="76" height="62" rx="6" class="t-red" stroke="var(--line)"/><text x="660" y="60" class="mid slab b">check</text><text x="660" y="82" class="mid mono xs">Ch. 10!</text><text x="660" y="118" class="mid xs muted">4 bytes</text><path d="M14,134 L14,142 L178,142 L178,134" class="line s-purple"/><text x="96" y="162" class="mid hand f-purple">get in step (Ch. 2)</text><path d="M180,134 L180,142 L350,142 L350,134" class="line s-blue"/><text x="265" y="162" class="mid hand f-blue">card addresses</text>
</svg>
<figcaption>Our new frame. Every card reads the “to” field and decides whether to keep going.</figcaption>

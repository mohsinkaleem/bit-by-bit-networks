<figure class="fig">
<svg class="dia" viewBox="0 0 720 236" role="img" aria-label="Timeline of a DNS record changing, and two resolvers keeping the old answer until their cached copies expire">
<text x="14" y="54" class="xs b">CERN’s server</text><line x1="90" y1="50" x2="690" y2="50" class="grid"/><text x="14" y="114" class="xs b">resolver A</text><line x1="90" y1="110" x2="690" y2="110" class="grid"/><text x="14" y="174" class="xs b">resolver B</text><line x1="90" y1="170" x2="690" y2="170" class="grid"/><rect x="90" y="36" width="210" height="28" rx="4" class="t-blue" stroke="var(--blue)"/><text x="195" y="54" class="mid mono xs b">188.184.67.127</text><rect x="300" y="36" width="390" height="28" rx="4" class="t-green" stroke="var(--green)"/><text x="495" y="54" class="mid xs b">the new address</text><line x1="300" y1="26" x2="300" y2="200" class="line s-orange" stroke-width="2" stroke-dasharray="4 3"/><text x="300" y="20" class="mid xs b f-orange">CERN changes the record</text><rect x="150" y="96" width="300" height="28" rx="4" class="t-blue" stroke="var(--blue)"/><text x="300" y="114" class="mid xs b">old address, from its cache</text><rect x="450" y="96" width="240" height="28" rx="4" class="t-green" stroke="var(--green)"/><text x="150" y="138" class="xs muted">asked at 150 s</text><text x="450" y="138" class="xs muted">TTL runs out: asks again</text><rect x="250" y="156" width="300" height="28" rx="4" class="t-blue" stroke="var(--blue)"/><text x="400" y="174" class="mid xs b">old address, from its cache</text><rect x="550" y="156" width="140" height="28" rx="4" class="t-green" stroke="var(--green)"/><text x="250" y="198" class="xs muted">asked at 250 s</text><text x="550" y="198" class="xs muted">TTL runs out: asks again</text><text x="360" y="224" class="mid xs">Each resolver keeps the old answer until its own copy’s TTL (here 900 s) runs out. Nothing “propagates”.</text>
</svg>
<figcaption>When a record changes, resolvers that asked recently keep the old answer until its TTL runs out, each on its own schedule.</figcaption>
</figure>

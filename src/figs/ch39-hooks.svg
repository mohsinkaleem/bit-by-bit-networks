<figure class="fig">
<svg class="dia" viewBox="0 0 720 360" role="img" aria-label="The Linux receive path, with eBPF hook points at the driver (XDP), traffic control, and sockets; and the path a program takes: verifier, JIT, attach">
<rect x="10" y="10" width="470" height="340" rx="12" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="24" y="32" class="sm b">inside the Linux kernel</text><rect x="30" y="290" width="250" height="34" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="155" y="312" class="mid xs b">the network card’s driver</text><rect x="30" y="240" width="250" height="34" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="155" y="262" class="mid xs b">sk_buff: Linux’s packet structure is built</text><rect x="30" y="190" width="250" height="34" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="155" y="212" class="mid xs b">traffic control (tc)</text><rect x="30" y="140" width="250" height="34" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="155" y="162" class="mid xs b">firewall, routing (Chapters 20, 34)</text><rect x="30" y="90" width="250" height="34" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="155" y="112" class="mid xs b">TCP, UDP, sockets</text><path d="M155,344 L155,326" class="line s-ink" stroke-width="2.4" marker-end="url(#ah-ink)"/><path d="M155,290 L155,276" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><path d="M155,240 L155,226" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><path d="M155,190 L155,176" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><path d="M155,140 L155,126" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><text x="155" y="64" class="mid xs muted">↑ to the program, e.g. a web server</text><circle cx="288" cy="307" r="7" class="f-orange"/><text x="302" y="311" class="xs b f-orange">XDP</text><text x="302" y="325" class="xs">before Linux builds its packet:</text><text x="302" y="338" class="xs">the fastest place to drop</text><circle cx="288" cy="207" r="7" class="f-orange"/><text x="302" y="211" class="xs b f-orange">tc</text><text x="302" y="225" class="xs">filter, rewrite, redirect</text><circle cx="288" cy="157" r="7" class="f-muted"/><text x="302" y="161" class="xs b muted">netfilter</text><text x="302" y="175" class="xs muted">(nftables isn’t eBPF)</text><circle cx="288" cy="107" r="7" class="f-orange"/><text x="302" y="111" class="xs b f-orange">sockets</text><text x="302" y="125" class="xs">socket filters: the old BPF</text><text x="302" y="138" class="xs">job (Chapter 16)</text><text x="24" y="342" class="xs muted">a packet arrives ↑</text><rect x="492" y="10" width="218" height="340" rx="12" class="f-card" stroke="var(--line)" stroke-width="1.6"/><text x="506" y="32" class="sm b">how a program gets there</text><rect x="502" y="46" width="198" height="34" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.6"/><text x="601" y="68" class="mid xs b">your program: instructions</text><path d="M560,82 L560,110" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="502" y="112" width="198" height="34" rx="6" class="t-yellow" stroke="var(--yellow)" stroke-width="1.6"/><text x="601" y="134" class="mid xs b">the verifier: is it safe?</text><path d="M560,148 L560,176" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="502" y="178" width="198" height="34" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.6"/><text x="601" y="200" class="mid xs b">JIT: compiled to machine code</text><path d="M560,214 L560,242" class="line s-ink" stroke-width="2" marker-end="url(#ah-ink)"/><rect x="502" y="244" width="198" height="34" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.6"/><text x="601" y="266" class="mid xs b">attached to a hook</text><text x="572" y="160" class="xs hand">no endless loops,</text><text x="572" y="173" class="xs hand">no bad pointers</text><rect x="502" y="296" width="198" height="44" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.6"/><text x="601" y="314" class="mid xs b">maps: memory shared with</text><text x="601" y="329" class="mid xs b">programs outside the kernel</text>
</svg>
<figcaption>Where eBPF programs can run as a packet climbs through Linux, and how one gets there. There are many more hooks outside networking: almost every function in the kernel can have a program attached, for tracing.</figcaption>
</figure>

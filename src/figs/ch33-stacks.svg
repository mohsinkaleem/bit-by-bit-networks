<figure class="fig">
<svg class="dia" viewBox="0 0 720 300" role="img" aria-label="Three protocol stacks: HTTP/1.1 and HTTP/2 over TLS over TCP, and HTTP/3 over QUIC over UDP">
<text x="125" y="22" class="mid sm b">HTTP/1.1</text><rect x="20" y="34" width="210" height="38" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="125" y="53" class="mid sm b">HTTP/1.1</text><text x="125" y="67" class="mid xs muted">text headers</text><rect x="20" y="78" width="210" height="38" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="125" y="101" class="mid sm b">TLS 1.3</text><rect x="20" y="122" width="210" height="38" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="125" y="145" class="mid sm b">TCP</text><rect x="20" y="166" width="210" height="38" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="125" y="189" class="mid sm b">IP</text><text x="361" y="22" class="mid sm b">HTTP/2</text><rect x="256" y="34" width="210" height="38" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="361" y="53" class="mid sm b">HTTP/2</text><text x="361" y="67" class="mid xs muted">binary frames, streams</text><rect x="256" y="78" width="210" height="38" rx="6" class="t-purple" stroke="var(--purple)" stroke-width="1.5"/><text x="361" y="101" class="mid sm b">TLS 1.3</text><rect x="256" y="122" width="210" height="38" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="361" y="145" class="mid sm b">TCP</text><rect x="256" y="166" width="210" height="38" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="361" y="189" class="mid sm b">IP</text><text x="597" y="22" class="mid sm b">HTTP/3</text><rect x="492" y="34" width="210" height="38" rx="6" class="t-green" stroke="var(--green)" stroke-width="1.5"/><text x="597" y="53" class="mid sm b">HTTP/3</text><text x="597" y="67" class="mid xs muted">frames, no streams of its own</text><rect x="492" y="78" width="210" height="68" rx="6" class="t-orange" stroke="var(--orange)" stroke-width="1.5"/><text x="597" y="112" class="mid sm b">QUIC</text><text x="597" y="126" class="mid xs muted">streams, reliability, congestion control, with TLS 1.3 inside</text><rect x="492" y="152" width="210" height="38" rx="6" class="t-blue" stroke="var(--blue)" stroke-width="1.5"/><text x="597" y="175" class="mid sm b">UDP</text><rect x="492" y="196" width="210" height="38" rx="6" class="f-card" stroke="var(--line)" stroke-width="1.5"/><text x="597" y="219" class="mid sm b">IP</text><text x="597" y="272" class="mid xs">QUIC is UDP’s datagrams with TCP’s</text><text x="597" y="288" class="mid xs">and TLS’s jobs rebuilt on top, in one piece</text>
</svg>
<figcaption>The same requests and responses, carried three ways. HTTP/2 changes only the top layer; HTTP/3 replaces TCP and TLS as well.</figcaption>
</figure>

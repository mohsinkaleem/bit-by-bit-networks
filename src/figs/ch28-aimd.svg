<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 308" role="img" aria-label="The Chiu-Jain diagram: two flows&#x27; speeds under additive increase and multiplicative decrease, zig-zagging towards the fair, full point">
<line x1="60" y1="290" x2="320" y2="290" class="line" stroke-width="1.5" marker-end="url(#ah-ink)"/><line x1="60" y1="290" x2="60" y2="30" class="line" stroke-width="1.5" marker-end="url(#ah-ink)"/><text x="310" y="308" class="end xs b">Alice’s speed</text><text x="52" y="26" class="xs b">Bob’s speed</text><line x1="60" y1="50" x2="300" y2="290" class="line s-orange" stroke-width="2"/><text x="232.8" y="212.8" class="xs b f-orange" transform="rotate(-45 232.79999999999998 212.8)">the link is full</text><line x1="60" y1="290" x2="300" y2="50" class="line s-green dash" stroke-width="2"/><text x="266.4" y="62" class="xs b f-green">fair: equal shares</text><g data-show="1"><line x1="84.0" y1="158.0" x2="132.0" y2="110.0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="1"><line x1="132.0" y1="110.0" x2="96.0" y2="200.0" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><g data-show="1"><line x1="96.0" y1="200.0" x2="153.6" y2="142.4" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="2"><line x1="153.6" y1="142.4" x2="106.8" y2="216.2" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><g data-show="2"><line x1="106.8" y1="216.2" x2="174.0" y2="149.0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="2"><line x1="174.0" y1="149.0" x2="117.0" y2="219.5" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><g data-show="2"><line x1="117.0" y1="219.5" x2="174.6" y2="161.9" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="3"><line x1="174.6" y1="161.9" x2="117.3" y2="225.9" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><g data-show="3"><line x1="117.3" y1="225.9" x2="184.5" y2="158.8" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="3"><line x1="184.5" y1="158.8" x2="122.2" y2="224.4" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><g data-show="3"><line x1="122.2" y1="224.4" x2="179.8" y2="166.8" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="3"><line x1="179.8" y1="166.8" x2="119.9" y2="228.4" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><g data-show="3"><line x1="119.9" y1="228.4" x2="187.1" y2="161.2" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="3"><line x1="187.1" y1="161.2" x2="123.6" y2="225.6" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><g data-show="3"><line x1="123.6" y1="225.6" x2="181.2" y2="168.0" class="line s-blue" stroke-width="2" marker-end="url(#ah-blue)"/></g><g data-show="3"><line x1="181.2" y1="168.0" x2="120.6" y2="229.0" class="line s-red" stroke-width="2" marker-end="url(#ah-red)"/></g><circle cx="84.0" cy="158.0" r="5" class="f-ink"/><text x="92" y="152" class="xs">start: Bob has most</text><text x="430" y="80" class="xs b" style="fill:var(--blue)">blue: both add the same amount</text><text x="430" y="98" class="xs" style="fill:var(--blue)">(additive increase: moves at 45°)</text><text x="430" y="130" class="xs b f-red">red: both halve (multiplicative</text><text x="430" y="148" class="xs f-red">decrease: moves towards 0)</text><text x="430" y="190" class="xs">Each round trip of the cycle, the gap</text><text x="430" y="208" class="xs">between them halves, but the total</text><text x="430" y="226" class="xs">keeps coming back to “full”.</text>
</svg>
<ol class="steps"><li>Two connections share one link. Bob’s starts with most of it. Both add one segment per round trip (blue), so both speeds grow by the same amount, until together they overflow the link, and a packet is lost.</li><li>Both halve their windows (red). Halving takes more from the bigger one: Bob loses more than Alice. Then both grow again by equal amounts.</li><li>Round after round, the point zig-zags towards the green line, where they’re equal, while staying near the orange one, where the link is full. Nobody coordinates anything. That’s why TCP uses additive increase and multiplicative decrease, and not any other combination: it’s the one that converges to fair.</li></ol>
<figcaption>Why AIMD shares fairly (after Chiu and Jain, 1989).</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 304" role="img" aria-label="An ICMP time exceeded message: the router&#x27;s IP header, the ICMP header, then a quote of the original packet&#x27;s IP header and first bytes">
<text x="14" y="22" class="sm b">What the router sent back when the Pi’s ping ran out of hops (packet 22 of Chapter 16’s capture)</text><rect x="14" y="40" width="692" height="50" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="26" y="60" class="sm b">IP header, from the router</text><text x="26" y="78" class="xs">192.168.1.1 → 192.168.1.4, protocol 1 (ICMP)</text><text x="700" y="60" class="end mono xs">45 c0 00 70 ad ae 00 00 40 01 48 c9 c0 a8 01 01</text><text x="700" y="78" class="end mono xs">c0 a8 01 04</text><rect x="14" y="98" width="692" height="50" rx="8" class="t-red" stroke="var(--red)" stroke-width="2"/><text x="26" y="118" class="sm b">ICMP: type 11, code 0</text><text x="26" y="136" class="xs">“time exceeded in transit”, then 4 unused bytes</text><text x="700" y="118" class="end mono xs">0b 00 f4 ff 00 00 00 00</text><rect x="38" y="156" width="668" height="50" rx="8" class="t-yellow" stroke="var(--yellow)" stroke-width="2"/><text x="50" y="176" class="sm b">…the Pi’s own IP header, quoted</text><text x="50" y="194" class="xs">192.168.1.4 → 1.1.1.1, ttl 1, protocol 1</text><text x="700" y="176" class="end mono xs">45 00 00 54 ad 8d 40 00 01 01 08 6e c0 a8 01 04</text><text x="700" y="194" class="end mono xs">01 01 01 01</text><rect x="38" y="214" width="668" height="50" rx="8" class="t-green" stroke="var(--green)" stroke-width="2"/><text x="50" y="234" class="sm b">…and the start of what was inside</text><text x="50" y="252" class="xs">ICMP echo request, id 15081, seq 1</text><text x="700" y="234" class="end mono xs">08 00 d6 2e 3a e9 00 01</text><path d="M24,156 L24,264" class="line s-muted" stroke-width="2"/><text x="360" y="290" class="mid hand">The quote lets the Pi work out exactly which of its packets died, and which program sent it.</text>
</svg>
<figcaption>An ICMP error always quotes the start of the packet that caused it.</figcaption>
</figure>

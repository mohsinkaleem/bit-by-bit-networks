<figure class="fig">
<svg class="dia" viewBox="0 0 720 216" role="img" aria-label="The letters H and I each sent with a start pulse before and a rest after">
<rect x="80" y="56" width="40" height="112" class="t-yellow"/><text x="100" y="48" class="mid sm b">start</text><path d="M80,172 L80,186" class="line s-red" marker-end="url(#ah-red)" transform="rotate(180 80 179)"/><text x="80" y="204" class="mid hand f-red">Bob restarts his clock</text><rect x="120" y="56" width="200" height="112" class="t-teal"/><text x="220" y="48" class="mid sm b">H = 00111</text><rect x="320" y="56" width="40" height="112" class="t-purple"/><text x="340" y="48" class="mid sm b">rest</text><rect x="360" y="56" width="40" height="112" class="t-yellow"/><text x="380" y="48" class="mid sm b">start</text><path d="M360,172 L360,186" class="line s-red" marker-end="url(#ah-red)" transform="rotate(180 360 179)"/><text x="360" y="204" class="mid hand f-red">Bob restarts his clock</text><rect x="400" y="56" width="200" height="112" class="t-teal"/><text x="500" y="48" class="mid sm b">I = 01000</text><rect x="600" y="56" width="40" height="112" class="t-purple"/><text x="620" y="48" class="mid sm b">rest</text><line x1="40" y1="77" x2="680" y2="77" class="grid" stroke-dasharray="4 4"/><line x1="40" y1="112" x2="680" y2="112" class="grid"/><line x1="40" y1="147" x2="680" y2="147" class="grid" stroke-dasharray="4 4"/><path d="M40,112 L80,112 L80,77 L120,77 L120,147 L160,147 L200,147 L200,77 L240,77 L280,77 L320,77 L320,112 L360,112 L360,77 L400,77 L400,147 L440,147 L440,77 L480,77 L480,147 L520,147 L560,147 L600,147 L600,112 L640,112 L680,112" class="line thick s-navy"/>
</svg>
<figcaption>Every letter brings its own “get ready” pulse, so Bob’s clock only has to stay accurate for six bits.</figcaption>
</figure>

<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 212" role="img" aria-label="Traceroute sending pings with increasing hop limits; each router in turn sends back time exceeded, until the destination replies">
<line x1="70" y1="110" x2="640" y2="110" class="wire" stroke-width="4"/><use href="#computer" x="40" y="82" width="60" height="54"/><use href="#router" x="180" y="90" width="60" height="40"/><use href="#router" x="320" y="90" width="60" height="40"/><use href="#router" x="460" y="90" width="60" height="40"/><use href="#server" x="624" y="82" width="32" height="54"/><text x="70" y="156" class="mid xs b">Bob’s laptop</text><text x="210" y="156" class="mid xs b">home router</text><text x="350" y="156" class="mid xs b">provider</text><text x="490" y="156" class="mid xs b">…</text><text x="640" y="156" class="mid xs b">1.1.1.1</text><g data-show="=1"><path d="M104,74 L200,74" class="line s-blue" stroke-width="3" marker-end="url(#ah-blue)"/><text x="140" y="64" class="mid xs b">ping with hop limit 1</text><path d="M202,86 l14,14 M216,86 l-14,14" class="line s-red" stroke-width="3"/><path d="M200,172 L104,172" class="line s-red" stroke-width="3" marker-end="url(#ah-red)"/><text x="140" y="192" class="mid xs b f-red">“time exceeded”, from router 1’s own address</text></g><g data-show="=2"><path d="M104,74 L340,74" class="line s-blue" stroke-width="3" marker-end="url(#ah-blue)"/><text x="210" y="64" class="mid xs b">ping with hop limit 2</text><path d="M342,86 l14,14 M356,86 l-14,14" class="line s-red" stroke-width="3"/><path d="M340,172 L104,172" class="line s-red" stroke-width="3" marker-end="url(#ah-red)"/><text x="210" y="192" class="mid xs b f-red">“time exceeded”, from router 2’s own address</text></g><g data-show="=3"><path d="M104,74 L618,74" class="line s-blue" stroke-width="3" marker-end="url(#ah-blue)"/><text x="355" y="64" class="mid xs b">ping with hop limit 4</text><path d="M618,172 L104,172" class="line s-green" stroke-width="3" marker-end="url(#ah-green)"/><text x="355" y="192" class="mid xs b f-green">“echo reply”: we’ve arrived</text></g>
</svg>
<ol class="steps"><li>Send a ping with a hop limit of 1. The first router takes 1 off, gets 0, throws the ping away, and sends back “time exceeded”, from its own address. Now we know who the first router is, and how long the round trip to it takes.</li><li>Send another with a hop limit of 2. It gets one router further, and the second router complains. Every step reveals one more router.</li><li>Keep going until the destination itself answers with an echo reply. Each line of traceroute’s output is one of these steps, usually tried three times.</li></ol>
<figcaption>How traceroute finds the routers: by making each one complain in turn.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 240" role="img" aria-label="Bars to scale: a classical key share of 32 bytes, the hybrid client share of 1,216 bytes, the server&#x27;s 1,120 bytes, and a 64-byte combined secret">
<text x="20" y="22" class="xs b">the key share in each hello, to scale</text><text x="20" y="52" class="xs b">Chapter 32’s ClientHello</text><text x="20" y="66" class="xs muted">191 bytes in all</text><rect x="190" y="40" width="14" height="26" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="212" y="57" class="xs">X25519: 32 bytes</text><text x="20" y="102" class="xs b">our ClientHello now</text><text x="20" y="116" class="xs muted">1,375 bytes in all</text><rect x="190" y="90" width="390.72" height="26" rx="3" class="t-purple" stroke="var(--purple)" stroke-width="1.2"/><text x="385.36" y="107" class="mid xs">ML-KEM-768 encapsulation key: 1,184 bytes</text><rect x="580.72" y="90" width="14" height="26" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="602.72" y="107" class="xs">+ X25519: 32 bytes</text><text x="20" y="152" class="xs b">the server’s reply</text><text x="20" y="166" class="xs muted">1,210 bytes in all</text><rect x="190" y="140" width="359.04" height="26" rx="3" class="t-purple" stroke="var(--purple)" stroke-width="1.2"/><text x="369.52" y="157" class="mid xs">ML-KEM-768 ciphertext: 1,088 bytes</text><rect x="549.04" y="140" width="14" height="26" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="571.04" y="157" class="xs">+ X25519: 32 bytes</text><text x="20" y="202" class="xs b">the shared secret</text><text x="20" y="216" class="xs muted">→ into the key schedule</text><rect x="190" y="190" width="14" height="26" rx="3" class="t-purple" stroke="var(--purple)" stroke-width="1.2"/><rect x="204" y="190" width="14" height="26" rx="3" class="t-blue" stroke="var(--blue)" stroke-width="1.2"/><text x="226" y="207" class="xs">32 + 32 bytes</text>
</svg>
<figcaption>X25519MLKEM768 in the handshake. Each side sends both kinds of key share, glued together, and the secret is both results, one after the other. Break X25519 and you still face ML-KEM, and the other way round.</figcaption>
</figure>

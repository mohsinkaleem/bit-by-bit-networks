<figure class="fig stepper" data-widget="stepper">
<svg class="dia" viewBox="0 0 720 278" role="img" aria-label="A resolver following referrals from a root server to the ch servers to CERN&#x27;s servers, which answer with a CNAME and an address">
<use href="#server" x="52" y="120" width="36" height="58"/><text x="70" y="194" class="mid xs b">a resolver</text><text x="70" y="208" class="mid xs muted">(empty cache)</text><rect x="170" y="40" width="160" height="64" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="250" y="58" class="mid xs b">a root server</text><text x="250" y="74" class="mid mono xs">f.root-servers.net</text><text x="250" y="88" class="mid mono xs">one of 13 names</text><rect x="360" y="40" width="160" height="64" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="440" y="58" class="mid xs b">the ch servers</text><text x="440" y="74" class="mid mono xs">f.nic.ch</text><text x="440" y="88" class="mid mono xs">run by SWITCH</text><rect x="550" y="40" width="160" height="64" rx="8" class="f-surface" stroke="var(--line)" stroke-width="1.6"/><text x="630" y="58" class="mid xs b">the cern.ch servers</text><text x="630" y="74" class="mid mono xs">scsnms.switch.ch</text><text x="630" y="88" class="mid mono xs">and 2 at CERN</text><g data-show="=1"><path d="M96,140 C160.0,100 190,130 230,108" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="170" y="120" class="mid xs b halo" style="fill:var(--blue)">info.cern.ch?</text><path d="M250,108 C250,190 190,170 96,154" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="240" y="200" class="mid xs b halo f-green">“ask the ch servers:</text><text x="240" y="214" class="mid xs b halo f-green">a.nic.ch … f.nic.ch”</text><text x="320" y="150" class="xs b muted">14 ms</text></g><g data-show="=2"><path d="M96,140 C255.0,100 380,130 420,108" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="265" y="120" class="mid xs b halo" style="fill:var(--blue)">info.cern.ch?</text><path d="M440,108 C440,190 190,170 96,154" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="430" y="200" class="mid xs b halo f-green">“ask the cern.ch servers:</text><text x="430" y="214" class="mid xs b halo f-green">ext-dns-1, -2, scsnms…”</text><text x="510" y="150" class="xs b muted">40 ms</text></g><g data-show="=3"><path d="M96,140 C350.0,100 570,130 610,108" class="line s-blue" stroke-width="2.5" marker-end="url(#ah-blue)"/><text x="360" y="120" class="mid xs b halo" style="fill:var(--blue)">info.cern.ch?</text><path d="M630,108 C630,190 190,170 96,154" class="line s-green" stroke-width="2.5" marker-end="url(#ah-green)"/><text x="620" y="200" class="mid xs b halo f-green">“it’s an alias: webafs902.cern.ch,</text><text x="620" y="214" class="mid xs b halo f-green">which is 188.184.67.127”</text><text x="700" y="150" class="xs b muted">158 ms</text></g><g data-show="4"><text x="360" y="250" class="mid xs">3 questions, about 210 ms. The resolver keeps every answer for as long as its TTL says: the ch servers for 2 days,</text><text x="360" y="266" class="mid xs">the cern.ch servers for an hour, the answer for 15 minutes. So the next name in cern.ch starts at step 3.</text></g>
</svg>
<ol class="steps"><li>The resolver knows nothing but the addresses of the root servers, which are built into it. It asks one of them about the whole name. The root doesn’t know, but it knows who looks after <code>ch</code>, and says so: a <strong>referral</strong>, with the names of Switzerland’s servers and, helpfully, their addresses (“glue”).</li><li>It asks one of the <code>ch</code> servers the same question, and gets another referral, to the servers for <code>cern.ch</code>.</li><li>One of CERN’s servers finally has the answer, and it’s <strong>authoritative</strong>: it comes from the people who own the name. <code>info.cern.ch</code> is an alias, and the server includes the real name’s address too.</li><li>Every step was cached. These are real answers, from <code>dig +trace info.cern.ch</code>.</li></ol>
<figcaption>A real lookup, from the root down.</figcaption>
</figure>

<figure class="fig">
<svg class="dia" viewBox="0 0 720 262" role="img" aria-label="The bits 10110 in plain encoding and in Manchester encoding">
<line x1="110" y1="34" x2="110" y2="250" class="grid" stroke-dasharray="3 4"/><line x1="220" y1="34" x2="220" y2="250" class="grid" stroke-dasharray="3 4"/><line x1="330" y1="34" x2="330" y2="250" class="grid" stroke-dasharray="3 4"/><line x1="440" y1="34" x2="440" y2="250" class="grid" stroke-dasharray="3 4"/><line x1="550" y1="34" x2="550" y2="250" class="grid" stroke-dasharray="3 4"/><line x1="660" y1="34" x2="660" y2="250" class="grid" stroke-dasharray="3 4"/><text x="165" y="24" class="mid mono b f-green">1</text><text x="275" y="24" class="mid mono b f-red">0</text><text x="385" y="24" class="mid mono b f-green">1</text><text x="495" y="24" class="mid mono b f-green">1</text><text x="605" y="24" class="mid mono b f-red">0</text><text x="110" y="49" class="sm b">Plain (metronome style): 1 1 in a row is one long flat stretch</text><line x1="110" y1="65" x2="660" y2="65" class="grid" stroke-dasharray="4 4"/><text x="102" y="69" class="end xs muted">+5 V</text><line x1="110" y1="95" x2="660" y2="95" class="grid"/><text x="102" y="99" class="end xs muted">0 V</text><line x1="110" y1="125" x2="660" y2="125" class="grid" stroke-dasharray="4 4"/><text x="102" y="129" class="end xs muted">−5 V</text><path d="M110,65 L165,65 L220,65 L220,125 L275,125 L330,125 L330,65 L385,65 L440,65 L495,65 L550,65 L550,125 L605,125 L660,125" class="line thick s-navy"/><text x="110" y="164" class="sm b">Manchester: every bit flips in the middle.  up = 1, down = 0</text><line x1="110" y1="180" x2="660" y2="180" class="grid" stroke-dasharray="4 4"/><text x="102" y="184" class="end xs muted">+5 V</text><line x1="110" y1="210" x2="660" y2="210" class="grid"/><text x="102" y="214" class="end xs muted">0 V</text><line x1="110" y1="240" x2="660" y2="240" class="grid" stroke-dasharray="4 4"/><text x="102" y="244" class="end xs muted">−5 V</text><path d="M110,240 L165,240 L165,180 L220,180 L275,180 L275,240 L330,240 L385,240 L385,180 L440,180 L440,240 L495,240 L495,180 L550,180 L605,180 L605,240 L660,240" class="line thick s-navy"/><path d="M177.0,228 L177.0,192" class="line s-green" marker-end="url(#ah-green)"/><path d="M287.0,192 L287.0,228" class="line s-red" marker-end="url(#ah-red)"/><path d="M397.0,228 L397.0,192" class="line s-green" marker-end="url(#ah-green)"/><path d="M507.0,228 L507.0,192" class="line s-green" marker-end="url(#ah-green)"/><path d="M617.0,192 L617.0,228" class="line s-red" marker-end="url(#ah-red)"/>
</svg>
<figcaption>Manchester encoding hides a clock tick inside every bit.</figcaption>
</figure>

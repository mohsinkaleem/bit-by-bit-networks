<figcaption>Real congestion control. The window shoots up in slow start, far past what the path needs, until the queues overflow. Then, after a rough second of losses and timeouts, it settles into a sawtooth around the bandwidth-delay product, cut to 70% at every loss: CUBIC’s signature.</figcaption>

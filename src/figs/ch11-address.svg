<figure class="fig">
<svg class="dia" viewBox="0 0 720 236" role="img" aria-label="A flat card address compared with a two-part network address">
<text x="180" y="28" class="mid slab b">A card address says WHO</text><rect x="50" y="48" width="260" height="62" rx="10" class="card"/><text x="180" y="88" class="mid mono lg b">0c:33:9a:41:07:e2</text><text x="180" y="138" class="mid sm">stamped in at the factory. Like a fingerprint,</text><text x="180" y="158" class="mid sm">it tells you nothing about where Carol is.</text><line x1="360" y1="30" x2="360" y2="220" class="line s-line"/><text x="540" y="28" class="mid slab b">A network address says WHERE</text><rect x="440" y="48" width="200" height="62" rx="10" class="card"/><text x="500" y="92" class="mid mono xl b f-blue">1</text><text x="540" y="92" class="mid mono xl b">.</text><text x="580" y="92" class="mid mono xl b f-orange">3</text><path d="M482,118 l0,8 l36,0 l0,-8" class="line s-blue" stroke-width="2"/><path d="M562,118 l0,8 l36,0 l0,-8" class="line s-orange" stroke-width="2"/><text x="500" y="148" class="mid hand f-blue">network 1</text><text x="500" y="166" class="mid xs muted">(our street)</text><text x="580" y="148" class="mid hand f-orange">host 3</text><text x="580" y="166" class="mid xs muted">(Carol)</text><text x="540" y="200" class="mid sm">Like “house 3, Maple Street”.</text><text x="540" y="220" class="mid sm">The first part is enough to get you close.</text>
</svg>
<figcaption>Carol gets a second address. Her card address still works on her own network; the new one works everywhere.</figcaption>
</figure>

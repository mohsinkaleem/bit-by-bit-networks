<figure class="fig">
<svg class="dia" viewBox="0 0 720 250" role="img" aria-label="Big-endian and little-endian byte orders for the number 1000">
<text x="360" y="28" class="mid sm b">The number 1000 is 0x03E8 in hex: too big for one byte, so it takes two.</text><path d="M70,52 C100,52 104,106 100,118 C94,138 46,138 40,118 C36,106 40,52 70,52 Z" fill="#fff8e6" stroke="#8c6d3f" stroke-width="2"/><path d="M56,126 l7,-6 l7,--6 l7,-6 l7,--6" fill="none" stroke="#8c6d3f" stroke-width="2"/><text x="130" y="88" class="slab b lg">Big-endian</text><text x="130" y="112" class="sm muted">biggest part first, like we write 1,000</text><rect x="440" y="66" width="80" height="54" rx="8" class="t-blue" stroke="var(--line)"/><text x="480" y="102" class="mid mono xl b">03</text><text x="480" y="138" class="mid xs muted">byte 1</text><rect x="530" y="66" width="80" height="54" rx="8" class="t-yellow" stroke="var(--line)"/><text x="570" y="102" class="mid mono xl b">E8</text><text x="570" y="138" class="mid xs muted">byte 2</text><text x="640" y="102" class="hand f-green">← the internet’s order</text><path d="M70,152 C100,152 104,206 100,218 C94,238 46,238 40,218 C36,206 40,152 70,152 Z" fill="#fff8e6" stroke="#8c6d3f" stroke-width="2"/><path d="M56,162 l7,6 l7,-6 l7,6 l7,-6" fill="none" stroke="#8c6d3f" stroke-width="2"/><text x="130" y="188" class="slab b lg">Little-endian</text><text x="130" y="212" class="sm muted">smallest part first</text><rect x="440" y="166" width="80" height="54" rx="8" class="t-yellow" stroke="var(--line)"/><text x="480" y="202" class="mid mono xl b">E8</text><text x="480" y="238" class="mid xs muted">byte 1</text><rect x="530" y="166" width="80" height="54" rx="8" class="t-blue" stroke="var(--line)"/><text x="570" y="202" class="mid mono xl b">03</text><text x="570" y="238" class="mid xs muted">byte 2</text>
</svg>
<figcaption>Same number, two byte orders. Both sides must agree, and on the network, big-endian wins.</figcaption>
</figure>
